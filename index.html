<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2ec">
<title>Discipline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
  :root{
    --bg:#f6f2ec; --card:#fffdf9; --ink:#1f2c47;
    --navy:#2c3f66; --navy-2:#4a6491; --navy-soft:#e7ecf5;
    --muted:#8d8577; --line:#eae3d8;
    --gold:#c9973f; --gold-soft:#fbf1de;
    --good:#4f8172; --good-soft:#e6f0eb;
    --warn:#bd6b57; --warn-soft:#fbeae5;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:40px}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  h1,h2,h3{margin:0 0 8px;color:var(--ink)}
  h1{font-size:23px;letter-spacing:-.3px} h2{font-size:18px} h3{font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06)}
  button{font-family:inherit;font-size:15px;border:none;border-radius:14px;padding:11px 16px;
    cursor:pointer;background:var(--navy-soft);color:var(--navy);font-weight:600}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.38;cursor:default}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-good{background:var(--good);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-warn{background:var(--warn-soft);color:var(--warn)}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;font-weight:500}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:11px}
  .btn-full{width:100%}
  .row{display:flex;gap:8px;align-items:center}
  .row-between{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  input,select{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:12px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--navy-2)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}

  .kid-tile{background:var(--card);border-radius:var(--radius);padding:16px 10px;text-align:center;
    box-shadow:0 2px 12px rgba(31,44,71,.06);cursor:pointer}
  .kid-tile .nm{font-weight:700;margin-top:8px}
  .kid-tile .pt{font-size:13px;color:var(--muted)}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    overflow:hidden;background:var(--navy-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .points-big{font-size:42px;font-weight:800;line-height:1.1;color:var(--navy)}

  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
    background:var(--card);margin-bottom:8px;box-shadow:0 1px 7px rgba(31,44,71,.05)}
  .item.due-now{box-shadow:0 0 0 2px var(--gold),0 1px 7px rgba(31,44,71,.05)}
  .item.due-late{box-shadow:0 0 0 2px var(--warn),0 1px 7px rgba(31,44,71,.05)}
  .item .emo{font-size:34px;flex:0 0 auto;width:44px;text-align:center;line-height:1.1}
  .item.ready{background:#fff;box-shadow:0 0 0 3px var(--good), 0 2px 10px rgba(31,44,71,.08)}
  .item.warn{box-shadow:0 0 0 3px var(--warn), 0 2px 10px rgba(31,44,71,.08)}
  .item.locked{opacity:.4}
  .btn-done{min-width:96px;font-size:17px;padding:13px 14px;font-weight:800}
  .state{font-size:26px;width:40px;text-align:center;flex:0 0 auto}
  .bignum{font-variant-numeric:tabular-nums;font-weight:800}
  .cnt{background:var(--warn);color:#fff;border-radius:999px;padding:2px 10px;
    font-size:14px;font-weight:800;margin-left:6px;display:inline-block}
  .newdot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block;flex:0 0 auto}
  .feed-line{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .feed-line:last-child{border-bottom:none}
  .strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{width:48px;height:56px;border-radius:13px;background:var(--bg);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:23px;line-height:1}
  .chip small{font-size:14px;line-height:1}
  .chip.done{background:var(--good-soft)}
  .chip.now{background:#fff;box-shadow:0 0 0 3px var(--good)}
  .chip.late{background:var(--warn-soft);box-shadow:0 0 0 2px var(--warn)}
  .chip.wait{opacity:.4}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
  .tag-plus{background:var(--good-soft);color:var(--good)}
  .tag-minus{background:var(--warn-soft);color:var(--warn)}
  .tag-cost{background:var(--gold-soft);color:var(--gold)}
  .tag-wait{background:var(--navy-soft);color:var(--navy-2)}

  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06);overflow-x:auto}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:9px 6px;font-size:14px;white-space:nowrap}
  .tabs button.on{background:var(--navy);color:#fff}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
  .pinpad button{font-size:22px;padding:16px 0;background:var(--card);color:var(--ink);
    box-shadow:0 2px 8px rgba(31,44,71,.06)}
  .dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--navy)}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{display:inline-block;font-size:12px;background:var(--navy-soft);color:var(--navy);
    padding:4px 10px;border-radius:999px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .log-line{display:flex;gap:9px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .log-line:last-child{border-bottom:none}
  .sec-title{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 8px;letter-spacing:.3px}
  .clock{font-variant-numeric:tabular-nums;font-weight:800}

  .prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .4s}
  .dayrow{display:flex;gap:4px;margin-top:6px}
  .daybox{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  .daybox b{display:block;height:22px;border-radius:7px;line-height:22px;font-size:11px;color:#fff;margin-bottom:2px}
  .daypick{display:flex;gap:5px;margin-top:6px}
  .daypick button{flex:1;padding:9px 0;font-size:13px;background:var(--bg);color:var(--muted)}
  .daypick button.on{background:var(--navy);color:#fff}

  .overlay{position:fixed;inset:0;background:rgba(31,44,71,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 24px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(31,44,71,.25)}
  @media(min-width:560px){ .overlay{align-items:center} .sheet{border-radius:22px} }
  .sheet h3{font-size:18px;margin-bottom:2px}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .sheet-actions button{flex:1}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .emoji-pick button{padding:6px 8px;font-size:21px;background:var(--bg);border-radius:10px}
  .emoji-pick button.on{background:var(--navy-soft);outline:2px solid var(--navy-2)}
  .switch{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:13px}
  .switch button{flex:1;background:transparent;color:var(--muted);font-size:14px;padding:9px 4px}
  .switch button.on{background:var(--navy);color:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;
    max-width:88%;text-align:center}
  .toast.show{opacity:1;bottom:56px}
  .offline{position:fixed;top:0;left:0;right:0;background:var(--gold);color:#fff;text-align:center;
    font-size:12px;padding:5px;z-index:80;font-weight:600}
  .boot{text-align:center;padding:60px 20px;color:var(--muted)}
  .boot .big{font-size:38px;margin-bottom:10px}
  .login{max-width:360px;margin:50px auto;text-align:center}

  /* แถบบอกว่านี่คือบัญชีของใคร — ติดบนสุดตลอด ไม่เลื่อนหาย */
  .kidbar{position:sticky;top:0;z-index:40;margin:-14px -14px 14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;color:#fff;
    box-shadow:0 4px 18px rgba(31,44,71,.22)}
  .kidbar .av{border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
  .kidbar .nm{font-size:20px;font-weight:800;line-height:1.15}
  .kidbar .pt{font-size:13px;opacity:.92;font-weight:600}
  .kidbar button{background:rgba(255,255,255,.22);color:#fff;padding:9px 13px;font-size:14px}
  .kid-tile{border:3px solid transparent}
  .kid-tile .av{margin:0 auto}
  .colorpick{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
  .colorpick button{width:40px;height:40px;border-radius:50%;padding:0;
    box-shadow:0 2px 6px rgba(31,44,71,.22)}
  .colorpick button.on{outline:3px solid var(--ink);outline-offset:3px}
  input[type=color]{width:60px;height:42px;padding:3px;cursor:pointer}
</style>
</head>
<body>
<div id="net"></div>
<div class="wrap" id="app"><div class="boot"><div class="big">⭐</div>กำลังเชื่อมต่อ…</div></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ตัวจับข้อผิดพลาดตอนเริ่มระบบ — ถ้าค้างหรือพัง จะบอกบนหน้าจอเลย ไม่ต้องเปิด F12 */
(function(){
  var shown = false;
  function hint(m){
    m = String(m||'');
    if(/firebase\/app|Failed to resolve|bare specifier/i.test(m))
      return 'วาง config ผิด — มีบรรทัด import ของ Firebase Console ติดมาด้วย ให้เอาแค่ก้อน firebaseConfig = {...}';
    if(/already been declared/i.test(m))
      return 'มีโค้ดซ้ำกัน 2 ชุด (initializeApp หรือ app) — ให้ใช้ไฟล์ต้นฉบับแล้วแก้แค่ 6 บรรทัดใน firebaseConfig';
    if(/Failed to fetch|dynamically imported|NetworkError|Load failed/i.test(m))
      return 'โหลดไฟล์ Firebase จาก gstatic.com ไม่ได้ — ลองปิดตัวบล็อกโฆษณา / ปิด VPN / สลับไปใช้เน็ตมือถือ';
    if(/api-key|invalid|400/i.test(m))
      return 'ค่า apiKey หรือ authDomain ไม่ถูกต้อง ลองคัดลอกจาก Firebase Console ใหม่';
    if(/permission|insufficient/i.test(m))
      return 'ยังไม่ได้วาง Rules ใน Firestore (ขั้นที่ 4 ในคู่มือ)';
    return 'ลองรีเฟรชแบบล้างแคช (Ctrl+Shift+R) ถ้ายังไม่หาย ส่งข้อความนี้มาให้ดูได้เลย';
  }
  window.__showDiag = function(msg){
    if(shown) return; shown = true;
    document.getElementById('app').innerHTML =
      '<div class="boot" style="text-align:left">' +
      '<div class="big" style="text-align:center">⚠️</div>' +
      '<b style="display:block;text-align:center;color:var(--ink);margin-bottom:14px">เปิดแอปไม่สำเร็จ</b>' +
      '<div class="card" style="font-size:13px;word-break:break-word"><b>สาเหตุที่น่าจะเป็น</b><br>' +
      hint(msg) + '</div>' +
      '<div class="card" style="font-size:12px;color:var(--muted);word-break:break-word"><b>ข้อความจากระบบ</b><br>' +
      String(msg).replace(/[<>]/g,'') + '</div>' +
      '<div style="text-align:center"><button class="btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>';
  };
  window.addEventListener('error', function(e){
    if(e && e.target && e.target.tagName === 'SCRIPT')
      window.__showDiag('โหลดสคริปต์ไม่ได้: ' + (e.target.src || 'module'));
    else window.__showDiag((e.message||'error') + (e.filename ? ' @ บรรทัด ' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    window.__showDiag((r && (r.code || r.message)) || String(r));
  });
  setTimeout(function(){
    if(!window.__booted) window.__showDiag('รอเกิน 12 วินาทีแล้วยังเชื่อมต่อไม่ได้');
  }, 12000);
})();
</script>

<script type="module">
/* ============================================================
   Discipline — เวอร์ชัน Firebase Firestore
   วางบน GitHub Pages ได้เลย · ข้อมูลซิงก์ทุกเครื่องแบบเรียลไทม์
   ใช้งานตอนเน็ตหลุดได้ แล้วซิงก์ให้เองเมื่อsกลับมาออนไลน์
   ============================================================ */

/* ⬇⬇⬇ ค่าจาก Firebase Console ของโปรเจกต์ discipline-629c3 (ใส่ให้แล้ว) ⬇⬇⬇ */
const firebaseConfig = {
  apiKey: "AIzaSyCkWB1di_6G64YFMx2ducpNYypCGs5chUY",
  authDomain: "discipline-629c3.firebaseapp.com",
  projectId: "discipline-629c3",
  storageBucket: "discipline-629c3.firebasestorage.app",
  messagingSenderId: "920264804175",
  appId: "1:920264804175:web:b84d3641c3abee6ed4273a"
};
/* ⬆⬆⬆ ถ้าจะเปลี่ยนโปรเจกต์ ให้แก้แค่ 6 บรรทัดข้างบนนี้ ห้ามเติม import หรือ initializeApp ⬆⬆⬆ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch,
         increment, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ============================================================
   ค่าคงที่ + ข้อมูลตั้งต้น
   ============================================================ */
const ALLDAYS = [0,1,2,3,4,5,6], WEEKDAYS = [1,2,3,4,5], SCHOOLNIGHT = [0,1,2,3,4];
const DAY_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const KID_COLORS = ['#4a6491','#7d9bc1','#bd6b57','#c9973f','#4f8172','#8b7fa8',
                    '#3e8e9c','#c07b8f','#7d8b52','#6b5b95','#d08a4e','#5a7d9a'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const DEF_SETTINGS = {approveChores:true, requireKidPin:false, stepOrder:true, perfectBonus:20,
                      autoHome:true, autoHomeSec:5, idleHome:true, idleSec:60,
                      rewardsV4:true, eveningV1:true, potFixV1:true, parentPin:'1234',
                      shareSmallV1:true, maxGiveDay:50,
                      /* ---- 🏦 ธนาคารแต้ม ----
                         ตัวเลขชุดนี้คุมไม่ให้แต้มเฟ้อ: ดอกฝากผลิตแต้มใหม่ได้สูงสุด
                         🎈 200×10%/14วัน = 10/สัปดาห์ (2.5% ของรายได้ 400)
                         💎 400×15%/30วัน = 14/สัปดาห์ (5.3% ของรายได้ ~265)
                         และดอกยืม (10% ของ 340 = 34 ต่อครั้ง) เผาแต้มทิ้งเกือบหักล้างกันพอดี
                         กฎเหล็กกันช่องโหว่: ดอกยืมต้องสูงกว่าดอกฝากเสมอ
                         และห้ามมีหนี้กับเงินฝากพร้อมกัน (ไม่งั้นฝากกินดอกแล้วยืมมาใช้ = แต้มฟรี) */
                      bankOn:true, bankV1:true,
                      loanCap:340, loanPct:10, loanDays:14, loanLatePct:2, loanMaxPct:30, loanRepayPct:50,
                      depDaily:'3:2,7:5,14:12', depCapDaily:200,
                      depExtra:'7:2,14:6,30:15', depCapExtra:400,
                      /* ---- ช่องทำกำไรที่ "ตั้งใจเปิดไว้" ให้เด็กที่คิดเป็นหาเจอเอง ----
                         กติกาทุกข้อประกาศไว้ครบในแอป แต่ไม่บอกว่าเอามาต่อกันแล้วได้อะไร
                         1) ปลอดดอก 3 วันแรก + ฝากขณะมีหนี้ได้เฉพาะบัญชีที่ครบก่อนหมดช่วงปลอดดอก
                            → ยืม 340 เอาไปฝากขั้น 3 วัน ได้ +4 แต้ม แต่ช้าไป 1 วัน = ติดดอก 34
                            ขั้นอื่นขาดทุนเสมอ (ดอกฝากสูงสุด 24 < ดอกยืม 34) จึงไม่ต้องเขียนกฎห้ามเพิ่ม
                         2) เงินฝากของสองพี่น้องครบกำหนดวันเดียวกัน + ล็อก ≥14 วัน → โบนัสทั้งคู่
                            ใครถอนก่อนกำหนด อีกคนก็อดโบนัสไปด้วย
                         3) พี่น้องเอาแต้มมาค้ำ 50% ของยอดยืม → ดอกยืมลดครึ่ง
                            แต่เลยกำหนดเมื่อไหร่ หลักประกันโดนยึดปิดหนี้ทันที */
                      arbV1:true, fridayV1:true, morningV1:true, loanGraceDays:3, loanPerWeek:1,
                      coDepBonusPct:2, coDepBonusMax:5, coDepMinDays:14,
                      cosignOn:true, cosignPct:50, cosignDiscount:50};
const mkChore = c => Object.assign(
  {id:uid(), once:true, from:'', due:'', grace:10, latePct:50, routine:true, by:'kid',
   extra:false, all:false, chain:true, days:ALLDAYS.slice()}, c);
/* กิจวัตรหลัก รวมกันต้องได้ 100 แต้มพอดี = คะแนนเต็มของวัน (ใช้ซื้อรางวัลเล็ก)
   เรียงแต้มตามลำดับความสำคัญ แต่ไม่ให้ห่างกันมาก (20 → 10) */

/* ---------- เวลา ---------- */
const pad2 = n => String(n).padStart(2,'0');
const now = () => Date.now();
function dstr(ts){
  const x = new Date(ts === undefined ? now() : ts);
  return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
}
const todayStr = () => dstr();
const fmtClock = ts => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
function dueDateOf(hhmm, ref){
  const p = String(hhmm).split(':');
  const d = new Date(ref === undefined ? now() : ref);
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  return d;
}
const minsUntil = hhmm => Math.ceil((dueDateOf(hhmm) - now())/60000);

/* ---------- helper ---------- */
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function timeAgo(ts){
  const d = Math.floor((now()-ts)/1000);
  if(d < 60) return 'เมื่อครู่';
  if(d < 3600) return Math.floor(d/60)+' นาทีที่แล้ว';
  if(dstr(ts) === todayStr()) return 'วันนี้ ' + fmtClock(ts);
  return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short'}) + ' ' + fmtClock(ts);
}
/* ผสมสีประจำตัวกับสีพื้นหลัง เพื่อย้อมทั้งหน้าจอแบบอ่อน ๆ */
function tint(hex, amt){
  const h = String(hex || '#4a6491').replace('#','');
  const bg = [246,242,236];
  const c = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  const m = c.map((v,i) => Math.round(bg[i] + (v - bg[i]) * amt));
  return `rgb(${m[0]},${m[1]},${m[2]})`;
}
function avatar(k, size){
  const s = size || 52;
  const inner = k.photo ? `<img src="${k.photo}" alt="">`
    : `<span style="font-size:${Math.round(s*0.56)}px">${k.emo||'🙂'}</span>`;
  return `<div class="av" style="width:${s}px;height:${s}px;background:${(k.color||'#4a6491')}22">${inner}</div>`;
}
function daysLabel(c){
  const d = Array.isArray(c.days) ? c.days : ALLDAYS;
  if(d.length === 7) return 'ทุกวัน';
  if(d.join() === WEEKDAYS.join()) return 'จ–ศ';
  if(d.join() === '0,6') return 'เสาร์–อาทิตย์';
  if(d.join() === SCHOOLNIGHT.join()) return 'คืนก่อนวันเรียน';
  return d.map(x => DAY_TH[x]).join(' ');
}

/* ---------- ตรรกะแต้ม ---------- */
const cfg = () => S.settings;
const kidById = id => S.kids.find(k => k.id === id);
/* ---- แต้มมี 2 กระเป๋า ----
   daily = แต้มประจำวันจากกิจวัตรหลัก → ใช้ซื้อรางวัลเล็ก
   extra = แต้มพิเศษจากงานเสริม + โบนัสทำครบตรงเวลา → ใช้ซื้อรางวัลใหญ่เท่านั้น  */
const POT_FIELD = {daily:'points', extra:'extra'};
const POT_NAME  = {daily:'แต้มประจำวัน', extra:'แต้มพิเศษ'};
const balance = (kidId, pot) => Number((kidById(kidId)||{})[POT_FIELD[pot||'daily']] || 0);
/* จองแต้มที่ยังรออนุมัติไว้ก่อน — คำขอแลกรางวัล (ทั้งคนขอและคนช่วยหาร)
   และคำขอแบ่งแต้มให้พี่น้อง (จองเฉพาะฝั่งคนให้) จะได้ไม่ใช้แต้มก้อนเดียวกันซ้ำ */
const reserved = (kidId, pot) => S.pending.filter(p => (p.pot||'daily') === (pot||'daily')
                          && ( (p.type==='reward'   && (p.kidId===kidId || p.partnerId===kidId))
                            || (p.type==='transfer' &&  p.kidId===kidId) ))
                          .reduce((s,p)=>s+Number(p.pts),0);
/* แต้มที่เอาไปค้ำประกันให้พี่น้อง ยังอยู่ในกระเป๋าแต่แตะไม่ได้จนกว่าหนี้จะปิด */
const held = (kidId, pot) => kidBank(kidId)
  .filter(b => b.kind==='collateral' && (b.pot||'daily') === (pot||'daily'))
  .reduce((s,b) => s + Number(b.amount), 0);
const available = (kidId, pot) => balance(kidId, pot) - reserved(kidId, pot) - held(kidId, pot);

/* ---- เพดานจำนวนครั้งของรางวัล ---- */
function weekStartTs(){
  const d = new Date(now()); const dow = (d.getDay()+6)%7;   // จันทร์ = ต้นสัปดาห์
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
function dayStartTs(){ const d = new Date(now()); d.setHours(0,0,0,0); return d.getTime(); }
function usedTimes(kidId, rid){
  const mine = x => x.rid === rid && (x.kidId === kidId || x.partnerId === kidId);
  const all = S.log.filter(l => l.kind==='reward' && mine(l))
        .concat(S.pending.filter(p => p.type==='reward' && mine(p)));
  const d = dayStartTs(), w = weekStartTs();
  return {day: all.filter(x => x.ts >= d).length, week: all.filter(x => x.ts >= w).length};
}
function limitLeft(kidId, r){
  const u = usedTimes(kidId, r.id);
  const dLeft = Number(r.limitDay||0)  ? Number(r.limitDay)  - u.day  : Infinity;
  const wLeft = Number(r.limitWeek||0) ? Number(r.limitWeek) - u.week : Infinity;
  return {ok: dLeft > 0 && wLeft > 0, dLeft, wLeft, used:u};
}
/* ---- แบ่งแต้มให้พี่น้อง: เพดานต่อคนต่อวัน (0 = ไม่จำกัด) ---- */
const giveCap = () => Number(cfg().maxGiveDay || 0);
function givenToday(kidId){
  const d = dayStartTs();
  const done = S.log.filter(l => l.kind==='transfer' && l.kidId===kidId && Number(l.delta)<0 && l.ts>=d)
                    .reduce((s,l)=>s+Math.abs(Number(l.delta)),0);
  const wait = S.pending.filter(p => p.type==='transfer' && p.kidId===kidId && p.ts>=d)
                    .reduce((s,p)=>s+Number(p.pts),0);
  return done + wait;
}
function giveLeft(kidId){ const c = giveCap(); return c ? Math.max(0, c - givenToday(kidId)) : Infinity; }

/* ============================================================
   🏦 ธนาคารแต้ม — เก็บบัญชีไว้ในฟิลด์ bank[] ของเด็กแต่ละคน
   deposit = ฝากล็อกเวลา ได้ดอกตอนครบกำหนด · loan = ยืม มีดอก หักคืนอัตโนมัติ
   ============================================================ */
const DAYMS = 86400000;
const bankOn = () => cfg().bankOn !== false;
const bankOf = k => Array.isArray((k||{}).bank) ? (k||{}).bank : [];
const kidBank = kidId => bankOf(kidById(kidId));
const activeLoan = kidId => kidBank(kidId).find(b => b.kind==='loan');
const myDeposits = kidId => kidBank(kidId).filter(b => b.kind==='deposit');
const depositIn = (kidId, pot) => myDeposits(kidId).find(b => b.pot === pot);
const depCap = pot => Number(pot==='extra' ? (cfg().depCapExtra||0) : (cfg().depCapDaily||0));
/* ตารางดอกฝากเก็บเป็นข้อความ "วัน:% , วัน:%" เพื่อให้พ่อแม่แก้เองได้ง่าย */
function depTiers(pot){
  return String((pot==='extra' ? cfg().depExtra : cfg().depDaily) || '')
    .split(',').map(s => s.trim()).filter(Boolean)
    .map(s => { const a = s.split(':'); return {days:parseInt(a[0],10)||0, pct:parseFloat(a[1])||0}; })
    .filter(t => t.days > 0 && t.pct >= 0).sort((a,b) => a.days - b.days);
}
const depInterest = d => Math.floor(Number(d.amount) * Number(d.pct) / 100);
const matured = d => now() >= Number(d.dueTs);
const graceEndOf = ln => Number(ln.openTs) +
  Number(ln.grace !== undefined ? ln.grace : (cfg().loanGraceDays||0)) * DAYMS;
/* ยอดหนี้ ณ ตอนนี้
   • ช่วงปลอดดอก (3 วันแรก) คืนครบ = ไม่เสียดอกเลย
   • พ้นช่วงนั้นคิดดอกเต็มทันที · เลยกำหนดแล้วเดินต่อวันละ loanLatePct จนชนเพดาน loanMaxPct */
function loanOwed(ln){
  const base = Number(ln.amount), pct0 = Number(ln.rate || cfg().loanPct || 0);
  const paid0 = Number(ln.paid || 0), gEnd = graceEndOf(ln);
  if(now() < gEnd) return {total:base, paid:paid0, left:Math.max(0, base - paid0),
                           late:0, pctNow:0, inGrace:true, graceEnd:gEnd};
  const late = Math.max(0, Math.floor((now() - Number(ln.dueTs)) / DAYMS));
  const cap  = Math.max(pct0, Number(cfg().loanMaxPct || pct0));
  const pctNow = Math.min(cap, pct0 + late * Number(cfg().loanLatePct || 0));
  // คูณก่อนหารร้อย — ถ้าเขียน base*(1+pct/100) ทศนิยมลอยตัวจะเพี้ยน (340*1.1 = 374.0000000000001)
  const total = base + Math.ceil(base * pctNow / 100);
  return {total, paid:paid0, left: Math.max(0, total - paid0),
          late, pctNow, inGrace:false, graceEnd:gEnd};
}
/* ยืมได้กี่ครั้งแล้วสัปดาห์นี้ (นับทั้งที่อนุมัติแล้วและที่รออนุมัติ) */
function loansThisWeek(kidId){
  const w = weekStartTs();
  return S.log.filter(l => l.kind==='loan' && l.kidId===kidId && l.ts >= w).length
       + S.pending.filter(p => p.type==='loan' && p.kidId===kidId && p.ts >= w).length;
}
/* โบนัสฝากคู่: เงินฝากของพี่น้องที่ครบกำหนด "วันเดียวกัน" และล็อกยาวพอทั้งคู่ */
function coDepPartner(kidId, d){
  const minD = Number(cfg().coDepMinDays || 0);
  if(!Number(cfg().coDepBonusPct) || Number(d.days) < minD) return null;
  const day = dstr(d.dueTs);
  for(const o of S.kids){
    if(o.id === kidId) continue;
    if(bankOf(o).some(x => x.kind==='deposit' && Number(x.days) >= minD && dstr(x.dueTs) === day)) return o;
    if(S.log.some(l => l.kidId===o.id && l.kind==='withdraw' && l.dueDay === day && Number(l.iv) > 0)) return o;
  }
  return null;
}
const coDepBonus = d => Math.min(Number(cfg().coDepBonusMax || 0),
                                 Math.floor(Number(d.amount) * Number(cfg().coDepBonusPct || 0) / 100));
function untilTxt(ts){
  const ms = Number(ts) - now();
  if(ms <= 0) return `เลยกำหนดมา ${Math.floor(-ms/DAYMS)} วัน`;
  const d = Math.floor(ms/DAYMS), h = Math.floor((ms % DAYMS)/3600000);
  return d ? `อีก ${d} วัน ${h} ชม.` : `อีก ${h} ชม.`;
}
/* เขียนบัญชีธนาคาร + แต้ม + ประวัติ ในก้อนเดียว (atomic) จะได้ไม่มีทางแต้มหายกลางทาง */
async function bankCommit(kidId, entry, bankArr){
  const b = writeBatch(db);
  const u = {};
  if(bankArr) u.bank = bankArr;
  if(entry){
    b.set(dref('log', entry.id), entry);
    if(entry.delta) u[POT_FIELD[entry.pot || 'daily']] = increment(Number(entry.delta));
  }
  if(Object.keys(u).length) b.update(dref('kids', kidId), u);
  await b.commit();
}
/* รายงานเงินเฟ้อให้พ่อแม่ดู — ดอกที่ "พิมพ์ใหม่" เทียบกับดอกยืมที่ "เผาทิ้ง" */
function bankReport(days){
  const from = now() - days*DAYMS;
  let created = 0, repaid = 0, principal = 0, earned = 0;
  S.log.forEach(l => {
    if(l.ts < from) return;
    const d = Number(l.delta);
    if(l.kind === 'withdraw') created += Number(l.iv || 0);
    else if(l.kind === 'repay') repaid += Math.abs(d);
    else if(l.kind === 'loan') principal += d;
    else if((l.kind === 'chore' || l.kind === 'bonus') && d > 0) earned += d;
  });
  const burned = Math.max(0, repaid - principal);
  const net = created - burned;
  return {created, burned, net, earned,
          pct: earned ? Math.round(net/earned*1000)/10 : 0};
}

function doneToday(kidId, name){
  const t = todayStr();
  return S.log.some(l => l.kidId===kidId && l.kind==='chore' && l.name===name && dstr(l.ts)===t)
      || S.pending.some(p => p.kidId===kidId && p.type==='chore' && p.name===name && dstr(p.ts)===t);
}
/* ---------- งานยกยอด (carry) ----------
   งานบางอย่างของวันธรรมดายกไปทำอีกวันได้ เช่น การบ้านวันศุกร์ → วันอาทิตย์ แต่ได้แต้มไม่เต็ม
   carryDay = วันที่ยกไปทำได้ (0=อา) · carryPct = ได้กี่ % ของแต้มเดิม
   วันต้นทางไม่ต้องตั้ง — ระบบไล่ย้อนจาก carryDay หาวันทำงานล่าสุดของงานนั้นเอง */
const hasCarry = c => c && c.carryDay !== undefined && c.carryDay !== '' && c.carryDay !== null;
const daysOf = c => Array.isArray(c.days) ? c.days : ALLDAYS;
const isCarryDow = (c, dow) =>
  hasCarry(c) && Number(c.carryDay) === dow && daysOf(c).indexOf(dow) < 0;
const isCarryToday = c => isCarryDow(c, new Date(now()).getDay());
/* แต้มของงานนี้ในวันที่ระบุ — วันยกยอดได้ไม่เต็ม */
const ptsOn = (c, dow) => isCarryDow(c, dow)
  ? Math.max(1, Math.round(Number(c.pts) * Number(c.carryPct || 100) / 100)) : Number(c.pts);
const ptsToday = c => ptsOn(c, new Date(now()).getDay());
/* วันต้นทางของงานยกยอด = วันทำงานล่าสุดก่อนถึง carryDay */
function carrySrcDow(c){
  if(!hasCarry(c)) return -1;
  const days = daysOf(c);
  for(let i=1;i<=7;i++){ const d = (Number(c.carryDay) - i + 7) % 7; if(days.indexOf(d) >= 0) return d; }
  return -1;
}
function carrySrcTs(c){                       // timestamp ต้นวันของวันต้นทางล่าสุดที่ผ่านมา
  const src = carrySrcDow(c); if(src < 0) return 0;
  const d = new Date(now()); d.setHours(0,0,0,0);
  for(let i=0;i<8;i++){ if(d.getDay() === src) return d.getTime(); d.setDate(d.getDate()-1); }
  return 0;
}
/* ทำวันต้นทางไปแล้ว → วันยกยอดไม่ต้องโผล่ให้ทำซ้ำ */
function carryDone(kidId, c){
  if(!isCarryToday(c)) return false;
  const ts = carrySrcTs(c); if(!ts) return false;
  const ds = dstr(ts);
  return S.log.some(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===ds)
      || S.pending.some(p => p.kidId===kidId && p.type==='chore' && p.name===c.name && dstr(p.ts)===ds);
}
function appliesOn(c, d){
  const dow = (d ? new Date(d) : new Date(now())).getDay();
  const days = daysOf(c);
  return !days.length || days.indexOf(dow) >= 0 || isCarryDow(c, dow);
}
/* งานของเด็กคนนี้วันนี้ — ตัดงานยกยอดที่เขาทำวันต้นทางไปแล้วออก */
const appliesFor = (kidId, c, d) => appliesOn(c, d) && !carryDone(kidId, c);
function evalTiming(c, t){
  t = t === undefined ? now() : t;
  const full = ptsOn(c, new Date(t).getDay());     // วันยกยอดได้แต้มไม่เต็ม
  if(!c.due) return {status:'', lateMin:0, pts:full};
  const late = Math.round((t - dueDateOf(c.due, t))/60000);
  if(late <= 0) return {status:'ontime', lateMin:0, pts:full};
  if(late <= Number(c.grace||10))
    return {status:'late', lateMin:late, pts:Math.max(1, Math.round(full*Number(c.latePct||50)/100))};
  return {status:'toolate', lateMin:late, pts:0};
}
const STATUS_TXT = {ontime:'ทันเวลา', late:'สายนิดหน่อย', toolate:'สายเกินไป'};
const STATUS_COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)'};
const windowOpen = c => !c.from || now() >= dueDateOf(c.from).getTime();
const dueKey = c => c.due || '99:99';
const chainToday = () => S.chores.filter(c => c.routine && c.by==='kid' && c.chain !== false && appliesOn(c))
  .sort((a,b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : 0);
function blockedBy(c, kidId){
  if(!cfg().stepOrder || !c.routine || c.by !== 'kid' || c.chain === false) return null;
  const list = chainToday();
  const idx = list.findIndex(x => x.id === c.id);
  if(idx <= 0) return null;
  for(let i=0;i<idx;i++) if(!doneToday(kidId, list[i].name)) return list[i];
  return null;
}
const routineToday = () => S.chores.filter(c => c.routine && appliesOn(c));
/* รายการของเด็กคนนี้โดยเฉพาะ — ตัดงานยกยอดที่เขาทำวันต้นทางไปแล้ว */
const routineFor = kidId => S.chores.filter(c => c.routine && appliesFor(kidId, c));
/* แต้มเต็มของวันที่งานเยอะที่สุดในสัปดาห์ — ใช้เป็นฐานคิดโบนัสตามสัดส่วน */
function weekPeakRoutine(){
  let m = 0;
  for(let d=0; d<7; d++){
    const s = S.chores.filter(c => c.routine && appliesOn(c, nextDowTs(d)))
                      .reduce((a,c) => a + ptsOn(c, d), 0);
    if(s > m) m = s;
  }
  return m;
}
function nextDowTs(dow){                 // timestamp ของวัน dow ในสัปดาห์นี้ (ใช้แค่หา getDay)
  const d = new Date(now()); d.setHours(12,0,0,0);
  d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7));
  return d.getTime();
}
/* โบนัสตรงเวลาครบทั้งวัน คิดตามสัดส่วนงานของวันนั้น — วันงานน้อยได้โบนัสน้อยลงตามส่วน
   ทำให้โบนัสรวมทั้งสัปดาห์เท่าเดิม ไม่ว่าจะย้ายงานไปวันไหน (กันแต้มเฟ้อ) */
function bonusFor(kidId){
  const b = Number(cfg().perfectBonus || 0); if(!b) return 0;
  const peak = weekPeakRoutine(); if(!peak) return 0;
  const mine = routineFor(kidId).reduce((s,c) => s + ptsToday(c), 0);
  if(mine <= 0) return 0;
  return Math.max(1, Math.round(b * mine / peak));
}
function routineProgress(kidId){
  const list = routineFor(kidId);
  const left = list.filter(c => !doneToday(kidId, c.name));
  return {total:list.length, done:list.length-left.length, left, complete:list.length>0 && left.length===0};
}
/* คะแนนวันนี้ = ได้กี่แต้มจากกิจวัตร เทียบกับแต้มเต็มที่เป็นไปได้ (รวมโบนัสตรงเวลาครบ) */
function todayScore(kidId){
  const routine = routineFor(kidId);
  const names = {}; routine.forEach(c => { names[c.name] = true; });
  const max = routine.reduce((s,c) => s + ptsToday(c), 0);
  const t = todayStr();
  const mine = S.log.filter(l => l.kidId===kidId && dstr(l.ts)===t);
  let core = 0, extra = 0, minus = 0;
  mine.forEach(l => {
    const d = Number(l.delta);
    if(l.kind === 'bonus') extra += d;
    else if(l.kind === 'chore') { if(names[l.name]) core += d; else extra += d; }
    else if(l.kind === 'penalty' || (l.kind === 'adjust' && d < 0)) minus += d;
    else if(l.kind === 'adjust' && d > 0) extra += d;
  });
  const waiting = S.pending.filter(p => p.kidId===kidId && p.type==='chore' && dstr(p.ts)===t)
                           .reduce((s,p) => s + Number(p.pts), 0);
  return {max, core, extra, minus, waiting,
          pct: max ? Math.round(core / max * 100) : 0,
          perfect: max > 0 && core >= max};
}
function onTimeStreak(kidId){
  let streak = 0;
  for(let i=0;i<120;i++){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    const ds = dstr(d.getTime());
    const timed = S.chores.filter(c => c.routine && c.due && appliesOn(c, d.getTime()));
    if(!timed.length){ if(i===0) continue; else break; }
    const all = timed.every(c => {
      const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===ds);
      return e && e.status==='ontime';
    });
    if(all) streak++; else if(i===0) continue; else break;
  }
  return streak;
}

/* ============================================================
   เขียนข้อมูล (Firestore เขียนลงเครื่องก่อนแล้วค่อยซิงก์ — กดปุ๊บเห็นผลปั๊บ)
   ============================================================ */
function logEntry(kidId, kind, name, emo, delta, extra){
  return Object.assign({id:uid(), ts:now(), kidId, kind, name, emo, delta:Number(delta),
                        pot:'daily', rid:'', due:'', status:'', lateMin:0}, extra||{});
}
async function addLog(entry){
  const b = writeBatch(db);
  b.set(dref('log', entry.id), entry);
  if(entry.delta){
    const f = POT_FIELD[entry.pot || 'daily'];
    b.update(dref('kids', entry.kidId), {[f]: increment(Number(entry.delta))});
  }
  await b.commit();
  // ได้แต้มประจำวันมาใหม่ → หักใช้หนี้อัตโนมัติทันที (bankCommit ไม่วิ่งผ่านตรงนี้ จึงไม่วน)
  if(bankOn() && (entry.pot||'daily') === 'daily' && Number(entry.delta) > 0)
    await autoRepay(entry.kidId, Number(entry.delta));
}
async function removeLog(entry){
  const b = writeBatch(db);
  b.delete(dref('log', entry.id));
  if(entry.delta){
    const f = POT_FIELD[entry.pot || 'daily'];
    b.update(dref('kids', entry.kidId), {[f]: increment(-Number(entry.delta))});
  }
  await b.commit();
}
async function checkPerfectDay(kidId){
  const bonus = bonusFor(kidId);            // คิดตามสัดส่วนงานของวันนั้น
  if(!bonus) return false;
  const t = todayStr();
  const timed = routineFor(kidId).filter(c => c.due);
  if(!timed.length) return false;
  const allOnTime = timed.every(c => S.log.some(l =>
    l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===t && l.status==='ontime'));
  if(!allOnTime) return false;
  if(S.log.some(l => l.kidId===kidId && l.kind==='bonus' && dstr(l.ts)===t)) return false;
  await addLog(logEntry(kidId, 'bonus', 'ตรงเวลาครบทั้งวัน 🎉', '🏅', bonus, {pot:'extra'}));
  toast(`สุดยอด! ตรงเวลาครบทุกอย่าง +${bonus} แต้มพิเศษ 🏅`);
  return true;
}
function fail(e){ console.error(e); toast('บันทึกไม่สำเร็จ — ' + (e && e.code ? e.code : 'ลองใหม่อีกครั้ง')); }

   พอเข้าโหมดผู้ปกครอง (ถือว่าดูแล้ว) และเคลียร์คิวหมด กล่องนี้จะหายไปเอง */
function homeFeed(){

    .map(p => ({ts:p.ts, kidId:p.kidId, emo:p.emo, name:p.name, wait:true,

              && ['adjust','deposit','withdraw','repay'].indexOf(l.kind) < 0)
      .map(l => ({ts:l.ts, kidId:l.kidId, emo:l.emo, name:l.name, wait:false,

/* ---------- หน้าเด็ก ---------- */
/* สถานะของงานหนึ่งชิ้น — ใช้ทั้งในแถวงานและแถบติดตามความคืบหน้า */
function choreState(c, kidId){
  if(c.once && doneToday(kidId, c.name)) return 'done';
  if(c.by === 'parent') return 'parent';
  if(!windowOpen(c)) return 'early';
  if(blockedBy(c, kidId)) return 'locked';
  const t = evalTiming(c);
  return (t.status === 'late' || t.status === 'toolate') ? 'late' : 'ready';
}
const STATE_ICON = {done:'✅', parent:'👩', early:'⏳', locked:'🔒', late:'⚠️', ready:'👉'};

/* แถบติดตาม — เห็นทั้งวันในแถวเดียว ว่าทำอะไรไปแล้วบ้าง */
function taskStrip(kidId){
  const list = routineFor(kidId).slice().sort((a,b) => (a.due||'99') < (b.due||'99') ? -1 : 1);
  if(!list.length) return '';
  const cls = {done:'done', ready:'now', late:'late', early:'wait', locked:'wait', parent:'wait'};
  return `<div class="strip">${list.map(c => {
    const st = choreState(c, kidId);
    return `<div class="chip ${cls[st]}" title="${esc(c.name)}">
      <span>${c.emo}</span><small>${STATE_ICON[st]}</small></div>`;
  }).join('')}</div>`;
}

/* แถวงาน — ออกแบบให้เด็กที่ยังอ่านไม่ออกดูรู้เรื่อง
   ใช้ ไอคอนใหญ่ + สีขอบ + ตัวเลขเวลา แทนประโยคยาว ๆ */
function choreRow(c, kidId){
  const st = choreState(c, kidId);          // ใช้ตัวเดียวกับแถบติดตาม จะได้ไม่มีทางขัดกัน
  const used = st === 'done';
  const t = evalTiming(c);
  const early = st === 'early';
  const prev  = st === 'locked' ? blockedBy(c, kidId) : null;
  let state, sub, cls = '', btn;

  if(used){
    const done = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===todayStr());
    state = '✅';
    sub = done ? `<span class="bignum">${fmtClock(done.ts)}</span>` : '⏳';
    cls = 'locked';
    btn = '';
  }else if(c.by === 'parent'){
    state = '👩';
    sub = c.due ? `<span class="bignum">${c.due}</span>` : '';
    cls = 'locked';
    btn = '';
  }else if(early){
    state = '⏳';
    sub = `<span class="bignum">${c.from}</span>`;
    cls = 'locked';
    btn = '';
  }else if(prev){
    state = '🔒';
    sub = `${prev.emo}`;
    cls = 'locked';
    btn = '';
  }else{
    const mins = c.due ? Math.round((dueDateOf(c.due) - now())/60000) : null;
    if(!c.due){ state = '👉'; sub = ''; cls = 'ready'; }
    else if(mins > 0){ state = '👉'; cls = 'ready';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--good)">${mins}′</span>`; }
    else if(t.status === 'late'){ state = '⚠️'; cls = 'warn';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--gold)">+${t.lateMin}′</span>`; }
    else { state = '⚠️'; cls = 'warn';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--warn)">+${t.lateMin}′</span>`; }
    btn = `<button class="btn-good btn-done" onclick="doChore('${c.id}')">✓ Done</button>`;
  }
  const shownPts = (!used && c.due) ? t.pts : Number(c.pts);
  return `<div class="item ${cls}">
    <div class="emo">${c.emo}</div>
    <div class="txt"><b>${esc(c.name)}</b><span class="muted">${sub}</span></div>
    <span class="state">${state}</span>
    <span class="tag ${shownPts>0?'tag-plus':'tag-minus'}">+${shownPts}</span>
    ${btn}</div>`;
}

function logLine(l, withUndo){
  const kid = kidById(l.kidId);

      ? '<span style="color:var(--good)">ทันเวลา</span>'

  const amt = ((l.pot==='extra')?'💎 ':'') + (d>=0?'+':'') + d;
  return `<div class="log-line">
    <span style="font-size:19px">${l.emo || '•'}</span>

}

/* ---------- การกระทำของเด็ก ---------- */
async function doChore(id){
  const c = S.chores.find(x => x.id===id); if(!c) return;
  if(c.once && doneToday(view.kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  if(!windowOpen(c)){ toast(`ยังไม่ถึงเวลา — เริ่มได้ตอน ${c.from} นะ`); render(); return; }
  const prev = blockedBy(c, view.kidId);
  if(prev){ toast(`ต้องทำ "${prev.name}" ให้เสร็จก่อนนะ`); render(); return; }
  const t = evalTiming(c);
  const commit = async () => {
    try{
      const statusTxt = t.status==='ontime' ? 'ทันเวลา! 🎉'
                      : t.status==='late'   ? `สาย ${t.lateMin} นาที`
                      : t.status==='toolate'? `สาย ${t.lateMin} นาที — รอบหน้าเอาใหม่นะ` : 'เรียบร้อย';
      if(cfg().approveChores){
        const p = {id:uid(), ts:now(), kidId:view.kidId, type:'chore', name:c.name, emo:c.emo,
                   pts:t.pts, full:Number(c.pts), pot: c.routine ? 'daily' : 'extra',
                   due:c.due||'', status:t.status, lateMin:t.lateMin};
        await setDoc(dref('pending', p.id), p);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name, big:'ส่งแล้ว ✓', color:'var(--navy)',
          sub:`${statusTxt} · รอคุณพ่อคุณแม่ตรวจ`,
          extra: `แต้มวันนี้ ${todayScore(view.kidId).core}/${todayScore(view.kidId).max} (${todayScore(view.kidId).pct}%)`,
          toast:`ส่งแล้ว รอตรวจ ${c.emo}`});
      }else{
        await addLog(logEntry(view.kidId, 'chore', c.name, c.emo, t.pts,
                              {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status:t.status, lateMin:t.lateMin}));
        const gotBonus = await checkPerfectDay(view.kidId);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name,
          big: t.pts>0 ? `+${t.pts} แต้ม` : 'ไม่ได้แต้ม',
          color: t.pts>0 ? 'var(--good)' : 'var(--warn)',
          sub: statusTxt,
          extra: gotBonus ? `🏅 ตรงเวลาครบทั้งวัน! โบนัสอีก +${bonusFor(view.kidId)} แต้ม — วันนี้ 100% เต็ม`
               : `แต้มวันนี้ ${todayScore(view.kidId).core}/${todayScore(view.kidId).max} (${todayScore(view.kidId).pct}%)`,
          toast: t.pts>0 ? `ได้ ${t.pts} แต้ม ${c.emo}` : 'บันทึกเวลาแล้ว แต่สายเกินไปเลยไม่ได้แต้ม'});
      }
    }catch(e){ fail(e); }
  };
  commit();          // กดแล้วบันทึกเลย ไม่ถามซ้ำ — ผลลัพธ์ไปแสดงในหน้าสรุปแทน
}
/* ---------- แลกของรางวัล (รางวัลใหญ่บางอย่างหารกันจ่ายได้) ---------- */
const potOf = r => r.big ? 'extra' : 'daily';
function limitMsg(r, lim){
  if(lim.dLeft <= 0) return `วันนี้แลก "${r.name}" ครบโควตาแล้ว (วันละ ${r.limitDay} ครั้ง)`;
  if(lim.wLeft <= 0) return `สัปดาห์นี้แลก "${r.name}" ครบแล้ว (สัปดาห์ละ ${r.limitWeek} ครั้ง)`;
  return '';
}
function redeem(id){
  const r = S.rewards.find(x => x.id===id); if(!r) return;
  const kid = kidById(view.kidId); if(!kid) return;
  const pot = potOf(r);
  const lim = limitLeft(kid.id, r);
  if(!lim.ok){ toast(limitMsg(r, lim)); return; }
  const half = Math.ceil(Number(r.cost)/2);
  const others = S.kids.filter(x => x.id !== kid.id && available(x.id, pot) >= half && limitLeft(x.id, r).ok);
  if(r.share && others.length){ modal = {kind:'share', r, kid, half, others, pot}; renderModal(); return; }
  if(available(kid.id, pot) < Number(r.cost)){
    toast(r.share ? 'ยังไม่มีใครแต้มพอมาหารด้วย และแต้มตัวเองก็ยังไม่พอ'
                  : POT_NAME[pot] + 'ยังไม่พอ'); return;
  }
  doRedeem(r, kid, Number(r.cost), null);
}
function shareWith(rewardId, partnerId){
  const r = S.rewards.find(x => x.id===rewardId), kid = kidById(view.kidId);
  const partner = kidById(partnerId);
  if(!r || !kid || !partner) return;
  const half = Math.ceil(Number(r.cost)/2), pot = potOf(r);
  modal = null; renderModal();
  if(available(kid.id, pot) < half){ toast(POT_NAME[pot]+'ของหนูยังไม่พอสำหรับครึ่งหนึ่ง'); return; }
  if(available(partner.id, pot) < half){ toast(`${POT_NAME[pot]}ของ${partner.name}ยังไม่พอ`); return; }
  // ต้องได้รับความยินยอมจากคนที่มาช่วยจ่าย — ให้เขามาใส่ PIN เอง
  askKidPin(partner, () => doRedeem(r, kid, half, partner),
            `${partner.name} มาใส่ PIN เพื่อยืนยันว่ายอมช่วยจ่าย ${half} แต้มนะ`);
}
function shareAlone(rewardId){
  const r = S.rewards.find(x => x.id===rewardId), kid = kidById(view.kidId);
  modal = null; renderModal();
  if(!r || !kid) return;
  if(available(kid.id, potOf(r)) < Number(r.cost)){ toast('แต้มยังไม่พอถ้าจ่ายคนเดียว'); return; }
  doRedeem(r, kid, Number(r.cost), null);
}
function doRedeem(r, kid, pts, partner){
  const pn = POT_NAME[potOf(r)];
  const msg = partner
    ? `หารกับ${partner.name} — จ่าย${pn}คนละ ${pts} รอคุณพ่อคุณแม่อนุมัติก่อนนะ`
    : `ใช้${pn} ${pts} แต้ม — ต้องรอคุณพ่อคุณแม่อนุมัติก่อนนะ`;
  askKidPin(kid, () => openConfirm(`ขอแลก "${r.name}"`, msg, async () => {
    try{
      const p = {id:uid(), ts:now(), kidId:kid.id, type:'reward', name:r.name, emo:r.emo,
                 pts:Number(pts), total:Number(r.cost), pot:potOf(r), rid:r.id,
                 partnerId: partner ? partner.id : '', partnerName: partner ? partner.name : ''};
      await setDoc(dref('pending', p.id), p);
      showFlash({emo:r.emo, title:'ส่งคำขอแลกแล้ว',
        big: partner ? `คนละ ${pts} แต้ม` : `−${pts} แต้ม`, color:'var(--gold)',
        sub: partner ? `หารกับ${partner.name} 🤝 รอคุณพ่อคุณแม่อนุมัติ` : 'รอคุณพ่อคุณแม่อนุมัติก่อนนะ',
        toast:'ส่งคำขอแล้ว รออนุมัติ'});
    }catch(e){ fail(e); }
  }));
}

/* ---------- แบ่งแต้มให้พี่น้อง (โอนแต้ม) ----------
   คนให้ต้องใส่ PIN ของตัวเอง → เข้าคิวรอพ่อแม่อนุมัติ → แต้มถึงย้ายจริง  */
function openGive(){
  const kid = kidById(view.kidId); if(!kid) return;
  const others = S.kids.filter(x => x.id !== kid.id);
  if(!others.length){ toast('ยังไม่มีพี่น้องให้แบ่งแต้ม'); return; }
  const left = giveLeft(kid.id);
  if(left <= 0){ toast(`วันนี้แบ่งแต้มครบ ${giveCap()} แต้มแล้ว พรุ่งนี้ค่อยแบ่งใหม่นะ`); return; }
  if(others.length === 1){ giveForm(others[0].id); return; }
  modal = {kind:'give', kid, others}; renderModal();
}
function giveForm(partnerId){
  const kid = kidById(view.kidId), partner = kidById(partnerId);
  modal = null; renderModal();
  if(!kid || !partner) return;
  const left = giveLeft(kid.id);
  if(left <= 0){ toast(`วันนี้แบ่งแต้มครบ ${giveCap()} แต้มแล้ว พรุ่งนี้ค่อยแบ่งใหม่นะ`); return; }
  const haveD = available(kid.id,'daily'), haveE = available(kid.id,'extra');
  if(haveD <= 0 && haveE <= 0){ toast('ยังไม่มีแต้มให้แบ่งเลย'); return; }
  openForm({title:`🤝 แบ่งแต้มให้${partner.name}`,
    fields:[
      {key:'extra', label:'แบ่งจากกระเป๋าไหน', type:'switch', value: haveD <= 0,
       onText:`💎 แต้มพิเศษ (มี ${haveE})`, offText:`🎈 แต้มประจำวัน (มี ${haveD})`},
      {key:'amt', label:'แบ่งกี่แต้ม' + (giveCap() ? ` (วันนี้เหลือได้อีก ${left})` : ''),
       type:'number', value:10}],
    async onSave(v){
      const pot = v.extra ? 'extra' : 'daily';
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      const have = available(kid.id, pot);
      if(have < n) return `${POT_NAME[pot]}มีให้แบ่งแค่ ${have} แต้ม`;
      if(giveCap() && n > left) return `วันนี้แบ่งได้อีกไม่เกิน ${left} แต้ม`;
      setTimeout(() => doGive(kid, partner, pot, n), 0);   // รอให้ฟอร์มปิดก่อนค่อยเด้ง PIN
    }});
}
function doGive(kid, partner, pot, n){
  askKidPin(kid, () => openConfirm(`แบ่งแต้มให้${partner.name}`,
    `${POT_NAME[pot]} ${n} แต้ม จะย้ายไปให้${partner.name} — ต้องรอคุณพ่อคุณแม่อนุมัติก่อนนะ`, async () => {
      try{
        const p = {id:uid(), ts:now(), kidId:kid.id, type:'transfer',
                   name:`แบ่งแต้มให้${partner.name}`, emo:'🤝',
                   pts:Number(n), total:Number(n), pot, rid:'',
                   partnerId:partner.id, partnerName:partner.name};
        await setDoc(dref('pending', p.id), p);
        showFlash({emo:'🤝', title:'ส่งคำขอแบ่งแต้มแล้ว', big:`−${n} แต้ม`, color:'var(--gold)',
          sub:`ให้${partner.name} · รอคุณพ่อคุณแม่อนุมัติ`, toast:'ส่งคำขอแล้ว รออนุมัติ'});
      }catch(e){ fail(e); }
    }),
    `${kid.name} ใส่ PIN เพื่อยืนยันว่าจะแบ่ง ${n} แต้มให้${partner.name}`);
}

/* ---------- 🏦 หน้าธนาคารของเด็ก ---------- */
function bankTab(k, myPend){
  if(!bankOn()) return '<div class="empty">ธนาคารปิดอยู่ — ให้คุณพ่อคุณแม่เปิดในหน้าตั้งค่า</div>';
  const ln = activeLoan(k.id), deps = myDeposits(k.id);
  const waitLoan   = myPend.filter(p => p.type==='loan');
  const waitUnlock = myPend.filter(p => p.type==='unlock');
  let out = '';

  if(waitLoan.length) out += `<div class="card" style="background:var(--gold-soft)">
    <div class="sec-title" style="margin:0 0 6px">⏳ รออนุมัติ</div>
    ${waitLoan.map(p => `<div class="log-line" style="border-color:#efe0c4">
      <span style="font-size:19px">💳</span>
      <span style="flex:1">${esc(p.name)}<span class="muted" style="display:block">ต้องคืน ${
        p.total} แต้มใน ${p.days} วัน · ขอเมื่อ ${timeAgo(p.ts)}</span></span>
      <span class="tag tag-wait">+${p.pts}</span></div>`).join('')}</div>`;

  if(ln){
    const o = loanOwed(ln);
    const over = o.late > 0;
    const pctDone = o.total ? Math.round(o.paid / o.total * 100) : 0;
    out += `<div class="card" style="border:2px solid ${
      over?'var(--warn)':o.inGrace?'var(--good)':'var(--gold)'}55">
      <div class="row-between"><b>💳 หนี้ที่ต้องใช้คืน</b>
        <span class="tag ${over?'tag-minus':o.inGrace?'tag-plus':'tag-cost'}">${
          o.inGrace ? `ปลอดดอกอีก ${untilTxt(o.graceEnd).replace('อีก ','')}` : untilTxt(ln.dueTs)}</span></div>
      <div style="font-size:26px;font-weight:800;color:${
        over?'var(--warn)':o.inGrace?'var(--good)':'var(--gold)'};margin:6px 0">
        ${o.left} <span style="font-size:15px;color:var(--muted);font-weight:600">แต้มที่ยังค้าง</span></div>
      <div class="prog"><i style="width:${Math.min(100,pctDone)}%;background:var(--good)"></i></div>
      <div class="muted" style="margin-top:6px">ยืมมา ${ln.amount} · ${o.inGrace
        ? `ตอนนี้คืนครบ <b>${ln.amount}</b> จบเลย ไม่เสียดอก — พ้นช่วงนี้แล้วจะกลายเป็น ${
            ln.amount + Math.ceil(ln.amount*Number(ln.rate)/100)}`
        : `ต้องคืนรวม ${o.total} (ดอก ${o.pctNow}%${over?` — เลยกำหนดแล้วดอกเดินวันละ ${cfg().loanLatePct}%`:''})`
        } · จ่ายไปแล้ว ${o.paid}</div>
      ${ln.cosignId ? `<div class="muted" style="margin-top:4px">🤝 ${esc(ln.cosignName||'')} ค้ำให้อยู่ ${
        over ? '<b style="color:var(--warn)">— เลยกำหนดแล้ว แต้มค้ำกำลังโดนยึด</b>' : '— อย่าให้เลยกำหนดนะ'}</div>` : ''}
      <div class="muted" style="margin-top:4px">🤖 แต้มประจำวันที่ได้ทุกครั้ง จะถูกหักใช้หนี้อัตโนมัติ ${
        cfg().loanRepayPct}%</div>
      <button class="btn-primary btn-full" style="margin-top:10px" onclick="payLoanAll()">
        จ่ายคืนตอนนี้ (มี ${available(k.id,'daily')} แต้ม)</button></div>`;
  }

  out += deps.map(d => {
    const iv = depInterest(d), ok = matured(d);
    const wait = waitUnlock.some(p => p.rid === d.id);
    const passed = Math.min(100, Math.max(0, Math.round((now()-d.openTs)/(d.dueTs-d.openTs)*100)));
    return `<div class="card" style="border:2px solid ${ok?'var(--good)':'var(--line)'}">
      <div class="row-between"><b>🏦 ฝาก${POT_NAME[d.pot]} ${d.amount} แต้ม</b>
        <span class="tag ${ok?'tag-plus':'tag-wait'}">${ok?'ครบกำหนดแล้ว':untilTxt(d.dueTs)}</span></div>
      <div class="muted" style="margin:6px 0">ล็อก ${d.days} วัน · ดอก +${d.pct}% = <b>+${iv} แต้ม</b>
        · ครบแล้วได้คืน ${Number(d.amount)+iv}</div>
      <div class="prog"><i style="width:${passed}%;background:${ok?'var(--good)':'var(--gold)'}"></i></div>
      ${wait ? `<div class="muted" style="margin-top:8px">⏳ ส่งคำขอถอนก่อนกำหนดแล้ว รอคุณพ่อคุณแม่</div>`
        : `<button class="${ok?'btn-gold':''} btn-full" style="margin-top:10px" onclick="withdrawDep('${d.id}')">${
            ok ? `ถอนเลย +${Number(d.amount)+iv}` : 'ขอถอนก่อนกำหนด (ไม่ได้ดอก)'}</button>`}</div>`;
  }).join('');

  // แต้มที่เอาไปค้ำให้พี่น้อง
  out += kidBank(k.id).filter(b => b.kind==='collateral').map(b => `
    <div class="card" style="border:2px solid var(--warn)55">
      <div class="row-between"><b>🔒 แต้มค้ำประกัน</b><span class="tag tag-wait">${b.amount}</span></div>
      <div class="muted" style="margin-top:6px">ล็อกไว้ค้ำหนี้ให้${esc(b.forName||'พี่น้อง')}
        · ใช้ไม่ได้จนกว่าหนี้จะปิด · ถ้าเขาคืนไม่ทันกำหนด แต้มนี้จะโดนยึดไปใช้หนี้</div></div>`).join('');

  out += `<div class="sec-title">💰 ฝากแต้มกินดอก</div>`;
  ['daily','extra'].forEach(pot => {
    let tl = depTiers(pot);
    if(!tl.length) return;
    const okTiers = ln ? tl.filter(t => now() + t.days*DAYMS <= graceEndOf(ln)) : tl;
    const has = depositIn(k.id, pot), have = available(k.id, pot);
    const can = !has && have > 0 && okTiers.length > 0;
    out += `<div class="item"><div class="emo">${pot==='extra'?'💎':'🎈'}</div>
      <div class="txt"><b>${POT_NAME[pot]}</b><span class="muted">${
        tl.map(t => `${t.days} วัน +${t.pct}%`).join(' · ')} · ฝากได้ไม่เกิน ${depCap(pot)}</span></div>
      <button class="${can ? 'btn-primary':''} btn-sm" ${can ? '' : 'disabled'}
        onclick="openDeposit('${pot}')">${
        has ? 'ฝากอยู่แล้ว' : have<=0 ? 'ไม่มีแต้ม' : okTiers.length ? 'ฝาก' : 'ฝากไม่ได้'}</button></div>`;
  });
  if(ln) out += `<div class="muted" style="margin:6px 2px">ตอนมีหนี้ ฝากได้เฉพาะบัญชีที่ครบกำหนด
    <b>ก่อนหมดช่วงปลอดดอก</b> ของหนี้ก้อนนี้ (${untilTxt(loanOwed(ln).graceEnd)})</div>`;

  if(!ln && !waitLoan.length){
    const perWk = Number(cfg().loanPerWeek||0), used = loansThisWeek(k.id);
    const outOf = perWk && used >= perWk;
    const blocked = deps.length > 0 || outOf;
    out += `<div class="sec-title">💳 ยืมแต้มล่วงหน้า</div>
      <div class="card">
        <div class="muted">ยืมได้เฉพาะ 🎈 แต้มประจำวัน ไม่เกิน <b>${cfg().loanCap}</b> แต้ม
          (= เกม/YouTube + ข้าวเย็น + Swensen) · ดอก ${cfg().loanPct}% คืนภายใน ${cfg().loanDays} วัน
          · เลยกำหนดดอกเดินวันละ ${cfg().loanLatePct}% (สูงสุด ${cfg().loanMaxPct}%)${
          perWk ? ` · ยืมได้สัปดาห์ละ ${perWk} ครั้ง (สัปดาห์นี้ใช้ไป ${used})` : ''}</div>
        <button class="${blocked?'':'btn-primary'} btn-full" style="margin-top:10px"
          ${blocked?'disabled':''} onclick="openLoan()">${
          outOf ? 'สัปดาห์นี้ยืมครบแล้ว'
          : deps.length ? 'ถอนเงินฝากให้หมดก่อนถึงจะยืมได้' : 'ขอยืมแต้ม'}</button></div>`;
  }

  /* กติกาบอกครบทุกข้อ แต่ไม่บอกว่าเอาข้อไหนมาต่อกันแล้วได้กำไร — ให้เด็กหาเจอเอง */
  out += `<div class="card" style="background:var(--navy-soft);margin-top:14px">
    <div class="sec-title" style="margin:0 0 6px">📘 กติกาทั้งหมด (อ่านให้ครบ แล้วลองคิดดู)</div>
    <div class="muted">
      1. <b>ฝาก</b> = ล็อกแต้มไว้ ยิ่งล็อกนานยิ่งได้ดอกเยอะ · ถอนก่อนกำหนด <b>ไม่ได้ดอกเลย</b><br>
      2. ฝากได้กระเป๋าละ <b>1 บัญชี</b> · เพดาน 🎈 ${cfg().depCapDaily} · 💎 ${cfg().depCapExtra}<br>
      3. <b>ยืม</b> ได้เฉพาะ 🎈 ไม่เกิน ${cfg().loanCap} · แต้มที่หาได้จะโดนหักใช้หนี้อัตโนมัติ ${cfg().loanRepayPct}%<br>
      4. 🎁 <b>คืนครบภายใน ${cfg().loanGraceDays} วันแรก = ไม่คิดดอกเลย</b> · พ้นจากนั้นคิด ${cfg().loanPct}% เต็มทันที<br>
      5. มีเงินฝากอยู่ <b>ยืมไม่ได้</b> · มีหนี้อยู่ ฝากได้<b>เฉพาะบัญชีที่ครบกำหนดก่อนหมดช่วงปลอดดอก</b><br>
      6. 🤝 ให้พี่น้อง<b>ค้ำ</b>ได้ — เขาโดนล็อกแต้ม ${cfg().cosignPct}% ของยอดยืม แลกกับดอกลดครึ่ง
         · เลยกำหนดเมื่อไหร่ แต้มค้ำโดนยึดจริง<br>
      7. 🎊 ถ้าเงินฝากของ<b>สองพี่น้องครบกำหนดวันเดียวกัน</b> และล็อกกันอย่างน้อย ${cfg().coDepMinDays} วัน
         ได้โบนัสทั้งคู่ +${cfg().coDepBonusPct}% (ไม่เกิน ${cfg().coDepBonusMax} แต้ม)
         · ใครถอนก่อนกำหนด อีกคนอดโบนัสไปด้วย<br>
      8. ยืมได้สัปดาห์ละ ${cfg().loanPerWeek} ครั้ง</div>
    <div class="muted" style="margin-top:8px;font-style:italic">
      💭 กติกาพวกนี้บางข้อเอามาต่อกันได้นะ — ใครคิดออกก่อน ได้แต้มฟรี (นิดหน่อย)</div></div>`;
  return out;
}

/* ---------- 🏦 ธนาคาร: ฝากแต้ม ---------- */
function openDeposit(pot){
  const kid = kidById(view.kidId); if(!kid || !bankOn()) return;
  if(depositIn(kid.id, pot)){ toast(`ตอนนี้มีบัญชีฝาก${POT_NAME[pot]}อยู่แล้ว 1 บัญชี`); return; }
  const ln = activeLoan(kid.id);
  let tl = depTiers(pot);
  // มีหนี้อยู่: ฝากได้เฉพาะบัญชีที่ครบกำหนด "ก่อนหมดช่วงปลอดดอก" ของหนี้ก้อนนั้น
  if(ln) tl = tl.filter(t => now() + t.days*DAYMS <= graceEndOf(ln));
  if(!tl.length){
    toast(ln ? `ตอนมีหนี้ ฝากได้เฉพาะบัญชีที่ครบกำหนดก่อนหมดช่วงปลอดดอก (${untilTxt(graceEndOf(ln))})`
             : 'ยังไม่ได้ตั้งดอกเบี้ยเงินฝาก');
    return;
  }
  const have = available(kid.id, pot), cap = depCap(pot);
  const most = cap ? Math.min(have, cap) : have;
  if(most <= 0){ toast(`${POT_NAME[pot]}ยังไม่พอฝาก`); return; }
  openForm({title:`🏦 ฝาก${POT_NAME[pot]}`,
    fields:[
      {key:'days', label:'ล็อกไว้กี่วัน (ยิ่งนาน ดอกยิ่งเยอะ)', type:'pick',
       opts: tl.map(t => ({v:t.days, t:`${t.days} วัน · +${t.pct}%`})), value: tl[0].days},
      {key:'amt', label:`ฝากกี่แต้ม (มี ${have}${cap?` · ฝากได้ไม่เกิน ${cap}`:''})`,
       type:'number', value: Math.min(most, 100)}],
    async onSave(v){
      const days = parseInt(v.days,10);
      const t = tl.find(x => x.days === days);
      if(!t) return 'เลือกจำนวนวันก่อนนะ';
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      if(n > have) return `${POT_NAME[pot]}มีแค่ ${have} แต้ม`;
      if(cap && n > cap) return `ฝากได้ครั้งละไม่เกิน ${cap} แต้ม (กันแต้มเฟ้อ)`;
      setTimeout(() => doDeposit(kid, pot, n, t), 0);
    }});
}
function doDeposit(kid, pot, n, t){
  const iv = Math.floor(n * t.pct / 100);
  askKidPin(kid, () => openConfirm('ฝากแต้ม',
    `ฝาก ${n} แต้ม ล็อก ${t.days} วัน — ครบกำหนดได้คืน ${n + iv} แต้ม (ดอก +${iv}) · ถอนก่อนกำหนดจะไม่ได้ดอกเลยนะ`,
    async () => {
      try{
        const rec = {id:uid(), kind:'deposit', pot, amount:Number(n), pct:Number(t.pct),
                     days:Number(t.days), openTs:now(), dueTs: now() + t.days*DAYMS};
        await bankCommit(kid.id,
          logEntry(kid.id,'deposit',`ฝาก ${t.days} วัน (+${t.pct}%)`,'🏦',-Number(n),{pot, iv:0}),
          bankOf(kid).concat([rec]));
        showFlash({emo:'🏦', title:'ฝากแต้มแล้ว', big:`${n} แต้ม`, color:'var(--gold)',
          sub:`ครบกำหนดใน ${t.days} วัน จะได้คืน ${n+iv} แต้ม`, toast:'ฝากแล้ว'});
      }catch(e){ fail(e); }
    }), `${kid.name} ใส่ PIN เพื่อยืนยันการฝาก ${n} แต้ม`);
}
/* ถอน: ครบกำหนดแล้วกดเองได้เลย · ยังไม่ครบต้องขอพ่อแม่ และไม่ได้ดอก */
function withdrawDep(recId){
  const kid = kidById(view.kidId); if(!kid) return;
  const rec = bankOf(kid).find(x => x.id === recId); if(!rec) return;
  if(!matured(rec)){ askEarly(recId); return; }
  const base = depInterest(rec);
  const mate = coDepPartner(kid.id, rec);
  const bonus = mate ? coDepBonus(rec) : 0;
  const iv = base + bonus, tot = Number(rec.amount) + iv;
  openConfirm('ถอนเงินฝาก',
    `ครบกำหนดแล้ว — ได้คืน ${rec.amount} + ดอก ${base}` +

/* ---------- 🏦 ธนาคาร: ยืมแต้ม (เฉพาะ 🎈 แต้มประจำวัน) ---------- */
function openLoan(){
  const kid = kidById(view.kidId); if(!kid || !bankOn()) return;
  if(activeLoan(kid.id)){ toast('ยังมีหนี้ค้างอยู่ ต้องปิดหนี้ก่อนถึงจะยืมใหม่ได้'); return; }
  if(myDeposits(kid.id).length){ toast('มีเงินฝากล็อกอยู่ — ถอนก่อนถึงจะยืมได้ (กันฝากกินดอกแล้วยืมมาใช้)'); return; }
  if(S.pending.some(p => p.type==='loan' && p.kidId===kid.id)){ toast('ส่งคำขอยืมไปแล้ว รออนุมัติอยู่'); return; }
  const perWk = Number(cfg().loanPerWeek||0);
  if(perWk && loansThisWeek(kid.id) >= perWk){
    toast(`สัปดาห์นี้ยืมครบ ${perWk} ครั้งแล้ว — สัปดาห์หน้าค่อยยืมใหม่นะ`); return; }
  const cap = Number(cfg().loanCap||0), pct = Number(cfg().loanPct||0), dys = Number(cfg().loanDays||7);
  if(cap <= 0){ toast('พ่อแม่ยังไม่ได้เปิดเพดานการยืม'); return; }
  openForm({title:'💳 ขอยืมแต้มประจำวัน',
    fields:[{key:'amt', label:`ยืมกี่แต้ม (ไม่เกิน ${cap})`, type:'number', value: Math.min(cap, 70)}],
    async onSave(v){
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      if(n > cap) return `ยืมได้ไม่เกิน ${cap} แต้ม`;
      setTimeout(() => pickCosign(kid, n, pct, dys), 0);
    }});
}
/* เลือกผู้ค้ำก่อน — มีคนค้ำแล้วดอกลดครึ่ง แต่คนค้ำโดนล็อกแต้มไว้จริง */
function pickCosign(kid, n, pct, dys){
  const need = Math.ceil(n * Number(cfg().cosignPct||0) / 100);
  const able = cfg().cosignOn === false ? []
    : S.kids.filter(o => o.id !== kid.id && available(o.id,'daily') >= need && need > 0);
  if(!able.length){ doLoan(kid, n, pct, dys, null); return; }
  modal = {kind:'cosign', kid, n, pct, dys, need, able}; renderModal();
}
function cosignWith(partnerId, alone){
  const m = modal; if(!m) return;
  modal = null; renderModal();
  if(alone){ doLoan(m.kid, m.n, m.pct, m.dys, null); return; }
  const partner = kidById(partnerId); if(!partner) return;
  const disc = Number(cfg().cosignDiscount||0);
  const newPct = Math.ceil(m.pct * (100 - disc) / 100);
  // คนค้ำต้องใส่ PIN ของตัวเองก่อน — ยินยอมให้ล็อกแต้มจริง
  askKidPin(partner, () => doLoan(m.kid, m.n, newPct, m.dys, {id:partner.id, name:partner.name, hold:m.need}),
    `${partner.name} ใส่ PIN เพื่อยอมให้ล็อกแต้ม ${m.need} แต้มไว้ค้ำ — ถ้า${m.kid.name}คืนไม่ทัน แต้มนี้จะโดนยึด`);
}
function doLoan(kid, n, pct, dys, cs){
  const total = n + Math.ceil(n * pct / 100);
  const rp = Number(cfg().loanRepayPct||50), gr = Number(cfg().loanGraceDays||0);
  askKidPin(kid, () => openConfirm('ขอยืมแต้ม',
    `ยืม ${n} แต้ม → ต้องใช้คืน ${total} แต้ม (ดอก ${total-n}) ภายใน ${dys} วัน` +
    (gr ? ` · คืนครบภายใน ${gr} วันแรก ไม่คิดดอกเลย` : '') +
    (cs ? ` · ${cs.name}ค้ำให้ ${cs.hold} แต้ม ดอกเลยลดเหลือ ${pct}%` : '') +
    ` · แต้มที่ได้ทุกครั้งจะถูกหักใช้หนี้อัตโนมัติ ${rp}% · รอคุณพ่อคุณแม่อนุมัติก่อนนะ`,
    async () => {
      try{
        const p = {id:uid(), ts:now(), kidId:kid.id, type:'loan',
                   name:`ขอยืม ${n} แต้ม${cs?` (${cs.name}ค้ำ)`:''}`, emo:'💳',
                   pts:Number(n), total:Number(total), pot:'daily', rid:'',
                   rate:Number(pct), days:Number(dys), grace:gr,
                   partnerId: cs ? cs.id : '', partnerName: cs ? cs.name : '',
                   hold: cs ? Number(cs.hold) : 0};
        await setDoc(dref('pending', p.id), p);
        showFlash({emo:'💳', title:'ส่งคำขอยืมแล้ว', big:`${n} แต้ม`, color:'var(--gold)',
          sub:`ต้องคืน ${total} แต้มใน ${dys} วัน · รอคุณพ่อคุณแม่อนุมัติ`, toast:'ส่งคำขอแล้ว'});
      }catch(e){ fail(e); }
    }), `${kid.name} ใส่ PIN เพื่อยืนยันว่าเข้าใจว่าต้องใช้คืน ${total} แต้ม`);
}
/* หักใช้หนี้อัตโนมัติทุกครั้งที่ได้แต้มประจำวันเข้ามา */
async function autoRepay(kidId, credited){
  const kid = kidById(kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan');
  if(i < 0) return;
  const o = loanOwed(arr[i]);
  const rp = Number(cfg().loanRepayPct||0)/100;
  if(rp <= 0) return;
  const pay = Math.min(Math.max(1, Math.ceil(credited * rp)), o.left, Math.max(0, balance(kidId,'daily')));
  if(pay <= 0) return;
  const na = arr.slice(), np = o.paid + pay;
  const done = np >= o.total;
  if(done) na.splice(i,1); else na[i] = Object.assign({}, arr[i], {paid:np});
  try{
    await bankCommit(kidId,
      logEntry(kidId,'repay', done ? 'ใช้หนี้งวดสุดท้าย — ปิดหนี้แล้ว 🎉'
               : (o.inGrace ? 'หักใช้หนี้อัตโนมัติ (ยังอยู่ในช่วงปลอดดอก)' : 'หักใช้หนี้อัตโนมัติ'),
               '💳', -pay, {pot:'daily'}), na);
    if(done){ await releaseCollateral(arr[i]); toast('ปิดหนี้ครบแล้ว 🎉'); }
    else if(o.late > 0) await seizeCollateral(kidId);
  }catch(e){ fail(e); }
}
/* ปิดหนี้แล้ว → ปลดล็อกแต้มของคนค้ำ */
async function releaseCollateral(ln){
  if(!ln || !ln.cosignId) return;
  const cs = kidById(ln.cosignId); if(!cs) return;
  const rest = bankOf(cs).filter(x => !(x.kind==='collateral' && x.loanId === ln.id));
  if(rest.length === bankOf(cs).length) return;
  await bankCommit(cs.id, null, rest);
  toast(`ปลดล็อกแต้มค้ำประกันของ${cs.name}แล้ว`);
}
/* เลยกำหนดแล้วยังค้าง → ยึดหลักประกันมาปิดหนี้ (บทเรียนเรื่องความเสี่ยงของการค้ำ) */
async function seizeCollateral(kidId){
  const kid = kidById(kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan'); if(i < 0) return;
  const ln = arr[i], o = loanOwed(ln);
  if(o.late <= 0 || o.left <= 0 || !ln.cosignId) return;
  const cs = kidById(ln.cosignId); if(!cs) return;
  const hold = bankOf(cs).find(x => x.kind==='collateral' && x.loanId === ln.id);
  if(!hold) return;
  const take = Math.min(Number(hold.amount), o.left, Math.max(0, balance(cs.id,'daily')));
  if(take <= 0) return;
  // หักจากคนค้ำจริง ๆ แล้วเอาไปลงเป็นยอดชำระของลูกหนี้
  const csRest = bankOf(cs).filter(x => x !== hold)
    .concat(take < Number(hold.amount) ? [Object.assign({}, hold, {amount:Number(hold.amount)-take})] : []);
  await bankCommit(cs.id,
    logEntry(cs.id,'repay',`โดนยึดหลักประกัน (ค้ำ${kid.name}ไว้)`,'⚠️',-take,{pot:'daily'}), csRest);
  const np = o.paid + take, done = np >= o.total;
  const na = arr.slice();
  if(done) na.splice(i,1); else na[i] = Object.assign({}, ln, {paid:np});
  await bankCommit(kidId, null, na);
  toast(`เลยกำหนด — ยึดหลักประกันของ${cs.name} ${take} แต้มมาปิดหนี้`);
}
function payLoanAll(){
  const kid = kidById(view.kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan'); if(i < 0) return;
  const o = loanOwed(arr[i]);
  const have = available(kid.id,'daily');
  const pay = Math.min(o.left, have);
  if(pay <= 0){ toast('แต้มประจำวันยังไม่พอจ่ายคืน'); return; }
  const done = o.paid + pay >= o.total;
  openConfirm(done ? 'ปิดหนี้ทั้งหมด' : 'จ่ายคืนบางส่วน',
    done ? `จ่าย ${pay} แต้ม แล้วหนี้จะหมดเลย` : `จ่าย ${pay} แต้ม · จะเหลือหนี้อีก ${o.left - pay} แต้ม`,
    async () => {
      try{
        const na = arr.slice();
        if(done) na.splice(i,1); else na[i] = Object.assign({}, arr[i], {paid:o.paid + pay});
        await bankCommit(kid.id,
          logEntry(kid.id,'repay', done ? 'ปิดหนี้เอง 🎉' : 'จ่ายคืนเอง', '💳', -pay, {pot:'daily'}), na);
        if(done) await releaseCollateral(arr[i]);
        toast(done ? 'ปิดหนี้แล้ว 🎉' : `จ่ายคืน ${pay} แต้มแล้ว`);
      }catch(e){ fail(e); }
    });
}

/* ---------- สถิติ ---------- */
function choreStats(kidId, chore, days){
  const res = {ontime:0, late:0, toolate:0, miss:0, na:0, sumLate:0, sumMin:0, n:0, applicable:0, boxes:[]};
  for(let i=days-1;i>=0;i--){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    if(!appliesOn(chore, d.getTime())){ res.na++; res.boxes.push({d, st:'na', e:null}); continue; }
    res.applicable++;
    const ds = dstr(d.getTime());
    const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===chore.name && dstr(l.ts)===ds);
    let st = 'miss';
    if(e){
      st = e.status || 'ontime';
      res.n++; res.sumLate += Number(e.lateMin||0);
      const t = new Date(e.ts); res.sumMin += t.getHours()*60 + t.getMinutes();
    }
    res[st]++; res.boxes.push({d, st, e});
  }
  return res;
}
function parentSummary(){
  const timed = S.chores.filter(c => c.due).sort((a,b)=> a.due<b.due?-1:1);
  if(!timed.length) return '<div class="empty">ยังไม่มีงานที่กำหนดเวลา</div>';
  const COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)', miss:'var(--warn-soft)', na:'var(--line)'};
  return S.kids.map(k => {
    const rows = timed.map(c => {
      const s = choreStats(k.id, c, 7);
      const avg = s.n ? pad2(Math.floor((s.sumMin/s.n)/60))+':'+pad2(Math.round((s.sumMin/s.n)%60)) : '—';
      const avgLate = s.n ? Math.round(s.sumLate/s.n) : 0;
      const boxes = s.boxes.map(b => `<div class="daybox">
        <b style="background:${COL[b.st]};color:${b.st==='miss'||b.st==='na'?'var(--muted)':'#fff'}">${b.e?fmtClock(b.e.ts):(b.st==='na'?'':'–')}</b>
        ${DAY_TH[b.d.getDay()]}</div>`).join('');
      return `<div style="margin-bottom:14px">
        <div class="row-between"><b style="font-size:14px">${c.emo} ${esc(c.name)}</b>
          <span class="muted">ก่อน ${c.due}</span></div>
        <div class="muted">ตรงเวลา ${s.ontime}/${s.applicable} วัน · ทำจริงเฉลี่ย ${avg}${avgLate>0?` (สายเฉลี่ย ${avgLate} นาที)`:''}</div>
        <div class="dayrow">${boxes}</div></div>`;
    }).join('');
    const st = onTimeStreak(k.id), pr = routineProgress(k.id);
    return `<div class="card">
      <div class="row" style="margin-bottom:14px">${avatar(k,46)}
        <div style="flex:1"><b>${esc(k.name)}</b>
          <div class="muted">วันนี้ ${pr.done}/${pr.total} · ${st>0?`🔥 ตรงเวลาครบ ${st} วันติด`:'ยังไม่มีวันที่ตรงเวลาครบ'}</div></div></div>
      ${rows}
      <div class="muted" style="border-top:1px solid var(--line);padding-top:10px">
        เขียว = ตรงเวลา · เหลือง = สายนิดหน่อย · แดง = สายเกินไป · ชมพู = ไม่ได้ทำ · เทา = ไม่มีในวันนั้น</div></div>`;
  }).join('') || '<div class="empty">ยังไม่มีเด็ก</div>';
}

async function approve(pid, override){
  const p = S.pending.find(x => x.id===pid); if(!p) return;
  try{
    await deleteDoc(dref('pending', pid));
    if(p.type === 'chore'){
      const pts = override !== undefined && override !== null ? Number(override) : Number(p.pts);
      const ch = S.chores.find(x => x.name === p.name);      // เผื่อคิวเก่าที่ยังไม่มี pot
      const cpot = p.pot || (ch && !ch.routine ? 'extra' : 'daily');
      await addLog(Object.assign(logEntry(p.kidId,'chore',p.name,p.emo,pts,
        {pot:cpot, due:p.due||'', status:p.status||'', lateMin:p.lateMin||0}), {ts:p.ts}));
      toast('ให้ ' + pts + ' แต้มแล้ว');
      await checkPerfectDay(p.kidId);
    }else if(p.type === 'loan'){           // อนุมัติเงินกู้ — จ่ายต้นเข้ากระเป๋า แล้วเปิดบัญชีหนี้
      const kid = kidById(p.kidId);
      if(kid && !activeLoan(kid.id)){
        const cs = p.partnerId ? kidById(p.partnerId) : null;
        const rec = {id:uid(), kind:'loan', pot:'daily', amount:Number(p.pts),
                     rate:Number(p.rate || cfg().loanPct || 0), paid:0,
                     grace:Number(p.grace !== undefined ? p.grace : (cfg().loanGraceDays||0)),
                     cosignId: cs ? cs.id : '', cosignName: cs ? cs.name : '',
                     openTs:now(), dueTs: now() + Number(p.days || cfg().loanDays || 7)*DAYMS};
        // ใช้ bankCommit (ไม่ใช่ addLog) เพราะไม่งั้นเงินที่เพิ่งยืมจะโดนหักใช้หนี้ทันที
        await bankCommit(p.kidId, logEntry(p.kidId,'loan',`ยืมแต้ม (ต้องคืน ${p.total})`,'💳',
                         Number(p.pts),{pot:'daily'}), bankOf(kid).concat([rec]));
        if(cs && Number(p.hold) > 0)     // ล็อกแต้มของคนค้ำไว้ (ยังอยู่ในกระเป๋า แต่ใช้ไม่ได้)
          await bankCommit(cs.id, null, bankOf(cs).concat([{id:uid(), kind:'collateral',
            pot:'daily', amount:Number(p.hold), loanId:rec.id,
            forId:p.kidId, forName:(kid.name||''), openTs:now()}]));
        toast(`ให้ยืม ${p.pts} แต้มแล้ว — ต้องคืน ${p.total}${cs?` · ล็อกแต้มค้ำของ${cs.name} ${p.hold}`:''}`);
      }else toast('ยังมีหนี้เดิมค้างอยู่ ยืมใหม่ไม่ได้');
    }else if(p.type === 'unlock'){         // ถอนเงินฝากก่อนกำหนด — คืนเงินต้น ไม่มีดอก
      const kid = kidById(p.kidId);
      const rec = bankOf(kid).find(x => x.id === p.rid);
      if(rec){
        await bankCommit(p.kidId,
          logEntry(p.kidId,'withdraw','ถอนก่อนกำหนด (ไม่ได้ดอก)','🏦',Number(rec.amount),{pot:rec.pot, iv:0}),
          bankOf(kid).filter(x => x.id !== p.rid));
        toast(`คืนเงินต้น ${rec.amount} แต้มแล้ว`);
      }else toast('ไม่พบบัญชีเงินฝากนี้แล้ว');
    }else if(p.type === 'transfer'){       // แบ่งแต้มให้พี่น้อง — หักคนให้ เพิ่มคนรับ กระเป๋าเดียวกัน
      const tpot = p.pot || 'daily';
      const giver = kidById(p.kidId), taker = kidById(p.partnerId);
      const gName = (giver||{}).name || '', tName = p.partnerName || (taker||{}).name || '';
      const tid = p.id;                    // ผูกสองฝั่งเข้าคู่กัน เผื่อพ่อแม่กดย้อนกลับทีหลัง
      await addLog(logEntry(p.kidId,'transfer','แบ่งแต้มให้'+tName,'🤝',-Number(p.pts),{pot:tpot, rid:tid}));
      if(taker) await addLog(logEntry(taker.id,'transfer','ได้แต้มจาก'+gName,'🎁',Number(p.pts),{pot:tpot, rid:tid}));
      toast(`ย้าย ${p.pts} แต้มให้${tName}แล้ว`);
    }else{
      const rpot = p.pot || 'daily';
      await addLog(logEntry(p.kidId,'reward',p.name,p.emo,-Number(p.pts),{pot:rpot, rid:p.rid||''}));
      if(p.partnerId && kidById(p.partnerId)){        // หารกัน — หักอีกฝ่ายด้วย
        await addLog(logEntry(p.partnerId,'reward',p.name + ' (หารกัน)',p.emo,-Number(p.pts),
                              {pot:rpot, rid:p.rid||''}));
        toast(`อนุมัติแล้ว หักคนละ ${p.pts} แต้ม`);
      }else toast('อนุมัติแล้ว หัก ' + p.pts + ' แต้ม');
    }
  }catch(e){ fail(e); }
}

function applyPenaltyAll(pid){
  const p = S.penalties.find(x => x.id===pid); if(!p) return;
  if(S.kids.length < 2){ toast('มีเด็กคนเดียว ใช้ปุ่มหักรายคนได้เลย'); return; }
  openConfirm(p.emo + ' ' + p.name,
    `หัก ${S.kids.map(k=>k.name).join(' และ ')} คนละ ${p.pts} แต้มประจำวัน`, async () => {
    try{
      for(const k of S.kids) await addLog(logEntry(k.id,'penalty',p.name,p.emo,-Number(p.pts),{pot:'daily'}));
      toast(`หักคนละ ${p.pts} แต้ม (${S.kids.length} คน)`);
    }catch(e){ fail(e); }
  });
}
async function giveAll(cid){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  const left = S.kids.filter(k => !doneToday(k.id, c.name));
  if(!left.length){ toast('ให้ครบทุกคนแล้ววันนี้'); return; }
  openConfirm(c.emo + ' ' + c.name, `ให้ ${left.map(k=>k.name).join(' และ ')} คนละ ${c.pts} แต้ม`, async () => {
    try{
      for(const k of left) await addLog(logEntry(k.id,'chore',c.name,c.emo,Number(c.pts),
        {pot: c.routine ? 'daily' : 'extra'}));
      toast(`ให้แต้มแล้ว ${left.length} คน 🎉`);
    }catch(e){ fail(e); }
  });
}
/* mode: 'ontime' | 'late' | 'miss' — พ่อแม่เป็นคนตัดสินจากสิ่งที่เกิดขึ้นจริง ไม่ใช่เวลาที่กด */
async function markParent(kidId, cid, mode){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(doneToday(kidId, c.name)){ toast('บันทึกไปแล้ววันนี้'); return; }
  if(mode === true) mode = 'ontime';
  if(mode === false) mode = 'late';
  const full = Number(c.pts);
  const pts = mode === 'ontime' ? full
            : mode === 'late'   ? Math.max(0, Math.round(full*Number(c.latePct||50)/100)) : 0;
  const status = mode === 'ontime' ? 'ontime' : mode === 'late' ? 'late' : 'toolate';
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo,pts,
      {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status,
       lateMin: mode === 'ontime' ? 0 : Number(c.grace||10)}));
    toast(pts > 0 ? `บันทึกแล้ว +${pts} แต้ม` : 'บันทึกแล้ว ไม่ได้แต้มรอบนี้');
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}
async function giveChore(kidId, cid){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(c.once && doneToday(kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  const t = evalTiming(c);
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo, c.due ? t.pts : Number(c.pts),
      {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status:t.status, lateMin:t.lateMin}));
    toast('บันทึกแล้ว');
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}
function applyPenalty(kidId, pid){
  const p = S.penalties.find(x => x.id===pid); if(!p) return;
  openConfirm('หักแต้ม', `${p.emo} ${p.name} — หัก ${p.pts} แต้ม`, async () => {
    try{ await addLog(logEntry(kidId,'penalty',p.name,p.emo,-Number(p.pts),{pot:'daily'}));
         toast('หัก '+p.pts+' แต้มประจำวันแล้ว'); }
    catch(e){ fail(e); }
  });
}
function openAdjust(kidId, dir){
  openForm({title: dir>0?'ให้แต้มเพิ่มเอง':'หักแต้มเอง',
    fields:[{key:'pot', label:'ใส่เข้ากระเป๋าไหน', type:'switch', value:true,
             onText:'🎈 แต้มประจำวัน', offText:'💎 แต้มพิเศษ'},
            {key:'pts', label:'กี่แต้ม', type:'number', value:10},
            {key:'why', label:'เหตุผล', type:'text', value: dir>0?'ทำดีพิเศษ':'ปรับพฤติกรรม'}],
    async onSave(v){
      const n = parseInt(v.pts,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      const pot = v.pot ? 'daily' : 'extra';
      try{ await addLog(logEntry(kidId,'adjust', v.why || (dir>0?'ให้แต้มเพิ่ม':'หักแต้ม'),
             dir>0?'🌟':'⚠️', dir*n, {pot}));
           toast('บันทึกแล้ว'); }catch(e){ fail(e); }
    }});
}
function undoLog(id){
  const l = S.log.find(x => x.id===id); if(!l) return;
  // รายการธนาคารผูกกับบัญชีเงินฝาก/หนี้ ย้อนกลับเดี่ยว ๆ จะทำให้ตัวเลขไม่ตรง
  if(['deposit','withdraw','loan','repay'].indexOf(l.kind) >= 0){
    toast('รายการธนาคารย้อนกลับตรงนี้ไม่ได้ — ให้จัดการที่บัญชีในหน้าธนาคารแทน'); return;
  }
  // การแบ่งแต้มมี 2 ฝั่งเสมอ — ย้อนกลับต้องลบทั้งคู่ ไม่งั้นแต้มรวมในบ้านจะเพี้ยน
  const pair = (l.kind==='transfer' && l.rid)
    ? S.log.filter(x => x.kind==='transfer' && x.rid===l.rid) : [l];
  const msg = pair.length > 1
    ? `ยกเลิกการแบ่ง ${Math.abs(Number(l.delta))} แต้ม — แต้มจะกลับไปอยู่กับเจ้าของเดิม`
    : `"${l.name}" (${l.delta>=0?'+':''}${l.delta} แต้ม) จะถูกลบ แต้มคืนตามเดิม`;
  openConfirm('ย้อนกลับรายการนี้', msg,
    async () => { try{ for(const e of pair) await removeLog(e); toast('ย้อนกลับแล้ว'); }catch(e){ fail(e); } });
}

function editBankTier(key){
  const pot = key === 'depExtra' ? '💎 แต้มพิเศษ' : '🎈 แต้มประจำวัน';
  openForm({title:`ตารางดอกฝาก ${pot}`,
    fields:[{key:'t', label:'รูปแบบ วัน:% คั่นด้วย , เช่น 3:2,7:5,14:10', type:'text', value:cfg()[key]||''}],
    async onSave(v){
      const raw = String(v.t||'').trim();
      const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
      if(!parts.length) return 'ใส่อย่างน้อย 1 ขั้น';
      for(const s of parts){
        const a = s.split(':');
        if(a.length !== 2 || !(parseInt(a[0],10) > 0) || isNaN(parseFloat(a[1])) || parseFloat(a[1]) < 0)
          return `รูปแบบผิดตรง "${s}" — ต้องเป็น วัน:% เช่น 7:5`;
        if(parseInt(a[0],10) > 90) return 'ล็อกได้ไม่เกิน 90 วัน';
        if(parseFloat(a[1]) > 50) return 'ดอกต่อขั้นไม่ควรเกิน 50% — แต้มจะเฟ้อหนัก';
      }
      // ล็อกนานขึ้นต้องคุ้มขึ้น "ต่อวัน" ไม่งั้นเด็กฝากสั้นวนไปเรื่อย ๆ แล้วได้ดอกมากกว่า
      const tl = parts.map(s => { const a = s.split(':'); return {d:parseInt(a[0],10), p:parseFloat(a[1])}; })
                      .sort((x,y) => x.d - y.d);
      for(let i=1;i<tl.length;i++)
        if(tl[i].p/tl[i].d <= tl[i-1].p/tl[i-1].d)
          return `ขั้น ${tl[i].d} วัน ให้ดอกต่อวันไม่มากกว่าขั้น ${tl[i-1].d} วัน — ฝากนานขึ้นต้องคุ้มขึ้น`;
      // กันแต้มเฟ้อ + กันช่องโหว่: ดอกฝากสูงสุด/สัปดาห์ ต้องต่ำกว่าดอกยืม/สัปดาห์
      const cap  = Number(cfg()[key==='depExtra'?'depCapExtra':'depCapDaily'] || 0);
      const best = Math.max.apply(null, tl.map(t => Math.floor(cap*t.p/100)/t.d*7));
      const loanWk = Number(cfg().loanCap||0)*Number(cfg().loanPct||0)/100/Number(cfg().loanDays||7)*7;
      if(loanWk > 0 && best >= loanWk)
        return `ดอกฝากสูงสุด ~${Math.round(best)} แต้ม/สัปดาห์ สูงกว่าดอกยืม ~${Math.round(loanWk)} — เด็กจะฝากแล้วยืมมาใช้ ได้แต้มฟรี`;
      await setOpt(key, parts.join(','));
    }});
}
