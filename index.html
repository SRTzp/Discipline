/* Discipline adventures v1 — only accepted chores unlock a journey. */
const ADV_PRIZES = [{id:'sprout',emo:'🌱',name:'ต้นไม้จิ๋ว'}, {id:'crystal',emo:'💎',name:'คริสตัล'}, {id:'tent',emo:'⛺',name:'เต็นท์สำรวจ'}];
let adventureOverlay = null, adventureOpening = false, adventureContext = null;
const advState = k => Object.assign({level:0,completed:0,collection:{},session:null}, k.adventure || {});
const advActive = a => !!(a.session && Number.isInteger(a.session.stage) && a.session.stage >= 0 && a.session.stage < 3);
// Pure state transitions are shared by the transaction handlers and tests.
function advNewJourney(k, id, ts){
  const a = advState(k);
  if(advActive(a)) return a;
  const pet = activePet(k);
  if(!pet) throw new Error('ทำงานเพื่อฟักเพื่อนตัวแรกก่อนนะ เสบียงที่ได้จะเก็บรอไว้');
  return {...a, session:{id,stage:0,level:a.level===1?1:0,pet,startedAt:ts}};
}
function advCompleteStage(k, sessionId, stage){
  const a = advState(k), s = a.session;
  if(!s || s.id !== sessionId) throw new Error('รอบสำรวจเปลี่ยนแล้ว กรุณาเปิดใหม่');
  if(!Number.isInteger(stage) || stage < 0 || stage > 2 || stage > s.stage)
    throw new Error('ยังไม่ถึงด่านนี้');
  if(stage < s.stage) return a; // retry / another device: never issue the prize twice
  const next = {...a,session:{...s,stage:stage+1}};
  if(stage===2){
    const prize = ADV_PRIZES[Number(a.completed||0)%ADV_PRIZES.length];
    next.completed = Number(a.completed||0)+1;
    next.collection = {...a.collection,[prize.id]:Number(a.collection[prize.id]||0)+1};
    next.session.prize = prize.id;
  }
  return next;
}
function adventureCard(k){
  const a=advState(k), active=advActive(a), pet=activePet(k);
  const tickets=(S.adventureTickets||[]).filter(t=>t.kidId===k.id).length;
  const can=active || (tickets>0 && !!pet);
  return `<div class="card">
    <div class="row-between"><b>🧭 ผจญภัยฝึกคิด</b><span class="tag">🎒 ${tickets}</span></div>
    <div class="muted" style="margin:8px 0">งานที่ผ่านและได้แต้ม 1 งาน → สำรวจ 1 รอบ · 3 ด่าน</div>
    <button class="btn-primary btn-full" ${can?'':'disabled'} onclick="startAdventure()">${active?`▶ เล่นต่อ · ด่าน ${a.session.stage+1}/3`:!pet?'🥚 รอเพื่อนฟักก่อน':tickets?'🧭 ออกสำรวจ':'🔒 ทำหน้าที่เพื่อรับเสบียง'}</button>
    ${active?'<div class="muted" style="margin-top:7px">กลับมาต่อได้ ไม่ใช้เสบียงเพิ่ม</div>':''}
    <details style="margin-top:10px"><summary>⚙️ ความยากของ ${esc(k.name)}</summary>
      <div class="row" style="margin-top:8px">
      ${[0,1].map(n=>`<button class="btn-sm ${a.level===n?'btn-primary':''}" ${active?'disabled':''} aria-pressed="${a.level===n}" onclick="setAdventureLevel(${n})">${n?'คิดหลายขั้น':'เริ่มท้าทาย'}</button>`).join('')}</div>
      ${active?'<div class="muted">เปลี่ยนได้เมื่อจบรอบนี้</div>':''}</details>
    <div class="muted" style="margin-top:10px">จบแล้ว ${Number(a.completed||0)} รอบ · ของสะสม ${ADV_PRIZES.map(p=>`${p.emo} ${Number(a.collection[p.id]||0)}`).join(' · ')}</div>
    <div class="muted" style="margin-top:6px">ตอบผิดไม่เสียแต้ม · บันทึกเมื่อผ่านแต่ละด่าน · ใช้อินเทอร์เน็ตตอนเริ่มและบันทึก</div>
  </div>`;
}
async function setAdventureLevel(level){
  if(view.screen!=='kid' || ![0,1].includes(level)) return;
  const ref=dref('kids',view.kidId);
  try{await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบข้อมูลเด็ก');
    const a=advState(snap.data());if(advActive(a))throw new Error('จบรอบนี้ก่อนเปลี่ยนความยากนะ');
    tx.update(ref,{'adventure.level':level});
  });}catch(e){toast(e.message||'บันทึกไม่ได้ ลองใหม่เมื่อเชื่อมต่ออินเทอร์เน็ต');}
}
async function startAdventure(){
  if(adventureOpening || adventureOverlay || view.screen!=='kid' || !base)return;
  if(!navigator.onLine){toast('เชื่อมต่ออินเทอร์เน็ตก่อนเริ่มสำรวจนะ');return;}
  adventureOpening=true;
  const kidId=view.kidId,family=base,ref=dref('kids',kidId),id=uid(),ts=now();
  const ticket=(S.adventureTickets||[]).find(t=>t.kidId===kidId);
  const ticketRef=ticket?dref('adventureTickets',ticket.id):null;
  try{
    const result=await runTransaction(db,async tx=>{
      const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบข้อมูลเด็ก');
      const k=snap.data(),a=advState(k);
      if(advActive(a))return {k,a};
      if(!ticket)throw new Error('ทำหน้าที่สำเร็จเพื่อรับเสบียงก่อนนะ');
      const t=await tx.get(ticketRef);
      if(!t.exists()||t.data().kidId!==kidId||t.data().state!=='ready')throw new Error('เสบียงนี้ถูกใช้แล้ว กรุณาลองใหม่');
      const next=advNewJourney(k,id,ts);
      tx.update(ticketRef,{state:'used',sessionId:id});
      tx.update(ref,{adventure:next});
      return {k,a:next};
    });
    if(base!==family || view.screen!=='kid' || view.kidId!==kidId)return;
    showAdventure(result.k,result.a,family);
  }catch(e){toast(e.message||'เปิดการสำรวจไม่ได้ กรุณาลองใหม่');}
  finally{adventureOpening=false;}
}
function closeAdventure(){
  if(adventureOverlay){adventureOverlay.remove();adventureOverlay=null;}
  adventureContext=null;document.body.style.overflow='';lastTouch=Date.now();
}
function showAdventure(k,a,family){
  closeAdventure();
  const overlay=document.createElement('div');overlay.id='adventure-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:9000;background:var(--bg);overflow:auto;padding:12px;';
  overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','ผจญภัยของ '+k.name);
  overlay.innerHTML=`<div style="max-width:540px;margin:auto"><div class="row-between" style="margin-bottom:8px"><b>${esc(k.name)} · 🧭 ผจญภัย</b><button id="adventure-pause">พักก่อน ✕</button></div><div id="adventure-save-note" class="muted" style="margin-bottom:6px">บันทึกเมื่อผ่านแต่ละด่าน · พักแล้วกลับมาต่อได้</div><iframe title="เกมฝึกคิด" sandbox="allow-scripts" style="width:100%;height:840px;border:0;display:block;"></iframe></div>`;
  document.body.append(overlay);document.body.style.overflow='hidden';adventureOverlay=overlay;
  const frame=overlay.querySelector('iframe');
  adventureContext={family,kidId:k.id,sessionId:a.session.id,frame};
  overlay.querySelector('#adventure-pause').onclick=()=>{closeAdventure();render();};
  const e=a.session.pet,stg=petStage(Number(((k.petst||{})[e]||{}).c||0)),art=petArt(e,stg);
  const markup=art && /^(data:image\/(png|jpeg|webp|gif);base64,|https:\/\/)/i.test(art)
    ? `<img src="${esc(art)}" alt="${esc(petBy(e).n)}" style="width:100%;height:100%;object-fit:contain;position:static">`
    : petSVG(e,'happy',stg);
  const setup=JSON.stringify({sessionId:a.session.id,stage:a.session.stage,level:a.session.level}).replace(/</g,'\\u003c');
  frame.srcdoc=ADVENTURE_GAME.replace('__ADVENTURE_SETUP__',setup).replace('__ADVENTURE_PET__',markup);
}
window.addEventListener('message',async event=>{
  const ctx=adventureContext,m=event.data;
  if(!ctx||event.source!==ctx.frame.contentWindow||!m||m.sessionId!==ctx.sessionId||base!==ctx.family)return;
  if(m.type==='adventure:activity'){lastTouch=Date.now();return;}
  if(m.type==='adventure:resize'&&Number.isFinite(m.height)){
    ctx.frame.style.height=Math.max(400,Math.min(1400,m.height))+'px';return;
  }
  if(m.type==='adventure:close'){closeAdventure();render();return;}
  if(m.type!=='adventure:complete'||!Number.isInteger(m.stage)||m.stage<0||m.stage>2)return;
  try{
    const ref=dref('kids',ctx.kidId);
    const a=await runTransaction(db,async tx=>{
      const snap=await tx.get(ref);if(!snap.exists())throw new Error('ไม่พบข้อมูลเด็ก');
      const next=advCompleteStage(snap.data(),ctx.sessionId,m.stage);
      tx.update(ref,{adventure:next});return next;
    });
    if(adventureContext!==ctx)return;
    const prize=ADV_PRIZES.find(p=>p.id===a.session.prize);
    ctx.frame.contentWindow.postMessage({type:'adventure:saved',sessionId:ctx.sessionId,stage:m.stage,prize:prize?prize.emo+' '+prize.name:''},'*');
  }catch(e){
    if(adventureContext!==ctx)return;
    ctx.frame.contentWindow.postMessage({type:'adventure:save-error',sessionId:ctx.sessionId,stage:m.stage},'*');
  }
});

const weekKey = ts => {const day=dayKey(ts),d=new Date(bangkokDue(day,'12:00')); const wd=(d.getUTCDay()+6)%7;return dayKey(bangkokDue(day,'12:00')-wd*DAY)};

const LEGACY_TASKS=new Map([['ตื่นนอน ลุกจากเตียง','wake'],['เก็บที่นอนหลังตื่น','bed'],['พร้อมออกจากบ้านไปโรงเรียน','school'],['ทำการบ้านเสร็จ','homework'],['ซ้อม Piano20 นาที','piano']]);

function legacyBankRecord(b,kidId){if(b?.kind!=='deposit'||!b.id||!kidId)return null;const principal=Number(b.amount),rate=Number(b.pct),openedAt=Number(b.openTs),dueAt=Number(b.dueTs);if(!Number.isSafeInteger(principal)||principal<=0||!Number.isFinite(rate)||rate<0||!Number.isFinite(openedAt)||!Number.isFinite(dueAt)||dueAt<=openedAt)return null;return {id:b.id,kidId,principal,original:principal,days:Number(b.days)||Math.round((dueAt-openedAt)/DAY),rate,openedAt,dueAt,status:'open',legacy:true,legacyPot:b.pot||'daily'}}

function validate(s){if(s.schema!==1||s.version!==VERSION)fail('ต้องใช้ schema รุ่นทดลอง');for(const k of s.kids){if(!Number.isSafeInteger(k.earned)||!Number.isSafeInteger(k.borrowed)||!Number.isSafeInteger(k.deficit||0)||k.earned<0||k.borrowed<0||(k.deficit||0)<0)fail('ยอดแต้มไม่ถูกต้อง')}return s}
function mutate(state,fn){if(state.legacy?.blocked)fail('ข้อมูลเก่ายังมีรายการที่ต้องตรวจ ก่อนเริ่มทำรายการด้วยกติกาใหม่');const draft=clone(validate(state));const result=fn(draft);validate(draft);Object.assign(state,draft);return result}

const balance=(s,id)=>{const k=kid(s,id);return {available:k.earned+k.borrowed,earned:k.earned,borrowed:k.borrowed,deficit:k.deficit||0,deposits:s.deposits.filter(d=>d.kidId===id&&d.status==='open').reduce((a,d)=>a+d.principal,0),debt:s.loans.filter(l=>l.kidId===id&&l.status==='open').reduce((a,l)=>a+l.remaining,0)}};
function spend(k,n,restricted=false){if(!Number.isSafeInteger(n)||n<0)fail('จำนวนแต้มไม่ถูกต้อง');if(restricted&&k.earned<n)fail('แต้มที่ได้จากงานไม่พอ');if(!restricted&&k.earned+k.borrowed<n)fail('แต้มไม่พอ');const e=Math.min(k.earned,n);k.earned-=e;k.borrowed-=n-e;return {earned:e,borrowed:n-e}}

function setPlan(s,day,{school,homework=false,assignment=''}={}){if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||typeof school!=='boolean')fail('กำหนดวันไม่ถูกต้อง');return mutate(s,d=>{if(d.ledger.some(e=>e.taskDay===day)||d.requests.some(r=>r.day===day))fail('วันนี้เริ่มบันทึกแล้ว');d.plans[day]={school,homework:!!homework,assignment:String(assignment),ruleVersion:VERSION};audit(d,'plan',{day})})}
function planFor(s,day){return s.plans[day]||{school:[1,2,3,4,5].includes(new Date(bangkokDue(day,'12:00')).getUTCDay()),homework:false,assignment:'',ruleVersion:VERSION}}
function activeTasks(s,day){const p=planFor(s,day);return Object.entries(RULES.tasks).filter(([,t])=>!t.schoolOnly||p.school).filter(([,t])=>!t.homeworkOnly||p.homework).map(([id,t])=>({id,...t,due:p.school?t.dueSchool:t.dueHoliday}))}
function scoreTask(s,id,taskId,finishedAt,complete=true){const day=dayKey(finishedAt),t=activeTasks(s,day).find(x=>x.id===taskId)||fail('วันนี้ไม่มีงานนี้');if(!complete)return {points:0,status:'incomplete',day};const due=bangkokDue(day,t.due),late=finishedAt-due;return {points:late<=0?t.pts:late<=RULES.graceMinutes*60000?Math.floor(t.pts/2):0,status:late<=0?'ontime':late<=RULES.graceMinutes*60000?'late':'expired',day,due,finishedAt}}
function submitTask(s,id,taskId,finishedAt,{complete=true,minutes=0,assignmentDone=true,requestId=freshId()}={}){return mutate(s,d=>{kid(d,id);if(d.requests.some(r=>r.id===requestId))return d.requests.find(r=>r.id===requestId);if(d.ledger.some(e=>['chore','legacy-chore'].includes(e.kind)&&e.kidId===id&&e.taskDay===dayKey(finishedAt)&&e.taskId===taskId)||d.requests.some(r=>['chore','legacy-chore'].includes(r.type)&&r.kidId===id&&r.day===dayKey(finishedAt)&&r.taskId===taskId&&r.status==='pending'))fail('งานนี้บันทึกแล้ว');if(['piano','chess','taekwondo'].includes(taskId)&&minutes<20)complete=false;if(taskId==='homework'&&!assignmentDone)complete=false;const result=scoreTask(d,id,taskId,finishedAt,complete);const r={id:requestId,type:'chore',kidId:id,taskId,day:result.day,finishedAt,complete,minutes,assignmentDone,status:'pending',createdAt:Date.now(),ruleVersion:VERSION};d.requests.push(r);return r})}
function autoRepay(d,k,amount){const loan=d.loans.find(l=>l.kidId===k.id&&l.status==='open');if(!loan||amount<=0)return 0;const paid=Math.min(loan.remaining,Math.floor(amount/2),k.earned);k.earned-=paid;loan.remaining-=paid;loan.paid+=paid;entry(d,k.id,'repayment',-paid,{loanId:loan.id,source:'chore-auto'});if(!loan.remaining)loan.status='closed';return paid}
function grant(d,id,kind,amount,meta={}){const k=kid(d,id);k.earned+=amount;entry(d,id,kind,amount,meta);if(kind==='chore'||kind==='bonus'){k.xp=(k.xp||0)+amount;k.eggWarm=(k.eggWarm||0)+(kind==='bonus'?10:meta.status==='ontime'?3:0);if(kind==='chore'&&amount>0)d.tickets.push({id:meta.requestId,kidId:id,status:'ready'});if(kind==='chore')autoRepay(d,k,amount)}if(k.deficit){const recovered=Math.min(k.earned,k.deficit);k.earned-=recovered;k.deficit-=recovered;entry(d,id,'penalty recovery',-recovered,{source:kind})}}
const PETS=['🦎','🐍','🦂','🕷️','🦇','🐗','🦉','🐙','🐺','🦈','🐊','🦅','🦏','🦑','🦍','🐆','🐅','🦁','🦣','🦖','🐉'];

function completeJourneyStage(s,id,sessionId,stage){return mutate(s,d=>{const k=kid(d,id),a=k.adventure||fail('ยังไม่มีการผจญภัย'),session=a.session;if(!session||session.id!==sessionId||!Number.isInteger(stage)||stage<0||stage>2||stage>session.stage)fail('ลำดับด่านไม่ถูกต้อง');if(stage<session.stage)return a;if(stage===2){const prizes=['sprout','crystal','tent'],prize=prizes[(a.completed||0)%prizes.length];a.completed=(a.completed||0)+1;a.collection={...(a.collection||{}),[prize]:(a.collection?.[prize]||0)+1};session.prize=prize}session.stage++;return a})}
function approveTask(s,requestId){return mutate(s,d=>{const r=d.requests.find(x=>x.id===requestId&&x.type==='chore')||fail('ไม่พบคำขอ');if(r.status==='approved')return r;if(r.status!=='pending')fail('คำขอนี้สิ้นสุดแล้ว');if(d.ledger.some(e=>e.kind==='chore'&&e.kidId===r.kidId&&e.taskDay===r.day&&e.taskId===r.taskId))fail('งานนี้ได้แต้มแล้ว');const result=scoreTask(d,r.kidId,r.taskId,r.finishedAt,r.complete&&r.assignmentDone&&(r.minutes>=20||!RULES.tasks[r.taskId].practice));r.status='approved';r.points=result.points;grant(d,r.kidId,'chore',result.points,{taskId:r.taskId,taskDay:r.day,status:result.status,finishedAt:r.finishedAt,requestId:r.id});const routines=activeTasks(d,r.day).filter(t=>t.routine);if(routines.length&&routines.every(t=>d.ledger.some(e=>e.kind==='chore'&&e.kidId===r.kidId&&e.taskDay===r.day&&e.taskId===t.id&&e.status==='ontime'))&&!d.ledger.some(e=>e.kind==='bonus'&&e.kidId===r.kidId&&e.taskDay===r.day))grant(d,r.kidId,'bonus',20,{taskDay:r.day,name:'กิจวัตรตรงเวลาครบ'});return r})}

function settleLegacyChore(s,id,approve=false,full=false){const d=clone(validate(s)),r=d.requests.find(x=>x.id===id&&x.type==='legacy-chore')||fail('ไม่พบงานเดิมที่รอตรวจ');if(r.status!=='pending')return r;const points=approve?(full?r.fullPoints:r.proposedPoints):0;r.status=approve?'approved':'rejected';r.points=points;if(approve){const k=kid(d,r.kidId);k.earned+=points;k.xp=(k.xp||0)+points;if(points>0)d.tickets.push({id:r.id,kidId:k.id,status:'ready',legacy:true});entry(d,k.id,'legacy-chore',points,{requestId:r.id,taskId:r.taskId,taskDay:r.day,name:r.name,status:r.legacyStatus,ts:r.finishedAt,legacy:true});}if(d.legacy){d.legacy.pending=d.legacy.pending.filter(x=>x.id!==r.id);d.legacy.blockers=d.legacy.blockers.filter(x=>!x.startsWith('คำขอเก่าค้าง'));if(d.legacy.pending.length)d.legacy.blockers.push(`คำขอเก่าค้าง ${d.legacy.pending.length} รายการ`);d.legacy.blocked=d.legacy.blockers.length>0}validate(d);Object.assign(s,d);return r}
function penalty(s,id,type,reason){const pts={screen:20,physical:30}[type];if(!pts||!String(reason).trim())fail('ระบุเหตุการณ์และเหตุผล');return mutate(s,d=>{const k=kid(d,id),parts=spend(k,Math.min(k.earned+k.borrowed,pts));const applied=parts.earned+parts.borrowed;k.deficit=(k.deficit||0)+pts-applied;entry(d,id,'penalty',-pts,{reason,type,nominal:pts,unpaid:pts-applied});audit(d,'penalty',{kidId:id,reason});return pts})}

function quotaUse(s,r,ts){const participants=r.participants||Object.keys(r.shares);if(['youtube','game'].includes(r.rewardId)){const day=dayKey(ts),week=weekKey(ts);return participants.some(id=>s.requests.filter(x=>x.status!=='cancelled'&&x.status!=='rejected'&&x.type==='reward'&&['youtube','game'].includes(x.rewardId)&&x.participants.includes(id)&&x.id!==r.id&&weekKey(x.ts)===week).length>=4||s.requests.some(x=>x.status!=='cancelled'&&x.status!=='rejected'&&x.type==='reward'&&['youtube','game'].includes(x.rewardId)&&x.participants.includes(id)&&x.id!==r.id&&dayKey(x.ts)===day))}if(['dinner','icecream'].includes(r.rewardId))return s.requests.filter(x=>x.status!=='cancelled'&&x.status!=='rejected'&&x.type==='reward'&&x.rewardId===r.rewardId&&x.id!==r.id&&weekKey(x.ts)===weekKey(ts)).length>=2;if(r.rewardId.startsWith('toy'))return participants.some(id=>s.requests.some(x=>x.status!=='cancelled'&&x.status!=='rejected'&&x.type==='reward'&&x.rewardId===r.rewardId&&x.participants.includes(id)&&x.id!==r.id&&ts<addMonths(x.ts,6)));return false}

ss=\"bubble\" aria-live=\"polite\">\u003cspan class=\"pet-message\">🧩 → 🗝️ → 💎\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"stages\">\u003cspan class=\"journey-progress\">🧩 → 🗝️ → 💎\u003c/span>\u003c/div>\n\u003cdiv class=\"content\">\u003c/div>\u003cdetails class=\"keyboard-help\">\u003csummary>⌨️ วิธีใช้คีย์บอร์ด\u003c/summary>\u003cdiv class=\"key-guide\">\u003c/div>\u003c/details>\u003cdiv class=\"summary\">ปลดล็อกจากหน้าที่จริง ✅ · ตอบผิดไม่เสียแต้ม\u003c/div>\n\u003c/div>\n\u003cscript>\n(()=>{\nconst setup=__ADVENTURE_SETUP__;\n\nconst root=document.getElementById('monster-adventure'),q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];\nconst state={level:setup.level,game:setup.stage,movement:true,done:[0,1,2].map(i=>i\u003csetup.stage)};let board=[],pieces=[],selected=0,rotated=false,program=[],pos=0,hasKey=false,mirrors=[],busy=false,epoch=0,cursor=0,mirrorCursor=0,keyboardMode=false,history=[];\nconst routeMaps=[{n:4,start:12,key:2,goal:3,walls:[1,5,9,11]},{n:5,start:20,key:3,goal:24,walls:[1,6,8,11,13,16,18]}];\nconst mirrorMaps=[{n:4,start:2,target:[3,4],items:[[1,2],[1,0],[3,0]],answer:['/','/','\\\\']},{n:5,start:3,target:[5,4],items:[[1,3],[1,1],[3,1],[3,4],[4,0],[4,2]],answer:['/','/','\\\\','\\\\','/','\\\\']}];\nfunction buttons(){q('.journey-progress').textContent=\"ด่าน \"+(state.game+1)+\" / 3 · \"+[\"🌉\",\"🗝️\",\"💎\"][state.game];all('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===state.level)));all('[data-game]').forEach(b=>{let i=+b.dataset.game;b.setAttribute('aria-pressed',String(i===state.game));b.textContent=(state.done[i]?'✓ ':['🌉 ','🗝️ ','💎 '][i])+['สะพาน','เส้นทาง','กระจก'][i];});}\nfunction say(text){const f=q('.feedback');if(f)f.textContent=text;}\nfunction pulse(el){if(!el)return;el.classList.remove('hinted');void el.offsetWidth;el.classList.add('hinted');}\nfunction sendCompletion(){parent.postMessage({type:'adventure:complete',sessionId:setup.sessionId,stage:state.game},'*');}\nfunction win(){\n busy=true;let r=q('.reward');if(!r){r=document.createElement('div');r.className='reward';q('.content').append(r);}\n r.textContent='กำลังบันทึก…';sendCompletion();\n}\nwindow.addEventListener('message',event=>{\n const m=event.data;if(event.source!==parent||!m||m.sessionId!==setup.sessionId||m.stage!==state.game)return;\n const r=q('.reward');if(!r)return;\n if(m.type==='adventure:save-error'){\n   r.innerHTML='\u003cspan>ยังบันทึกไม่ได้ เชื่อมต่อแล้วลองใหม่\u003c/span>\u003cbutton type=\"button\" class=\"primary retry-send\">บันทึกอีกครั้ง\u003c/button>';\n   q('.retry-send').onclick=()=>{r.textContent='กำลังบันทึก…';sendCompletion();};return;\n }\n if(m.type!=='adventure:saved')return;\n busy=false;state.done[state.game]=true;buttons();say('✓ บันทึกแล้ว');q('.pet-message').textContent='✨ 🙌 ✨';q('.pet').classList.add('celebrate');\n r.innerHTML=state.game===2?'\u003cspan class=\"prize-name\">\u003c/span>\u003cbutton type=\"button\" class=\"primary replay\">กลับบ้าน ✓\u003c/button>':'\u003cspan>✓ ผ่านแล้ว!\u003c/span>\u003cbutton type=\"button\" class=\"primary next\">ไปต่อ →\u003c/button>';\n if(state.game===2){q('.prize-name').textContent=m.prize||'🎁 ของสะสม';q('.replay').onclick=()=>parent.postMessage({type:'adventure:close',sessionId:setup.sessionId},'*');}\n else q('.next').onclick=()=>{state.game++;init();};\n});\nfunction shell(title){q('.content').innerHTML='\u003cdiv class=\"heading\">\u003cstrong>'+title+'\u003c/strong>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"icon hint\" aria-label=\"คำใบ้ทีละขั้น\">💡\u003c/button>\u003cbutton type=\"button\" class=\"icon reset\" aria-label=\"เริ่มด่านนี้ใหม่\">↻\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"play\">\u003c/div>\u003cdiv class=\"feedback\" aria-live=\"polite\">\u003c/div>';q('.reset').onclick=init;}\nfunction init(){epoch++;busy=false;cursor=0;mirrorCursor=0;keyboardMode=false;history=[];buttons();q('.pet-message').textContent=['👆 🧩 → ▦','↑ → ↓ ←  ▶','👆 🪞 ↻  ☀️'][state.game];if(state.game===0)bridgeInit();else if(state.game===1)routeInit();else mirrorInit();updateGuide();}\nfunction pieceDimensions(p){return rotated&&selected===p.id?[p.h,p.w]:[p.w,p.h];}\nfunction bridgeInit(){shell('เติมสะพานให้เต็ม');const cols=state.level?5:4;board=Array(cols*3).fill(-1);pieces=(state.level?[[3,1],[3,1],[2,2],[1,2],[1,2],[1,1]]:[[2,2],[1,2],[2,2],[1,2]]).map(([w,h],id)=>({id,w,h,used:false}));selected=0;rotated=false;q('.play').innerHTML='\u003cdiv class=\"endpoints\">\u003cspan>🐉\u003c/span>\u003cspan>🌳 🎁\u003c/span>\u003c/div>\u003cdiv class=\"board-wrap\">\u003cdiv class=\"board\">\u003c/div>\u003c/div>\u003cdiv class=\"tray\">\u003c/div>\u003cdiv class=\"under\">\u003cbutton type=\"button\" class=\"icon rotate\" aria-label=\"หมุนชิ้นส่วน\">↻ หมุน\u003c/button>\u003cbutton type=\"button\" class=\"icon bridge-undo\" aria-label=\"ย้อนการวางล่าสุด\">↶\u003c/button>\u003c/div>';q('.hint').onclick=()=>{const unused=pieces.find(p=>!p.used);if(!unused)return;selected=unused.id;rotated=false;drawBridge();pulse(q('[data-piece=\"'+selected+'\"]'));say('🧩 ↻ → ▦');};q('.rotate').onclick=()=>{rotated=!rotated;drawBridge();paintCursor();};q('.bridge-undo').onclick=undoBridge;drawBridge();}\nfunction drawBridge(){const cols=state.level?5:4;const g=q('.board');g.style.gridTemplateColumns='repeat('+cols+',1fr)';g.innerHTML=board.map((id,i)=>'\u003cbutton type=\"button\" class=\"cell '+(id\u003c0?'river':'occupied')+'\" data-cell=\"'+i+'\" aria-label=\"ช่อง '+(i+1)+(id>=0?' ชิ้น '+(id+1)+' แตะเพื่อนำออก':' ว่าง')+'\">'+(id>=0?['●','◆','▲','✦','■','○'][id]:'')+'\u003c/button>').join('');q('.tray').innerHTML=pieces.map(p=>{let [w,h]=pieceDimensions(p);return '\u003cbutton type=\"button\" class=\"piece\" data-piece=\"'+p.id+'\" aria-label=\"ชิ้น '+(p.id+1)+' ขนาด '+w+' คูณ '+h+'\" aria-pressed=\"'+(selected===p.id)+'\" '+(p.used?'disabled':'')+'>\u003cspan class=\"number\">'+(p.id+1)+'\u003c/span>\u003cspan class=\"mini-shape\" style=\"grid-template &&y===m.target[1]};let key=[x,y,dx,dy].join(',');if(seen.has(key))return{points,won:false};seen.add(key);const mirror=mirrors.find(v=>v.x===x&&v.y===y);if(mirror){if(mirror.type==='/')[dx,dy]=[-dy,-dx];else [dx,dy]=[dy,dx];}}return{points,won:false};}\nfunction shine(){const m=mirrorMaps[state.level],res=trace(),wrap=q('.board-wrap').getBoundingClientRect(),cells=all('.board .cell');const points=res.points.map(([x,y])=>{const cell=cells[Math.max(0,Math.min(m.n-1,y))*m.n+Math.max(0,Math.min(m.n-1,x))].getBoundingClientRect();return [(x\u003c0?0:x>=m.n?100:(cell.left-wrap.left+cell.width/2)/wrap.width*100),(y\u003c0?0:y>=m.n?100:(cell.top-wrap.top+cell.height/2)/wrap.height*100)].join(',');}).join(' ');q('.beam').innerHTML='\u003cpolyline points=\"'+points+'\">\u003c/polyline>';if(res.won)win();else say('👀 ☀️ → 🪞');}\n\nfunction updateGuide(){q('.key-guide').innerHTML=[\n '\u003cspan>\u003ckbd>1–6\u003c/kbd> เลือกชิ้น · \u003ckbd>R\u003c/kbd> หมุน\u003c/span>\u003cspan>\u003ckbd>↑ ↓ ← →\u003c/kbd> เลือกช่อง · \u003ckbd>Space\u003c/kbd> วาง / นำออก\u003c/span>\u003cspan>\u003ckbd>Backspace\u003c/kbd> ย้อนกลับ · \u003ckbd>H\u003c/kbd> คำใบ้\u003c/span>',\n '\u003cspan>\u003ckbd>↑ ↓ ← →\u003c/kbd> เพิ่มก้าวเดิน\u003c/span>\u003cspan>\u003ckbd>Enter\u003c/kbd> เริ่มเดิน · \u003ckbd>Backspace\u003c/kbd> ลบก้าว\u003c/span>\u003cspan>\u003ckbd>H\u003c/kbd> คำใบ้\u003c/span>',\n '\u003cspan>\u003ckbd>↑ ↓ ← →\u003c/kbd> เลือกกระจก\u003c/span>\u003cspan>\u003ckbd>R\u003c/kbd> / \u003ckbd>Space\u003c/kbd> หมุน · \u003ckbd>Enter\u003c/kbd> ยิงแสง\u003c/span>\u003cspan>\u003ckbd>H\u003c/kbd> คำใบ้\u003c/span>'\n][state.game];}\nfunction rememberBridge(){history.push({board:[...board],used:pieces.map(p=>p.used),selected,rotated});}\nfunction undoBridge(){if(!history.length||q('.reward'))return;const prev=history.pop();board=prev.board;pieces.forEach((p,i)=>p.used=prev.used[i]);selected=prev.selected;rotated=prev.rotated;drawBridge();paintCursor();say('');}\nfunction clearPreview(){ // Original Discipline pet SVG renderer, reused by the classic pilot interface.
const OUT = '#241f2b', SW = 3;
const P = (d, f, w) => `<path d="${d}" fill="${f||'none'}" stroke="${OUT}" stroke-width="${w||SW}"
  stroke-linejoin="round" stroke-linecap="round"/>`;
const EL = (cx, cy, rx, ry, f) => P(`M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${rx*2} 0a${rx} ${ry} 0 1 0 ${-rx*2} 0`, f);

/* ---- เล็บ 3 นิ้ว ---- */
const claw3 = (x, y, dir, len) => `<g stroke="${OUT}" stroke-width="2.4" stroke-linecap="round" fill="none">
  <path d="M${x-4} ${y}l${-2*dir} ${len}"/><path d="M${x} ${y}l0 ${len+1}"/><path d="M${x+4} ${y}l${2*dir} ${len}"/></g>`;

/* ---- ขาสองข้าง + เท้ามีเล็บ ---- */
function legsRig(c1, c2, st){
  const w = st===2 ? 15 : 13, y = st===2 ? 74 : 76;
  const leg = x => P(`M${x} ${y}h${w}v${100-y-6}a${w/2} 7 0 0 1 ${-w} 0z`, c1)
    + EL(x+w/2, 99, w/2+2, 6, c2) + claw3(x+w/2, 101, 1, 4);
  return leg(24) + leg(61);
}
/* ---- แขนสองข้าง กางออก มีเล็บ ---- */
function armsRig(c1, st){
  const drop = st===2 ? 20 : 17;
  const arm = (x, dir) => P(`M${x} 56c${dir*7} 2 ${dir*11} 8 ${dir*11} ${drop}
    a7 8 0 0 ${dir>0?1:0} ${-dir*13} 0c0-8 ${dir*2}-${drop-6} ${-dir*2}-${drop-6}z`.replace(/\s+/g,' '), c1)
    + claw3(x + dir*12, 56+drop+4, dir, st===2?7:5);
  return arm(24, -1) + arm(76, 1);
}
/* ---- ลำตัว + พุงเป็นแผ่น ---- */
function torso(shape, c1, c2, bel){
  const SH = {
    pear:  'M50 40c-17 0-25 12-25 26s9 22 25 22 25-8 25-22-8-26-25-26z',
    stout: 'M50 40c-20 0-28 13-28 25s10 23 28 23 28-11 28-23-8-25-28-25z',
    slim:  'M50 41c-14 0-21 11-21 24s8 21 21 21 21-8 21-21-7-24-21-24z',
    drop:  'M50 38c-18 0-27 15-27 28s10 22 27 22 27-9 27-22-9-28-27-28z'
  };
  const B = SH[shape] || SH.pear;
  const belly = EL(50, 72, 15, 15, bel);
  const plates = `<g stroke="${OUT}" stroke-width="2" fill="none" opacity=".8">
    <path d="M37 66h26M36 74h28M39 82h22"/></g>`;
  return P(B, c1) + belly + plates;
}
/* ---- หัว 5 แบบ — จุดที่ทำให้แต่ละตัวต่างกันมากที่สุด ---- */
function headRig(kind, c1, c2, bel, st, mood){
  const cy = 33, fierce = st===2;
  let out = EL(50, cy, 25, 22, c1);
  if(kind === 'dino'){                                   // ปากยื่น + เขี้ยวบน
    out += EL(50, cy+13, 15, 10, bel)
      + P(`M40 ${cy+13}h20`) + P(`M43 ${cy+13}l2 5 3-5`, '#fff') + P(`M57 ${cy+13}l-2 5-3-5`, '#fff')
      + `<circle cx="45" cy="${cy+7}" r="1.6" fill="${OUT}"/><circle cx="55" cy="${cy+7}" r="1.6" fill="${OUT}"/>`;
  } else if(kind === 'beast'){                            // จมูกสั้น + หูตั้ง
    out = P(`M28 ${cy-12}l-5-17 17 8z`, c1) + P(`M72 ${cy-12}l5-17-17 8z`, c1) + out
      + EL(50, cy+13, 12, 8, bel) + `<circle cx="50" cy="${cy+9}" r="3" fill="${OUT}"/>`
      + P(`M50 ${cy+12}v3M50 ${cy+15}q-4 3-7 0M50 ${cy+15}q4 3 7 0`);
  } else if(kind === 'bird'){                             // จะงอยปาก
    out += P(`M50 ${cy+6}l11 9-11 8-11-8z`, '#f5c451');
  } else if(kind === 'aqua'){                             // ครีบหัว + ปากกว้าง
    out = P(`M50 ${cy-30}c6 6 8 13 8 20h-16c0-7 2-14 8-20z`, c2) + out
      + P(`M35 ${cy+11}q15 12 30 0`, bel);
  } else if(kind === 'bug'){                              // เขี้ยวคีบ
    out += P(`M38 ${cy+12}q-6 6-3 12 5-3 8-8z`, c2) + P(`M62 ${cy+12}q6 6 3 12-5-3-8-8z`, c2)
      + P(`M42 ${cy+13}h16`);
  }
  return out;
}
/* ---- เขา ---- */
function hornRig(kind, st){
  const g = st===2 ? 1.4 : 1, IV = '#f6ecd2';
  switch(kind){
    case 'nose': return P(`M50 ${44}l${-5*g} ${9*g}h${10*g}z`, IV);
    case 'top':  return P(`M50 ${11-6*g}l${6*g} ${14*g}h${-12*g}z`, IV);
    case 'twin': return P(`M36 14c${-3*g} ${-7*g} ${-8*g} ${-9*g} ${-11*g} ${-13*g} ${8*g} 1 ${14*g} ${5*g} ${17*g} ${11*g}z`, IV)
      + P(`M64 14c${3*g} ${-7*g} ${8*g} ${-9*g} ${11*g} ${-13*g}-${8*g} 1-${14*g} ${5*g}-${17*g} ${11*g}z`, IV);
    case 'crown':return P(`M32 16l4-11 6 8 8-12 8 12 6-8 4 11z`, IV);
    default: return '';
  }
}
/* ---- ของหลัง: ปีก / หนาม / กระดอง ---- */
function backRig(kind, c2, st){
  if(kind === 'wing') return P(`M26 52c-13-11-26-16-29-10-3 7 2 13 8 17-6 2-10 7-7 12 4 7 17 4 30-6z`, c2)
    + P(`M74 52c13-11 26-16 29-10 3 7-2 13-8 17 6 2 10 7 7 12-4 7-17 4-30-6z`, c2);
  if(kind === 'spike') return [[72,48],[80,60],[80,74]].map(([x,y]) =>
    P(`M${x} ${y}l${13} ${-4} ${-4} ${13}z`, c2)).join('')
    + [[28,48],[20,60]].map(([x,y]) => P(`M${x} ${y}l${-13} ${-4} ${4} ${13}z`, c2)).join('');
  if(kind === 'shell') return EL(50, 62, 30, 26, c2);
  return '';
}
/* ---- ลายบนตัว ---- */
function markRig(kind, c2){
  switch(kind){
    case 'stripe': return `<g fill="${c2}" opacity=".8"><rect x="27" y="46" width="6" height="16" rx="3"/>
      <rect x="67" y="46" width="6" height="16" rx="3"/><rect x="27" y="66" width="5" height="14" rx="2.5"/>
      <rect x="68" y="66" width="5" height="14" rx="2.5"/></g>`;
    case 'spot': return `<g fill="${c2}" opacity=".7"><circle cx="31" cy="55" r="4.5"/><circle cx="69" cy="55" r="4.5"/>
      <circle cx="29" cy="70" r="4"/><circle cx="71" cy="70" r="4"/></g>`;
    case 'scale': return `<g fill="none" stroke="${c2}" stroke-width="2.4" opacity=".8">
      <path d="M28 52q5-6 10 0M62 52q5-6 10 0M26 64q5-6 10 0M64 64q5-6 10 0"/></g>`;
    default: return '';
  }
}
/* ---- ตา — จุดที่บอกอารมณ์ ---- */
function eyesRig(mood, st){
  const cy = 30, ex = 11, r = st===2 ? 8 : 7.4;
  if(mood === 'sleep') return `<g stroke="${OUT}" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M${50-ex-6} ${cy}q6 6 12 0"/><path d="M${50+ex-6} ${cy}q6 6 12 0"/></g>`;
  const white = EL(50-ex, cy, r, r*1.05, '#fff') + EL(50+ex, cy, r, r*1.05, '#fff');
  const pup = `<circle cx="${50-ex}" cy="${cy+1}" r="${r*0.5}" fill="${OUT}"/>
    <circle cx="${50+ex}" cy="${cy+1}" r="${r*0.5}" fill="${OUT}"/>

function tailRig(kind, c1, c2, st){
  const g = st===2 ? 1.25 : 1;
  switch(kind){
    case 'thick': return P(`M74 80c${16*g} 4 ${22*g}-6 ${20*g}-${18*g}l-9 3c1 8-4 12-13 9z`, c1);
    case 'spike': return P(`M74 78c${17*g} 2 ${24*g}-9 ${23*g}-${22*g}l-8 6 2-10-8 6-1-8c-8 10-13 20-8 28z`, c1);
    case 'fin':   return P(`M74 72c${11*g}-11 ${20*g}-14 ${25*g}-13-5 7-5 18 0 27-7 1-16-3-25-14z`, c2);
    case 'puff':  return P(`M74 78c12 3 16-3 15-11`, 'none', 8).replace(`stroke="${OUT}"`,`stroke="${c1}"`)
      + P(`M74 78c12 3 16-3 15-11`) + EL(90, 64, 8*g, 8*g, c2);
    default: return '';
  }
}

    <ellipse cx="50" cy="105" rx="${28*sc}" ry="5" fill="#000" opacity=".18"/>
    <g class="pet-body" style="transform:translate(50px,107px) scale(${sc}) translate(-50px,-107px)">

    </g></svg>`;
}

function rewardQuotaText(k,id){const r=E.RULES.rewards[id],requests=model.requests.filter(x=>x.type==='reward'&&['pending','approved'].includes(x.status)&&!(PILOT_REMOTE?.isSpark&&x.childIntentId)),legacy=model.legacy?.quotaEvents||model.legacyAssets?.quotaEvents||[],now=Date.now();if(r.group==='screen'){const old=legacy.filter(x=>x.kidId===k.id&&['youtube','game'].includes(x.rewardId)&&E.weekKey(x.ts)===E.weekKey(now)),current=requests.filter(x=>['youtube','game'].includes(x.rewardId)&&x.participants.includes(k.id)&&E.weekKey(x.ts)===E.weekKey(now)),todayUsed=old.some(x=>E.dayKey(x.ts)===date())||current.some(x=>E.dayKey(x.ts)===date()),weekUsed=old.length+current.length;return {blocked:todayUsed||weekUsed>=4,text:`จอวันละ 1 · สัปดาห์ละ 4 (ใช้ ${weekUsed})`}}if(['dinner','icecream'].includes(id)){const old=legacy.filter(x=>x.rewardId===id&&!x.inv&&E.weekKey(x.ts)===E.weekKey(now)),current=requests.filter(x=>x.rewardId===id&&E.weekKey(x.ts)===E.weekKey(now)),used=old.length+current.length;return {blocked:used>=2,text:`ทั้งบ้านสัปดาห์ละ 2 (ใช้ ${used})`}}if(id.startsWith('toy')){const old=legacy.some(x=>x.kidId===k.id&&x.rewardId===id&&now<E.addMonths(x.ts,6)),current=requests.some(x=>x.rewardId===id&&x.participants.includes(k.id)&&now<E.addMonths(x.ts,6));return {blocked:old||current,text:'คนละ 1 ครั้ง/6 เดือน'}}return {blocked:false,text:id==='sea'||id==='abroad'?'แบ่งจ่ายได้':''}}
function rewardsView(k){const b=E.balance(model,k.id),waiting=model.requests.filter(r=>r.type==='reward'&&r.status==='pending'&&r.participants.includes(k.id));return todayCard(k)+(waiting.length?`<div class="card" style="background:var(--gold-soft)"><div class="sec-title" style="margin:0">⏳ รออนุมัติ · ยังไม่หักแต้มสำหรับคำขอใหม่</div>${waiting.map(r=>`<div class="log-line"><span style="flex:1">${safe(E.RULES.rewards[r.rewardId].name)}</span><span class="tag tag-cost">−${r.shares[k.id]||0}</span>${PILOT_REMOTE?.isSpark&&r.childIntentId?'':button('ยกเลิก',`cancel:${r.id}`,'btn-sm')}</div>`).join('')}</div>`:'')+`<div class="sec-title">🎁 ของรางวัล — แต้มพร้อมใช้ ${b.available}</div>`+Object.entries(E.RULES.rewards).map(([id,r])=>{const q=rewardQuotaText(k,id);return `<div class="item" style="${q.blocked?'opacity:.5':''}"><div class="emo">${{youtube:'📺',game:'🎮',dinner:'🍽️',icecream:'🍨',toy200:'🧸',toy500:'🎁',toy1000:'🚲',sea:'🏖️',abroad:'✈️'}[id]}</div><div class="txt"><b>${safe(r.name)}</b><span class="muted">${q.text}</span></div><span class="tag tag-cost">${r.cost} 🤝</span>${button('แลก',`reward:${id}`,'btn-gold btn-sm',q.blocked)}</div>`}).join('')}
function legacyBankView(k){const records=model.deposits.filter(d=>d.kidId===k.id&&d.legacy);return records.length?`<div class="card" style="border:2px solid var(--gold)"><h3>สัญญาเงินฝากเดิม</h3>${records.map(r=>`<div class="log-line"><span style="flex:1">เงินต้น ${r.principal} · ดอก ${r.rate}%<span class="muted" style="display:block">ครบ ${datetime(r.dueAt)}</span></span><b>${r.status==='open'?'ยังฝากอยู่':safe(r.status)}</b></div>`).join('')}<div class="muted">เก็บอัตราและวันครบจากสัญญาเดิม · เงินฝากไม่รวมในแต้มพร้อมใช้</div></div>`:''}
function bankView(k){const b=E.balance(model,k.id);return legacyBankView(k)+`<div class="card"><div class="sec-title" style="margin:0">🏦 ธนาคารแต้ม</div><div class="grid" style="margin-top:8px"><div><div class="muted">พร้อมใช้</div><div class="points-big">${b.available}</div></div><div><div class="muted">เงินฝาก</div><div class="points-big">${b.deposits}</div></div></div><div class="muted">จากงาน ${b.earned} · จากยืม ${b.borrowed} · หนี้คงเหลือ ${b.debt}${b.deficit?` · ติดลบจาก penalty ${b.deficit}`:''}</div></div><div class="card"><h3>ฝากแต้ม</h3><div class="muted">ขั้นต่ำ 100 เพิ่มทีละ 100 · 7 วัน 1% หรือ 30 วัน 5% ต่อรอบ</div><div class="row" style="margin-top:12px">${button('ฝาก 7 วัน',`deposit:7`,'btn-primary')}${button('ฝาก 30 วัน',`deposit:30`,'btn-gold')}</div></div>${model.deposits.filter(d=>d.kidId===k.id).map(d=>`<div class="card">ฝาก ${d.days} วัน · ต้น ${d.principal} · ${d.status}<div class="muted">ครบ ${datetime(d.dueAt)}</div>${d.status==='open'?button('ถอนต้น',`withdraw:${d.id}`,'btn-sm'):''}</div>`).join('')}<div class="card"><h3>ยืมแต้ม</h3><div class="muted">สูงสุด 300 · ต้นทุน 10% · ครบ 14 วัน · งานใหม่หักคืน 50%</div>${button('ขอยืม', 'loan','btn-primary')}</div>${model.loans.filter(l=>l.kidId===k.id).map(l=>`<div class="card">ยืม ${l.principal} · ต้นทุน ${l.total-l.principal} · คืนแล้ว ${l.paid}<div class="muted">คงเหลือ ${l.remaining} · ครบ ${datetime(l.dueAt)} · ${l.status}</div>${l.status==='open'?button('คืนเพิ่ม',`repay:${l.id}`,'btn-sm'):''}</div>`).join('')}`}
function zooView(k){const need=75+(k.pets||[]).length*60,pct=Math.min(100,Math.round((k.eggWarm||0)/need*100));return `<div class="card" style="text-align:center"><div style="font-size:56px">🥚</div><h2>ไข่ของ${safe(k.name)}</h2><div class="muted">อุ่น ${k.eggWarm||0}/${need} · ตรงเวลา +3 · กิจวัตรครบ +10</div><div class="prog"><i style="width:${pct}%"></i></div>${button('ฟักไข่','hatch','btn-good',pct<100)}</div><div class="card"><h3>🐾 คอกสัตว์เลี้ยง</h3><div class="zoo">${(k.pets||[]).map(p=>`<button class="zoocell ${k.pet===p?'live':''}" data-act="choosepet:${p}" style="--rc:var(--good)"><div class="zoopic">${pilotPet(p,petStage(Number(k.petst?.[p]?.c||0)))}</div><b>${p}</b></button>`).join('')||'<div class="empty">ยังไม่มีสัตว์</div>'}</div><div style="width:180px;height:198px;margin:12px auto">${k.pet?pilotPet(k.pet,petStage(Number(k.petst?.[k.pet]?.c||0))):'🥚'}</div><div class="carerow">${button('<span>🍖</span><b>ให้อาหาร</b>','care:feed','care',!k.pet)}${button('<span>🎾</span><b>เล่น</b>','care:play','care',!k.pet)}${button('<span>🧼</span><b>อาบน้ำ</b>','care:wash','care',!k.pet)}${button('<span>🧭</span><b>ผจญภัย</b>','tab:adventure','care',!k.pet)}</div></div>`}
function adventureView(k){const a=k.adventure||{completed:0,collection:{},session:null},tickets=model.tickets.filter(t=>t.kidId===k.id&&t.status==='ready').length;return `<div class="card"><div class="row-between"><b>🧭 ผจญภัยฝึกคิด</b><span class="tag tag-wait">🎒 ${tickets}</span></div><div class="muted" style="margin:8px 0">งานที่ผ่านและได้แต้ม 1 งาน → สำรวจ 1 รอบ · 3 ด่าน</div>${button(a.session&&a.session.stage<3?'▶ เล่นต่อ':'🧭 ออกสำรวจ','journey','btn-primary btn-full',!k.pet)}<div class="muted" style="margin-top:8px">จบแล้ว ${a.completed||0} รอบ · ${safe(JSON.stringify(a.collection||{}))}</div><div id="journeyBox"></div></div>`}
function historyView(k){const rows=[...model.ledger].filter(l=>l.kidId===k.id).reverse().slice(0,80);return rows.length?`<div class="card">${rows.map(l=>`<div class="log-line"><span style="font-size:19px">${l.kind==='chore'?'⭐':l.kind==='reward'?'🎁':l.kind==='penalty'?'⚠️':'•'}</span><span style="flex:1">${safe(l.taskId?E.RULES.tasks[l.taskId]?.name:l.rewardId?E.RULES.rewards[l.rewardId]?.name:l.reason||l.name||l.kind)}<span class="muted" style="display:block">${datetime(l.ts)}</span></span><span class="tag ${l.delta>=0?'tag-plus':'tag-minus'}">${l.delta>=0?'+':''}${l.delta}</span></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีประวัติ</div>'}
function kidView(){const k=kid(page.kidId);if(!k){page.screen='pick';return pickView()}const b=E.balance(model,k.id),tabs=[['chores','วันนี้'],['rewards','ของรางวัล'],['zoo','🐾 คอกสัตว์'],['adventure','🧭 ผจญภัย'],['bank','🏦 ธนาคาร'],['history','ประวัติ']];const body={chores:choresView,rewards:rewardsView,zoo:zooView,adventure:adventureView,bank:bankView,history:historyView}[page.tab](k);return `<div class="kidbar" style="background:${k.color||'#4a6491'}">${avatar(k,54)}<div style="flex:1;min-width:0"><div class="nm">${safe(k.name)} <span class="lvbadge">🐣 Lv.${1+Math.floor((k.xp||0)/300)}</span></div><div class="pt">⭐ ${b.available} แต้ม · XP ${k.xp||0}</div><div class="xpbar"><i style="width:${(k.xp||0)%300/3}%"></i></div></div>${button('ออก ✕','home')}</div><div class="card" style="border:2px solid var(--navy)55"><div class="muted">⭐ แต้มพร้อมใช้</div><div class="points-big">${b.available}</div><div class="muted">จากงาน ${b.earned} · ยืม ${b.borrowed} · ฝาก ${b.deposits} · หนี้ ${b.debt}</div></div><div class="tabs">${tabs.map(([id,label])=>button(label,`tab:${id}`,page.tab===id?'on':'')).join('')}</div>${body}`}
function parentReview(){const pending=model.requests.filter(r=>r.status==='pending');return pending.length?pending.map(r=>{const k=kid(r.kidId||r.participants?.[0])||model.kids[0];if(r.type==='legacy-chore')return `<div class="card" style="border:2px solid var(--gold)"><div class="row" style="margin-bottom:8px">${avatar(k,44)}<div style="flex:1"><b>⏳ ${safe(r.name)}</b><div class="muted">${safe(k.name)} · งานเดิม ส่ง ${clock(r.finishedAt)}</div></div><span class="tag tag-plus">+${r.proposedPoints}</span></div><div class="muted" style="margin-bottom:10px">ผู้ปกครองเลือกผลเอง: ผ่าน ${r.proposedPoints} แต้ม หรือให้เต็ม ${r.fullPoints} แต้ม</div><div class="row">${button(`✓ ผ่าน +${r.proposedPoints}`,`legacyapprove:${r.id}`,'btn-good btn-sm')}${r.fullPoints>r.proposedPoints?button(`ให้เต็ม +${r.fullPoints}`,`legacyfull:${r.id}`,'btn-sm'):''}${button('✕ ไม่ผ่าน',`legacyreject:${r.id}`,'btn-warn btn-sm')}</div></div>`;const chore=r.type==='chore',name=chore?E.RULES.tasks[r.taskId].name:E.RULES.rewards[r.rewardId].name;return `<div class="card"><div class="row" style="margin-bottom:8px">${avatar(k,44)}<div style="flex:1"><b>${chore?'⭐':'🎁'} ${safe(name)}</b><div class="muted">${safe(k.name)}</div></div><span class="tag ${chore?'tag-plus':'tag-cost'}">${chore?'+':'−'}${chore?E.scoreTask(model,k.id,r.taskId,r.finishedAt,r.complete&&(!E.RULES.tasks[r.taskId].practice||r.minutes>=20)&&r.assignmentDone).points:E.RULES.rewards[r.rewardId].cost}</span></div><div class="muted" style="margin-bottom:10px">${chore?`ส่งตอน ${clock(r.finishedAt)} · กำหนด ${E.RULES.tasks[r.taskId].dueSchool||''}`:`ร่วมใช้ ${r.participants.map(id=>safe(kid(id)?.name)).join(', ')} · แบ่งจ่าย ${r.participants.map(id=>`${safe(kid(id)?.name)} ${r.shares[id]||0}`).join(' · ')}${r.childIntentId?' · ยังไม่กันแต้ม/โควตา':''}`}</div><div class="row">${button('✓ อนุมัติ',`approve:${r.id}`,'btn-good btn-sm')}${button('✕ ไม่ผ่าน',`reject:${r.id}`,'btn-warn btn-sm')}</div></div>`}).join(''):'<div class="empty">ไม่มีรายการรอตรวจ 🎉</div>'}
function parentSummary(){return `<div class="card"><h3>📊 สรุปวันนี้</h3>${model.kids.map(k=>{const chores=model.ledger.filter(l=>l.kind==='chore'&&l.kidId===k.id&&l.taskDay===date());return `<div class="log-line">${avatar(k,32)}<span style="flex:1">${safe(k.name)}</span><span class="tag tag-plus">${chores.length} งาน · ${chores.reduce((n,l)=>n+l.delta,0)} แต้ม</span></div>`}).join('')}</div>`}
function parentPoints(){return `<div class="sec-title">⚠️ หักแต้มเฉพาะคนที่ทำ</div>${model.kids.map(k=>`<div class="card"><div class="row">${avatar(k,36)}<b>${safe(k.name)}</b></div><div class="row" style="flex-wrap:wrap;margin-top:8px">${button('ใช้จอเกินเวลา −20',`penalty:${k.id}:screen`,'btn-warn btn-sm')}${button('ทำร้าย/ทำลายของ −30',`penalty:${k.id}:physical`,'btn-warn btn-sm')}${button('ปรับแต้ม',`adjust:${k.id}`,'btn-sm')}</div></div>`).join('')}`}
function parentManage(){const p=E.planFor(model,date());return `<div class="card"><h3>📅 กำหนดงานวันนี้</h3><div class="muted">${date()} · ${p.school?'วันเรียน':'วันหยุด'} · ${p.homework?'มีการบ้าน':'ไม่มีการบ้าน'}</div>${button('ตั้งค่าวันเรียน/การบ้าน','plan','btn-primary btn-full')}</div>${PILOT_REMOTE?.isLive?'':`<div class="card"><h3>🧪 ข้อมูลจำลอง</h3><div class="muted">${PILOT_REMOTE?'รุ่นทดลองแชร์ข้อมูลผ่าน Firebase Emulator บนเครื่องนี้ ไม่แตะข้อมูลจริง':'รุ่นทดลองเก็บบนเครื่องนี้ ไม่มีการเขียน Firebase'}</div>${button('เติม 35,000 แต้มให้ทั้งสองคน','seed','btn-sm')}${button('ดาวน์โหลดข้อมูลทดลอง','export','btn-sm')}${PILOT_REMOTE?'':button('นำเข้า snapshot ข้อมูลเก่า','importlegacy','btn-sm')}<input id="legacyFile" type="file" accept="application/json,.json" style="display:none">${PILOT_REMOTE?'':button('ล้างข้อมูลทดลอง','reset','btn-warn btn-sm')}</div>`}`}
function parentLog(){return `<div class="card">${[...model.ledger].reverse().slice(0,80).map(l=>`<div class="log-line"><span style="flex:1">${safe(kid(l.kidId)?.name)} · ${safe(l.reason||l.name||l.kind)}<span class="muted" style="display:block">${datetime(l.ts)}</span></span><span class="tag ${l.delta>=0?'tag-plus':'tag-minus'}">${l.delta>=0?'+':''}${l.delta}</span></div>`).join('')||'<div class="empty">ยังไม่มีประวัติ</div>'}</div>`}
function parentView(){const tabs=[['review',`ตรวจ (${model.requests.filter(r=>r.status==='pending').length})`],['summary','สรุปเวลา'],['points','ให้/หักแต้ม'],['manage','ตั้งค่า'],['log','ประวัติ']];return `<div class="topbar">${button('← ออก','home','btn-ghost')}<div style="flex:1"></div><span class="badge clock">🕐 ${clock(Date.now())}</span><span class="badge">ผู้ปกครอง</span></div><div class="tabs">${tabs.map(([id,label])=>button(label,`tab:${id}`,page.tab===id?'on':'')).join('')}</div>${{review:parentReview,summary:parentSummary,points:parentPoints,manage:parentManage,log:parentLog}[page.tab]()} `}
function draw(){if(PILOT_REMOTE?.isLive&&page.screen==='parent'&&!PILOT_REMOTE.hasParentSession())page.screen='pick';el('app').innerHTML=legacyBanner()+(page.screen==='pick'?pickView():page.screen==='pin'?pinView():page.screen==='kid'?kidView():parentView());el('modal').innerHTML=sheet?`<div class="overlay"><div class="sheet"><div class="row-between"><h3>${safe(sheet.title)}</h3>${button('✕','close','btn-ghost')}</div>${sheet.body}<div class="sheet-actions">${button('ยกเลิก','close','btn-ghost')}${button(sheet.submit||'ยืนยัน','submit','btn-primary')}</div></div></div>`:'';document.body.style.background=page.screen==='kid'?(kid(page.kidId)?.color||'#4a6491')+'25':''}
function openSheet(title,body,callback,submit='ยืนยัน'){sheet={title,body,callback,submit};draw()}
function value(name){return el('modal').querySelector(`[name="${name}"]`)?.value}
function checked(name){return !!el('modal').querySelector(`[name="${name}"]`)?.checked}
function askTask(id){const t=E.RULES.tasks[id];let submittedAt=null;openSheet('ส่งงาน '+t.name,`<div class="muted">กำหนด ${t.dueSchool||t.dueHoliday} · ใช้เวลาส่งงานคิดแต้ม</div>${t.practice?'<label>ซ้อมกี่นาที</label><input name="minutes" type="number" min="0" value="20">':''}<label><input type="checkbox" name="complete" checked style="width:auto"> ทำครบตามงานแล้ว</label>${id==='homework'?'<label><input type="checkbox" name="assignmentDone" checked style="width:auto"> ทำส่วนที่กำหนดครบแล้ว</label>':''}`,()=>perform('submitTask',[page.kidId,id,submittedAt??=Date.now(),{complete:checked('complete'),minutes:t.practice?Number(value('minutes')):0,assignmentDone:id==='homework'?checked('assignmentDone'):true}]),'ส่งให้ตรวจ')}
function askReward(id){const r=E.RULES.rewards[id],k=kid(page.kidId),others=model.kids.filter(x=>x.id!==k.id);const body=`<div class="muted">${safe(r.name)} · รวม ${r.cost} แต้ม · ผู้ร่วมใช้ทุกคนถูกนับโควตา</div><label>จ่ายเองกี่แต้ม</label><input name="own" type="number" min="0" max="${r.cost}" value="${r.cost}">${others.map(o=>`<label><input name="join-${safe(o.id)}" type="checkbox" style="width:auto"> ${safe(o.name)} ร่วมใช้</label>`).join('')}<div class="muted" data-share-preview>เลือกผู้ร่วมใช้แล้วระบบจะตั้งต้นให้จ่ายคนละครึ่ง ปรับจำนวนเองได้</div>`;openSheet('ขอแลก '+r.name,body,()=>{const participants=[k.id,...others.filter(o=>checked(`join-${o.id}`)).map(o=>o.id)],own=Number(value('own')),shares={[k.id]:own};if(participants.length===1&&own!==r.cost)throw Error('ถ้าใช้คนเดียวต้องจ่ายเต็ม');if(participants.length>2)throw Error('รุ่นทดลองนี้รองรับสองคน');if(participants.length===2)shares[participants[1]]=r.cost-own;if(PILOT_REMOTE?.isLive&&!PILOT_REMOTE.isSpark&&participants.length>1&&!PILOT_REMOTE.hasParentSession()){openSheet('ผู้ปกครองยืนยันรางวัลร่วม',`<div class="muted">จะกันแต้ม ${safe(k.name)} ${shares[k.id]} และ ${safe(kid(participants[1])?.name)} ${shares[participants[1]]}</div><label>รหัสผู้ปกครอง</label><input name="parentSecret" type="password" autocomplete="off">`,async()=>{try{await PILOT_REMOTE.unlockParent(value('parentSecret'));await perform('requestReward',[id,participants,shares])}catch(error){notice(error.message,true)}},'ยืนยันและส่งคำขอ');return}perform('requestReward',[id,participants,shares])},'ส่งคำขอ');sheet.shareCost=r.cost;sheet.sharePartners=others.map(o=>o.id)}
function updateRewardShare(resetOwn){if(!sheet?.sharePartners)return;const selected=sheet.sharePartners.filter(id=>checked(`join-${id}`));const own=el('modal').querySelector('[name="own"]');if(!own)return;if(resetOwn)own.value=selected.length?Math.ceil(sheet.shareCost/2):sheet.shareCost;const preview=el('modal').querySelector('[data-share-preview]');if(preview)preview.textContent=selected.length?`ตั้งต้นคนละครึ่ง: หนู ${own.value} · ${safe(kid(selected[0])?.name)} ${sheet.shareCost-Number(own.value)} แต้ม (ปรับจำนวนได้)`:'เลือกผู้ร่วมใช้แล้วระบบจะตั้งต้นให้จ่ายคนละครึ่ง'}
function askPlan(){const p=E.planFor(model,date());openSheet('กำหนดงานวันนี้',`<label><input name="school" type="checkbox" style="width:auto" ${p.school?'checked':''}> วันเรียน</label><label><input name="homework" type="checkbox" style="width:auto" ${p.homework?'checked':''}> มีการบ้าน</label><label>ส่วนที่ต้องทำ</label><input name="assignment" value="${safe(p.assignment||'')}">`,()=>perform('setPlan',[date(),{school:checked('school'),homework:checked('homework'),assignment:value('assignment')}]))}
function askPenalty(id,type){const n=type==='screen'?20:30;openSheet('หัก '+n+' แต้ม',`<div class="muted">หักเฉพาะ ${safe(kid(id)?.name)} · ${type==='screen'?'ใช้จอเกินเวลา':'ทำร้ายหรือจงใจทำลายของ'}</div><label>เหตุผล/เหตุการณ์</label><input name="reason" placeholder="ระบุเหตุผล">`,()=>perform('penalty',[id,type,value('reason')]))}
function askAdjust(id){openSheet('ปรับแต้ม '+kid(id).name,'<label>จำนวนแต้ม (ติดลบเพื่อหัก)</label><input name="amount" type="number" value="10"><label>เหตุผล</label><input name="reason" placeholder="เหตุผลที่แก้ไข">',()=>perform('adjust',[id,Number(value('amount')),value('reason')]))}
function askDeposit(days){openSheet(`ฝาก ${days} วัน`, `<div class="muted">ฝากขั้นต่ำ 100 เพิ่มทีละ 100 · ดอก ${days===7?1:5}% ต่อรอบ · เงินต้น+ดอกกลับพร้อมใช้เมื่อครบกำหนด</div><label>จำนวนแต้ม</label><input name="amount" type="number" min="100" step="100" value="100">`,()=>perform('openDeposit',[page.kidId,Number(value('amount')),days]))}
function askLoan(){openSheet('ยืมแต้ม','<div class="muted">สูงสุด 300 แต้ม · ต้นทุน 10% · ครบ 14 วัน · แต้มงานใหม่หักคืน 50%</div><label>จำนวนยืม</label><input name="amount" type="number" min="1" max="300" value="100"><div id="loanPreview" class="muted">ยืม 100 · ต้องคืน 110</div>',()=>perform('openLoan',[page.kidId,Number(value('amount'))]))}
function askWithdraw(id){const dep=model.deposits.find(d=>d.id===id);openSheet('ถอนเงินฝาก',`<div class="muted">ก่อนครบกำหนดได้เงินต้นส่วนที่ถอน แต่ไม่ได้ดอกส่วนนั้น</div><label>จำนวนถอน</label><input name="amount" type="number" min="1" max="${dep.principal}" value="${dep.principal}">`,()=>perform('withdrawDeposit',[id,Number(value('amount'))]))}
function askRepay(id){const loan=model.loans.find(l=>l.id===id);openSheet('คืนหนี้เพิ่ม',`<div class="muted">คงเหลือ ${loan.remaining} · จ่ายได้ด้วยแต้มจากงาน</div><label>จำนวนคืน</label><input name="amount" type="number" min="1" max="${loan.remaining}" value="${Math.min(loan.remaining,E.balance(model,loan.kidId).earned)}">`,()=>perform('repayLoan',[id,Number(value('amount'))]))}
function openJourney(session){page.tab='adventure';draw();const box=el('journeyBox');box.innerHTML=`${button('พักก่อน ✕','closejourney','btn-ghost')}<iframe title="เกมผจญภัย" sandbox="allow-scripts" style="width:100%;height:760px;border:0"></iframe>`;journeyFrame=box.querySelector('iframe');journeyFrame.srcdoc=ADVENTURE_GAME.replace('__ADVENTURE_SETUP__',JSON.stringify({sessionId:session.id,stage:session.stage,level:session.level})).replace('__ADVENTURE_PET__',`<span style="font-size:65px">${session.pet}</span>`)}
async function handle(action){const [op,a,b]=action.split(':');if(op==='home'){if(PILOT_REMOTE?.isLive&&PILOT_REMOTE.hasParentSession())PILOT_REMOTE.lockParent().catch(error=>notice(error.message,true));navigate('pick')}else if(op==='kid')navigate('kid','chores',a);else if(op==='pin'){page.screen='pin';page.pin='';if(PILOT_REMOTE?.isLive){try{parentEnrollment=await PILOT_REMOTE.parentStatus()}catch(error){notice(error.message,true)}}draw()}else if(op==='parentunlock'){try{await PILOT_REMOTE.unlockParent(el('parentSecret')?.value||'');navigate('parent','review')}catch(error){notice(error.message,true)}}else if(op==='parentenroll'){try{await PILOT_REMOTE.enrollParent(el('parentEnrollmentToken')?.value||'',el('parentSecret')?.value||'');navigate('parent','review')}catch(error){notice(error.message,true)}}else if(op==='key'){page.pin+=a;if(page.pin.length===4){if(page.pin==='1234')navigate('parent','review');else{page.pin='';draw();notice('รหัสทดลองไม่ถูกต้อง',true)}}else draw()}else if(op==='backspace'){page.pin=page.pin.slice(0,-1);draw()}else if(op==='tab'){page.tab=a;draw()}else if(op==='task')askTask(a);else if(op==='reward')askReward(a);else if(op==='plan')askPlan();else if(op==='mature')perform('matureDeposits',[Date.now()]);else if(op==='legacyapprove')perform('settleLegacyChore',[a,true,false]);else if(op==='legacyfull')perform('settleLegacyChore',[a,true,true]);else if(op==='legacyreject')perform('settleLegacyChore',[a,false,false]);else if(op==='approve'){const r=model.requests.find(x=>x.id===a);if(!r){notice('ไม่พบคำขอ',true);return}if(r.type==='reward'&&r.participants.length>1){const split=r.participants.map(id=>`${safe(kid(id)?.name||id)} ${r.shares[id]||0} แต้ม`).join(' · ');openSheet('ยืนยันรางวัลร่วม',`<div class="muted">${safe(E.RULES.rewards[r.rewardId].name)} · ${split}</div><label><input name="sharedConsent" type="checkbox" style="width:auto"> ผู้ร่วมใช้ทุกคนตกลงส่วนแบ่งนี้แล้ว</label><div class="muted">คำขอเด็กยังไม่กันแต้ม ระบบจะตรวจยอดและโควตาอีกครั้งตอนอนุมัติ</div>`,()=>{if(!checked('sharedConsent'))throw Error('ยืนยันความยินยอมและส่วนแบ่งก่อน');perform('settleReward',r.childIntentId?[a,true,true]:[a,true])},'ยืนยันและอนุมัติ')}else perform(r.type==='chore'?'approveTask':'settleReward',r.type==='chore'?[a]:[a,true])}else if(op==='reject'){const r=model.requests.find(x=>x.id===a);perform(r.type==='chore'?'rejectTask':'settleReward',r.type==='chore'?[a]:[a,false])}else if(op==='cancel')perform('cancelReward',[a]);else if(op==='penalty')askPenalty(a,b);else if(op==='adjust')askAdjust(a);else if(op==='deposit')askDeposit(Number(a));else if(op==='withdraw')askWithdraw(a);else if(op==='loan')askLoan();else if(op==='repay')askRepay(a);else if(op==='hatch')perform('hatchPet',[page.kidId]);else if(op==='choosepet')perform('choosePet',[page.kidId,a]);else if(op==='care')perform('carePet',[page.kidId,a]);else if(op==='journey'){await startOrResumeJourney()}else if(op==='closejourney'){journeyFrame=null;draw()}else if(op==='seed'&&!PILOT_REMOTE?.isLive){if(PILOT_REMOTE){for(const k of model.kids)await perform('adjust',[k.id,35000,'ข้อมูลจำลองเพื่อทดลองรางวัล'])}else commit(()=>{for(const k of model.kids)E.adjust(model,k.id,35000,'ข้อมูลจำลองเพื่อทดลองรางวัล')})}else if(op==='importlegacy'&&!PILOT_REMOTE){el('legacyFile')?.click()}else if(op==='export'){const blob=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='discipline-pilot-simulation.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}else if(op==='reset'&&!PILOT_REMOTE){openSheet('ล้างข้อมูลจำลอง','<p>ข้อมูลจำลองในเบราว์เซอร์นี้จะถูกลบ</p>',()=>{localStorage.removeItem(PILOT_STORE);model=E.newState();sheet=null;navigate('pick')},'ล้างข้อมูล')}else if(op==='close'){if(sheet?.journeyApproval){sheet=null;el('modal').innerHTML='';journeyFrame?.contentWindow.postMessage({type:'adventure:save-error',sessionId:journeyPending?.sessionId,stage:journeyPending?.stage},'*');journeyPending=null}else{sheet=null;draw()}}else if(op==='submit'){try{sheet?.callback()}catch(err){notice(err.message,true)}}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-act]');if(target){event.preventDefault();handle(target.dataset.act)}});
document.addEventListener('change',async event=>{if(event.target?.id==='legacyFile')await importLegacyFile(event.target.files?.[0]);if(event.target?.name?.startsWith('join-'))updateRewardShare(true)});
document.addEventListener('input',event=>{if(event.target?.name==='own')updateRewardShare(false)});
let journeyPending=null;
async function startOrResumeJourney(){
  const existing=kid(page.kidId)?.adventure?.session;
  if(existing&&existing.stage<3){openJourney(existing);return}
  if(PILOT_REMOTE?.isSpark&&!PILOT_REMOTE.hasParentSession()){
    openSheet('ผู้ปกครองยืนยันใช้ตั๋ว','<div class="muted">ใช้ตั๋ว 1 ใบเพื่อเริ่มเกม เด็กจะเล่นต่อได้โดยไม่ต้องใส่รหัสระหว่างด่าน</div><label>รหัสผ่านบัญชีครอบครัว</label><input name="parentSecret" type="password" autocomplete="off">',async()=>{
      try{await PILOT_REMOTE.unlockParent(value('parentSecret'));const session=await perform('startJourney',[page.kidId]);if(session)openJourney(session)}
      catch(error){notice(error.message,true)}
    },'ยืนยันและเริ่มเกม');return;
  }
  const session=await perform('startJourney',[page.kidId]);if(session)openJourney(session);
}
async function saveJourneyStage(message,frame){
  try{
    let result;
    if(PILOT_REMOTE){const saved=await PILOT_REMOTE.apply('completeJourneyStage',[page.kidId,message.sessionId,message.stage]);model=saved.state;result=saved.result}
    else{result=E.completeJourneyStage(model,page.kidId,message.sessionId,message.stage);localStorage.setItem(PILOT_STORE,JSON.stringify(model))}
    frame.contentWindow.postMessage({type:'adventure:saved',sessionId:message.sessionId,stage:message.stage,prize:message.stage===2?result.session.prize:''},'*');
  }catch(error){frame.contentWindow.postMessage({type:'adventure:save-error',sessionId:message.sessionId,stage:message.stage},'*');notice(error.message,true)}
}
function requestJourneyApproval(message,frame){
  journeyPending=message;
  sheet={journeyApproval:true,title:'รอบันทึกผลด่าน',body:'<div class="muted">ผลเกมยังไม่ถูกบันทึกและยังไม่ได้รางวัล ผู้ปกครองยืนยันก่อนบันทึกด่านนี้</div><label>รหัสผ่านบัญชีครอบครัว</label><input name="parentSecret" type="password" autocomplete="off">',submit:'ยืนยันและบันทึก',callback:async()=>{
    try{await PILOT_REMOTE.unlockParent(value('parentSecret'));sheet=null;journeyPending=null;el('modal').innerHTML='';await saveJourneyStage(message,frame)}
    catch(error){notice(error.message,true)}
  }};
  // Keep the iframe mounted while the parent confirms: a full draw() would
  // destroy the game and lose the completed stage before it is persisted.
  el('modal').innerHTML=`<div class="overlay"><div class="sheet"><div class="row-between"><h3>${safe(sheet.title)}</h3>${button('✕','close','btn-ghost')}</div>${sheet.body}<div class="sheet-actions">${button('ยกเลิก','close','btn-ghost')}${button(sheet.submit,'submit','btn-primary')}</div></div></div>`;
}
window.addEventListener('message',async event=>{
  if(!journeyFrame||event.source!==journeyFrame.contentWindow)return;
  const message=event.data;
  if(message?.type==='adventure:resize'&&Number.isFinite(message.height))journeyFrame.style.height=Math.max(400,Math.min(1400,message.height))+'px';
  if(message?.type==='adventure:complete'){
    const frame=journeyFrame;
    if(PILOT_REMOTE?.isSpark&&!PILOT_REMOTE.hasParentSession())requestJourneyApproval(message,frame);
    else await saveJourneyStage(message,frame);
  }
  if(message?.type==='adventure:close'){journeyFrame=null;journeyPending=null;sheet=null;draw()}
});
setInterval(()=>{if(!model.deposits.some(d=>d.status==='open'&&d.dueAt<=Date.now()))return;if(PILOT_REMOTE?.isLive)return;if(PILOT_REMOTE)perform('matureDeposits',[Date.now()]);else{const n=E.matureDeposits(model);if(n){localStorage.setItem(PILOT_STORE,JSON.stringify(model));draw()}}},60000);
if(PILOT_REMOTE)PILOT_REMOTE.subscribe(state=>{model=state;if(!sheet&&!journeyFrame)draw()},err=>notice(err.message,true));
draw();

}
}
</script>
<script type="module">
if(window.DISCIPLINE_MODE==='preview'){
const {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
const {getAuth,onAuthStateChanged,signInWithEmailAndPassword} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
const {getFirestore,collection,doc,getDocsFromServer,getDocFromServer} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
const VERSION='pilot-0.1';
const dayKey=ts=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts));
const weekKey=ts=>{const day=dayKey(ts),midday=Date.parse(`${day}T12:00:00+07:00`),weekday=(new Date(midday).getUTCDay()+6)%7;return dayKey(midday-weekday*86400000)};

// Pure, read-only preview of an export from the legacy Firestore collections.
// It deliberately does not resolve old contracts or transform production data.
function previewLegacySnapshot(raw,asOf=Date.now()){
  const kids=Array.isArray(raw.kids)?raw.kids:[],logs=Array.isArray(raw.log)?raw.log:[],
    pending=Array.isArray(raw.pending)?raw.pending:[],rewards=Array.isArray(raw.rewards)?raw.rewards:[];
  const issues=[],rewardById=new Map(rewards.map(r=>[r.id,r]));
  const balances=kids.map(k=>{
    const daily=Number(k.points||0),extra=Number(k.extra||0),bank=Array.isArray(k.bank)?k.bank:[];
    if(!Number.isSafeInteger(daily)||!Number.isSafeInteger(extra))issues.push(`ยอด ${k.name||k.id} ไม่ใช่จำนวนเต็ม`);
    return {kidId:k.id,name:k.name,daily,extra,combined:daily+extra,
      bank:bank.map(b=>({id:b.id,kind:b.kind,pot:b.pot,amount:Number(b.amount||0),
        paid:Number(b.paid||0),pct:b.pct,rate:b.rate,grace:b.grace,
        openTs:b.openTs,dueTs:b.dueTs,cosignId:b.cosignId,loanId:b.loanId,forId:b.forId})),
      xp:Number(k.xp||0),eggWarm:Number(k.eggWarm||0),pets:(k.pets||[]).length,
      adventureCompleted:Number(k.adventure?.completed||0),
      readyTickets:(raw.adventureTickets||[]).filter(t=>t.kidId===k.id&&t.state==='ready').length};
  });
  const contracts=balances.flatMap(k=>k.bank.map(b=>({kidId:k.kidId,kidName:k.name,...b})));
  for(const c of contracts)issues.push(`ตรวจสัญญาเก่า ${c.kind} ${c.id||'?'} ของ ${c.kidName}: คงอัตรา วันครบ และยอดชำระเดิม`);
  const reservations=pending.map(p=>{
    const people=p.type==='reward'?[p.kidId,p.partnerId].filter(Boolean)
      :p.type==='join'?[p.kidId,p.partnerId].filter(Boolean):[p.kidId].filter(Boolean);
    return {id:p.id,type:p.type,rewardId:p.rid,day:dayKey(Number(p.ts||asOf)),participants:[...new Set(people)],
      points:Number(p.pts||0),partnerId:p.partnerId||null,pot:p.pot||'daily',
      note:p.type==='join'?'ส่วนคืนเจ้าของรอบแรกต้องตรวจคู่รายการ':undefined};
  });
  for(const r of reservations)issues.push(`ตรวจคำขอค้าง ${r.type} ${r.id||'?'}: แต้มจองและโควตา`);
  const isScreen=name=>/youtube|เล่นเกม|เกม 30 นาที/i.test(name||'');
  const currentWeek=weekKey(asOf),today=dayKey(asOf);
  const screenUsage=kids.map(k=>{
    const used=logs.filter(l=>l.kind==='reward'&&l.kidId===k.id&&isScreen(rewardById.get(l.rid)?.name||l.name)
      &&weekKey(Number(l.ts||0))===currentWeek);
    const waiting=pending.filter(p=>['reward','join'].includes(p.type)
      &&(p.kidId===k.id||(p.type==='reward'&&p.partnerId===k.id))
      &&isScreen(rewardById.get(p.rid)?.name||p.name)
      &&weekKey(Number(p.ts||0))===currentWeek);
    return {kidId:k.id,name:k.name,week:currentWeek,completed:used.length,pending:waiting.length,
      todayCompleted:used.filter(l=>dayKey(Number(l.ts))===today).length,
      todayPending:waiting.filter(p=>dayKey(Number(p.ts))===today).length};
  });
  const olderThanLimit=logs.length>=600;
  if(olderThanLimit)issues.push('export log มี 600 รายการขึ้นไป: ต้องตรวจว่าดึงประวัติครบ ไม่ใช่ขีดจำกัดหน้าเดิม');
  return {targetVersion:VERSION,asOf,source:{kids:kids.length,chores:(raw.chores||[]).length,
    rewards:rewards.length,ledger:logs.length,pending:pending.length,tickets:(raw.adventureTickets||[]).length,
    customPetArt:Object.values(raw.petartDocs||{}).reduce((n,doc)=>n+Object.values(doc||{}).filter(Boolean).length,0)},
    balances,combinedTotal:balances.reduce((n,k)=>n+k.combined,0),contracts,reservations,
    screenUsage,legacyRewardNames:rewards.map(r=>({id:r.id,name:r.name,cost:r.cost})),
    issues,readyForAutomaticMigration:false};
}

// Read-only inspection of the existing Firebase family. No seed/migration calls.

const config={apiKey:'AIzaSyCkWB1di_6G64YFMx2ducpNYypCGs5chUY',authDomain:'discipline-629c3.firebaseapp.com',projectId:'discipline-629c3',storageBucket:'discipline-629c3.firebasestorage.app',messagingSenderId:'920264804175',appId:'1:920264804175:web:b84d3641c3abee6ed4273a'};
const app=initializeApp(config,'discipline-read-only-preview');
const auth=getAuth(app),db=getFirestore(app);
const output=document.getElementById('app');
const normalize=value=>{
  if(value?.toMillis)return value.toMillis();
  if(Array.isArray(value))return value.map(normalize);
  if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,normalize(v)]));
  return value;
};
const show=message=>{output.textContent=message};

async function showLegacyPreview(){
  const local=['localhost','127.0.0.1'].includes(location.hostname);
  const published=location.hostname==='srtzp.github.io'&&location.pathname.startsWith('/Discipline/');
  if(!local&&!published)throw Error('เปิด preview จาก localhost หรือ GitHub Pages ของ Discipline เท่านั้น');
  show('กำลังตรวจบัญชี Firebase…');
  const user=await new Promise(resolve=>{const off=onAuthStateChanged(auth,value=>{off();resolve(value)},()=>{off();resolve(null)})});
  if(!user){
    output.replaceChildren();
    const form=document.createElement('form'),heading=document.createElement('h2'),email=document.createElement('input'),password=document.createElement('input'),button=document.createElement('button'),status=document.createElement('p');
    heading.textContent='ลงชื่อเข้าใช้เพื่ออ่านข้อมูลเก่า';email.type='email';email.placeholder='อีเมล';email.required=true;password.type='password';password.placeholder='รหัสผ่าน';password.required=true;button.type='submit';button.textContent='เปิดรายงานแบบอ่านอย่างเดียว';
    form.append(heading,email,password,button,status);output.append(form);
    form.onsubmit=async event=>{event.preventDefault();button.disabled=true;status.textContent='กำลังลงชื่อเข้าใช้…';try{const result=await signInWithEmailAndPassword(auth,email.value,password.value);password.value='';await loadReport(result.user)}catch(error){status.textContent='เปิดรายงานไม่สำเร็จ: '+error.message;button.disabled=false}};
    return;
  }
  await loadReport(user);
}

async function loadReport(user){
  show('กำลังอ่านข้อมูลจริงแบบ read-only…');
  const names=['kids','chores','rewards','penalties','pending','log','adventureTickets'];
  const [collections,settings,artDocs]=await Promise.all([
    Promise.all(names.map(async name=>[name,(await getDocsFromServer(collection(db,'families',user.uid,name))).docs.map(d=>normalize({id:d.id,...d.data()}))])),
    getDocFromServer(doc(db,'families',user.uid,'config','settings')),
    Promise.all(['petart','petart1','petart2'].map(async name=>{const snap=await getDocFromServer(doc(db,'families',user.uid,'config',name));return [name,snap.exists()?normalize(snap.data()):{}]}))
  ]);
  const raw=Object.fromEntries(collections);raw.settings=settings.exists()?normalize(settings.data()):null;raw.petartDocs=Object.fromEntries(artDocs);
  const report=previewLegacySnapshot(raw);
  output.replaceChildren();
  const title=document.createElement('h2');title.textContent='ตรวจข้อมูลก่อนย้าย · อ่านอย่างเดียว';output.append(title);
  const lead=document.createElement('p');lead.textContent='ยอดเดิมจะรวมแต้มประจำวันกับแต้มพิเศษ 1:1 ใน engine ใหม่ ข้อมูล Firebase ยังไม่เปลี่ยน';output.append(lead);
  for(const kid of report.balances){const row=document.createElement('div');row.className='card';row.textContent=`${kid.name||kid.kidId}: ${kid.daily} + ${kid.extra} = ${kid.combined} แต้ม`;output.append(row)}
  const status=document.createElement('div');status.className='card';status.textContent=report.issues.length?`ต้องตรวจต่อ ${report.issues.length} เรื่อง: ${report.issues.join(' · ')}`:'ยอดพร้อมให้ตรวจต่อ ยังไม่ได้ย้ายข้อมูลจริง';output.append(status);
  const text=document.createElement('pre');text.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;padding:20px';
  text.textContent=JSON.stringify(report,null,2);output.append(text);
  const button=document.createElement('button');button.textContent='ดาวน์โหลด snapshot ที่อ่านมา';
  button.onclick=async()=>{button.disabled=true;try{
    const encoded=new TextEncoder().encode(JSON.stringify(raw));
    const digest=await crypto.subtle.digest('SHA-256',encoded);
    const sourceSha256=[...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
    const exportData={exportedAt:new Date().toISOString(),sourceProjectId:config.projectId,familyUid:user.uid,sourceSha256,raw,report};
    const url=URL.createObjectURL(new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='discipline-legacy-preview.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }finally{button.disabled=false}};
  output.append(button);
}

try{await showLegacyPreview()}catch(error){document.getElementById('app').textContent='Preview ไม่สำเร็จ: '+error.message}
}
