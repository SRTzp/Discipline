/* ---------- 🍖 ระบบเลี้ยง ---------- */
const FEED_MS = 20*3600e3, PLAY_MS = 30*3600e3, WASH_MS = 48*3600e3;
const petStOf = k => (k && k.petst && k.pet && k.petst[k.pet]) || null;
const activePet = k => (k && k.pet && (k.pets||[]).indexOf(k.pet) >= 0) ? k.pet
                     : ((k && (k.pets||[])[0]) || '');
function petStats(st){
  const t = now(), c = x => Math.max(0, Math.min(100, Math.round(x)));
  if(!st) return {hunger:100, happy:100, clean:100, care:0};
  return {hunger: c(100 - (t - Number(st.f||t))/FEED_MS*100),
          happy:  c(100 - (t - Number(st.p||t))/PLAY_MS*100),
          clean:  c(100 - (t - Number(st.w||t))/WASH_MS*100),
          care:   Number(st.c||0)};
}
const petStage = care => care >= 70 ? 2 : care >= 25 ? 1 : 0;
function petMood(S3){
  if(timeBand() === 'night') return 'sleep';
  const low = Math.min(S3.hunger, S3.happy, S3.clean);
  return low >= 60 ? 'happy' : low >= 30 ? 'ok' : 'sad';
}
function petSay(S3, mood){
  if(mood === 'sleep') return 'หลับอยู่… เจอกันพรุ่งนี้เช้านะ 💤';
  if(S3.hunger < 30) return 'ท้องร้องแล้ว หิวมาก ๆ 🍖';
  if(S3.clean  < 30) return 'ตัวเลอะไปหมดเลย ขออาบน้ำหน่อย 🧼';
  if(S3.happy  < 30) return 'เหงาจัง มาเล่นด้วยกันหน่อย 🎾';
  if(S3.hunger < 60) return 'เริ่มหิวนิด ๆ แล้วนะ';
  if(S3.happy  < 60) return 'อยากเล่นแล้ว!';
  return 'สบายใจสุด ๆ ขอบคุณที่ดูแลนะ 💛';
}
/* บันทึกสถานะสัตว์ตัวที่กำลังเลี้ยง */
async function petSave(kidId, patch, careAdd){
  const k = kidById(kidId); if(!k) return;
  const e = activePet(k); if(!e) return;
  const cur = (k.petst && k.petst[e]) || {f:now(), p:now(), w:now(), c:0, b:now()};
  const nx = Object.assign({}, cur, patch, {c: Number(cur.c||0) + (careAdd||0)});
  const before = petStage(Number(cur.c||0)), after = petStage(nx.c);
  // เขียนทั้ง map ไม่ใช้ dot-notation เพราะคีย์เป็นอีโมจิ — Firestore ไม่รับ field path แบบนั้น
  const map = Object.assign({}, k.petst || {}); map[e] = nx;
  await updateDoc(dref('kids', kidId), {petst: map, pet: e});
  if(after > before){
    celebrate(2);
    toast(`⚡ ${petBy(e).n} วิวัฒนาการเป็น "${STAGE[after].th}" แล้ว! 🎉`);
  }
}
function petAct(what){
  const k = kidById(view.kidId); if(!k) return;
  const e = activePet(k);
  if(!e){ toast('ยังไม่มีสัตว์เลี้ยงเลย — ทำงานให้ตรงเวลาเพื่อฟักไข่ก่อนนะ'); return; }
  const S3 = petStats(petStOf(k) || (k.petst||{})[e]);
  if(timeBand() === 'night' && what !== 'treat'){ toast('ตอนนี้หลับอยู่ ปลุกไม่ได้นะ 💤'); return; }
  if(what === 'feed'){
    if(S3.hunger >= 75){ toast('อิ่มอยู่แล้ว ยังไม่หิวเลย'); return; }
    sfx('coin'); boom(18,.6); petSave(k.id, {f:now()}, 1);
    toast('อร่อยจัง! 🍖'); return;
  }
  if(what === 'play'){
    if(S3.happy >= 80){ toast('เพิ่งเล่นไป ยังสนุกอยู่เลย'); return; }
    sfx('done'); boom(22,.7); petSave(k.id, {p:now()}, 1);
    toast('สนุกมาก! 🎾'); return;
  }
  if(what === 'wash'){
    if(S3.clean >= 80){ toast('ยังสะอาดอยู่เลย'); return; }
    sfx('coin'); boom(18,.6); petSave(k.id, {w:now()}, 1);
    toast('ตัวหอมแล้ว! 🧼'); return;
  }
  if(what === 'treat'){
    const cost = Number(cfg().treatCost === undefined ? 3 : cfg().treatCost);
    const max  = Number(cfg().treatMax  === undefined ? 2 : cfg().treatMax);
    const used = S.log.filter(l => l.kidId===k.id && l.kind==='treat' && l.ts >= dayStartTs()).length;
    if(max && used >= max){ toast(`วันนี้ให้ขนมครบ ${max} ครั้งแล้ว พรุ่งนี้ค่อยให้ใหม่นะ`); return; }
    if(available(k.id,'daily') < cost){ toast(`ขนมใช้ ${cost} แต้ม — แต้มยังไม่พอ`); return; }
    openConfirm('ให้ขนม 🍰', `ใช้ ${cost} แต้ม แลกขนมพิเศษ — ${petBy(e).n} จะอิ่มเต็มและมีความสุขขึ้นเยอะ`,
      async () => {
        try{
          await addLog(logEntry(k.id, 'treat', `ขนมให้ ${petBy(e).n}`, '🍰', -cost, {pot:'daily'}));
          await petSave(k.id, {f:now(), p:Math.min(now(), Number(((k.petst||{})[e]||{}).p||now()) + PLAY_MS*0.3)}, 2);
          celebrate(1); toast('อร่อยที่สุดเลย! 🍰');
        }catch(err){ fail(err); }
      });
    return;
  }
}
async function petChoose(e){
  const k = kidById(view.kidId); if(!k) return;
  if((k.pets||[]).indexOf(e) < 0) return;
  const has = (k.petst||{})[e];
  try{
    const map = Object.assign({}, k.petst || {});
    if(!has) map[e] = {f:now(), p:now(), w:now(), c:0, b:now()};
    await updateDoc(dref('kids', k.id), {pet:e, petst:map});
    sfx('done'); toast(`มาเลี้ยง ${petBy(e).n} แล้ว!`);
  }catch(err){ fail(err); }
}

/* ---------- 🥚 การ์ดไข่ + คอกสัตว์เลี้ยง ---------- */
function petCard(k){
  const warm = Number(k.eggWarm||0), need = eggNeed(k), pct = eggPct(k);
  const pets = Array.isArray(k.pets) ? k.pets : [];
  const stage = pct >= 75 ? 3 : pct >= 40 ? 2 : 1;
  const say = pct >= 90 ? 'ใกล้แตกแล้ว! ขยับแรงมาก 🎉'
            : pct >= 75 ? 'ไข่สั่นแรงขึ้นเรื่อย ๆ!'
            : pct >= 40 ? 'ได้ยินเสียงข้างในแล้วนะ'
            : pct > 0   ? 'ไข่เริ่มอุ่นแล้ว'
                        : 'ทำงานให้ตรงเวลา แล้วไข่จะค่อย ๆ อุ่นขึ้น';
  return `<div class="petcard">
    <div class="egg w${stage}">🥚</div>
    <div style="flex:1;min-width:0">
      <div class="row-between"><b>ไข่ใบที่ ${pets.length+1}</b>
        <span class="tag tag-cost">${warm}/${need}</span></div>
      <div class="muted" style="font-size:12px">${say}</div>
      <div class="petbar"><i style="width:${pct}%"></i></div>
      ${pets.length ? `<div class="pets">${pets.map(x => {
        const P = petBy(x), R = RARITY[P.r];
        return `<span class="pet r${P.r}" style="--rc:${R.c}" title="${esc(P.n)} ${esc(P.th)} · ${R.k}"
          >${petImg(x, 24)}</span>`; }).join('')}</div>
        <div class="muted" style="font-size:11px;margin-top:4px">เก็บได้ ${pets.length}/${PETS.length} ตัว</div>` : ''}
    </div></div>`;
}
/* ---------- 🎮 หน้าเลี้ยงสัตว์แบบทามาก็อตจิ ---------- */
function petHome(k){
  const e = activePet(k);
  if(!e) return `<div class="card" style="text-align:center;padding:26px">
    <div class="egg w1" style="font-size:56px">🥚</div>
    <b style="display:block;margin-top:10px">ยังไม่มีเพื่อนเลย</b>
    <div class="muted" style="margin-top:6px">ทำงานให้ตรงเวลา ไข่จะค่อย ๆ อุ่นขึ้นแล้วฟักออกมาเอง</div></div>`;
  const P = petBy(e), R = RECIPE[e] || {h:'forest'};
  const st = (k.petst||{})[e], S3 = petStats(st), mood = petMood(S3), stg = petStage(S3.care);
  const night = timeBand() === 'night';
  const bar = (ico, lab, v, col) => `<div class="stat">
    <span class="stat-i">${ico}</span>
    <div style="flex:1"><div class="row-between"><small>${lab}</small><small>${v}%</small></div>
      <div class="sbar"><i style="width:${v}%;background:${v<30?'var(--warn)':v<60?'var(--gold)':col}"></i></div></div></div>`;
  const cost = Number(cfg().treatCost === undefined ? 3 : cfg().treatCost);
  const max  = Number(cfg().treatMax  === undefined ? 2 : cfg().treatMax);
  const used = S.log.filter(l => l.kidId===k.id && l.kind==='treat' && l.ts >= dayStartTs()).length;
  const btn = (id, ico, lab, on, note) => `<button class="care ${on?'':'off'}" ${on?'':'disabled'}
    onclick="petAct('${id}')"><span>${ico}</span><b>${lab}</b>${note?`<small>${note}</small>`:''}</button>`;
  return `<div class="stage">
      ${scene(R.h, mood)}
      <div class="pethere">${petArt(e, stg)
        ? `<img class="petpic s${stg} ${mood==='sleep'?'sleeping':''}" src="${petArt(e, stg)}" alt="${esc(P.n)}">`
        : petSVG(e, mood, stg, mood==='sleep'?'sleeping':'')}</div>
      <div class="bubble ${mood==='sad'?'warn':''}">${esc(petSay(S3, mood))}</div>
    </div>
    <div class="card" style="margin-top:0;border-radius:0 0 18px 18px">
      <div class="row-between" style="margin-bottom:8px">
        <b>${esc(P.n)} <span class="muted" style="font-weight:600">· ${esc(P.th)}</span></b>
        <span class="tag ${stg===2?'tag-plus':'tag-cost'}">${STAGE[stg].th}</span></div>
      ${bar('🍖','อิ่ม',   S3.hunger,'var(--good)')}
      ${bar('😄','สนุก',   S3.happy, 'var(--good)')}
      ${bar('🧼','สะอาด', S3.clean, 'var(--good)')}
      <div class="muted" style="font-size:11px;margin-top:6px">ดูแลไปแล้ว ${S3.care} ครั้ง${
        stg<2?` · อีก ${(stg===0?25:70)-S3.care} ครั้งจะวิวัฒนาการ`:' · ร่างสมบูรณ์แล้ว'}</div>
      <div class="carerow">
        ${btn('feed','🍖','ให้อาหาร', !night && S3.hunger < 75, 'ฟรี')}
        ${btn('play','🎾','เล่นด้วย', !night && S3.happy  < 80, 'ฟรี')}
        ${btn('wash','🧼','อาบน้ำ',  !night && S3.clean  < 80, 'ฟรี')}
        ${btn('treat','🍰','ขนม', (!max || used < max) && available(k.id,'daily') >= cost,
              max ? `${cost} แต้ม · ${max-used}/${max}` : `${cost} แต้ม`)}
      </div>
      ${night ? '<div class="muted" style="margin-top:8px">🌙 กลางคืนเขาหลับ — กลับมาดูแลตอนเช้านะ (ให้ขนมได้อย่างเดียว)</div>' : ''}
    </div>`;
}
/* คอกสัตว์เต็ม ๆ — โชว์ตัวที่ยังไม่ได้เป็นเงาดำ ให้เด็กเห็นว่ายังมีอะไรรออยู่ */
function petZoo(k){
  const owned = Array.isArray(k.pets) ? k.pets : [];
  const rows = [2,1,0].map(r => {
    const list = PETS.filter(x => x.r === r);
    return `<div class="sec-title" style="color:${RARITY[r].c}">${
      r===2?'✨ ตำนาน':r===1?'⭐ หายาก':'ธรรมดา'} — ได้ ${
      list.filter(x=>owned.indexOf(x.e)>=0).length}/${list.length}</div>
      <div class="zoo">${list.map(x => {
        const got = owned.indexOf(x.e) >= 0, live = got && x.e === activePet(k);
        return `<div class="zoocell ${got?'':'locked'} ${live?'live':''}" style="--rc:${RARITY[r].c}"
          ${got?`onclick="petChoose('${x.e}')"`:''}>
          <div class="zoopic">${got ? (petArt(x.e, 2) ? petImg(x.e, 34, 2) : petSVG(x.e,'happy',2))
                                    : '<span style="font-size:30px">❔</span>'}</div>
          <b>${got ? esc(x.n) : '???'}</b>
          <small>${live ? '● กำลังเลี้ยง' : got ? esc(x.th) : ''}</small></div>`; }).join('')}</div>`;
  }).join('');
  return `<div class="card">${rows}</div>`;
}

/* ---------- 🏦 หน้าธนาคารของเด็ก ---------- */
function bankTab(k, myPend){
  if(!bankOn()) return '<div class="empty">ธนาคารปิดอยู่ — ให้คุณพ่อคุณแม่เปิดในหน้าตั้งค่า</div>';
  const ln = activeLoan(k.id), deps = myDeposits(k.id);
  const waitLoan   = myPend.filter(p => p.type==='loan');
  const waitUnlock = myPend.filter(p => p.type==='unlock');
  let out = '';

  if(waitLoan.length) out += `<div class="card" style="background:var(--gold-soft)">
    <div class="sec-title" style="margin:0 0 6px">⏳ รออนุมัติ</div>
    ${waitLoan.map(p => `<div class="log-line" style="border-color:#efe0c4">
      <span style="font-size:19px">💳</span>
      <span style="flex:1">${esc(p.name)}<span class="muted" style="display:block">ต้องคืน ${
        p.total} แต้มใน ${p.days} วัน · ขอเมื่อ ${timeAgo(p.ts)}</span></span>
      <span class="tag tag-wait">+${p.pts}</span></div>`).join('')}</div>`;

  if(ln){
    const o = loanOwed(ln);
    const over = o.late > 0;
    const pctDone = o.total ? Math.round(o.paid / o.total * 100) : 0;
    out += `<div class="card" style="border:2px solid ${
      over?'var(--warn)':o.inGrace?'var(--good)':'var(--gold)'}55">
      <div class="row-between"><b>💳 หนี้ที่ต้องใช้คืน</b>
        <span class="tag ${over?'tag-minus':o.inGrace?'tag-plus':'tag-cost'}">${
          o.inGrace ? `ปลอดดอกอีก ${untilTxt(o.graceEnd).replace('อีก ','')}` : untilTxt(ln.dueTs)}</span></div>
      <div style="font-size:26px;font-weight:800;color:${
        over?'var(--warn)':o.inGrace?'var(--good)':'var(--gold)'};margin:6px 0">
        ${o.left} <span style="font-size:15px;color:var(--muted);font-weight:600">แต้มที่ยังค้าง</span></div>
      <div class="prog"><i style="width:${Math.min(100,pctDone)}%;background:var(--good)"></i></div>
      <div class="muted" style="margin-top:6px">ยืมมา ${ln.amount} · ${o.inGrace
        ? `ตอนนี้คืนครบ <b>${ln.amount}</b> จบเลย ไม่เสียดอก — พ้นช่วงนี้แล้วจะกลายเป็น ${
            ln.amount + Math.ceil(ln.amount*Number(ln.rate)/100)}`
        : `ต้องคืนรวม ${o.total} (ดอก ${o.pctNow}%${over?` — เลยกำหนดแล้วดอกเดินวันละ ${cfg().loanLatePct}%`:''})`
        } · จ่ายไปแล้ว ${o.paid}</div>
      ${ln.cosignId ? `<div class="muted" style="margin-top:4px">🤝 ${esc(ln.cosignName||'')} ค้ำให้อยู่ ${
        over ? '<b style="color:var(--warn)">— เลยกำหนดแล้ว แต้มค้ำกำลังโดนยึด</b>' : '— อย่าให้เลยกำหนดนะ'}</div>` : ''}
      <div class="muted" style="margin-top:4px">🤖 แต้มประจำวันที่ได้ทุกครั้ง จะถูกหักใช้หนี้อัตโนมัติ ${
        cfg().loanRepayPct}%</div>
      <button class="btn-primary btn-full" style="margin-top:10px" onclick="payLoanAll()">
        จ่ายคืนตอนนี้ (มี ${available(k.id,'daily')} แต้ม)</button></div>`;
  }

  out += deps.map(d => {
    const iv = depInterest(d), ok = matured(d);
    const wait = waitUnlock.some(p => p.rid === d.id);
    const passed = Math.min(100, Math.max(0, Math.round((now()-d.openTs)/(d.dueTs-d.openTs)*100)));
    return `<div class="card" style="border:2px solid ${ok?'var(--good)':'var(--line)'}">
      <div class="row-between"><b>🏦 ฝาก${POT_NAME[d.pot]} ${d.amount} แต้ม</b>
        <span class="tag ${ok?'tag-plus':'tag-wait'}">${ok?'ครบกำหนดแล้ว':untilTxt(d.dueTs)}</span></div>
      <div class="muted" style="margin:6px 0">ล็อก ${d.days} วัน · ดอก +${d.pct}% = <b>+${iv} แต้ม</b>
        · ครบแล้วได้คืน ${Number(d.amount)+iv}</div>
      <div class="prog"><i style="width:${passed}%;background:${ok?'var(--good)':'var(--gold)'}"></i></div>
      ${wait ? `<div class="muted" style="margin-top:8px">⏳ ส่งคำขอถอนก่อนกำหนดแล้ว รอคุณพ่อคุณแม่</div>`
        : `<button class="${ok?'btn-gold':''} btn-full" style="margin-top:10px" onclick="withdrawDep('${d.id}')">${
            ok ? `ถอนเลย +${Number(d.amount)+iv}` : 'ขอถอนก่อนกำหนด (ไม่ได้ดอก)'}</button>`}</div>`;
  }).join('');

  // แต้มที่เอาไปค้ำให้พี่น้อง
  out += kidBank(k.id).filter(b => b.kind==='collateral').map(b => `
    <div class="card" style="border:2px solid var(--warn)55">
      <div class="row-between"><b>🔒 แต้มค้ำประกัน</b><span class="tag tag-wait">${b.amount}</span></div>
      <div class="muted" style="margin-top:6px">ล็อกไว้ค้ำหนี้ให้${esc(b.forName||'พี่น้อง')}
        · ใช้ไม่ได้จนกว่าหนี้จะปิด · ถ้าเขาคืนไม่ทันกำหนด แต้มนี้จะโดนยึดไปใช้หนี้</div></div>`).join('');

  out += `<div class="sec-title">💰 ฝากแต้มกินดอก</div>`;
  ['daily','extra'].forEach(pot => {
    let tl = depTiers(pot);
    if(!tl.length) return;
    const okTiers = ln ? tl.filter(t => now() + t.days*DAYMS <= graceEndOf(ln)) : tl;
    const has = depositIn(k.id, pot), have = available(k.id, pot);
    const can = !has && have > 0 && okTiers.length > 0;
    out += `<div class="item"><div class="emo">${pot==='extra'?'💎':'🎈'}</div>
      <div class="txt"><b>${POT_NAME[pot]}</b><span class="muted">${
        tl.map(t => `${t.days} วัน +${t.pct}%`).join(' · ')} · ฝากได้ไม่เกิน ${depCap(pot)}</span></div>
      <button class="${can ? 'btn-primary':''} btn-sm" ${can ? '' : 'disabled'}
        onclick="openDeposit('${pot}')">${
        has ? 'ฝากอยู่แล้ว' : have<=0 ? 'ไม่มีแต้ม' : okTiers.length ? 'ฝาก' : 'ฝากไม่ได้'}</button></div>`;
  });
  if(ln) out += `<div class="muted" style="margin:6px 2px">ตอนมีหนี้ ฝากได้เฉพาะบัญชีที่ครบกำหนด
    <b>ก่อนหมดช่วงปลอดดอก</b> ของหนี้ก้อนนี้ (${untilTxt(loanOwed(ln).graceEnd)})</div>`;

  if(!ln && !waitLoan.length){
    const perWk = Number(cfg().loanPerWeek||0), used = loansThisWeek(k.id);
    const outOf = perWk && used >= perWk;
    const blocked = deps.length > 0 || outOf;
    out += `<div class="sec-title">💳 ยืมแต้มล่วงหน้า</div>
      <div class="card">
        <div class="muted">ยืมได้เฉพาะ 🎈 แต้มประจำวัน ไม่เกิน <b>${cfg().loanCap}</b> แต้ม
          (= เกม/YouTube + ข้าวเย็น + Swensen) · ดอก ${cfg().loanPct}% คืนภายใน ${cfg().loanDays} วัน
          · เลยกำหนดดอกเดินวันละ ${cfg().loanLatePct}% (สูงสุด ${cfg().loanMaxPct}%)${
          perWk ? ` · ยืมได้สัปดาห์ละ ${perWk} ครั้ง (สัปดาห์นี้ใช้ไป ${used})` : ''}</div>
        <button class="${blocked?'':'btn-primary'} btn-full" style="margin-top:10px"
          ${blocked?'disabled':''} onclick="openLoan()">${
          outOf ? 'สัปดาห์นี้ยืมครบแล้ว'
          : deps.length ? 'ถอนเงินฝากให้หมดก่อนถึงจะยืมได้' : 'ขอยืมแต้ม'}</button></div>`;
  }

  /* กติกาบอกครบทุกข้อ แต่ไม่บอกว่าเอาข้อไหนมาต่อกันแล้วได้กำไร — ให้เด็กหาเจอเอง */
  out += `<div class="card" style="background:var(--navy-soft);margin-top:14px">
    <div class="sec-title" style="margin:0 0 6px">📘 กติกาทั้งหมด (อ่านให้ครบ แล้วลองคิดดู)</div>
    <div class="muted">
      1. <b>ฝาก</b> = ล็อกแต้มไว้ ยิ่งล็อกนานยิ่งได้ดอกเยอะ · ถอนก่อนกำหนด <b>ไม่ได้ดอกเลย</b><br>
      2. ฝากได้กระเป๋าละ <b>1 บัญชี</b> · เพดาน 🎈 ${cfg().depCapDaily} · 💎 ${cfg().depCapExtra}<br>
      3. <b>ยืม</b> ได้เฉพาะ 🎈 ไม่เกิน ${cfg().loanCap} · แต้มที่หาได้จะโดนหักใช้หนี้อัตโนมัติ ${cfg().loanRepayPct}%<br>
      4. 🎁 <b>คืนครบภายใน ${cfg().loanGraceDays} วันแรก = ไม่คิดดอกเลย</b> · พ้นจากนั้นคิด ${cfg().loanPct}% เต็มทันที<br>
      5. มีเงินฝากอยู่ <b>ยืมไม่ได้</b> · มีหนี้อยู่ ฝากได้<b>เฉพาะบัญชีที่ครบกำหนดก่อนหมดช่วงปลอดดอก</b><br>
      6. 🤝 ให้พี่น้อง<b>ค้ำ</b>ได้ — เขาโดนล็อกแต้ม ${cfg().cosignPct}% ของยอดยืม แลกกับดอกลดครึ่ง
         · เลยกำหนดเมื่อไหร่ แต้มค้ำโดนยึดจริง<br>
      7. 🎊 ถ้าเงินฝากของ<b>สองพี่น้องครบกำหนดวันเดียวกัน</b> และล็อกกันอย่างน้อย ${cfg().coDepMinDays} วัน
         ได้โบนัสทั้งคู่ +${cfg().coDepBonusPct}% (ไม่เกิน ${cfg().coDepBonusMax} แต้ม)
         · ใครถอนก่อนกำหนด อีกคนอดโบนัสไปด้วย<br>
      8. ยืมได้สัปดาห์ละ ${cfg().loanPerWeek} ครั้ง</div>
    <div class="muted" style="margin-top:8px;font-style:italic">
      💭 กติกาพวกนี้บางข้อเอามาต่อกันได้นะ — ใครคิดออกก่อน ได้แต้มฟรี (นิดหน่อย)</div></div>`;
  return out;
}

/* ---------- 🏦 ธนาคาร: ฝากแต้ม ---------- */
function openDeposit(pot){
  const kid = kidById(view.kidId); if(!kid || !bankOn()) return;
  if(depositIn(kid.id, pot)){ toast(`ตอนนี้มีบัญชีฝาก${POT_NAME[pot]}อยู่แล้ว 1 บัญชี`); return; }
  const ln = activeLoan(kid.id);
  let tl = depTiers(pot);
  // มีหนี้อยู่: ฝากได้เฉพาะบัญชีที่ครบกำหนด "ก่อนหมดช่วงปลอดดอก" ของหนี้ก้อนนั้น
  if(ln) tl = tl.filter(t => now() + t.days*DAYMS <= graceEndOf(ln));
  if(!tl.length){
    toast(ln ? `ตอนมีหนี้ ฝากได้เฉพาะบัญชีที่ครบกำหนดก่อนหมดช่วงปลอดดอก (${untilTxt(graceEndOf(ln))})`
             : 'ยังไม่ได้ตั้งดอกเบี้ยเงินฝาก');
    return;
  }
  const have = available(kid.id, pot), cap = depCap(pot);
  const most = cap ? Math.min(have, cap) : have;
  if(most <= 0){ toast(`${POT_NAME[pot]}ยังไม่พอฝาก`); return; }
  openForm({title:`🏦 ฝาก${POT_NAME[pot]}`,
    fields:[
      {key:'days', label:'ล็อกไว้กี่วัน (ยิ่งนาน ดอกยิ่งเยอะ)', type:'pick',
       opts: tl.map(t => ({v:t.days, t:`${t.days} วัน · +${t.pct}%`})), value: tl[0].days},
      {key:'amt', label:`ฝากกี่แต้ม (มี ${have}${cap?` · ฝากได้ไม่เกิน ${cap}`:''})`,
       type:'number', value: Math.min(most, 100)}],
    async onSave(v){
      const days = parseInt(v.days,10);
      const t = tl.find(x => x.days === days);
      if(!t) return 'เลือกจำนวนวันก่อนนะ';
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      if(n > have) return `${POT_NAME[pot]}มีแค่ ${have} แต้ม`;
      if(cap && n > cap) return `ฝากได้ครั้งละไม่เกิน ${cap} แต้ม (กันแต้มเฟ้อ)`;
      setTimeout(() => doDeposit(kid, pot, n, t), 0);
    }});
}
function doDeposit(kid, pot, n, t){
  const iv = Math.floor(n * t.pct / 100);
  askKidPin(kid, () => openConfirm('ฝากแต้ม',
    `ฝาก ${n} แต้ม ล็อก ${t.days} วัน — ครบกำหนดได้คืน ${n + iv} แต้ม (ดอก +${iv}) · ถอนก่อนกำหนดจะไม่ได้ดอกเลยนะ`,
    async () => {
      try{
        const rec = {id:uid(), kind:'deposit', pot, amount:Number(n), pct:Number(t.pct),
                     days:Number(t.days), openTs:now(), dueTs: now() + t.days*DAYMS};
        await bankCommit(kid.id,
          logEntry(kid.id,'deposit',`ฝาก ${t.days} วัน (+${t.pct}%)`,'🏦',-Number(n),{pot, iv:0}),
          bankOf(kid).concat([rec]));
        showFlash({emo:'🏦', title:'ฝากแต้มแล้ว', big:`${n} แต้ม`, color:'var(--gold)',
          sub:`ครบกำหนดใน ${t.days} วัน จะได้คืน ${n+iv} แต้ม`, toast:'ฝากแล้ว'});
      }catch(e){ fail(e); }
    }), `${kid.name} ใส่ PIN เพื่อยืนยันการฝาก ${n} แต้ม`);
}
/* ถอน: ครบกำหนดแล้วกดเองได้เลย · ยังไม่ครบต้องขอพ่อแม่ และไม่ได้ดอก */
function withdrawDep(recId){
  const kid = kidById(view.kidId); if(!kid) return;
  const rec = bankOf(kid).find(x => x.id === recId); if(!rec) return;
  if(!matured(rec)){ askEarly(recId); return; }
  const base = depInterest(rec);
  const mate = coDepPartner(kid.id, rec);
  const bonus = mate ? coDepBonus(rec) : 0;
  const iv = base + bonus, tot = Number(rec.amount) + iv;
  openConfirm('ถอนเงินฝาก',
    `ครบกำหนดแล้ว — ได้คืน ${rec.amount} + ดอก ${base}` +
    (bonus ? ` + โบนัสครบกำหนดพร้อม${mate.name} ${bonus}` : '') + ` = ${tot} แต้ม`,
    async () => {
      try{
        await bankCommit(kid.id,
          logEntry(kid.id,'withdraw',
            `ถอนเงินฝาก (ต้น ${rec.amount} + ดอก ${base}${bonus?` + โบนัสคู่ ${bonus}`:''})`,
            '🏦', tot, {pot:rec.pot, iv, dueDay: dstr(rec.dueTs)}),
          bankOf(kid).filter(x => x.id !== recId));
        showFlash({emo: bonus?'🎊':'🏦', title:'ถอนเงินฝากแล้ว', big:`+${tot} แต้ม`, color:'var(--good)',
          sub: bonus ? `ได้โบนัสครบกำหนดพร้อม${mate.name} +${bonus} แต้ม!`
                     : `เป็นดอกเบี้ย ${base} แต้ม — อดทนรอคุ้มไหม?`, toast:`ได้คืน ${tot} แต้ม`});
      }catch(e){ fail(e); }
    });
}
function askEarly(recId){
  const kid = kidById(view.kidId); if(!kid) return;
  const rec = bankOf(kid).find(x => x.id === recId); if(!rec) return;
  if(S.pending.some(p => p.type==='unlock' && p.rid===recId)){ toast('ส่งคำขอไปแล้ว รออนุมัติอยู่'); return; }
  askKidPin(kid, () => openConfirm('ขอถอนก่อนกำหนด',
    `จะได้คืนแค่เงินต้น ${rec.amount} แต้ม ไม่ได้ดอกเบี้ยเลย (${untilTxt(rec.dueTs)}ถึงจะครบ) — ต้องรอคุณพ่อคุณแม่อนุมัติ`,
    async () => {
      try{
        const p = {id:uid(), ts:now(), kidId:kid.id, type:'unlock', name:'ขอถอนเงินฝากก่อนกำหนด',
                   emo:'🏦', pts:Number(rec.amount), total:Number(rec.amount), pot:rec.pot,
                   rid:recId, partnerId:'', partnerName:''};
        await setDoc(dref('pending', p.id), p);
        showFlash({emo:'🏦', title:'ส่งคำขอถอนแล้ว', big:`${rec.amount} แต้ม`, color:'var(--gold)',
          sub:'รอคุณพ่อคุณแม่อนุมัติ · ถอนก่อนกำหนดไม่ได้ดอก', toast:'ส่งคำขอแล้ว'});
      }catch(e){ fail(e); }
    }), `${kid.name} ใส่ PIN เพื่อยืนยันว่าจะถอนก่อนกำหนด`);
}
/* ---------- 🏦 ธนาคาร: ยืมแต้ม (เฉพาะ 🎈 แต้มประจำวัน) ---------- */
function openLoan(){
  const kid = kidById(view.kidId); if(!kid || !bankOn()) return;
  if(activeLoan(kid.id)){ toast('ยังมีหนี้ค้างอยู่ ต้องปิดหนี้ก่อนถึงจะยืมใหม่ได้'); return; }
  if(myDeposits(kid.id).length){ toast('มีเงินฝากล็อกอยู่ — ถอนก่อนถึงจะยืมได้ (กันฝากกินดอกแล้วยืมมาใช้)'); return; }
  if(S.pending.some(p => p.type==='loan' && p.kidId===kid.id)){ toast('ส่งคำขอยืมไปแล้ว รออนุมัติอยู่'); return; }
  const perWk = Number(cfg().loanPerWeek||0);
  if(perWk && loansThisWeek(kid.id) >= perWk){
    toast(`สัปดาห์นี้ยืมครบ ${perWk} ครั้งแล้ว — สัปดาห์หน้าค่อยยืมใหม่นะ`); return; }
  const cap = Number(cfg().loanCap||0), pct = Number(cfg().loanPct||0), dys = Number(cfg().loanDays||7);
  if(cap <= 0){ toast('พ่อแม่ยังไม่ได้เปิดเพดานการยืม'); return; }
  openForm({title:'💳 ขอยืมแต้มประจำวัน',
    fields:[{key:'amt', label:`ยืมกี่แต้ม (ไม่เกิน ${cap})`, type:'number', value: Math.min(cap, 70)}],
    async onSave(v){
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      if(n > cap) return `ยืมได้ไม่เกิน ${cap} แต้ม`;
      setTimeout(() => pickCosign(kid, n, pct, dys), 0);
    }});
}
/* เลือกผู้ค้ำก่อน — มีคนค้ำแล้วดอกลดครึ่ง แต่คนค้ำโดนล็อกแต้มไว้จริง */
function pickCosign(kid, n, pct, dys){
  const need = Math.ceil(n * Number(cfg().cosignPct||0) / 100);
  const able = cfg().cosignOn === false ? []
    : S.kids.filter(o => o.id !== kid.id && available(o.id,'daily') >= need && need > 0);
  if(!able.length){ doLoan(kid, n, pct, dys, null); return; }
  modal = {kind:'cosign', kid, n, pct, dys, need, able}; renderModal();
}
function cosignWith(partnerId, alone){
  const m = modal; if(!m) return;
  modal = null; renderModal();
  if(alone){ doLoan(m.kid, m.n, m.pct, m.dys, null); return; }
  const partner = kidById(partnerId); if(!partner) return;
  const disc = Number(cfg().cosignDiscount||0);
  const newPct = Math.ceil(m.pct * (100 - disc) / 100);
  // คนค้ำต้องใส่ PIN ของตัวเองก่อน — ยินยอมให้ล็อกแต้มจริง
  askKidPin(partner, () => doLoan(m.kid, m.n, newPct, m.dys, {id:partner.id, name:partner.name, hold:m.need}),
    `${partner.name} ใส่ PIN เพื่อยอมให้ล็อกแต้ม ${m.need} แต้มไว้ค้ำ — ถ้า${m.kid.name}คืนไม่ทัน แต้มนี้จะโดนยึด`);
}
function doLoan(kid, n, pct, dys, cs){
  const total = n + Math.ceil(n * pct / 100);
  const rp = Number(cfg().loanRepayPct||50), gr = Number(cfg().loanGraceDays||0);
  askKidPin(kid, () => openConfirm('ขอยืมแต้ม',
    `ยืม ${n} แต้ม → ต้องใช้คืน ${total} แต้ม (ดอก ${total-n}) ภายใน ${dys} วัน` +
    (gr ? ` · คืนครบภายใน ${gr} วันแรก ไม่คิดดอกเลย` : '') +
    (cs ? ` · ${cs.name}ค้ำให้ ${cs.hold} แต้ม ดอกเลยลดเหลือ ${pct}%` : '') +
    ` · แต้มที่ได้ทุกครั้งจะถูกหักใช้หนี้อัตโนมัติ ${rp}% · รอคุณพ่อคุณแม่อนุมัติก่อนนะ`,
    async () => {
      try{
        const p = {id:uid(), ts:now(), kidId:kid.id, type:'loan',
                   name:`ขอยืม ${n} แต้ม${cs?` (${cs.name}ค้ำ)`:''}`, emo:'💳',
                   pts:Number(n), total:Number(total), pot:'daily', rid:'',
                   rate:Number(pct), days:Number(dys), grace:gr,
                   partnerId: cs ? cs.id : '', partnerName: cs ? cs.name : '',
                   hold: cs ? Number(cs.hold) : 0};
        await setDoc(dref('pending', p.id), p);
        showFlash({emo:'💳', title:'ส่งคำขอยืมแล้ว', big:`${n} แต้ม`, color:'var(--gold)',
          sub:`ต้องคืน ${total} แต้มใน ${dys} วัน · รอคุณพ่อคุณแม่อนุมัติ`, toast:'ส่งคำขอแล้ว'});
      }catch(e){ fail(e); }
    }), `${kid.name} ใส่ PIN เพื่อยืนยันว่าเข้าใจว่าต้องใช้คืน ${total} แต้ม`);
}
/* หักใช้หนี้อัตโนมัติทุกครั้งที่ได้แต้มประจำวันเข้ามา */
async function autoRepay(kidId, credited){
  const kid = kidById(kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan');
  if(i < 0) return;
  const o = loanOwed(arr[i]);
  const rp = Number(cfg().loanRepayPct||0)/100;
  if(rp <= 0) return;
  const pay = Math.min(Math.max(1, Math.ceil(credited * rp)), o.left, Math.max(0, balance(kidId,'daily')));
  if(pay <= 0) return;
  const na = arr.slice(), np = o.paid + pay;
  const done = np >= o.total;
  if(done) na.splice(i,1); else na[i] = Object.assign({}, arr[i], {paid:np});
  try{
    await bankCommit(kidId,
      logEntry(kidId,'repay', done ? 'ใช้หนี้งวดสุดท้าย — ปิดหนี้แล้ว 🎉'
               : (o.inGrace ? 'หักใช้หนี้อัตโนมัติ (ยังอยู่ในช่วงปลอดดอก)' : 'หักใช้หนี้อัตโนมัติ'),
               '💳', -pay, {pot:'daily'}), na);
    if(done){ await releaseCollateral(arr[i]); toast('ปิดหนี้ครบแล้ว 🎉'); }
    else if(o.late > 0) await seizeCollateral(kidId);
  }catch(e){ fail(e); }
}
/* ปิดหนี้แล้ว → ปลดล็อกแต้มของคนค้ำ */
async function releaseCollateral(ln){
  if(!ln || !ln.cosignId) return;
  const cs = kidById(ln.cosignId); if(!cs) return;
  const rest = bankOf(cs).filter(x => !(x.kind==='collateral' && x.loanId === ln.id));
  if(rest.length === bankOf(cs).length) return;
  await bankCommit(cs.id, null, rest);
  toast(`ปลดล็อกแต้มค้ำประกันของ${cs.name}แล้ว`);
}
/* เลยกำหนดแล้วยังค้าง → ยึดหลักประกันมาปิดหนี้ (บทเรียนเรื่องความเสี่ยงของการค้ำ) */
async function seizeCollateral(kidId){
  const kid = kidById(kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan'); if(i < 0) return;
  const ln = arr[i], o = loanOwed(ln);
  if(o.late <= 0 || o.left <= 0 || !ln.cosignId) return;
  const cs = kidById(ln.cosignId); if(!cs) return;
  const hold = bankOf(cs).find(x => x.kind==='collateral' && x.loanId === ln.id);
  if(!hold) return;
  const take = Math.min(Number(hold.amount), o.left, Math.max(0, balance(cs.id,'daily')));
  if(take <= 0) return;
  // หักจากคนค้ำจริง ๆ แล้วเอาไปลงเป็นยอดชำระของลูกหนี้
  const csRest = bankOf(cs).filter(x => x !== hold)
    .concat(take < Number(hold.amount) ? [Object.assign({}, hold, {amount:Number(hold.amount)-take})] : []);
  await bankCommit(cs.id,
    logEntry(cs.id,'repay',`โดนยึดหลักประกัน (ค้ำ${kid.name}ไว้)`,'⚠️',-take,{pot:'daily'}), csRest);
  const np = o.paid + take, done = np >= o.total;
  const na = arr.slice();
  if(done) na.splice(i,1); else na[i] = Object.assign({}, ln, {paid:np});
  await bankCommit(kidId, null, na);
  toast(`เลยกำหนด — ยึดหลักประกันของ${cs.name} ${take} แต้มมาปิดหนี้`);
}
function payLoanAll(){
  const kid = kidById(view.kidId); if(!kid) return;
  const arr = bankOf(kid), i = arr.findIndex(x => x.kind === 'loan'); if(i < 0) return;
  const o = loanOwed(arr[i]);
  const have = available(kid.id,'daily');
  const pay = Math.min(o.left, have);
  if(pay <= 0){ toast('แต้มประจำวันยังไม่พอจ่ายคืน'); return; }
  const done = o.paid + pay >= o.total;
  openConfirm(done ? 'ปิดหนี้ทั้งหมด' : 'จ่ายคืนบางส่วน',
    done ? `จ่าย ${pay} แต้ม แล้วหนี้จะหมดเลย` : `จ่าย ${pay} แต้ม · จะเหลือหนี้อีก ${o.left - pay} แต้ม`,
    async () => {
      try{
        const na = arr.slice();
        if(done) na.splice(i,1); else na[i] = Object.assign({}, arr[i], {paid:o.paid + pay});
        await bankCommit(kid.id,
          logEntry(kid.id,'repay', done ? 'ปิดหนี้เอง 🎉' : 'จ่ายคืนเอง', '💳', -pay, {pot:'daily'}), na);
        if(done) await releaseCollateral(arr[i]);
        toast(done ? 'ปิดหนี้แล้ว 🎉' : `จ่ายคืน ${pay} แต้มแล้ว`);
      }catch(e){ fail(e); }
    });
}

/* ---------- สถิติ ---------- */
function choreStats(kidId, chore, days){
  const res = {ontime:0, late:0, toolate:0, miss:0, na:0, sumLate:0, sumMin:0, n:0, applicable:0, boxes:[]};
  for(let i=days-1;i>=0;i--){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    if(!appliesOn(chore, d.getTime())){ res.na++; res.boxes.push({d, st:'na', e:null}); continue; }
    res.applicable++;
    const ds = dstr(d.getTime());
    const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===chore.name && dstr(l.ts)===ds);
    let st = 'miss';
    if(e){
      st = e.status || 'ontime';
      res.n++; res.sumLate += Number(e.lateMin||0);
      const t = new Date(e.ts); res.sumMin += t.getHours()*60 + t.getMinutes();
    }
    res[st]++; res.boxes.push({d, st, e});
  }
  return res;
}
function parentSummary(){
  const timed = S.chores.filter(c => c.due).sort((a,b)=> a.due<b.due?-1:1);
  if(!timed.length) return '<div class="empty">ยังไม่มีงานที่กำหนดเวลา</div>';
  const COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)', miss:'var(--warn-soft)', na:'var(--line)'};
  return S.kids.map(k => {
    const rows = timed.map(c => {
      const s = choreStats(k.id, c, 7);
      const avg = s.n ? pad2(Math.floor((s.sumMin/s.n)/60))+':'+pad2(Math.round((s.sumMin/s.n)%60)) : '—';
      const avgLate = s.n ? Math.round(s.sumLate/s.n) : 0;
      const boxes = s.boxes.map(b => `<div class="daybox">
        <b style="background:${COL[b.st]};color:${b.st==='miss'||b.st==='na'?'var(--muted)':'#fff'}">${b.e?fmtClock(b.e.ts):(b.st==='na'?'':'–')}</b>
        ${DAY_TH[b.d.getDay()]}</div>`).join('');
      return `<div style="margin-bottom:14px">
        <div class="row-between"><b style="font-size:14px">${c.emo} ${esc(c.name)}</b>
          <span class="muted">ก่อน ${c.due}</span></div>
        <div class="muted">ตรงเวลา ${s.ontime}/${s.applicable} วัน · ทำจริงเฉลี่ย ${avg}${avgLate>0?` (สายเฉลี่ย ${avgLate} นาที)`:''}</div>
        <div class="dayrow">${boxes}</div></div>`;
    }).join('');
    const st = onTimeStreak(k.id), pr = routineProgress(k.id);
    return `<div class="card">
      <div class="row" style="margin-bottom:14px">${avatar(k,46)}
        <div style="flex:1"><b>${esc(k.name)}</b>
          <div class="muted">วันนี้ ${pr.done}/${pr.total} · ${st>0?`🔥 ตรงเวลาครบ ${st} วันติด`:'ยังไม่มีวันที่ตรงเวลาครบ'}</div></div></div>
      ${rows}
      <div class="muted" style="border-top:1px solid var(--line);padding-top:10px">
        เขียว = ตรงเวลา · เหลือง = สายนิดหน่อย · แดง = สายเกินไป · ชมพู = ไม่ได้ทำ · เทา = ไม่มีในวันนั้น</div></div>`;
  }).join('') || '<div class="empty">ยังไม่มีเด็ก</div>';
}

/* ---------- หน้าผู้ปกครอง ---------- */
function viewParent(){
  const n = S.pending.length;
  const tabs = [['review','ตรวจ'+(n?' ('+n+')':'')],['summary','สรุปเวลา'],['points','ให้/หักแต้ม'],['manage','ตั้งค่า'],['log','ประวัติ']];
  const tabBtns = tabs.map(([id,l]) => `<button class="${view.tab===id?'on':''}" onclick="setTab('${id}')">${l}</button>`).join('');
  const body = view.tab==='review' ? parentReview()
             : view.tab==='summary' ? parentSummary()
             : view.tab==='points' ? parentPoints()
             : view.tab==='manage' ? parentManage() : parentLog();
  return `
    <div class="topbar"><button class="btn-ghost" onclick="go('pick')">← ออก</button>
      <div style="flex:1"></div>
      <span class="badge clock">🕐 ${fmtClock(now())}</span>
      <span class="badge">ผู้ปกครอง</span></div>
    <div class="tabs">${tabBtns}</div>${body}`;
}

async function approve(pid, override){
  const p = S.pending.find(x => x.id===pid); if(!p) return;
  try{
    await deleteDoc(dref('pending', pid));
    if(p.type === 'chore'){
      const pts = override !== undefined && override !== null ? Number(override) : Number(p.pts);
      const ch = S.chores.find(x => x.name === p.name);      // เผื่อคิวเก่าที่ยังไม่มี pot
      const cpot = p.pot || (ch && !ch.routine ? 'extra' : 'daily');
      await addLog(Object.assign(logEntry(p.kidId,'chore',p.name,p.emo,pts,
        {pot:cpot, due:p.due||'', status:p.status||'', lateMin:p.lateMin||0}), {ts:p.ts}));
      toast('ให้ ' + pts + ' แต้มแล้ว');
      await checkPerfectDay(p.kidId);
    }else if(p.type === 'join'){           // ขอร่วมทีหลัง — หักคนขอครึ่งหนึ่ง แล้วคืนส่วนต่างให้คนที่จ่ายไปก่อน
      const jpot = p.pot || 'daily';
      const first = kidById(p.partnerId);
      const me = kidById(p.kidId) || {};
      await addLog(logEntry(p.kidId,'reward', p.name + ' (หารกัน)', p.emo,
                            -Number(p.pts), {pot:jpot, rid:p.rid||''}));
      if(first && Number(p.refund) > 0)
        // ใช้ bankCommit แทน addLog เพื่อไม่ให้เงินคืนโดนหักใช้หนี้อัตโนมัติ — มันคือเงินที่จ่ายเกินไป ไม่ใช่รายได้ใหม่
        await bankCommit(first.id, logEntry(first.id,'refund',
          `คืนส่วนต่าง ${p.name} (${me.name||''} มาร่วมหาร)`, '↩️',
          Number(p.refund), {pot:jpot, rid:p.rid||''}), null);
      toast(`อนุมัติแล้ว — หัก ${p.pts} จาก${me.name||''} · คืน ${p.refund} ให้${(first||{}).name||''}`);
    }else if(p.type === 'loan'){           // อนุมัติเงินกู้ — จ่ายต้นเข้ากระเป๋า แล้วเปิดบัญชีหนี้
      const kid = kidById(p.kidId);
      if(kid && !activeLoan(kid.id)){
        const cs = p.partnerId ? kidById(p.partnerId) : null;
        const rec = {id:uid(), kind:'loan', pot:'daily', amount:Number(p.pts),
                     rate:Number(p.rate || cfg().loanPct || 0), paid:0,
                     grace:Number(p.grace !== undefined ? p.grace : (cfg().loanGraceDays||0)),
                     cosignId: cs ? cs.id : '', cosignName: cs ? cs.name : '',
                     openTs:now(), dueTs: now() + Number(p.days || cfg().loanDays || 7)*DAYMS};
        // ใช้ bankCommit (ไม่ใช่ addLog) เพราะไม่งั้นเงินที่เพิ่งยืมจะโดนหักใช้หนี้ทันที
        await bankCommit(p.kidId, logEntry(p.kidId,'loan',`ยืมแต้ม (ต้องคืน ${p.total})`,'💳',
                         Number(p.pts),{pot:'daily'}), bankOf(kid).concat([rec]));
        if(cs && Number(p.hold) > 0)     // ล็อกแต้มของคนค้ำไว้ (ยังอยู่ในกระเป๋า แต่ใช้ไม่ได้)
          await bankCommit(cs.id, null, bankOf(cs).concat([{id:uid(), kind:'collateral',
            pot:'daily', amount:Number(p.hold), loanId:rec.id,
            forId:p.kidId, forName:(kid.name||''), openTs:now()}]));
        toast(`ให้ยืม ${p.pts} แต้มแล้ว — ต้องคืน ${p.total}${cs?` · ล็อกแต้มค้ำของ${cs.name} ${p.hold}`:''}`);
      }else toast('ยังมีหนี้เดิมค้างอยู่ ยืมใหม่ไม่ได้');
    }else if(p.type === 'unlock'){         // ถอนเงินฝากก่อนกำหนด — คืนเงินต้น ไม่มีดอก
      const kid = kidById(p.kidId);
      const rec = bankOf(kid).find(x => x.id === p.rid);
      if(rec){
        await bankCommit(p.kidId,
          logEntry(p.kidId,'withdraw','ถอนก่อนกำหนด (ไม่ได้ดอก)','🏦',Number(rec.amount),{pot:rec.pot, iv:0}),
          bankOf(kid).filter(x => x.id !== p.rid));
        toast(`คืนเงินต้น ${rec.amount} แต้มแล้ว`);
      }else toast('ไม่พบบัญชีเงินฝากนี้แล้ว');
    }else if(p.type === 'transfer'){       // แบ่งแต้มให้พี่น้อง — หักคนให้ เพิ่มคนรับ กระเป๋าเดียวกัน
      const tpot = p.pot || 'daily';
      const giver = kidById(p.kidId), taker = kidById(p.partnerId);
      const gName = (giver||{}).name || '', tName = p.partnerName || (taker||{}).name || '';
      const tid = p.id;                    // ผูกสองฝั่งเข้าคู่กัน เผื่อพ่อแม่กดย้อนกลับทีหลัง
      await addLog(logEntry(p.kidId,'transfer','แบ่งแต้มให้'+tName,'🤝',-Number(p.pts),{pot:tpot, rid:tid}));
      if(taker) await addLog(logEntry(taker.id,'transfer','ได้แต้มจาก'+gName,'🎁',Number(p.pts),{pot:tpot, rid:tid}));
      toast(`ย้าย ${p.pts} แต้มให้${tName}แล้ว`);
    }else{
      const rpot = p.pot || 'daily';
      await addLog(logEntry(p.kidId,'reward',p.name,p.emo,-Number(p.pts),{pot:rpot, rid:p.rid||''}));
      if(p.partnerId && kidById(p.partnerId)){        // หารกัน — หักอีกฝ่ายด้วย
        await addLog(logEntry(p.partnerId,'reward',p.name + ' (หารกัน)',p.emo,-Number(p.pts),
                              {pot:rpot, rid:p.rid||'', inv:true}));   // inv = ถูกชวนมาหาร
        toast(`อนุมัติแล้ว หักคนละ ${p.pts} แต้ม`);
      }else toast('อนุมัติแล้ว หัก ' + p.pts + ' แต้ม');
    }
  }catch(e){ fail(e); }
}
function reject(pid){
  const p = S.pending.find(x => x.id===pid); if(!p) return;
  openConfirm('ไม่ผ่าน', `"${p.name}" จะถูกตีกลับ ไม่ได้/ไม่เสียแต้ม`, async () => {
    try{ await deleteDoc(dref('pending', pid)); toast('ตีกลับแล้ว'); }catch(e){ fail(e); }
  });
}

async function giveAll(cid){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  const left = S.kids.filter(k => !doneToday(k.id, c.name));
  if(!left.length){ toast('ให้ครบทุกคนแล้ววันนี้'); return; }
  openConfirm(c.emo + ' ' + c.name, `ให้ ${left.map(k=>k.name).join(' และ ')} คนละ ${c.pts} แต้ม`, async () => {
    try{
      for(const k of left) await addLog(logEntry(k.id,'chore',c.name,c.emo,Number(c.pts),
        {pot: c.routine ? 'daily' : 'extra'}));
      toast(`ให้แต้มแล้ว ${left.length} คน 🎉`);
    }catch(e){ fail(e); }
  });

/* mode: 'ontime' | 'late' | 'miss' — พ่อแม่เป็นคนตัดสินจากสิ่งที่เกิดขึ้นจริง ไม่ใช่เวลาที่กด */
async function markParent(kidId, cid, mode){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(doneToday(kidId, c.name)){ toast('บันทึกไปแล้ววันนี้'); return; }
  if(mode === true) mode = 'ontime';
  if(mode === false) mode = 'late';
  const full = Number(c.pts);
  const pts = mode === 'ontime' ? full
            : mode === 'late'   ? Math.max(0, Math.round(full*Number(c.latePct||50)/100)) : 0;
  const status = mode === 'ontime' ? 'ontime' : mode === 'late' ? 'late' : 'toolate';
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo,pts,
      {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status,
       lateMin: mode === 'ontime' ? 0 : Number(c.grace||10)}));
    toast(pts > 0 ? `บันทึกแล้ว +${pts} แต้ม` : 'บันทึกแล้ว ไม่ได้แต้มรอบนี้');
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}
async function giveChore(kidId, cid){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(c.once && doneToday(kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  const t = evalTiming(c);
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo, c.due ? t.pts : Number(c.pts),
      {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status:t.status, lateMin:t.lateMin}));
    toast('บันทึกแล้ว');
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}
function applyPenalty(kidId, pid){
  const p = S.penalties.find(x => x.id===pid); if(!p) return;
  openConfirm('หักแต้ม', `${p.emo} ${p.name} — หัก ${p.pts} แต้ม`, async () => {
    try{ await addLog(logEntry(kidId,'penalty',p.name,p.emo,-Number(p.pts),{pot:'daily'}));
         toast('หัก '+p.pts+' แต้มประจำวันแล้ว'); }
    catch(e){ fail(e); }
  });
}
function openAdjust(kidId, dir){
  openForm({title: dir>0?'ให้แต้มเพิ่มเอง':'หักแต้มเอง',
    fields:[{key:'pot', label:'ใส่เข้ากระเป๋าไหน', type:'switch', value:true,
             onText:'🎈 แต้มประจำวัน', offText:'💎 แต้มพิเศษ'},
            {key:'pts', label:'กี่แต้ม', type:'number', value:10},
            {key:'why', label:'เหตุผล', type:'text', value: dir>0?'ทำดีพิเศษ':'ปรับพฤติกรรม'}],
    async onSave(v){
      const n = parseInt(v.pts,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      const pot = v.pot ? 'daily' : 'extra';
      try{ await addLog(logEntry(kidId,'adjust', v.why || (dir>0?'ให้แต้มเพิ่ม':'หักแต้ม'),
             dir>0?'🌟':'⚠️', dir*n, {pot}));
           toast('บันทึกแล้ว'); }catch(e){ fail(e); }
    }});
}
function undoLog(id){
  const l = S.log.find(x => x.id===id); if(!l) return;
  // รายการธนาคารผูกกับบัญชีเงินฝาก/หนี้ ย้อนกลับเดี่ยว ๆ จะทำให้ตัวเลขไม่ตรง
  if(['deposit','withdraw','loan','repay'].indexOf(l.kind) >= 0){
    toast('รายการธนาคารย้อนกลับตรงนี้ไม่ได้ — ให้จัดการที่บัญชีในหน้าธนาคารแทน'); return;
  }
  // การแบ่งแต้มมี 2 ฝั่งเสมอ — ย้อนกลับต้องลบทั้งคู่ ไม่งั้นแต้มรวมในบ้านจะเพี้ยน
  const pair = (l.kind==='transfer' && l.rid)
    ? S.log.filter(x => x.kind==='transfer' && x.rid===l.rid) : [l];
  const msg = pair.length > 1
    ? `ยกเลิกการแบ่ง ${Math.abs(Number(l.delta))} แต้ม — แต้มจะกลับไปอยู่กับเจ้าของเดิม`
    : `"${l.name}" (${l.delta>=0?'+':''}${l.delta} แต้ม) จะถูกลบ แต้มคืนตามเดิม`;
  openConfirm('ย้อนกลับรายการนี้', msg,
    async () => { try{ for(const e of pair) await removeLog(e); toast('ย้อนกลับแล้ว'); }catch(e){ fail(e); } });
}

  if(!S.log.length) return '<div class="empty">ยังไม่มีประวัติ</div>';

function editBankTier(key){
  const pot = key === 'depExtra' ? '💎 แต้มพิเศษ' : '🎈 แต้มประจำวัน';
  openForm({title:`ตารางดอกฝาก ${pot}`,
    fields:[{key:'t', label:'รูปแบบ วัน:% คั่นด้วย , เช่น 3:2,7:5,14:10', type:'text', value:cfg()[key]||''}],
    async onSave(v){
      const raw = String(v.t||'').trim();
      const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
      if(!parts.length) return 'ใส่อย่างน้อย 1 ขั้น';
      for(const s of parts){
        const a = s.split(':');
        if(a.length !== 2 || !(parseInt(a[0],10) > 0) || isNaN(parseFloat(a[1])) || parseFloat(a[1]) < 0)
          return `รูปแบบผิดตรง "${s}" — ต้องเป็น วัน:% เช่น 7:5`;
        if(parseInt(a[0],10) > 90) return 'ล็อกได้ไม่เกิน 90 วัน';
        if(parseFloat(a[1]) > 50) return 'ดอกต่อขั้นไม่ควรเกิน 50% — แต้มจะเฟ้อหนัก';
      }
      // ล็อกนานขึ้นต้องคุ้มขึ้น "ต่อวัน" ไม่งั้นเด็กฝากสั้นวนไปเรื่อย ๆ แล้วได้ดอกมากกว่า
      const tl = parts.map(s => { const a = s.split(':'); return {d:parseInt(a[0],10), p:parseFloat(a[1])}; })
                      .sort((x,y) => x.d - y.d);
      for(let i=1;i<tl.length;i++)
        if(tl[i].p/tl[i].d <= tl[i-1].p/tl[i-1].d)
          return `ขั้น ${tl[i].d} วัน ให้ดอกต่อวันไม่มากกว่าขั้น ${tl[i-1].d} วัน — ฝากนานขึ้นต้องคุ้มขึ้น`;
      // กันแต้มเฟ้อ + กันช่องโหว่: ดอกฝากสูงสุด/สัปดาห์ ต้องต่ำกว่าดอกยืม/สัปดาห์
      const cap  = Number(cfg()[key==='depExtra'?'depCapExtra':'depCapDaily'] || 0);
      const best = Math.max.apply(null, tl.map(t => Math.floor(cap*t.p/100)/t.d*7));
      const loanWk = Number(cfg().loanCap||0)*Number(cfg().loanPct||0)/100/Number(cfg().loanDays||7)*7;
      if(loanWk > 0 && best >= loanWk)
        return `ดอกฝากสูงสุด ~${Math.round(best)} แต้ม/สัปดาห์ สูงกว่าดอกยืม ~${Math.round(loanWk)} — เด็กจะฝากแล้วยืมมาใช้ ได้แต้มฟรี`;
      await setOpt(key, parts.join(','));
    }});
}

/* ---------- 🐾 แนบรูปสัตว์เอง (3 ร่างต่อ 1 ตัว) ----------
   ย่อเหลือ 160px · PNG พื้นโปร่งถ้าไม่เกิน ~19KB ไม่งั้นตกไปเป็น JPEG พื้นขาว · เต็มที่ 21 ตัว × 3 ร่าง = 63 รูป
   แยกเก็บ 3 เอกสารตามระดับหายาก เอกสารละ ~300–430KB ยังห่างเพดาน 1MB ต่อเอกสารของ Firestore */
const ART_PX = 160, ART_Q = 0.72, ART_MAX = 800000, ART_PNG_MAX = 26000;
function openPetArt(){ modal = {kind:'petart', r:0}; renderModal(); }
function petArtTier(r){ modal = {kind:'petart', r:Number(r)}; renderModal(); }
/* ย่อเป็นสี่เหลี่ยมจัตุรัส ตัดขอบจากกลางภาพ
   เก็บเป็น PNG ก่อน เพราะพื้นโปร่งใสจะวางทับฉากได้สวย — ถ้าไฟล์ใหญ่เกินค่อยอัดเป็น JPEG (พื้นขาว) */
function shrinkImg(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('เปิดรูปไม่ได้'));
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = ART_PX;
        const ctx = cv.getContext('2d'), sz = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-sz)/2, (img.height-sz)/2, sz, sz, 0, 0, ART_PX, ART_PX);
        const png = cv.toDataURL('image/png');
        if(png.length <= ART_PNG_MAX) return res(png);
        ctx.globalCompositeOperation = 'destination-over';   // รองพื้นขาวใต้ภาพ เพราะ JPEG ไม่มีพื้นโปร่ง
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, ART_PX, ART_PX);
        res(cv.toDataURL('image/jpeg', ART_Q));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
/* ขนาดโดยประมาณของเอกสารระดับนั้น หลังใส่รูปชุดใหม่ลงไปแล้ว */
function artDocBytes(r, add){
  const A = artAll(), nx = add || {}; let n = 0;
  Object.keys(A).forEach(k => {
    if(petBy(String(k).split('|')[0]).r !== r) return;
    if(Object.prototype.hasOwnProperty.call(nx, k)) return;
    n += k.length + String(A[k] || '').length;
  });
  Object.keys(nx).forEach(k => { n += k.length + String(nx[k] || '').length; });
  return n;
}
async function saveArt(emo, patch){
  const r = petBy(emo).r, sz = artDocBytes(r, patch);
  if(sz > ART_MAX)
    return toast('รูประดับนี้เต็มแล้ว (~' + Math.round(sz/1024) + 'KB) — เอารูปตัวอื่นออกก่อน');
  try{
    await setDoc(doc(db, 'families', base, 'config', ART_DOC[r] || 'petart'), patch, {merge:true});
    toast('บันทึกรูปแล้ว'); renderModal();
  }catch(e){ fail(e); }
}

function pickPetArt(emo, st){

  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    try{ await saveArt(emo, {[artKey(emo, Number(st) || 0)]: await shrinkImg(f)}); }
    catch(e){ toast(e.message || 'เปิดรูปไม่ได้'); }
  };
  inp.click();
}
/* แนบ 3 ร่างรวดเดียว — เรียงไฟล์ตามชื่อ แล้วไล่ใส่ ร่าง 1 → 2 → 3 */
function pickPetArt3(emo){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async () => {
    const fs = Array.from(inp.files || []).sort((a,b) => a.name.localeCompare(b.name)).slice(0,3);
    if(!fs.length) return;
    try{
      const patch = {};
      for(let i = 0; i < fs.length; i++) patch[artKey(emo, i)] = await shrinkImg(fs[i]);
      await saveArt(emo, patch);
    }catch(e){ toast(e.message || 'เปิดรูปไม่ได้'); }
  };
  inp.click();
}
async function clearPetArt(emo){
  const r = petBy(emo).r, patch = {[emo]: ''};
  STAGE_N.forEach(s => { patch[artKey(emo, s)] = ''; });
  try{
    await setDoc(doc(db, 'families', base, 'config', ART_DOC[r] || 'petart'), patch, {merge:true});

    if(r) await setDoc(doc(db, 'families', base, 'config', 'petart'), {[emo]: ''}, {merge:true});
    toast('กลับไปใช้อีโมจิแล้ว'); renderModal();
  }catch(e){ fail(e); }
}

function openForm(opts){
  modal = {kind:'form', title:opts.title, fields:opts.fields, onSave:opts.onSave, err:null, values:{}};
  opts.fields.forEach(f => { modal.values[f.key] = f.value; });
  if(opts.extraValues) Object.assign(modal.values, opts.extraValues);
  renderModal();
}
function openConfirm(title, msg, onYes){ modal = {kind:'confirm', title, msg, onYes}; renderModal(); }
function askKidPin(kid, onOk, note){
  modal = {kind:'pinask', title:'ยืนยันตัวตน', kidName:kid.name, pin:String(kid.pin), buf:'', onOk, note};
  renderModal();
}
function pinAskTap(n){
  if(modal.buf.length >= 4) return;
  modal.buf += n; renderModal();
  if(modal.buf.length === 4){
    if(modal.buf === modal.pin){ const f = modal.onOk; modal = null; renderModal(); if(f) f(); }
    else { toast('PIN ไม่ถูกต้อง'); modal.buf=''; renderModal(); }
  }
}
function pinAskDel(){ modal.buf = modal.buf.slice(0,-1); renderModal(); }
function confirmYes(){ const f = modal.onYes; modal = null; renderModal(); if(f) f(); }
function closeModal(){ modal = null; renderModal(); }
function setVal(k,v){ syncInputs(); modal.values[k] = v; renderModal(); }
function toggleDay(key, i){
  syncInputs();
  const cur = Array.isArray(modal.values[key]) ? modal.values[key].slice() : ALLDAYS.slice();
  const at = cur.indexOf(i);
  if(at >= 0){ if(cur.length > 1) cur.splice(at,1); } else cur.push(i);
  modal.values[key] = cur.sort((a,b)=>a-b);
  renderModal();
}
function setDays(key, preset){
  syncInputs();
  modal.values[key] = preset==='all' ? ALLDAYS.slice() : preset==='week' ? WEEKDAYS.slice() : SCHOOLNIGHT.slice();
  renderModal();
}
function syncInputs(){
  document.querySelectorAll('#modal input[data-key]').forEach(i => { modal.values[i.getAttribute('data-key')] = i.value; });
}
async function submitForm(){
  syncInputs();
  const err = await modal.onSave(modal.values);
  if(err){ modal.err = err; renderModal(); return; }
  modal = null; renderModal();
}

/* ---------- รูปโปรไฟล์ ---------- */
function pickPhoto(){
  syncInputs();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const file = inp.files && inp.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const N = 200, cv = document.createElement('canvas');
        cv.width = N; cv.height = N;
        const ctx = cv.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, N, N);
        modal.values.photo = cv.toDataURL('image/jpeg', 0.75);
        renderModal();
      };
      img.onerror = () => toast('เปิดรูปไม่ได้');
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  };
  inp.click();
}
function clearPhoto(){ syncInputs(); modal.values.photo = ''; renderModal(); }

            {key:'color', label:'สีประจำตัว (ใช้ย้อมทั้งหน้าจอ)', type:'color',
             value:k?(k.color||KID_COLORS[0]):KID_COLORS[S.kids.length % KID_COLORS.length]},
            {key:'pin', label:'PIN 4 หลัก (ใช้ตอนแลกของรางวัล)', type:'pin', value:k?k.pin:''}],
    extraValues:{photo:k?k.photo:'', emo:k?k.emo:'🦊', __editingId:k?k.id:''},
    async onSave(v){
      if(!v.name || !v.name.trim()) return 'ใส่ชื่อด้วยนะ';
      const pin = String(v.pin||'').replace(/\D/g,'').slice(0,4);

      const color = /^#[0-9a-fA-F]{6}$/.test(String(v.color||'')) ? String(v.color).toLowerCase() : KID_COLORS[0];
      try{
        if(k) await updateDoc(dref('kids', k.id), {name:v.name.trim(), emo:v.emo, photo:v.photo||'', pin, color});
        else{
          const nk = {id:uid(), name:v.name.trim(), emo:v.emo||'🦊', photo:v.photo||'', pin, color, points:0};
          await setDoc(dref('kids', nk.id), nk);
        }
      }catch(e){ fail(e); }
    }});
}

          carryPct: Math.min(100, Math.max(1, parseInt(v.carryPct,10)||100))};
        // วันที่ยกไปทำ ต้องไม่ใช่วันที่ทำงานนี้อยู่แล้ว ไม่งั้นจะได้แต้ม 2 เด้ง

  if(list === 'rewards'){

        {key:'limitDay',  label:'แลกได้วันละกี่ครั้ง (0 = ไม่จำกัด)', type:'number', value:x?(x.limitDay||0):0},

            {key:'all', label:'หักทั้งบ้านพร้อมกันได้ไหม', type:'switch', value:x?!!x.all:false,
             onText:'ผิดทั้งคู่ (หักทุกคน)', offText:'หักทีละคน'}],
    async onSave(v){
      if(!v.name || !v.name.trim()) return 'ใส่ชื่อด้วยนะ';

function watch(){
  const empty = {settings:Object.assign({}, DEF_SETTINGS), kids:[], chores:[], penalties:[], rewards:[], pending:[], log:[], petart:{}, adventureTickets:[]};
  S = S || empty;
  const mark = n => { ready[n] = true; if(Object.keys(ready).length >= 7) render(); };

  unsubs.push(onSnapshot(settingsRef(), d => {
    S.settings = Object.assign({}, DEF_SETTINGS, d.exists() ? d.data() : {});
    mark('settings'); render();
  }, e => console.error(e)));

  [['kids','kids'],['chores','chores'],['penalties','penalties'],['rewards','rewards']].forEach(([c,key]) => {
    unsubs.push(onSnapshot(col(c), snap => {
      S[key] = snap.docs.map(d => d.data());
      mark(key); render();
    }, e => console.error(e)));
  });
  unsubs.push(onSnapshot(query(col('adventureTickets'),where('state','==','ready')),snap=>{
    S.adventureTickets=snap.docs.map(d=>({...d.data(),id:d.id}));render();
  },e=>console.error(e)));
  // เรียงใหม่ฝั่งเครื่องด้วย เผื่อเวลาชนกันเป๊ะ ๆ จะได้ลำดับคงที่ทุกเครื่อง
  const newestFirst = (a,b) => (b.ts - a.ts) || (a.id < b.id ? 1 : a.id > b.id ? -1 : 0);
  // รูปสัตว์แยก 3 เอกสารตามระดับหายาก — รวมเป็นแมพเดียวใน S.petart (เอกสารระดับสูงกว่าทับคีย์แบบเก่า)
  const artDocs = {};
  ART_DOC.forEach(name => unsubs.push(onSnapshot(doc(db, 'families', base, 'config', name), d => {
    artDocs[name] = d.exists() ? (d.data() || {}) : {};
    S.petart = Object.assign.apply(null, [{}].concat(ART_DOC.map(n => artDocs[n] || {})));
    render();
  }, e => console.error(e))));
  unsubs.push(onSnapshot(query(col('pending'), orderBy('ts','desc')), snap => {
    S.pending = snap.docs.map(d => d.data()).sort(newestFirst); mark('pending'); render();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(query(col('log'), orderBy('ts','desc'), limit(600)), snap => {
    S.log = snap.docs.map(d => d.data()).sort(newestFirst); mark('log'); render();
  }, e => console.error(e)));
}
async function seedOrMigrate(){
  const chores = await getDocs(col('chores'));
  if(chores.empty){                       // ครั้งแรกสุด — สร้างข้อมูลตั้งต้นทั้งชุด
    const b = writeBatch(db);
    b.set(settingsRef(), DEF_SETTINGS);
    DEF_KIDS.forEach(k => b.set(dref('kids', k.id), k));
    DEF_CHORES.forEach(c => b.set(dref('chores', c.id), c));
    DEF_PENALTIES.forEach(p => b.set(dref('penalties', p.id), p));
    DEF_REWARDS.forEach(r => b.set(dref('rewards', r.id), r));
    await b.commit();
    return;
  }
  /* ---- อัปเกรดข้อมูลเดิม (ทำครั้งเดียว) แต้มและประวัติไม่หาย ---- */
  const setSnap = await getDocs(query(col('config')));
  const cur = {};
  setSnap.docs.forEach(d => { if(d.id === 'settings') Object.assign(cur, d.data()); });

  if(!cur.potFixV1){        // ซ่อมงานเสริมที่เคยถูกบันทึกเข้ากระเป๋าแต้มประจำวันผิด ๆ
    const isExtra = {};
    chores.docs.forEach(d => { const o = d.data(); if(o.routine === false) isExtra[o.name] = true; });
    const logs = await getDocs(col('log'));
    const move = {};
    const bad = logs.docs.filter(d => {
      const l = d.data();
      return l.kind === 'chore' && (l.pot || 'daily') === 'daily' && isExtra[l.name] && Number(l.delta);
    }).slice(0, 300);
    if(bad.length){
      const b = writeBatch(db);
      bad.forEach(d => {
        const l = d.data();
        b.update(dref('log', d.id), {pot:'extra'});
        move[l.kidId] = (move[l.kidId] || 0) + Number(l.delta);
      });
      Object.keys(move).forEach(kidId => {
        b.update(dref('kids', kidId), {points: increment(-move[kidId]), extra: increment(move[kidId])});
      });
      b.update(settingsRef(), {potFixV1:true});
      await b.commit();
      console.log('ย้ายแต้มงานเสริมกลับเข้ากระเป๋าแต้มพิเศษ', bad.length, 'รายการ');
    } else await updateDoc(settingsRef(), {potFixV1:true});
  }
  if(cur.rewardsV4 && !cur.eveningV1){   // งานช่วงเย็น 3 อย่าง → 17:00–20:00 ทำอันไหนก่อนก็ได้
    const b = writeBatch(db);
    const free = {'ทำการบ้านเสร็จ':1, 'ทำการบ้านเสร็จภายใน 1 ชม.':1,
                  'เก็บกระเป๋าพร้อมพรุ่งนี้':1, 'เตรียมชุดวันพรุ่งนี้':1};
    chores.docs.forEach(d => {
      const o = d.data(), u = {};
      if(o.chain === undefined) u.chain = true;
      if(free[o.name]){
        u.chain = false; u.from = '17:00'; u.due = '20:00';
        if(o.name.indexOf('ภายใน 1 ชม.') >= 0) u.name = 'ทำการบ้านเสร็จ';
      }
      if(Object.keys(u).length) b.update(dref('chores', d.id), u);
    });
    b.update(settingsRef(), {eveningV1:true});
    await b.commit();
  }
  if(!cur.rewardsV4){        // แยก 2 กระเป๋าแต้ม + จัดลำดับความสำคัญของแต้มใหม่
    const b = writeBatch(db);
    (await getDocs(col('rewards'))).docs.forEach(d => b.delete(dref('rewards', d.id)));
    DEF_REWARDS.forEach(r => b.set(dref('rewards', r.id), r));
    // แทนกิจวัตรด้วยชุดใหม่ (แต้มต้องรวมได้ 100) แต่ยกเวลา/วันที่เคยตั้งเองไว้มาด้วย
    const oldByName = {};
    chores.docs.forEach(d => { const o = d.data(); oldByName[o.name] = o; b.delete(dref('chores', d.id)); });
    DEF_CHORES.forEach(c => {
      const o = oldByName[c.name];
      const keep = o ? {from:o.from||c.from, due:o.due||c.due,
                        days:(Array.isArray(o.days)&&o.days.length)?o.days:c.days,
                        grace:o.grace??c.grace, latePct:o.latePct??c.latePct} : {};
      b.set(dref('chores', c.id), Object.assign({}, c, keep));
    });
    (await getDocs(col('kids'))).docs.forEach(d => {          // เปิดกระเป๋าแต้มพิเศษให้ทุกคน
      if(d.data().extra === undefined) b.update(dref('kids', d.id), {extra:0});
    });
    // รายการหักแต้ม: เติมธง "หักทั้งคู่" โดยไม่ทับของที่ตั้งเอง
    const pens = await getDocs(col('penalties'));
    let hasFight = false;
    pens.docs.forEach(d => {
      const o = d.data();
      if(o.name && o.name.indexOf('ทะเลาะ') >= 0){ hasFight = true; b.update(dref('penalties', d.id), {all:true}); }
      else if(o.all === undefined) b.update(dref('penalties', d.id), {all:false});
    });
    if(!hasFight){
      const f = DEF_PENALTIES.find(x => x.name.indexOf('ทะเลาะ') >= 0);
      if(f) b.set(dref('penalties', f.id), f);
    }
    b.set(settingsRef(), Object.assign({}, DEF_SETTINGS, cur,
      {rewardsV4:true, rewardsV3:true, rewardsV2:true, extrasV1:true, eveningV1:true, potFixV1:true,
       shareSmallV1:true, perfectBonus:20}));
    await b.commit();
  }
  if(!cur.shareSmallV1){     // เปิดให้ "เลือกเมนูข้าวเย็น" กับ "Swensen" หารกันจ่ายได้ (ราคาเดิม)
    const SHARE_SMALL = {'เลือกเมนูข้าวเย็น':1, 'Swensen':1};
    const b = writeBatch(db);
    (await getDocs(col('rewards'))).docs.forEach(d => {
      const o = d.data();
      if(SHARE_SMALL[String(o.name||'').trim()] && !o.share) b.update(dref('rewards', d.id), {share:true});
    });
    b.update(settingsRef(), {shareSmallV1:true});
    await b.commit();
  }
  if(cur.maxGiveDay === undefined){          // เพดานแบ่งแต้มให้พี่น้องต่อคนต่อวัน
    await updateDoc(settingsRef(), {maxGiveDay:50});
  }
  if(!cur.bankV1){                           // 🏦 ธนาคารแต้ม — ค่าตั้งต้นที่คำนวณมาแล้วว่าไม่ทำให้แต้มเฟ้อ
    await updateDoc(settingsRef(), {
      bankOn:true, bankV1:true,
      loanCap:340, loanPct:10, loanDays:14, loanLatePct:2, loanMaxPct:30, loanRepayPct:50,
      depDaily:'3:2,7:5,14:12', depCapDaily:200,
      depExtra:'7:2,14:6,30:15', depCapExtra:400});
  }
  if(!cur.morningV1){         // ชุดเช้า: อาบน้ำ 10 → แยกเป็น อาบน้ำ 4 + แปรงฟัน 3 + แต่งตัว 3 (รวมเท่าเดิม)
    const cs = await getDocs(col('chores'));
    const byName = {}; cs.docs.forEach(d => { byName[String(d.data().name||'').trim()] = d; });
    const b = writeBatch(db);
    const bath = byName['อาบน้ำเสร็จ'];
    if(bath) b.update(dref('chores', bath.id),
      {pts:4, from:'06:00', due:'07:15', chain:false, days:WEEKDAYS.slice()});
    [['แปรงฟัน','🪥'], ['แต่งตัวเรียบร้อย','👔']].forEach(([nm, em]) => {
      if(byName[nm]) return;                       // มีอยู่แล้ว (หรือพ่อแม่เพิ่มเอง) ไม่ทับ
      const src = bath ? bath.data() : {};
      const c = mkChore({name:nm, emo:em, pts:3, from:'06:00', due:'07:15',
                         days:WEEKDAYS.slice(), chain:false,
                         grace: src.grace===undefined?10:src.grace,
                         latePct: src.latePct===undefined?50:src.latePct});
      b.set(dref('chores', c.id), Object.assign({carryDay:'', carryPct:100}, c));
    });
    b.update(settingsRef(), {morningV1:true});
    await b.commit();
  }
  if(!cur.morningV2){         // รวมอาบน้ำ + แต่งตัว เป็นงานเดียว 7 แต้ม (เหลือชุดเช้า 2 อย่าง = 7+3)
    const cs = await getDocs(col('chores'));
    const b = writeBatch(db);
    let merged = false;
    cs.docs.forEach(d => {
      const n = String(d.data().name||'').trim();
      if(n === 'อาบน้ำเสร็จ' || n === 'อาบน้ำแต่งตัวเสร็จ'){
        b.update(dref('chores', d.id),
          {name:'อาบน้ำแต่งตัวเสร็จ', emo:'🚿', pts:7, from:'06:00', due:'07:15', chain:false});
        merged = true;
      }else if(n === 'แต่งตัวเรียบร้อย') b.delete(dref('chores', d.id));
    });
    if(!merged){                              // เผื่อโดนลบไปแล้ว — สร้างใหม่ให้ครบ 100
      const c = mkChore({name:'อาบน้ำแต่งตัวเสร็จ', emo:'🚿', pts:7, from:'06:00', due:'07:15',
                         days:WEEKDAYS.slice(), chain:false});
      b.set(dref('chores', c.id), Object.assign({carryDay:'', carryPct:100}, c));
    }
    b.update(settingsRef(), {morningV2:true});
    await b.commit();
  }
  if(cur.soundOn === undefined) await updateDoc(settingsRef(), {soundOn:true, funV1:true});
  if(cur.treatCost === undefined) await updateDoc(settingsRef(), {treatCost:3, treatMax:2, tamaV1:true});
  if(!cur.morningV3){         // ยุบชุดเช้าเหลืองานเดียว 10 แต้ม (อาบน้ำ + แปรงฟัน + แต่งตัว)
    const NAME = 'อาบน้ำ แปรงฟัน แต่งตัวเสร็จ';
    const OLD = {'อาบน้ำเสร็จ':1, 'อาบน้ำแต่งตัวเสร็จ':1};   // ชื่อจากทุกรุ่นก่อนหน้า
    const cs = await getDocs(col('chores'));
    const b = writeBatch(db);
    let keep = null;
    cs.docs.forEach(d => {
      const n = String(d.data().name||'').trim();
      if(n === NAME || OLD[n]){
        if(keep) b.delete(dref('chores', d.id));      // เผื่อมีซ้ำ เก็บอันเดียวพอ
        else keep = d;
      }else if(n === 'แปรงฟัน' || n === 'แต่งตัวเรียบร้อย') b.delete(dref('chores', d.id));
    });
    if(keep) b.update(dref('chores', keep.id),
      {name:NAME, emo:'🚿', pts:10, from:'06:00', due:'07:15', chain:false, days:WEEKDAYS.slice()});
    else {
      const c = mkChore({name:NAME, emo:'🚿', pts:10, from:'06:00', due:'07:15',
                         days:WEEKDAYS.slice(), chain:false});
      b.set(dref('chores', c.id), Object.assign({carryDay:'', carryPct:100}, c));
    }
    b.update(settingsRef(), {morningV3:true});
    await b.commit();
  }
  if(!cur.rewardsV5){        // ราคา/โควตารางวัลชุดใหม่ + เปิดหารกันให้รางวัลจอ + เพิ่ม Educational YouTube
    const NEW = {
      'YouTube 30 นาที':            {cost:70,  share:true,  limitDay:1, limitWeek:5},
      'เล่นเกม 30 นาที':             {cost:50,  share:true,  limitDay:1, limitWeek:5},
      'Swensen':                    {cost:140, share:true,  limitDay:1, limitWeek:2},
      'Educational YouTube 30 นาที': {cost:40,  share:true,  limitDay:1, limitWeek:0}
    };
    const cs = await getDocs(col('rewards'));
    const seen = {};
    const b = writeBatch(db);
    cs.docs.forEach(d => {
      const o = d.data(), n = String(o.name||'').trim();
      // ของเดิม "เลือกเมนูข้าวเย็น" → กลายเป็น Dinner out ไปกินข้าวนอกบ้าน
      if(n === 'เลือกเมนูข้าวเย็น' || n === 'Dinner out ไปกินข้าวนอกบ้าน'){
        seen['Dinner out ไปกินข้าวนอกบ้าน'] = true;
        b.update(dref('rewards', d.id), {name:'Dinner out ไปกินข้าวนอกบ้าน', emo:'🍽️',
          cost:140, share:true, limitDay:1, limitWeek:2});
      }else if(NEW[n]){ seen[n] = true; b.update(dref('rewards', d.id), NEW[n]); }
    });
    // ของที่ยังไม่มีในบ้านนี้ ค่อยสร้างเพิ่ม (ไม่ทับของที่พ่อแม่เพิ่มเอง)
    DEF_REWARDS.filter(r => !r.big).forEach(r => {
      if(seen[r.name] || r.name === 'นอนดึกได้ 1 ชม.') return;
      if(cs.docs.some(d => String(d.data().name||'').trim() === r.name)) return;
      b.set(dref('rewards', r.id), r);
    });
    b.update(settingsRef(), {rewardsV5:true});
    await b.commit();
  }
  if(cur.urgentMin === undefined) await updateDoc(settingsRef(), {urgentMin:15});
  if(!cur.fridayV1){          // ศุกร์เย็นไม่ต้องเตรียมของ → ยกไปทำวันอาทิตย์แทน
    const b = writeBatch(db);
    (await getDocs(col('chores'))).docs.forEach(d => {
      const o = d.data(), n = String(o.name||'').trim();
      if(n === 'เก็บกระเป๋าพร้อมพรุ่งนี้' || n === 'เตรียมชุดวันพรุ่งนี้')
        b.update(dref('chores', d.id), {days: SCHOOLNIGHT.slice(), carryDay:'', carryPct:100});
      else if(n === 'ทำการบ้านเสร็จ')
        b.update(dref('chores', d.id), {days: WEEKDAYS.slice(), carryDay:0, carryPct:50});
      else if(o.carryDay === undefined)
        b.update(dref('chores', d.id), {carryDay:'', carryPct:100});
    });
    b.update(settingsRef(), {fridayV1:true});
    await b.commit();
  }
  if(!cur.arbV1){                            // ช่องทำกำไรที่ตั้งใจเปิดไว้ให้เด็กหาเจอเอง
    await updateDoc(settingsRef(), {
      arbV1:true, loanGraceDays:3, loanPerWeek:1,
      coDepBonusPct:2, coDepBonusMax:5, coDepMinDays:14,
      cosignOn:true, cosignPct:50, cosignDiscount:50});
  }
}

    <div class="login">

      <h1>Discipline</h1>
      <div class="muted" style="margin-bottom:20px">เข้าสู่ระบบด้วยบัญชีครอบครัว<br>ทำครั้งเดียวต่อเครื่อง</div>

async function doSignIn(){
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  if(!em || !pw){ viewLogin('ใส่อีเมลและรหัสผ่านด้วยนะ'); return; }
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, em, pw);
  }catch(e){
    const m = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'

    viewLogin(m);
  }
}

/* ============================================================
   Face ID / Touch ID แทนรหัสผู้ปกครอง (WebAuthn)
   ผูกกับ "เครื่องนี้" เท่านั้น — แต่ละเครื่องต้องตั้งเอง และรหัส 4 หลักยังใช้ได้เสมอ
   ============================================================ */
const SEEN_KEY = 'discipline.seen';
const lastSeen = () => Number(localStorage.getItem(SEEN_KEY) || 0);
function markSeen(){ try{ localStorage.setItem(SEEN_KEY, String(now())); }catch(e){} }

const FID_KEY = 'discipline.faceid';
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = str => {
  const t = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(t + '='.repeat((4 - t.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
};
const faceIdSupported = () => !!(window.PublicKeyCredential && navigator.credentials);
const faceIdReady = () => faceIdSupported() && !!localStorage.getItem(FID_KEY);

async function faceIdSetup(){
  if(!faceIdSupported()){ toast('เครื่องนี้ไม่รองรับ Face ID / Touch ID'); return; }
  try{
    const cred = await navigator.credentials.create({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name:'Discipline'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name:'parent', displayName:'ผู้ปกครอง'},
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: {authenticatorAttachment:'platform', userVerification:'required'},
      timeout: 60000, attestation:'none'
    }});
    localStorage.setItem(FID_KEY, b64(cred.rawId));
    toast('เปิด Face ID สำหรับเครื่องนี้แล้ว 🙂');
    render();
  }catch(e){
    console.error(e);
    toast(e && e.name === 'NotAllowedError' ? 'ยกเลิกแล้ว' : 'ตั้งค่าไม่สำเร็จ — ลองใหม่อีกครั้ง');
  }
}
function faceIdRemove(){
  openConfirm('ปิด Face ID เครื่องนี้', 'ต่อไปต้องใช้รหัส 4 หลักเข้าโหมดผู้ปกครอง', () => {
    localStorage.removeItem(FID_KEY); toast('ปิดแล้ว'); render();
  });
}
async function faceIdUnlock(){
  if(!faceIdReady()) return;
  try{
    await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{type:'public-key', id: unb64(localStorage.getItem(FID_KEY))}],
      userVerification:'required', timeout: 60000
    }});
    markSeen();
    view.screen='parent'; view.tab='review'; view.pinBuf=''; render();   // ผ่านการยืนยันตัวตนของเครื่องแล้ว
  }catch(e){
    if(e && e.name === 'NotAllowedError') toast('ยกเลิก หรือไม่ผ่าน — ใช้รหัส 4 หลักแทนได้');
    else { console.error(e); toast('ปลดล็อกไม่สำเร็จ ใช้รหัส 4 หลักแทน'); }
  }
}

setInterval(() => { if(S && !modal && !flash) render(); }, 20000);

/* ---------- ไม่มีใครแตะนาน ๆ → กลับหน้าแรกเอง ----------
   กันเครื่องค้างอยู่ในบัญชีของคนก่อนหน้า คนถัดไปเดินมาจะเจอหน้าแรกเสมอ */
let lastTouch = Date.now();
['pointerdown','touchstart','keydown','wheel'].forEach(ev =>
  document.addEventListener(ev, () => { lastTouch = Date.now(); }, {capture:true, passive:true}));
setInterval(() => {
  if(!S || modal || flash || adventureOverlay) return;
  if(view.screen === 'pick') return;
  if(!cfg().idleHome) return;
  const sec = Number(cfg().idleSec || 60);
  const limit = view.screen === 'parent' ? sec * 3 : sec;   // โหมดผู้ปกครองให้เวลานานกว่า จะได้อ่านสรุปทัน
  if(Date.now() - lastTouch > limit * 1000) go('pick');
}, 5000);

ss=\"bubble\" aria-live=\"polite\">\u003cspan class=\"pet-message\">🧩 → 🗝️ → 💎\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"stages\">\u003cspan class=\"journey-progress\">🧩 → 🗝️ → 💎\u003c/span>\u003c/div>\n\u003cdiv class=\"content\">\u003c/div>\u003cdetails class=\"keyboard-help\">\u003csummary>⌨️ วิธีใช้คีย์บอร์ด\u003c/summary>\u003cdiv class=\"key-guide\">\u003c/div>\u003c/details>\u003cdiv class=\"summary\">ปลดล็อกจากหน้าที่จริง ✅ · ตอบผิดไม่เสียแต้ม\u003c/div>\n\u003c/div>\n\u003cscript>\n(()=>{\nconst setup=__ADVENTURE_SETUP__;\n\nconst root=document.getElementById('monster-adventure'),q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];\nconst state={level:setup.level,game:setup.stage,movement:true,done:[0,1,2].map(i=>i\u003csetup.stage)};let board=[],pieces=[],selected=0,rotated=false,program=[],pos=0,hasKey=false,mirrors=[],busy=false,epoch=0,cursor=0,mirrorCursor=0,keyboardMode=false,history=[];\nconst routeMaps=[{n:4,start:12,key:2,goal:3,walls:[1,5,9,11]},{n:5,start:20,key:3,goal:24,walls:[1,6,8,11,13,16,18]}];\nconst mirrorMaps=[{n:4,start:2,target:[3,4],items:[[1,2],[1,0],[3,0]],answer:['/','/','\\\\']},{n:5,start:3,target:[5,4],items:[[1,3],[1,1],[3,1],[3,4],[4,0],[4,2]],answer:['/','/','\\\\','\\\\','/','\\\\']}];\nfunction buttons(){q('.journey-progress').textContent=\"ด่าน \"+(state.game+1)+\" / 3 · \"+[\"🌉\",\"🗝️\",\"💎\"][state.game];all('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===state.level)));all('[data-game]').forEach(b=>{let i=+b.dataset.game;b.setAttribute('aria-pressed',String(i===state.game));b.textContent=(state.done[i]?'✓ ':['🌉 ','🗝️ ','💎 '][i])+['สะพาน','เส้นทาง','กระจก'][i];});}\nfunction say(text){const f=q('.feedback');if(f)f.textContent=text;}\nfunction pulse(el){if(!el)return;el.classList.remove('hinted');void el.offsetWidth;el.classList.add('hinted');}\nfunction sendCompletion(){parent.postMessage({type:'adventure:complete',sessionId:setup.sessionId,stage:state.game},'*');}\nfunction win(){\n busy=true;let r=q('.reward');if(!r){r=document.createElement('div');r.className='reward';q('.content').append(r);}\n r.textContent='กำลังบันทึก…';sendCompletion();\n}\nwindow.addEventListener('message',event=>{\n const m=event.data;if(event.source!==parent||!m||m.sessionId!==setup.sessionId||m.stage!==state.game)return;\n const r=q('.reward');if(!r)return;\n if(m.type==='adventure:save-error'){\n   r.innerHTML='\u003cspan>ยังบันทึกไม่ได้ เชื่อมต่อแล้วลองใหม่\u003c/span>\u003cbutton type=\"button\" class=\"primary retry-send\">บันทึกอีกครั้ง\u003c/button>';\n   q('.retry-send').onclick=()=>{r.textContent='กำลังบันทึก…';sendCompletion();};return;\n }\n if(m.type!=='adventure:saved')return;\n busy=false;state.done[state.game]=true;buttons();say('✓ บันทึกแล้ว');q('.pet-message').textContent='✨ 🙌 ✨';q('.pet').classList.add('celebrate');\n r.innerHTML=state.game===2?'\u003cspan class=\"prize-name\">\u003c/span>\u003cbutton type=\"button\" class=\"primary replay\">กลับบ้าน ✓\u003c/button>':'\u003cspan>✓ ผ่านแล้ว!\u003c/span>\u003cbutton type=\"button\" class=\"primary next\">ไปต่อ →\u003c/button>';\n if(state.game===2){q('.prize-name').textContent=m.prize||'🎁 ของสะสม';q('.replay').onclick=()=>parent.postMessage({type:'adventure:close',sessionId:setup.sessionId},'*');}\n else q('.next').onclick=()=>{state.game++;init();};\n});\nfunction shell(title){q('.content').innerHTML='\u003cdiv class=\"heading\">\u003cstrong>'+title+'\u003c/strong>\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"icon hint\" aria-label=\"คำใบ้ทีละขั้น\">💡\u003c/button>\u003cbutton type=\"button\" class=\"icon reset\" aria-label=\"เริ่มด่านนี้ใหม่\">↻\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"play\">\u003c/div>\u003cdiv class=\"feedback\" aria-live=\"polite\">\u003c/div>';q('.reset').onclick=init;}\nfunction init(){epoch++;busy=false;cursor=0;mirrorCursor=0;keyboardMode=false;history=[];buttons();q('.pet-message').textContent=['👆 🧩 → ▦','↑ → ↓ ←  ▶','👆 🪞 ↻  ☀️'][state.game];if(state.game===0)bridgeInit();else if(state.game===1)routeInit();else mirrorInit();updateGuide();}\nfunction pieceDimensions(p){return rotated&&selected===p.id?[p.h,p.w]:[p.w,p.h];}\nfunction bridgeInit(){shell('เติมสะพานให้เต็ม');const cols=state.level?5:4;board=Array(cols*3).fill(-1);pieces=(state.level?[[3,1],[3,1],[2,2],[1,2],[1,2],[1,1]]:[[2,2],[1,2],[2,2],[1,2]]).map(([w,h],id)=>({id,w,h,used:false}));selected=0;rotated=false;q('.play').innerHTML='\u003cdiv class=\"endpoints\">\u003cspan>🐉\u003c/span>\u003cspan>🌳 🎁\u003c/span>\u003c/div>\u003cdiv class=\"board-wrap\">\u003cdiv class=\"board\">\u003c/div>\u003c/div>\u003cdiv class=\"tray\">\u003c/div>\u003cdiv class=\"under\">\u003cbutton type=\"button\" class=\"icon rotate\" aria-label=\"หมุนชิ้นส่วน\">↻ หมุน\u003c/button>\u003cbutton type=\"button\" class=\"icon bridge-undo\" aria-label=\"ย้อนการวางล่าสุด\">↶\u003c/button>\u003c/div>';q('.hint').onclick=()=>{const unused=pieces.find(p=>!p.used);if(!unused)return;selected=unused.id;rotated=false;drawBridge();pulse(q('[data-piece=\"'+selected+'\"]'));say('🧩 ↻ → ▦');};q('.rotate').onclick=()=>{rotated=!rotated;drawBridge();paintCursor();};q('.bridge-undo').onclick=undoBridge;drawBridge();}\nfunction drawBridge(){const cols=state.level?5:4;const g=q('.board');g.style.gridTemplateColumns='repeat('+cols+',1fr)';g.innerHTML=board.map((id,i)=>'\u003cbutton type=\"button\" class=\"cell '+(id\u003c0?'river':'occupied')+'\" data-cell=\"'+i+'\" aria-label=\"ช่อง '+(i+1)+(id>=0?' ชิ้น '+(id+1)+' แตะเพื่อนำออก':' ว่าง')+'\">'+(id>=0?['●','◆','▲','✦','■','○'][id]:'')+'\u003c/button>').join('');q('.tray').innerHTML=pieces.map(p=>{let [w,h]=pieceDimensions(p);return '\u003cbutton type=\"button\" class=\"piece\" data-piece=\"'+p.id+'\" aria-label=\"ชิ้น '+(p.id+1)+' ขนาด '+w+' คูณ '+h+'\" aria-pressed=\"'+(selected===p.id)+'\" '+(p.used?'disabled':'')+'>\u003cspan class=\"number\">'+(p.id+1)+'\u003c/span>\u003cspan class=\"mini-shape\" style=\"grid-template-columns:repeat('+w+',12px)\">'+Array(w*h).fill('\u003cspan class=\"mini-unit\">\u003c/span>').join('')+'\u003c/span>\u003c/button>';}).join('');all('[data-piece]').forEach(b=>b.onclick=()=>{selected=+b.dataset.piece;rotated=false;drawBridge();paintCursor();});all('[data-cell]').forEach(b=>b.onclick=()=>{if(q('.reward'))return;const i=+b.dataset.cell;cursor=i;if(board[i]>=0){rememberBridge();let id=board[i];board=board.map(v=>v===id?-1:v);pieces[id].used=false;selected=id;rotated=false;drawBridge();return;}let p=pieces[selected];if(!p||p.used)return;let [w,h]=pieceDimensions(p),x=i%cols,y=Math.floor(i/cols),cells=[];for(let yy=0;yy\u003ch;yy++)for(let xx=0;xx\u003cw;xx++)cells.push((y+yy)*cols+x+xx);if(x+w>cols||y+h>3||cells.some(c=>board[c]>=0)){pulse(b);say('↻ 🧩');return;}rememberBridge();cells.forEach(c=>board[c]=p.id);p.used=true;selected=pieces.find(p=>!p.used)?.id??-1;rotated=false;drawBridge();say('');if(board.every(v=>v>=0))win();});all('[data-cell]').forEach(b=>b.onpointerenter=()=>{if(!keyboardMode){cursor=+b.dataset.cell;previewBridge();}});g.onpointerleave=()=>{if(!keyboardMode)clearPreview();};paintCursor();}\nfunction routeInit(){shell('เก็บกุญแจ → ไปประตู');const m=routeMaps[state.level];program=[];pos=m.start;hasKey=false;q('.play').innerHTML='\u003cdiv class=\"board-wrap\">\u003cdiv class=\"board\">\u003c/div>\u003c/div>\u003cdiv class=\"program\" aria-label=\"ลำดับการเดิน\">\u003c/div>\u003cdiv class=\"arrows\">\u003cbutton type=\"button\" class=\"icon\" data-dir=\"U\" aria-label=\"ขึ้น\">↑\u003c/button>\u003cbutton type=\"button\" class=\"icon\" data-dir=\"R\" aria-label=\"ขวา\">→\u003c/button>\u003cbutton type=\"button\" class=\"icon\" data-dir=\"D\" aria-label=\"ลง\">↓\u003c/button>\u003cbutton type=\"button\" class=\"icon\" data-dir=\"L\" aria-label=\"ซ้าย\">←\u003c/button>\u003cbutton type=\"button\" class=\"icon undo\" aria-label=\"ลบก้าวสุดท้าย\">⌫\u003c/button>\u003c/div>\u003cdiv class=\"under\">\u003cbutton type=\"button\" class=\"primary
