<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2ec">
<title>Discipline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
  :root{
    --bg:#f6f2ec; --card:#fffdf9; --ink:#1f2c47;
    --navy:#2c3f66; --navy-2:#4a6491; --navy-soft:#e7ecf5;
    --muted:#8d8577; --line:#eae3d8;
    --gold:#c9973f; --gold-soft:#fbf1de;
    --good:#4f8172; --good-soft:#e6f0eb;
    --warn:#bd6b57; --warn-soft:#fbeae5;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:40px}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  h1,h2,h3{margin:0 0 8px;color:var(--ink)}
  h1{font-size:23px;letter-spacing:-.3px} h2{font-size:18px} h3{font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06)}
  button{font-family:inherit;font-size:15px;border:none;border-radius:14px;padding:11px 16px;
    cursor:pointer;background:var(--navy-soft);color:var(--navy);font-weight:600}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.38;cursor:default}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-good{background:var(--good);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-warn{background:var(--warn-soft);color:var(--warn)}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;font-weight:500}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:11px}
  .btn-full{width:100%}
  .row{display:flex;gap:8px;align-items:center}
  .row-between{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  input,select{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:12px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--navy-2)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}

  .kid-tile{background:var(--card);border-radius:var(--radius);padding:16px 10px;text-align:center;
    box-shadow:0 2px 12px rgba(31,44,71,.06);cursor:pointer}
  .kid-tile .nm{font-weight:700;margin-top:8px}
  .kid-tile .pt{font-size:13px;color:var(--muted)}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    overflow:hidden;background:var(--navy-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .points-big{font-size:42px;font-weight:800;line-height:1.1;color:var(--navy)}

  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
    background:var(--card);margin-bottom:8px;box-shadow:0 1px 7px rgba(31,44,71,.05)}
  .item.due-now{box-shadow:0 0 0 2px var(--gold),0 1px 7px rgba(31,44,71,.05)}
  .item.due-late{box-shadow:0 0 0 2px var(--warn),0 1px 7px rgba(31,44,71,.05)}
  .item .emo{font-size:34px;flex:0 0 auto;width:44px;text-align:center;line-height:1.1}
  .item.ready{background:#fff;box-shadow:0 0 0 3px var(--good), 0 2px 10px rgba(31,44,71,.08)}
  .item.warn{box-shadow:0 0 0 3px var(--warn), 0 2px 10px rgba(31,44,71,.08)}
  .item.locked{opacity:.4}
  .btn-done{min-width:96px;font-size:17px;padding:13px 14px;font-weight:800}
  .state{font-size:26px;width:40px;text-align:center;flex:0 0 auto}
  .bignum{font-variant-numeric:tabular-nums;font-weight:800}
  .cnt{background:var(--warn);color:#fff;border-radius:999px;padding:2px 10px;
    font-size:14px;font-weight:800;margin-left:6px;display:inline-block}
  .newdot{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block;flex:0 0 auto}
  .feed-line{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .feed-line:last-child{border-bottom:none}
  .strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{width:48px;height:56px;border-radius:13px;background:var(--bg);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:23px;line-height:1}
  .chip small{font-size:14px;line-height:1}
  .chip.done{background:var(--good-soft)}
  .chip.now{background:#fff;box-shadow:0 0 0 3px var(--good)}
  .chip.late{background:var(--warn-soft);box-shadow:0 0 0 2px var(--warn)}
  .chip.wait{opacity:.4}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
  .tag-plus{background:var(--good-soft);color:var(--good)}
  .tag-minus{background:var(--warn-soft);color:var(--warn)}
  .tag-cost{background:var(--gold-soft);color:var(--gold)}
  .tag-wait{background:var(--navy-soft);color:var(--navy-2)}

  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06);overflow-x:auto}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:9px 6px;font-size:14px;white-space:nowrap}
  .tabs button.on{background:var(--navy);color:#fff}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
  .pinpad button{font-size:22px;padding:16px 0;background:var(--card);color:var(--ink);
    box-shadow:0 2px 8px rgba(31,44,71,.06)}
  .dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--navy)}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{display:inline-block;font-size:12px;background:var(--navy-soft);color:var(--navy);
    padding:4px 10px;border-radius:999px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .log-line{display:flex;gap:9px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .log-line:last-child{border-bottom:none}
  .sec-title{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 8px;letter-spacing:.3px}
  .clock{font-variant-numeric:tabular-nums;font-weight:800}

  .prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .4s}
  .dayrow{display:flex;gap:4px;margin-top:6px}
  /* ---------- ⏳ แท่งเวลานับถอยหลังของแต่ละงาน ----------
     แท่งหดด้วย CSS animation ล้วน ๆ + animation-delay ติดลบ = วาดใหม่กี่ครั้งก็ยังตรงเวลาจริง
     JS แตะแค่ตัวเลข ไม่ต้อง re-render ทั้งหน้า จะได้ไม่กระตุก */
  .cd{margin:8px 0 2px;padding:9px 12px 11px;border-radius:14px;
      background:var(--bg);border:2px solid var(--line)}
  .cd-top{display:flex;align-items:baseline;gap:8px}
  .cd-num{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
  .cd-lab{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}
  .cd-lab small{display:block;font-size:11px;font-weight:600;opacity:.75}
  .cd-pct{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
  /* ราง: มีขีดทุก 10% ให้เด็กนับช่องได้ */
  .cd-bar{position:relative;height:18px;border-radius:99px;overflow:hidden;margin-top:8px;
    background-color:var(--line);
    background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.13) calc(10% - 2px) 10%)}
  .cd-bar i{display:block;height:100%;width:100%;border-radius:99px;
    animation:cdDrain linear forwards;background:var(--muted)}
  @keyframes cdDrain{from{width:100%}to{width:0%}}
  /* ปกติ = เขียวใจเย็น */
  .cd.ok{border-color:var(--good)55;background:var(--good-soft)}
  .cd.ok .cd-num,.cd.ok .cd-lab,.cd.ok .cd-pct{color:var(--good)}
  .cd.ok .cd-bar i{background:var(--good)}
  /* ใกล้หมดเวลา = เหลือง เต้นช้า ๆ */
  .cd.warn{border-color:var(--gold);background:var(--gold-soft);animation:cdPulse 1.6s ease-in-out infinite}
  .cd.warn .cd-num,.cd.warn .cd-lab,.cd.warn .cd-pct{color:var(--gold)}
  .cd.warn .cd-bar i{background:var(--gold)}
  /* ด่วนมาก / เลยเวลา = แดง เต้นเร็ว */
  .cd.hot{border-color:var(--warn);background:var(--warn-soft);animation:cdPulse .8s ease-in-out infinite}
  .cd.hot .cd-num,.cd.hot .cd-lab,.cd.hot .cd-pct{color:var(--warn)}
  .cd.hot .cd-bar i{background:var(--warn)}
  @keyframes cdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  @media (prefers-reduced-motion:reduce){ .cd.warn,.cd.hot{animation:none} }
  /* ---------- 🎮 โหมดสนุก ---------- */
  .flash-emo{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{0%{transform:scale(.2) rotate(-18deg);opacity:0}
                 60%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  .lvbadge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);
    border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
  .petcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;
    background:linear-gradient(135deg,var(--gold-soft),var(--card));border:2px solid var(--gold)55;margin-bottom:12px}
  .egg{font-size:40px;line-height:1;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
  .egg.w1{animation:eggTilt 2.6s ease-in-out infinite}
  .egg.w2{animation:eggTilt 1.1s ease-in-out infinite}
  .egg.w3{animation:eggShake .42s ease-in-out infinite}
  @keyframes eggTilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes eggShake{0%,100%{transform:translateX(-3px) rotate(-11deg)}
                      50%{transform:translateX(3px) rotate(11deg)}}
  .petbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .petbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--good));
    transition:width .6s cubic-bezier(.2,.9,.3,1)}
  .pets{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .pets span{font-size:22px;line-height:1;animation:petIn .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes petIn{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
  .pets span.pet{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:9px;background:var(--card);box-shadow:0 0 0 2px var(--rc)}
  .pets span.pet.r2{box-shadow:0 0 0 2px var(--rc),0 0 10px 1px var(--rc)}
  /* ---------- 🎮 หน้าเลี้ยงสัตว์ ---------- */
  .stage{position:relative;border-radius:18px 18px 0 0;overflow:hidden;height:200px;background:#8fd3f4}
  .stage .scene{position:absolute;inset:0;width:100%;height:100%}
  .pethere{position:absolute;left:50%;bottom:2px;width:118px;margin-left:-59px}
  .petsvg{width:100%;height:auto;overflow:visible}
  /* รูปที่พ่อแม่แนบเอง — ใช้แทน SVG เมื่อมี · ขนาดไล่ตามร่างเหมือน SVG */
  .petpic{display:block;width:100%;margin:0 auto;transform-origin:50% 100%;
          filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:bob 2.8s ease-in-out infinite}
  .petpic.s0{width:62%}
  .petpic.s1{width:86%}
  .petpic.sleeping{animation:snore 3.6s ease-in-out infinite}
  .artslots{display:flex;gap:3px;width:100%;margin-top:5px}
  .artslot{flex:1;min-width:0;border:1.5px dashed var(--line);border-radius:7px;padding:2px 1px;cursor:pointer;
           background:var(--card);display:flex;flex-direction:column;align-items:center;gap:1px}
  .artslot.has{border-style:solid;border-color:var(--good)}
  .artslot img{width:100%;aspect-ratio:1;border-radius:4px;object-fit:cover;display:block}
  .artslot .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
               font-size:15px;color:var(--muted);line-height:1}
  .artslot small{font-size:8px;line-height:1;color:var(--muted)}
  .pet-body{animation:bob 2.8s ease-in-out infinite;transform-origin:50% 100%}
  .petsvg.sleeping .pet-body{animation:snore 3.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.03)}}
  @keyframes snore{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(1px) scale(1.03,.97)}}
  .pet-eye{animation:blink 5.2s infinite;transform-origin:50% 42%}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .zzz text{animation:zup 2.4s ease-out infinite}
  .zzz text:last-child{animation-delay:.8s}
  @keyframes zup{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.8}100%{opacity:0;transform:translate(6px,-10px)}}
  .star{animation:tw 2.6s ease-in-out infinite}.star.s1{animation-delay:.8s}.star.s2{animation-delay:1.6s}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  .bub{animation:rise 4.5s ease-in infinite}.bub.b1{animation-delay:1.4s}.bub.b2{animation-delay:2.8s}
  @keyframes rise{0%{opacity:0;transform:translateY(14px)}25%{opacity:.7}100%{opacity:0;transform:translateY(-26px)}}
  .bubble{position:absolute;left:10px;right:10px;top:9px;background:rgba(255,255,255,.94);
    border-radius:14px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--navy);
    box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .bubble.warn{background:rgba(255,243,238,.96);color:var(--warn)}
  .stat{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .stat-i{font-size:19px;flex:none;width:24px;text-align:center}
  .stat small{font-size:11px;color:var(--muted);font-weight:700}
  .sbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
  .sbar i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .carerow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .care{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 2px;border-radius:14px;
    background:var(--bg);border:2px solid var(--line);font-weight:800;color:var(--navy)}
  .care span{font-size:23px;line-height:1.1}
  .care b{font-size:11.5px}
  .care small{font-size:9.5px;color:var(--muted);font-weight:700}
  .care.off{opacity:.42}
  .zoocell.live{box-shadow:0 0 0 3px var(--good)}
  .zoocell .zoopic{height:38px;display:flex;align-items:center;justify-content:center}
  .zoocell .zoopic svg{height:38px;width:auto}
  @media (prefers-reduced-motion:reduce){
    .pet-body,.pet-eye,.zzz text,.star,.bub{animation:none}
  }
  .zoo{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;margin-bottom:12px}
  .zoocell{text-align:center;padding:8px 3px;border-radius:12px;background:var(--bg);
    box-shadow:0 0 0 2px var(--rc)}
  .zoocell b{display:block;font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zoocell small{display:block;font-size:10px;color:var(--muted)}
  .zoocell.locked{opacity:.4;box-shadow:0 0 0 2px var(--line);filter:grayscale(1)}
  .xpbar{height:7px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:5px}
  .xpbar i{display:block;height:100%;background:#fff;opacity:.9;transition:width .6s}
  @media (prefers-reduced-motion:reduce){
    .flash-emo,.pets span{animation:none} .egg.w1,.egg.w2,.egg.w3{animation:none}
  }
  .daybox{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  .daybox b{display:block;height:22px;border-radius:7px;line-height:22px;font-size:11px;color:#fff;margin-bottom:2px}
  .daypick{display:flex;gap:5px;margin-top:6px}
  .daypick button{flex:1;padding:9px 0;font-size:13px;background:var(--bg);color:var(--muted)}
  .daypick button.on{background:var(--navy);color:#fff}

  .overlay{position:fixed;inset:0;background:rgba(31,44,71,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 24px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(31,44,71,.25)}
  @media(min-width:560px){ .overlay{align-items:center} .sheet{border-radius:22px} }
  .sheet h3{font-size:18px;margin-bottom:2px}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .sheet-actions button{flex:1}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .emoji-pick button{padding:6px 8px;font-size:21px;background:var(--bg);border-radius:10px}
  .emoji-pick button.on{background:var(--navy-soft);outline:2px solid var(--navy-2)}
  .switch{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:13px}
  .switch button{flex:1;background:transparent;color:var(--muted);font-size:14px;padding:9px 4px}
  .switch button.on{background:var(--navy);color:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;
    max-width:88%;text-align:center}
  .toast.show{opacity:1;bottom:56px}
  .offline{position:fixed;top:0;left:0;right:0;background:var(--gold);color:#fff;text-align:center;
    font-size:12px;padding:5px;z-index:80;font-weight:600}
  .boot{text-align:center;padding:60px 20px;color:var(--muted)}
  .boot .big{font-size:38px;margin-bottom:10px}
  .login{max-width:360px;margin:50px auto;text-align:center}

  /* แถบบอกว่านี่คือบัญชีของใคร — ติดบนสุดตลอด ไม่เลื่อนหาย */
  .kidbar{position:sticky;top:0;z-index:40;margin:-14px -14px 14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;color:#fff;
    box-shadow:0 4px 18px rgba(31,44,71,.22)}
  .kidbar .av{border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
  .kidbar .nm{font-size:20px;font-weight:800;line-height:1.15}
  .kidbar .pt{font-size:13px;opacity:.92;font-weight:600}
  .kidbar button{background:rgba(255,255,255,.22);color:#fff;padding:9px 13px;font-size:14px}
  .kid-tile{border:3px solid transparent}
  .kid-tile .av{margin:0 auto}
  .colorpick{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
  .colorpick button{width:40px;height:40px;border-radius:50%;padding:0;
    box-shadow:0 2px 6px rgba(31,44,71,.22)}
  .colorpick button.on{outline:3px solid var(--ink);outline-offset:3px}
  input[type=color]{width:60px;height:42px;padding:3px;cursor:pointer}
</style>
</head>
<body>
<div id="net"></div>
<div class="wrap" id="app"><div class="boot"><div class="big">⭐</div>กำลังเชื่อมต่อ…</div></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>

    m = String(m||'');

      return 'วาง config ผิด — มีบรรทัด import ของ Firebase Console ติดมาด้วย ให้เอาแค่ก้อน firebaseConfig = {...}';

  }
  window.__showDiag = function(msg){
    if(shown) return; shown = true;
    document.getElementById('app').innerHTML =
      '<div class="boot" style="text-align:left">' +
      '<div class="big" style="text-align:center">⚠️</div>' +
      '<b style="display:block;text-align:center;color:var(--ink);margin-bottom:14px">เปิดแอปไม่สำเร็จ</b>' +

      hint(msg) + '</div>' +
      '<div class="card" style="font-size:12px;color:var(--muted);word-break:break-word"><b>ข้อความจากระบบ</b><br>' +

      '<div style="text-align:center"><button class="btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>';
  };
  window.addEventListener('error', function(e){
    if(e && e.target && e.target.tagName === 'SCRIPT')
      window.__showDiag('โหลดสคริปต์ไม่ได้: ' + (e.target.src || 'module'));
    else window.__showDiag((e.message||'error') + (e.filename ? ' @ บรรทัด ' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    window.__showDiag((r && (r.code || r.message)) || String(r));
  });
  setTimeout(function(){
    if(!window.__booted) window.__showDiag('รอเกิน 12 วินาทีแล้วยังเชื่อมต่อไม่ได้');
  }, 12000);
})();
</script>

function rollPet(owned){
  const has = e => owned.indexOf(e) >= 0;
  const tiers = [0,1,2].map(r => PETS.filter(x => x.r === r && !has(x.e)));
  let total = 0; const avail = [];
  RARITY.forEach((R,i) => { if(tiers[i].length){ total += R.w; avail.push({i, w:R.w}); } });
  if(!total) return PETS[(Math.random()*PETS.length)|0];      // เก็บครบทุกตัวแล้ว — สุ่มซ้ำได้

  for(const a of avail){ if(roll < a.w){ pickTier = a.i; break; } roll -= a.w; }

}

const pad2 = n => String(n).padStart(2,'0');
const now = () => Date.now();
function dstr(ts){
  const x = new Date(ts === undefined ? now() : ts);
  return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
}
const todayStr = () => dstr();
const fmtClock = ts => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
function dueDateOf(hhmm, ref){
  const p = String(hhmm).split(':');
  const d = new Date(ref === undefined ? now() : ref);
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  return d;
}
const minsUntil = hhmm => Math.ceil((dueDateOf(hhmm) - now())/60000);

/* ---------- helper ---------- */
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function timeAgo(ts){
  const d = Math.floor((now()-ts)/1000);
  if(d < 60) return 'เมื่อครู่';
  if(d < 3600) return Math.floor(d/60)+' นาทีที่แล้ว';
  if(dstr(ts) === todayStr()) return 'วันนี้ ' + fmtClock(ts);
  return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short'}) + ' ' + fmtClock(ts);
}
/* ผสมสีประจำตัวกับสีพื้นหลัง เพื่อย้อมทั้งหน้าจอแบบอ่อน ๆ */
function tint(hex, amt){
  const h = String(hex || '#4a6491').replace('#','');
  const bg = [246,242,236];
  const c = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  const m = c.map((v,i) => Math.round(bg[i] + (v - bg[i]) * amt));
  return `rgb(${m[0]},${m[1]},${m[2]})`;
}
function avatar(k, size){
  const s = size || 52;
  const inner = k.photo ? `<img src="${k.photo}" alt="">`

  return `<div class="av" style="width:${s}px;height:${s}px;background:${(k.color||'#4a6491')}22">${inner}</div>`;
}
function daysLabel(c){
  const d = Array.isArray(c.days) ? c.days : ALLDAYS;
  if(d.length === 7) return 'ทุกวัน';
  if(d.join() === WEEKDAYS.join()) return 'จ–ศ';
  if(d.join() === '0,6') return 'เสาร์–อาทิตย์';
  if(d.join() === SCHOOLNIGHT.join()) return 'คืนก่อนวันเรียน';
  return d.map(x => DAY_TH[x]).join(' ');
}

/* ---------- ตรรกะแต้ม ---------- */
const cfg = () => S.settings;
const kidById = id => S.kids.find(k => k.id === id);
/* ---- แต้มมี 2 กระเป๋า ----
   daily = แต้มประจำวันจากกิจวัตรหลัก → ใช้ซื้อรางวัลเล็ก
   extra = แต้มพิเศษจากงานเสริม + โบนัสทำครบตรงเวลา → ใช้ซื้อรางวัลใหญ่เท่านั้น  */
const POT_FIELD = {daily:'points', extra:'extra'};
const POT_NAME  = {daily:'แต้มประจำวัน', extra:'แต้มพิเศษ'};
const balance = (kidId, pot) => Number((kidById(kidId)||{})[POT_FIELD[pot||'daily']] || 0);
/* จองแต้มที่ยังรออนุมัติไว้ก่อน — คำขอแลกรางวัล (ทั้งคนขอและคนช่วยหาร)
   และคำขอแบ่งแต้มให้พี่น้อง (จองเฉพาะฝั่งคนให้) จะได้ไม่ใช้แต้มก้อนเดียวกันซ้ำ */
const reserved = (kidId, pot) => S.pending.filter(p => (p.pot||'daily') === (pot||'daily')
                          && ( (p.type==='reward'   && (p.kidId===kidId || p.partnerId===kidId))
                            || (p.type==='transfer' &&  p.kidId===kidId)
                            || (p.type==='join'     &&  p.kidId===kidId) ))
                          .reduce((s,p)=>s+Number(p.pts),0);
/* แต้มที่เอาไปค้ำประกันให้พี่น้อง ยังอยู่ในกระเป๋าแต่แตะไม่ได้จนกว่าหนี้จะปิด */
const held = (kidId, pot) => kidBank(kidId)
  .filter(b => b.kind==='collateral' && (b.pot||'daily') === (pot||'daily'))
  .reduce((s,b) => s + Number(b.amount), 0);
const available = (kidId, pot) => balance(kidId, pot) - reserved(kidId, pot) - held(kidId, pot);

/* ---- เพดานจำนวนครั้งของรางวัล ---- */
function weekStartTs(){
  const d = new Date(now()); const dow = (d.getDay()+6)%7;   // จันทร์ = ต้นสัปดาห์
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d.getTime();
}
function dayStartTs(){ const d = new Date(now()); d.setHours(0,0,0,0); return d.getTime(); }
/* โควตารายวันแยกเป็น 2 ถัง — กันเคส "น้องดูเองไปแล้ว พี่กลับมาชวนดูด้วยกัน แล้วน้องกดไม่ได้"
   own = รอบที่ตัวเองเป็นคนเริ่ม · inv = รอบที่พี่น้องชวนมาหาร
   แต่ละถังใช้เพดาน limitDay เท่ากัน → วันหนึ่งจึงได้สูงสุด 2 รอบ แต่เริ่มเองได้แค่ 1
   โควตารายสัปดาห์นับรวมทั้งสองถัง จึงยังคุมเวลาจอรวมไว้เท่าเดิม */
function usedTimes(kidId, rid){
  const d = dayStartTs(), w = weekStartTs(), rows = [];
  S.log.forEach(l => {
    if(l.kind === 'reward' && l.rid === rid && l.kidId === kidId) rows.push({ts:l.ts, inv: !!l.inv});
  });
  S.pending.forEach(p => {
    if((p.type !== 'reward' && p.type !== 'join') || p.rid !== rid) return;
    if(p.kidId === kidId) rows.push({ts:p.ts, inv:false});
    else if(p.partnerId === kidId) rows.push({ts:p.ts, inv:true});
  });
  const today = rows.filter(x => x.ts >= d);
  return {day: today.length,
          own: today.filter(x => !x.inv).length,
          inv: today.filter(x =>  x.inv).length,
          week: rows.filter(x => x.ts >= w).length};
}
/* asInvited = true → เช็กถัง "ถูกชวน" (ใช้ตอนหาว่าใครมาหารกับเราได้บ้าง) */
function limitLeft(kidId, r, asInvited){
  const u = usedTimes(kidId, r.id);
  const ld = Number(r.limitDay || 0);
  const dLeft = ld ? ld - (asInvited ? u.inv : u.own) : Infinity;
  const wLeft = Number(r.limitWeek||0) ? Number(r.limitWeek) - u.week : Infinity;
  return {ok: dLeft > 0 && wLeft > 0, dLeft, wLeft, used:u, invited: !!asInvited};
}
/* ---- แบ่งแต้มให้พี่น้อง: เพดานต่อคนต่อวัน (0 = ไม่จำกัด) ---- */
const giveCap = () => Number(cfg().maxGiveDay || 0);
function givenToday(kidId){
  const d = dayStartTs();
  const done = S.log.filter(l => l.kind==='transfer' && l.kidId===kidId && Number(l.delta)<0 && l.ts>=d)
                    .reduce((s,l)=>s+Math.abs(Number(l.delta)),0);
  const wait = S.pending.filter(p => p.type==='transfer' && p.kidId===kidId && p.ts>=d)
                    .reduce((s,p)=>s+Number(p.pts),0);
  return done + wait;
}
function giveLeft(kidId){ const c = giveCap(); return c ? Math.max(0, c - givenToday(kidId)) : Infinity; }

/* ============================================================
   🏦 ธนาคารแต้ม — เก็บบัญชีไว้ในฟิลด์ bank[] ของเด็กแต่ละคน
   deposit = ฝากล็อกเวลา ได้ดอกตอนครบกำหนด · loan = ยืม มีดอก หักคืนอัตโนมัติ
   ============================================================ */
const DAYMS = 86400000;
const bankOn = () => cfg().bankOn !== false;
const bankOf = k => Array.isArray((k||{}).bank) ? (k||{}).bank : [];
const kidBank = kidId => bankOf(kidById(kidId));
const activeLoan = kidId => kidBank(kidId).find(b => b.kind==='loan');
const myDeposits = kidId => kidBank(kidId).filter(b => b.kind==='deposit');
const depositIn = (kidId, pot) => myDeposits(kidId).find(b => b.pot === pot);
const depCap = pot => Number(pot==='extra' ? (cfg().depCapExtra||0) : (cfg().depCapDaily||0));
/* ตารางดอกฝากเก็บเป็นข้อความ "วัน:% , วัน:%" เพื่อให้พ่อแม่แก้เองได้ง่าย */
function depTiers(pot){
  return String((pot==='extra' ? cfg().depExtra : cfg().depDaily) || '')
    .split(',').map(s => s.trim()).filter(Boolean)
    .map(s => { const a = s.split(':'); return {days:parseInt(a[0],10)||0, pct:parseFloat(a[1])||0}; })
    .filter(t => t.days > 0 && t.pct >= 0).sort((a,b) => a.days - b.days);
}
const depInterest = d => Math.floor(Number(d.amount) * Number(d.pct) / 100);
const matured = d => now() >= Number(d.dueTs);
const graceEndOf = ln => Number(ln.openTs) +
  Number(ln.grace !== undefined ? ln.grace : (cfg().loanGraceDays||0)) * DAYMS;
/* ยอดหนี้ ณ ตอนนี้
   • ช่วงปลอดดอก (3 วันแรก) คืนครบ = ไม่เสียดอกเลย
   • พ้นช่วงนั้นคิดดอกเต็มทันที · เลยกำหนดแล้วเดินต่อวันละ loanLatePct จนชนเพดาน loanMaxPct */
function loanOwed(ln){
  const base = Number(ln.amount), pct0 = Number(ln.rate || cfg().loanPct || 0);
  const paid0 = Number(ln.paid || 0), gEnd = graceEndOf(ln);
  if(now() < gEnd) return {total:base, paid:paid0, left:Math.max(0, base - paid0),
                           late:0, pctNow:0, inGrace:true, graceEnd:gEnd};
  const late = Math.max(0, Math.floor((now() - Number(ln.dueTs)) / DAYMS));
  const cap  = Math.max(pct0, Number(cfg().loanMaxPct || pct0));
  const pctNow = Math.min(cap, pct0 + late * Number(cfg().loanLatePct || 0));
  // คูณก่อนหารร้อย — ถ้าเขียน base*(1+pct/100) ทศนิยมลอยตัวจะเพี้ยน (340*1.1 = 374.0000000000001)
  const total = base + Math.ceil(base * pctNow / 100);
  return {total, paid:paid0, left: Math.max(0, total - paid0),
          late, pctNow, inGrace:false, graceEnd:gEnd};
}
/* ยืมได้กี่ครั้งแล้วสัปดาห์นี้ (นับทั้งที่อนุมัติแล้วและที่รออนุมัติ) */
function loansThisWeek(kidId){
  const w = weekStartTs();
  return S.log.filter(l => l.kind==='loan' && l.kidId===kidId && l.ts >= w).length
       + S.pending.filter(p => p.type==='loan' && p.kidId===kidId && p.ts >= w).length;
}
/* โบนัสฝากคู่: เงินฝากของพี่น้องที่ครบกำหนด "วันเดียวกัน" และล็อกยาวพอทั้งคู่ */
function coDepPartner(kidId, d){
  const minD = Number(cfg().coDepMinDays || 0);
  if(!Number(cfg().coDepBonusPct) || Number(d.days) < minD) return null;
  const day = dstr(d.dueTs);
  for(const o of S.kids){
    if(o.id === kidId) continue;
    if(bankOf(o).some(x => x.kind==='deposit' && Number(x.days) >= minD && dstr(x.dueTs) === day)) return o;
    if(S.log.some(l => l.kidId===o.id && l.kind==='withdraw' && l.dueDay === day && Number(l.iv) > 0)) return o;
  }
  return null;
}
const coDepBonus = d => Math.min(Number(cfg().coDepBonusMax || 0),
                                 Math.floor(Number(d.amount) * Number(cfg().coDepBonusPct || 0) / 100));
function untilTxt(ts){
  const ms = Number(ts) - now();
  if(ms <= 0) return `เลยกำหนดมา ${Math.floor(-ms/DAYMS)} วัน`;
  const d = Math.floor(ms/DAYMS), h = Math.floor((ms % DAYMS)/3600000);
  return d ? `อีก ${d} วัน ${h} ชม.` : `อีก ${h} ชม.`;
}
/* เขียนบัญชีธนาคาร + แต้ม + ประวัติ ในก้อนเดียว (atomic) จะได้ไม่มีทางแต้มหายกลางทาง */
async function bankCommit(kidId, entry, bankArr){
  const b = writeBatch(db);
  const u = {};
  if(bankArr) u.bank = bankArr;
  if(entry){
    b.set(dref('log', entry.id), entry);
    if(entry.delta) u[POT_FIELD[entry.pot || 'daily']] = increment(Number(entry.delta));
  }
  if(Object.keys(u).length) b.update(dref('kids', kidId), u);
  await b.commit();
}
/* รายงานเงินเฟ้อให้พ่อแม่ดู — ดอกที่ "พิมพ์ใหม่" เทียบกับดอกยืมที่ "เผาทิ้ง" */
function bankReport(days){
  const from = now() - days*DAYMS;
  let created = 0, repaid = 0, principal = 0, earned = 0;
  S.log.forEach(l => {
    if(l.ts < from) return;
    const d = Number(l.delta);
    if(l.kind === 'withdraw') created += Number(l.iv || 0);
    else if(l.kind === 'repay') repaid += Math.abs(d);
    else if(l.kind === 'loan') principal += d;
    else if((l.kind === 'chore' || l.kind === 'bonus') && d > 0) earned += d;
  });
  const burned = Math.max(0, repaid - principal);
  const net = created - burned;
  return {created, burned, net, earned,
          pct: earned ? Math.round(net/earned*1000)/10 : 0};
}

function doneToday(kidId, name){
  const t = todayStr();
  return S.log.some(l => l.kidId===kidId && l.kind==='chore' && l.name===name && dstr(l.ts)===t)
      || S.pending.some(p => p.kidId===kidId && p.type==='chore' && p.name===name && dstr(p.ts)===t);
}
/* ---------- งานยกยอด (carry) ----------
   งานบางอย่างของวันธรรมดายกไปทำอีกวันได้ เช่น การบ้านวันศุกร์ → วันอาทิตย์ แต่ได้แต้มไม่เต็ม
   carryDay = วันที่ยกไปทำได้ (0=อา) · carryPct = ได้กี่ % ของแต้มเดิม
   วันต้นทางไม่ต้องตั้ง — ระบบไล่ย้อนจาก carryDay หาวันทำงานล่าสุดของงานนั้นเอง */
const hasCarry = c => c && c.carryDay !== undefined && c.carryDay !== '' && c.carryDay !== null;
const daysOf = c => Array.isArray(c.days) ? c.days : ALLDAYS;
const isCarryDow = (c, dow) =>
  hasCarry(c) && Number(c.carryDay) === dow && daysOf(c).indexOf(dow) < 0;
const isCarryToday = c => isCarryDow(c, new Date(now()).getDay());
/* แต้มของงานนี้ในวันที่ระบุ — วันยกยอดได้ไม่เต็ม */
const ptsOn = (c, dow) => isCarryDow(c, dow)
  ? Math.max(1, Math.round(Number(c.pts) * Number(c.carryPct || 100) / 100)) : Number(c.pts);
const ptsToday = c => ptsOn(c, new Date(now()).getDay());
/* วันต้นทางของงานยกยอด = วันทำงานล่าสุดก่อนถึง carryDay */
function carrySrcDow(c){
  if(!hasCarry(c)) return -1;
  const days = daysOf(c);
  for(let i=1;i<=7;i++){ const d = (Number(c.carryDay) - i + 7) % 7; if(days.indexOf(d) >= 0) return d; }
  return -1;
}
function carrySrcTs(c){                       // timestamp ต้นวันของวันต้นทางล่าสุดที่ผ่านมา
  const src = carrySrcDow(c); if(src < 0) return 0;
  const d = new Date(now()); d.setHours(0,0,0,0);
  for(let i=0;i<8;i++){ if(d.getDay() === src) return d.getTime(); d.setDate(d.getDate()-1); }
  return 0;
}
/* ทำวันต้นทางไปแล้ว → วันยกยอดไม่ต้องโผล่ให้ทำซ้ำ */
function carryDone(kidId, c){
  if(!isCarryToday(c)) return false;
  const ts = carrySrcTs(c); if(!ts) return false;
  const ds = dstr(ts);
  return S.log.some(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===ds)
      || S.pending.some(p => p.kidId===kidId && p.type==='chore' && p.name===c.name && dstr(p.ts)===ds);
}
function appliesOn(c, d){
  const dow = (d ? new Date(d) : new Date(now())).getDay();
  const days = daysOf(c);
  return !days.length || days.indexOf(dow) >= 0 || isCarryDow(c, dow);
}
/* งานของเด็กคนนี้วันนี้ — ตัดงานยกยอดที่เขาทำวันต้นทางไปแล้วออก */
const appliesFor = (kidId, c, d) => appliesOn(c, d) && !carryDone(kidId, c);
function evalTiming(c, t){
  t = t === undefined ? now() : t;
  const full = ptsOn(c, new Date(t).getDay());     // วันยกยอดได้แต้มไม่เต็ม
  if(!c.due) return {status:'', lateMin:0, pts:full};
  const late = Math.round((t - dueDateOf(c.due, t))/60000);
  if(late <= 0) return {status:'ontime', lateMin:0, pts:full};
  if(late <= Number(c.grace||10))
    return {status:'late', lateMin:late, pts:Math.max(1, Math.round(full*Number(c.latePct||50)/100))};
  return {status:'toolate', lateMin:late, pts:0};
}
const STATUS_TXT = {ontime:'ทันเวลา', late:'สายนิดหน่อย', toolate:'สายเกินไป'};
const STATUS_COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)'};
const windowOpen = c => !c.from || now() >= dueDateOf(c.from).getTime();
const dueKey = c => c.due || '99:99';
const chainToday = () => S.chores.filter(c => c.routine && c.by==='kid' && c.chain !== false && appliesOn(c))
  .sort((a,b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : 0);
function blockedBy(c, kidId){
  if(!cfg().stepOrder || !c.routine || c.by !== 'kid' || c.chain === false) return null;
  const list = chainToday();
  const idx = list.findIndex(x => x.id === c.id);
  if(idx <= 0) return null;
  for(let i=0;i<idx;i++) if(!doneToday(kidId, list[i].name)) return list[i];
  return null;
}
const routineToday = () => S.chores.filter(c => c.routine && appliesOn(c));
/* รายการของเด็กคนนี้โดยเฉพาะ — ตัดงานยกยอดที่เขาทำวันต้นทางไปแล้ว */
const routineFor = kidId => S.chores.filter(c => c.routine && appliesFor(kidId, c));
/* แต้มเต็มของวันที่งานเยอะที่สุดในสัปดาห์ — ใช้เป็นฐานคิดโบนัสตามสัดส่วน */
function weekPeakRoutine(){
  let m = 0;
  for(let d=0; d<7; d++){
    const s = S.chores.filter(c => c.routine && appliesOn(c, nextDowTs(d)))
                      .reduce((a,c) => a + ptsOn(c, d), 0);
    if(s > m) m = s;
  }
  return m;
}
function nextDowTs(dow){                 // timestamp ของวัน dow ในสัปดาห์นี้ (ใช้แค่หา getDay)
  const d = new Date(now()); d.setHours(12,0,0,0);
  d.setDate(d.getDate() + ((dow - d.getDay() + 7) % 7));
  return d.getTime();
}
/* โบนัสตรงเวลาครบทั้งวัน คิดตามสัดส่วนงานของวันนั้น — วันงานน้อยได้โบนัสน้อยลงตามส่วน
   ทำให้โบนัสรวมทั้งสัปดาห์เท่าเดิม ไม่ว่าจะย้ายงานไปวันไหน (กันแต้มเฟ้อ) */
function bonusFor(kidId){
  const b = Number(cfg().perfectBonus || 0); if(!b) return 0;
  const peak = weekPeakRoutine(); if(!peak) return 0;
  const mine = routineFor(kidId).reduce((s,c) => s + ptsToday(c), 0);
  if(mine <= 0) return 0;
  return Math.max(1, Math.round(b * mine / peak));
}
function routineProgress(kidId){
  const list = routineFor(kidId);
  const left = list.filter(c => !doneToday(kidId, c.name));
  return {total:list.length, done:list.length-left.length, left, complete:list.length>0 && left.length===0};
}
/* คะแนนวันนี้ = ได้กี่แต้มจากกิจวัตร เทียบกับแต้มเต็มที่เป็นไปได้ (รวมโบนัสตรงเวลาครบ) */
function todayScore(kidId){
  const routine = routineFor(kidId);
  const names = {}; routine.forEach(c => { names[c.name] = true; });
  const max = routine.reduce((s,c) => s + ptsToday(c), 0);
  const t = todayStr();
  const mine = S.log.filter(l => l.kidId===kidId && dstr(l.ts)===t);
  let core = 0, extra = 0, minus = 0;
  mine.forEach(l => {
    const d = Number(l.delta);
    if(l.kind === 'bonus') extra += d;
    else if(l.kind === 'chore') { if(names[l.name]) core += d; else extra += d; }
    else if(l.kind === 'penalty' || (l.kind === 'adjust' && d < 0)) minus += d;
    else if(l.kind === 'adjust' && d > 0) extra += d;
  });
  const waiting = S.pending.filter(p => p.kidId===kidId && p.type==='chore' && dstr(p.ts)===t)
                           .reduce((s,p) => s + Number(p.pts), 0);
  return {max, core, extra, minus, waiting,
          pct: max ? Math.round(core / max * 100) : 0,
          perfect: max > 0 && core >= max};
}
function onTimeStreak(kidId){
  let streak = 0;
  for(let i=0;i<120;i++){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    const ds = dstr(d.getTime());
    const timed = S.chores.filter(c => c.routine && c.due && appliesOn(c, d.getTime()));
    if(!timed.length){ if(i===0) continue; else break; }
    const all = timed.every(c => {
      const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===ds);
      return e && e.status==='ontime';
    });
    if(all) streak++; else if(i===0) continue; else break;
  }
  return streak;
}

/* ============================================================
   เขียนข้อมูล (Firestore เขียนลงเครื่องก่อนแล้วค่อยซิงก์ — กดปุ๊บเห็นผลปั๊บ)
   ============================================================ */
function logEntry(kidId, kind, name, emo, delta, extra){
  return Object.assign({id:uid(), ts:now(), kidId, kind, name, emo, delta:Number(delta),
                        pot:'daily', rid:'', due:'', status:'', lateMin:0}, extra||{});
}
async function addLog(entry){
  const b = writeBatch(db);
  b.set(dref('log', entry.id), entry);
  // Only accepted, point-earning chores grant a ticket; pending/bonus/adjust never do.
  if(entry.kind==='chore' && Number(entry.delta)>0)
    b.set(dref('adventureTickets',entry.id),{id:entry.id,kidId:entry.kidId,state:'ready',createdAt:entry.ts});
  const d = Number(entry.delta), earn = d > 0 && (entry.kind === 'chore' || entry.kind === 'bonus');
  const u = {};
  if(d) u[POT_FIELD[entry.pot || 'daily']] = increment(d);
  // XP สะสมตลอดกาล — ใช้แต้มไปแล้วก็ไม่ลด เลเวลจึงไม่มีวันถอยหลัง
  if(earn) u.xp = increment(d);
  // ความอบอุ่นของไข่ — ได้จาก "ตรงเวลา" เท่านั้น ซื้อไม่ได้ แลกไม่ได้
  const warm = entry.kind === 'bonus' ? WARM_PERFECT
             : (entry.kind === 'chore' && entry.status === 'ontime') ? WARM_ONTIME : 0;
  if(warm) u.eggWarm = increment(warm);
  // อ่านค่าก่อนเขียน — หลัง commit แล้ว S อาจอัปเดตหรือยังไม่อัปเดตก็ได้ (snapshot มาไม่แน่นอน)
  // ถ้าไปอ่านทีหลังจะนับซ้ำหรือหลุดได้ จึงล็อกค่าตั้งต้นไว้ตรงนี้เลย
  const k0 = kidById(entry.kidId) || {};
  const xp0 = Number(k0.xp || 0), warm0 = Number(k0.eggWarm || 0);
  if(Object.keys(u).length) b.update(dref('kids', entry.kidId), u);
  await b.commit();
  if(earn) await afterEarn(entry.kidId, xp0, d, warm0, warm);
  // ได้แต้มประจำวันมาใหม่ → หักใช้หนี้อัตโนมัติทันที (bankCommit ไม่วิ่งผ่านตรงนี้ จึงไม่วน)
  if(bankOn() && (entry.pot||'daily') === 'daily' && d > 0)
    await autoRepay(entry.kidId, d);
}
/* หลังได้แต้ม: เช็กเลเวลอัพ แล้วเช็กไข่แตก (S ยังไม่ทันอัปเดตจาก snapshot จึงคำนวณจากค่าก่อนหน้า + ที่เพิ่งได้) */
async function afterEarn(kidId, xp0, gained, warm0, warm){
  if(levelOf(xp0 + gained).lv > levelOf(xp0).lv){
    const L = levelOf(xp0 + gained);
    cheer.push({lv:2, emo:L.emo, title:`เลเวลอัพ! Lv.${L.lv}`, big:L.name, color:'var(--gold)',
      sub:'ได้ฉายาใหม่ประจำตัวแล้ว เก่งมาก!', toast:`🎉 เลเวลอัพ! Lv.${L.lv} ${L.name}`});
  }
  if(warm) await checkHatch(kidId, warm0 + warm);
}
/* ไข่ครบความอบอุ่น → ฟักเป็นสัตว์เลี้ยงแบบสุ่ม แล้วเริ่มฟองใหม่ (ฟองถัดไปต้องการมากขึ้น) */
async function checkHatch(kidId, warm){
  const k = kidById(kidId); if(!k) return;
  const need = eggNeed(k);
  if(warm < need) return;
  const owned = Array.isArray(k.pets) ? k.pets : [];
  const P = rollPet(owned), R = RARITY[P.r];
  try{
    await updateDoc(dref('kids', kidId),
      {pets: owned.concat([P.e]), eggWarm: Math.max(0, warm - need)});
    cheer.push({lv:3, emo:P.e, title:`ไข่ฟักแล้ว! ${P.r===2?'✨ ตำนาน ✨':P.r===1?'⭐ หายาก':'🎊'}`,
      big:`${P.n} · ${P.th}`, color:R.c,
      sub:`สัตว์ระดับ "${R.k}" — ฟักได้จากการทำงานตรงเวลาเท่านั้น ซื้อด้วยแต้มไม่ได้นะ`,
      toast:`ไข่ฟักแล้ว! ได้ ${P.e} ${P.n} (${R.k})`});
  }catch(e){ fail(e); }
}
async function removeLog(entry){
  const b = writeBatch(db);
  b.delete(dref('log', entry.id));
  if(entry.kind==='chore')b.delete(dref('adventureTickets',entry.id));
  if(entry.delta){
    const f = POT_FIELD[entry.pot || 'daily'];
    b.update(dref('kids', entry.kidId), {[f]: increment(-Number(entry.delta))});
  }
  await b.commit();
}
async function checkPerfectDay(kidId){
  const bonus = bonusFor(kidId);            // คิดตามสัดส่วนงานของวันนั้น
  if(!bonus) return false;
  const t = todayStr();
  const timed = routineFor(kidId).filter(c => c.due);
  if(!timed.length) return false;
  const allOnTime = timed.every(c => S.log.some(l =>
    l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===t && l.status==='ontime'));
  if(!allOnTime) return false;
  if(S.log.some(l => l.kidId===kidId && l.kind==='bonus' && dstr(l.ts)===t)) return false;
  await addLog(logEntry(kidId, 'bonus', 'ตรงเวลาครบทั้งวัน 🎉', '🏅', bonus, {pot:'extra'}));
  toast(`สุดยอด! ตรงเวลาครบทุกอย่าง +${bonus} แต้มพิเศษ 🏅`);
  return true;
}
/* ---------- 🔊 เสียง: สังเคราะห์สดด้วย WebAudio ไม่ต้องโหลดไฟล์เสียงเลย ---------- */
let AC = null;
const soundOn = () => cfg().soundOn !== false;
function tone(freq, at, dur, vol, type){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}
const SFX = {                              // โน้ตไล่ขึ้นทั้งหมด = ฟังแล้วรู้สึก "สำเร็จ"
  done:  [[660,0,.14],[880,.09,.20]],
  coin:  [[988,0,.10],[1319,.06,.16]],
  big:   [[523,0,.14],[659,.10,.14],[784,.20,.14],[1047,.30,.34]],
  hatch: [[392,0,.16],[523,.12,.16],[659,.24,.16],[784,.36,.16],[1047,.48,.40]],
  level: [[523,0,.12],[784,.10,.12],[1047,.20,.12],[1319,.30,.40]],
  oops:  [[300,0,.16],[200,.10,.24]]
};
function sfx(name){
  if(!soundOn()) return;
  (SFX[name] || SFX.done).forEach(n => tone(n[0], n[1], n[2], .16, 'triangle'));
}
/* ---------- 🎉 กระดาษโปรย — วาดบน canvas ใบเดียว ไม่ขวางการกดจอ ---------- */
let cfCanvas = null, cfParts = [], cfRunning = false;
function boom(n, power){
  const cv = cfCanvas || (cfCanvas = (() => {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
    document.body.appendChild(c); return c;
  })());
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const COL = ['#4a6491','#c9973f','#4f8172','#bd6b57','#8b7fa8','#3e8e9c','#d08a4e'];
  const pw = power || 1;
  for(let i=0;i<n;i++) cfParts.push({
    x: W/2 + (Math.random()-.5)*W*.5, y: H*.42 + (Math.random()-.5)*60,
    vx: (Math.random()-.5)*13*pw, vy: (-7 - Math.random()*9)*pw,
    s: 6 + Math.random()*7, r: Math.random()*Math.PI, vr: (Math.random()-.5)*.35,
    c: COL[(Math.random()*COL.length)|0], life: 1
  });
  if(cfRunning) return;
  cfRunning = true;
  const ctx = cv.getContext('2d');
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    cfParts = cfParts.filter(p => p.life > 0 && p.y < cv.height + 40);
    cfParts.forEach(p => {
      p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .992; p.life -= .006;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s*.35, p.s, p.s*.7);
      ctx.restore();
    });
    if(cfParts.length) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,cv.width,cv.height); cfRunning = false; }
  })();
}
/* ระดับการฉลอง: 1 = กดงานเสร็จ · 2 = ครบทั้งวัน/เลเวลอัพ · 3 = ไข่แตก */
function celebrate(level){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
    sfx(level>=3?'hatch':level>=2?'level':'done'); return;
  }
  if(level >= 3){ boom(150, 1.25); setTimeout(() => boom(90, 1), 320); sfx('hatch'); }
  else if(level >= 2){ boom(110, 1.1); sfx('level'); }
  else { boom(45, .85); sfx('done'); }
}

function fail(e){ console.error(e); toast('บันทึกไม่สำเร็จ — ' + (e && e.code ? e.code : 'ลองใหม่อีกครั้ง')); }

/* เหตุการณ์ใหญ่ (เลเวลอัพ / ไข่แตก) เข้าคิวไว้ตรงนี้ แล้วให้หน้าสรุปหยิบไปโชว์แทนผลงานธรรมดา
   — เด็กจะได้เห็นของที่ตื่นเต้นที่สุดเป็นพระเอก ไม่ใช่โดนหน้า "+16 แต้ม" ทับ */
let cheer = [];
function showFlash(o){
  const top = cheer.sort((a,b) => b.lv - a.lv)[0];
  cheer = [];
  const small = `${o.title} ${o.big}`;
  const view = top ? Object.assign({}, top, {extra: o.extra ? `${small} · ${o.extra}` : small}) : o;
  celebrate(top ? top.lv : 1);
  if(!cfg().autoHome){ if(view.toast) toast(view.toast); return; }
  clearTimeout(flashTimer);
  flash = Object.assign({left: Number(cfg().autoHomeSec || 5) + (top ? 4 : 0)}, view);
  render();
  tickFlash();
}
function tickFlash(){
  flashTimer = setTimeout(() => {
    if(!flash) return;
    flash.left--;
    if(flash.left <= 0){ flash = null; go('pick'); }
    else { render(); tickFlash(); }
  }, 1000);
}
function stayHere(){ clearTimeout(flashTimer); flash = null; render(); }
function goHomeNow(){ clearTimeout(flashTimer); flash = null; go('pick'); }

function go(screen, tab){

  view.screen=screen; if(tab) view.tab=tab; view.pinBuf=''; render();
}
function setTab(t){ view.tab=t; render(); }

/* ---------- หน้าเด็ก ---------- */
/* สถานะของงานหนึ่งชิ้น — ใช้ทั้งในแถวงานและแถบติดตามความคืบหน้า */
function choreState(c, kidId){
  if(c.once && doneToday(kidId, c.name)) return 'done';
  if(c.by === 'parent') return 'parent';
  if(!windowOpen(c)) return 'early';
  if(blockedBy(c, kidId)) return 'locked';
  const t = evalTiming(c);
  return (t.status === 'late' || t.status === 'toolate') ? 'late' : 'ready';
}
const STATE_ICON = {done:'✅', parent:'👩', early:'⏳', locked:'🔒', late:'⚠️', ready:'👉'};

/* แถบติดตาม — เห็นทั้งวันในแถวเดียว ว่าทำอะไรไปแล้วบ้าง */
function taskStrip(kidId){
  const list = routineFor(kidId).slice().sort((a,b) => (a.due||'99') < (b.due||'99') ? -1 : 1);
  if(!list.length) return '';
  const cls = {done:'done', ready:'now', late:'late', early:'wait', locked:'wait', parent:'wait'};
  return `<div class="strip">${list.map(c => {
    const st = choreState(c, kidId);
    return `<div class="chip ${cls[st]}" title="${esc(c.name)}">
      <span>${c.emo}</span><small>${STATE_ICON[st]}</small></div>`;
  }).join('')}</div>`;
}

/* แถวงาน — ออกแบบให้เด็กที่ยังอ่านไม่ออกดูรู้เรื่อง
   ใช้ ไอคอนใหญ่ + สีขอบ + ตัวเลขเวลา แทนประโยคยาว ๆ */
/* ---------- ⏳ แท่งเวลานับถอยหลัง ----------
   แท่งหดจริงตามเวลาที่เหลือ · 15 นาทีสุดท้ายเปลี่ยนเป็นโหมดด่วน · หมดเวลาแล้วนับสายขึ้นเรื่อย ๆ */
const urgentMin = () => Number(cfg().urgentMin === undefined ? 15 : cfg().urgentMin);
function cdStage(leftMin){
  if(leftMin <= 0) return 'hot';
  if(leftMin <= 5) return 'hot';
  return leftMin <= urgentMin() ? 'warn' : 'ok';
}
function cdText(leftMin, lateMin, pts, due){
  const to = due ? ` · ถึง ${due} น.` : '';
  if(leftMin > 0) return {num:leftMin, lab:`นาที<small>เหลือเวลา${to}</small>`};
  return {num:lateMin, lab:`นาที<small>สายแล้ว${pts>0?` · ได้ ${pts} แต้ม`:' · หมดเวลา'}${to}</small>`};
}
function countdown(c){
  if(!c.due) return '';
  const due = dueDateOf(c.due).getTime();
  const start = c.from ? dueDateOf(c.from).getTime() : due - 60*60000;   // ไม่มีเวลาเริ่ม → ถือว่า 1 ชม.
  const span = Math.max(60000, due - start);
  const elapsed = Math.min(span, Math.max(0, now() - start));
  const leftMin = Math.ceil((due - now())/60000);
  const t = evalTiming(c);
  const running = leftMin > 0;
  const secs = Math.round(span/1000), delay = Math.round(elapsed/1000);
  const anim = running
    ? `animation-duration:${secs}s;animation-delay:-${delay}s`
    : 'animation:none';
  const txt = cdText(leftMin, t.lateMin, t.pts, c.due);
  const pct = running ? Math.max(0, Math.min(100, Math.round((due - now())/span*100))) : 0;
  return `<div class="cd ${cdStage(leftMin)}" data-due="${due}" data-span="${span}"
    data-to="${c.due}" data-grace="${Number(c.grace||10)}" data-lp="${Math.max(1, Math.round(Number(ptsToday(c))*Number(c.latePct||50)/100))}">
    <div class="cd-top">
      <span class="cd-num">${txt.num}</span>
      <span class="cd-lab">${txt.lab}</span>
      <span class="cd-pct">${pct}%</span>
    </div>
    <div class="cd-bar"><i style="${running?anim:'width:0'}"></i></div>
  </div>`;
}
/* เดินตัวเลขทุกวินาทีแบบแตะเฉพาะจุด — ไม่ re-render ทั้งหน้า (แท่งหดเองด้วย CSS อยู่แล้ว) */
function tickCountdowns(){
  const t = Date.now();
  document.querySelectorAll('.cd[data-due]').forEach(el => {
    const due = Number(el.getAttribute('data-due'));
    const leftMin = Math.ceil((due - t)/60000);
    const lateMin = Math.max(0, Math.round((t - due)/60000));
    const num = el.querySelector('.cd-num'), lab = el.querySelector('.cd-lab');
    if(!num || !lab) return;
    const g = Number(el.getAttribute('data-grace')||0);
    const pts = lateMin <= g ? Number(el.getAttribute('data-lp')||0) : 0;
    const txt = cdText(leftMin, lateMin, pts, el.getAttribute('data-to')||'');
    num.textContent = txt.num;
    if(lab.innerHTML !== txt.lab) lab.innerHTML = txt.lab;
    const pctEl = el.querySelector('.cd-pct'), span = Number(el.getAttribute('data-span')||0);
    if(pctEl && span) pctEl.textContent =
      Math.max(0, Math.min(100, Math.round((due - t)/span*100))) + '%';
    const stage = cdStage(leftMin);
    if(!el.classList.contains(stage)){
      el.classList.remove('ok','warn','hot'); el.classList.add(stage);
    }
  });
}
setInterval(tickCountdowns, 1000);

function choreRow(c, kidId){
  const st = choreState(c, kidId);          // ใช้ตัวเดียวกับแถบติดตาม จะได้ไม่มีทางขัดกัน
  const used = st === 'done';
  const t = evalTiming(c);
  const early = st === 'early';
  const prev  = st === 'locked' ? blockedBy(c, kidId) : null;
  let state, sub, cls = '', btn;

  if(used){
    const done = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===todayStr());
    state = '✅';
    sub = done ? `<span class="bignum">${fmtClock(done.ts)}</span>` : '⏳';
    cls = 'locked';
    btn = '';
  }else if(c.by === 'parent'){
    state = '👩';
    sub = c.due ? `<span class="bignum">${c.due}</span>` : '';
    cls = 'locked';
    btn = '';
  }else if(early){
    state = '⏳';
    sub = `<span class="bignum">${c.from}</span>`;
    cls = 'locked';
    btn = '';
  }else if(prev){
    state = '🔒';
    sub = `${prev.emo}`;
    cls = 'locked';
    btn = '';
  }else{
    const mins = c.due ? Math.round((dueDateOf(c.due) - now())/60000) : null;
    if(!c.due){ state = '👉'; sub = ''; cls = 'ready'; }
    else if(mins > 0){ state = '👉'; cls = 'ready';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--good)">${mins}′</span>`; }
    else if(t.status === 'late'){ state = '⚠️'; cls = 'warn';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--gold)">+${t.lateMin}′</span>`; }
    else { state = '⚠️'; cls = 'warn';
      sub = `<span class="bignum">${c.due}</span> <span style="color:var(--warn)">+${t.lateMin}′</span>`; }
    btn = `<button class="btn-good btn-done" onclick="doChore('${c.id}')">✓ Done</button>`;
  }
  const shownPts = (!used && c.due) ? t.pts : Number(c.pts);
  // โชว์แท่งเวลาเฉพาะงานที่ "กดได้ตอนนี้" และมีเส้นตาย — งานที่ทำแล้ว/ยังไม่ถึงเวลา/ล็อกคิว ไม่ต้องรก
  const timer = (!used && !early && !prev && c.by !== 'parent' && c.due) ? countdown(c) : '';
  return `<div class="item ${cls}" style="${timer?'flex-wrap:wrap':''}">
    <div class="emo">${c.emo}</div>
    <div class="txt"><b>${esc(c.name)}</b><span class="muted">${sub}</span></div>
    <span class="state">${state}</span>
    <span class="tag ${shownPts>0?'tag-plus':'tag-minus'}">+${shownPts}</span>
    ${btn}
    ${timer ? `<div style="flex-basis:100%">${timer}</div>` : ''}</div>`;
}
function todayCard(k){
  const pr = routineProgress(k.id);
  if(pr.total === 0) return `<div class="card" style="background:var(--gold-soft)">
    <div class="row"><span style="font-size:30px">🌴</span>
      <div style="flex:1"><b>วันหยุด — ไม่มีกิจวัตรวันนี้</b>
        <div class="muted">พักผ่อนได้เต็มที่ ทำงานเสริมเก็บแต้มก็ได้นะ</div></div></div></div>`;
  const s = todayScore(k.id);
  const col = s.pct >= 100 ? 'var(--good)' : s.pct >= 80 ? 'var(--good)'
            : s.pct >= 50 ? 'var(--gold)' : 'var(--warn)';
  const face = s.pct >= 100 ? '🏆' : s.pct >= 80 ? '😄' : s.pct >= 50 ? '🙂' : '💪';
  const msg  = s.pct >= 100 ? 'เพอร์เฟกต์! ได้โบนัสครบทุกแต้ม'
             : s.pct >= 80  ? 'เก่งมาก อีกนิดเดียวก็เต็ม'
             : s.pct >= 50  ? 'มาได้ครึ่งทางแล้ว สู้ต่อ!'
             : 'เริ่มเลย! ทำได้เท่าไหร่ก็ได้แต้มเท่านั้น';
  return `<div class="card" style="border:2px solid ${col}55">
    <div class="row-between" style="align-items:flex-end">
      <div><div class="sec-title" style="margin:0">📊 แต้มวันนี้</div>
        <div style="font-size:26px;font-weight:800;color:${col}">${s.core} <span
          style="font-size:15px;color:var(--muted);font-weight:600">/ ${s.max} แต้ม</span></div></div>
      <div style="text-align:right"><div style="font-size:30px;line-height:1">${face}</div>
        <div style="font-size:30px;font-weight:800;color:${col};line-height:1">${s.pct}%</div></div>
    </div>
    <div class="prog" style="margin-top:10px"><i style="width:${Math.min(100,s.pct)}%;background:${col}"></i></div>
    <div class="row-between">
      <span class="muted">${msg}</span>
      <b class="bignum" style="color:${col};font-size:15px">${pr.done}/${pr.total}</b>
    </div>
    ${taskStrip(k.id)}
    ${(s.extra || s.waiting || s.minus) ? `<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
      ${s.extra   ? `<span class="tag tag-cost">💎 +${s.extra} แต้มพิเศษวันนี้</span>` : ''}
      ${s.waiting ? `<span class="tag tag-wait">รอตรวจอีก ${s.waiting}</span>` : ''}
      ${s.minus   ? `<span class="tag tag-minus">${s.minus} จากการหักแต้ม</span>` : ''}
    </div>` : ''}
  </div>`;
}
function viewKid(){
  const k = kidById(view.kidId);
  if(!k){ view.screen='pick'; return viewPick(); }
  const availD = available(k.id, 'daily'), availE = available(k.id, 'extra');
  const avail = availD;
  const myPend = S.pending.filter(p => p.kidId===k.id || p.partnerId===k.id);
  const tabs = [['chores','วันนี้'],['rewards','ของรางวัล'],['zoo','🐾 คอกสัตว์'],['adventure','🧭 ผจญภัย']]
    .concat(bankOn() ? [['bank','🏦 ธนาคาร']] : []).concat([['history','ประวัติ']]);
  const tabBtns = tabs.map(([id,l]) => `<button class="${view.tab===id?'on':''}" onclick="setTab('${id}')">${l}</button>`).join('');
  let body = '';
  if(view.tab === 'chores'){
    const waiting = myPend.filter(p => p.type==='chore');
    const waitBox = waiting.length ? `<div class="card" style="background:var(--navy-soft)">
      <div class="sec-title" style="margin:0 0 6px">⏳ รอผู้ปกครองตรวจ</div>
      ${waiting.map(p => `<div class="log-line" style="border-color:#d8e0ee">
        <span style="font-size:19px">${p.emo}</span>
        <span style="flex:1">${esc(p.name)}<span class="muted bignum" style="display:block">${fmtClock(p.ts)}</span></span>
        <span class="tag tag-wait">+${p.pts}</span></div>`).join('')}</div>` : '';
    const today = S.chores.filter(c => appliesFor(k.id, c));
    const timed = today.filter(c => c.due).sort((a,b)=> a.due<b.due?-1:1);
    const anytime = today.filter(c => !c.due);
    const routineList = timed.filter(c => c.routine).concat(anytime.filter(c => c.routine));
    const extraList   = timed.filter(c => !c.routine).concat(anytime.filter(c => !c.routine));
    body = petCard(k) + todayCard(k) + waitBox

function logLine(l, withUndo){
  const kid = kidById(l.kidId);
  const d = Number(l.delta);
  const cls = d > 0 ? 'tag-plus' : d < 0 ? (l.kind==='reward'?'tag-cost':'tag-minus') : 'tag-wait';
  const note = l.due ? ' · ' + (l.status==='ontime'
      ? '<span style="color:var(--good)">ทันเวลา</span>'
      : `<span style="color:${STATUS_COL[l.status]}">สาย ${l.lateMin} นาที</span>`) : '';
  const amt = ((l.pot==='extra')?'💎 ':'') + (d>=0?'+':'') + d;
  return `<div class="log-line">
    <span style="font-size:19px">${l.emo || '•'}</span>
    <span style="flex:1;min-width:0">
      <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</span>
      <span class="muted">${kid ? esc(kid.name)+' · ' : ''}${timeAgo(l.ts)}${note}</span></span>
    <span class="tag ${cls}">${amt}</span>
    ${withUndo ? `<button class="btn-ghost btn-sm" onclick="undoLog('${l.id}')">↩︎</button>` : ''}</div>`;
}

/* ---------- การกระทำของเด็ก ---------- */
async function doChore(id){
  const c = S.chores.find(x => x.id===id); if(!c) return;
  if(c.once && doneToday(view.kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  if(!windowOpen(c)){ toast(`ยังไม่ถึงเวลา — เริ่มได้ตอน ${c.from} นะ`); render(); return; }
  const prev = blockedBy(c, view.kidId);
  if(prev){ toast(`ต้องทำ "${prev.name}" ให้เสร็จก่อนนะ`); render(); return; }
  const t = evalTiming(c);
  const commit = async () => {
    try{
      const statusTxt = t.status==='ontime' ? 'ทันเวลา! 🎉'
                      : t.status==='late'   ? `สาย ${t.lateMin} นาที`
                      : t.status==='toolate'? `สาย ${t.lateMin} นาที — รอบหน้าเอาใหม่นะ` : 'เรียบร้อย';
      if(cfg().approveChores){
        const p = {id:uid(), ts:now(), kidId:view.kidId, type:'chore', name:c.name, emo:c.emo,
                   pts:t.pts, full:Number(c.pts), pot: c.routine ? 'daily' : 'extra',
                   due:c.due||'', status:t.status, lateMin:t.lateMin};
        await setDoc(dref('pending', p.id), p);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name, big:'ส่งแล้ว ✓', color:'var(--navy)',
          sub:`${statusTxt} · รอคุณพ่อคุณแม่ตรวจ`,
          extra: `แต้มวันนี้ ${todayScore(view.kidId).core}/${todayScore(view.kidId).max} (${todayScore(view.kidId).pct}%)`,
          toast:`ส่งแล้ว รอตรวจ ${c.emo}`});
      }else{
        await addLog(logEntry(view.kidId, 'chore', c.name, c.emo, t.pts,
                              {pot: c.routine ? 'daily' : 'extra', due:c.due||'', status:t.status, lateMin:t.lateMin}));
        const gotBonus = await checkPerfectDay(view.kidId);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name,
          big: t.pts>0 ? `+${t.pts} แต้ม` : 'ไม่ได้แต้ม',
          color: t.pts>0 ? 'var(--good)' : 'var(--warn)',
          sub: statusTxt,
          extra: gotBonus ? `🏅 ตรงเวลาครบทั้งวัน! โบนัสอีก +${bonusFor(view.kidId)} แต้ม — วันนี้ 100% เต็ม`
               : `แต้มวันนี้ ${todayScore(view.kidId).core}/${todayScore(view.kidId).max} (${todayScore(view.kidId).pct}%)`,
          toast: t.pts>0 ? `ได้ ${t.pts} แต้ม ${c.emo}` : 'บันทึกเวลาแล้ว แต่สายเกินไปเลยไม่ได้แต้ม'});
      }
    }catch(e){ fail(e); }
  };
  commit();          // กดแล้วบันทึกเลย ไม่ถามซ้ำ — ผลลัพธ์ไปแสดงในหน้าสรุปแทน
}
/* ---------- แลกของรางวัล (รางวัลใหญ่บางอย่างหารกันจ่ายได้) ---------- */
const potOf = r => r.big ? 'extra' : 'daily';
/* พี่น้องแลกไปก่อนแล้ว เรายังขอ "ร่วมด้วย" ทีหลังได้ — คนละครึ่ง คนที่จ่ายไปก่อนได้ส่วนต่างคืน
   เงื่อนไข: รางวัลนี้หารได้ · เรายังไม่ได้ใช้โควตาของรายการนี้วันนี้ · เขายังจ่ายเต็มราคาอยู่ (ยังไม่มีคนหาร) */
function joinTarget(kidId, r){
  if(!r || !r.share) return null;
  if(usedTimes(kidId, r.id).day > 0) return null;
  if(S.pending.some(x => x.type==='join' && x.rid===r.id && x.kidId===kidId)) return null;
  const pot = potOf(r), t = todayStr();
  const pend = S.pending.find(x => x.type==='reward' && x.rid===r.id
                            && x.kidId!==kidId && !x.partnerId);
  if(pend) return {kind:'pending', p:pend, other:kidById(pend.kidId), pot};
  const lg = S.log.find(l => l.kind==='reward' && l.rid===r.id && l.kidId!==kidId
                        && dstr(l.ts)===t && Math.abs(Number(l.delta)) === Number(r.cost));
  if(lg) return {kind:'log', l:lg, other:kidById(lg.kidId), pot};
  return null;
}
function joinShare(id){
  const r = S.rewards.find(x => x.id===id), kid = kidById(view.kidId);
  if(!r || !kid) return;
  const jt = joinTarget(kid.id, r);
  modal = null; renderModal();
  if(!jt || !jt.other){ toast('ตอนนี้ยังไม่มีรายการของพี่น้องให้ร่วมนะ'); return; }
  const half = Math.ceil(Number(r.cost)/2), refund = Number(r.cost) - half;
  if(available(kid.id, jt.pot) < half){ toast(POT_NAME[jt.pot]+'ยังไม่พอสำหรับครึ่งหนึ่ง'); return; }
  const msg = jt.kind === 'pending'
    ? `ไปหารกับคำขอของ${jt.other.name}ที่ยังรออนุมัติอยู่ — จ่ายคนละ ${half} แต้ม`
    : `${jt.other.name}จ่ายไป ${r.cost} แล้ว — ถ้าอนุมัติ หนูจ่าย ${half} และ${jt.other.name}ได้คืน ${refund} แต้ม`;
  askKidPin(kid, () => openConfirm(`ขอร่วม "${r.name}"`, msg + ' · รอคุณพ่อคุณแม่อนุมัติก่อนนะ', async () => {
    try{
      if(jt.kind === 'pending'){       // ยังไม่อนุมัติ → แก้คำขอเดิมให้กลายเป็นหารกัน ไม่ต้องคืนอะไร
        await setDoc(dref('pending', jt.p.id),
          Object.assign({}, jt.p, {pts:half, partnerId:kid.id, partnerName:kid.name}));
      }else{                           // อนุมัติไปแล้ว → เข้าคิวใหม่ หักคนขอ + คืนส่วนต่างให้คนแรก
        const q = {id:uid(), ts:now(), kidId:kid.id, type:'join', name:r.name, emo:r.emo,
                   pts:half, total:Number(r.cost), pot:jt.pot, rid:r.id,
                   partnerId:jt.other.id, partnerName:jt.other.name, refund};
        await setDoc(dref('pending', q.id), q);
      }
      showFlash({emo:'🤝', title:'ส่งคำขอร่วมแล้ว', big:`คนละ ${half} แต้ม`, color:'var(--gold)',
        sub:`ร่วมกับ${jt.other.name} · รอคุณพ่อคุณแม่อนุมัติ`, toast:'ส่งคำขอแล้ว'});
    }catch(e){ fail(e); }
  }), `${kid.name} ใส่ PIN เพื่อยืนยันว่าจะจ่าย ${half} แต้มร่วมกับ${jt.other.name}`);
}
function limitMsg(r, lim){
  if(lim.dLeft <= 0) return lim.invited
    ? `วันนี้ถูกชวนหาร "${r.name}" ครบแล้ว (วันละ ${r.limitDay} ครั้ง)`
    : `วันนี้เริ่ม "${r.name}" เองครบแล้ว (วันละ ${r.limitDay} ครั้ง) — แต่ยังถูกพี่น้องชวนหารได้อีก 1 รอบ`;
  if(lim.wLeft <= 0) return `สัปดาห์นี้แลก "${r.name}" ครบแล้ว (สัปดาห์ละ ${r.limitWeek} ครั้ง)`;
  return '';
}
function redeem(id){
  const r = S.rewards.find(x => x.id===id); if(!r) return;
  const kid = kidById(view.kidId); if(!kid) return;
  const pot = potOf(r);
  const lim = limitLeft(kid.id, r);
  if(!lim.ok){ toast(limitMsg(r, lim)); return; }
  const half = Math.ceil(Number(r.cost)/2);
  // คนที่มาหารได้ = ยังมีโควตาถัง "ถูกชวน" เหลือ (แม้เขาจะดูเองไปแล้ววันนี้ก็ยังมาหารรอบใหม่ได้)
  const others = S.kids.filter(x => x.id !== kid.id
    && available(x.id, pot) >= half && limitLeft(x.id, r, true).ok);
  const jt = joinTarget(kid.id, r);          // ตัวเลือกที่ 2: แทรกรอบที่เขาแลกไปแล้ว
  if(r.share && (others.length || jt)){ modal = {kind:'share', r, kid, half, others, pot, jt}; renderModal(); return; }
  if(available(kid.id, pot) < Number(r.cost)){
    toast(r.share ? 'ยังไม่มีใครแต้มพอมาหารด้วย และแต้มตัวเองก็ยังไม่พอ'
                  : POT_NAME[pot] + 'ยังไม่พอ'); return;
  }
  doRedeem(r, kid, Number(r.cost), null);
}
function shareWith(rewardId, partnerId){
  const r = S.rewards.find(x => x.id===rewardId), kid = kidById(view.kidId);
  const partner = kidById(partnerId);
  if(!r || !kid || !partner) return;
  const half = Math.ceil(Number(r.cost)/2), pot = potOf(r);
  modal = null; renderModal();
  if(available(kid.id, pot) < half){ toast(POT_NAME[pot]+'ของหนูยังไม่พอสำหรับครึ่งหนึ่ง'); return; }
  if(available(partner.id, pot) < half){ toast(`${POT_NAME[pot]}ของ${partner.name}ยังไม่พอ`); return; }
  const plim = limitLeft(partner.id, r, true);
  if(!plim.ok){ toast(limitMsg(r, plim).replace('วันนี้', partner.name + ' วันนี้')); return; }
  // ต้องได้รับความยินยอมจากคนที่มาช่วยจ่าย — ให้เขามาใส่ PIN เอง
  askKidPin(partner, () => doRedeem(r, kid, half, partner),
            `${partner.name} มาใส่ PIN เพื่อยืนยันว่ายอมช่วยจ่าย ${half} แต้มนะ`);
}
function shareAlone(rewardId){
  const r = S.rewards.find(x => x.id===rewardId), kid = kidById(view.kidId);
  modal = null; renderModal();
  if(!r || !kid) return;
  if(available(kid.id, potOf(r)) < Number(r.cost)){ toast('แต้มยังไม่พอถ้าจ่ายคนเดียว'); return; }
  doRedeem(r, kid, Number(r.cost), null);
}
function doRedeem(r, kid, pts, partner){
  const pn = POT_NAME[potOf(r)];
  const msg = partner
    ? `หารกับ${partner.name} — จ่าย${pn}คนละ ${pts} รอคุณพ่อคุณแม่อนุมัติก่อนนะ`
    : `ใช้${pn} ${pts} แต้ม — ต้องรอคุณพ่อคุณแม่อนุมัติก่อนนะ`;
  askKidPin(kid, () => openConfirm(`ขอแลก "${r.name}"`, msg, async () => {
    try{
      const p = {id:uid(), ts:now(), kidId:kid.id, type:'reward', name:r.name, emo:r.emo,
                 pts:Number(pts), total:Number(r.cost), pot:potOf(r), rid:r.id,
                 partnerId: partner ? partner.id : '', partnerName: partner ? partner.name : ''};
      await setDoc(dref('pending', p.id), p);
      showFlash({emo:r.emo, title:'ส่งคำขอแลกแล้ว',
        big: partner ? `คนละ ${pts} แต้ม` : `−${pts} แต้ม`, color:'var(--gold)',
        sub: partner ? `หารกับ${partner.name} 🤝 รอคุณพ่อคุณแม่อนุมัติ` : 'รอคุณพ่อคุณแม่อนุมัติก่อนนะ',
        toast:'ส่งคำขอแล้ว รออนุมัติ'});
    }catch(e){ fail(e); }
  }));
}

/* ---------- แบ่งแต้มให้พี่น้อง (โอนแต้ม) ----------
   คนให้ต้องใส่ PIN ของตัวเอง → เข้าคิวรอพ่อแม่อนุมัติ → แต้มถึงย้ายจริง  */
function openGive(){
  const kid = kidById(view.kidId); if(!kid) return;
  const others = S.kids.filter(x => x.id !== kid.id);
  if(!others.length){ toast('ยังไม่มีพี่น้องให้แบ่งแต้ม'); return; }
  const left = giveLeft(kid.id);
  if(left <= 0){ toast(`วันนี้แบ่งแต้มครบ ${giveCap()} แต้มแล้ว พรุ่งนี้ค่อยแบ่งใหม่นะ`); return; }
  if(others.length === 1){ giveForm(others[0].id); return; }
  modal = {kind:'give', kid, others}; renderModal();
}
function giveForm(partnerId){
  const kid = kidById(view.kidId), partner = kidById(partnerId);
  modal = null; renderModal();
  if(!kid || !partner) return;
  const left = giveLeft(kid.id);
  if(left <= 0){ toast(`วันนี้แบ่งแต้มครบ ${giveCap()} แต้มแล้ว พรุ่งนี้ค่อยแบ่งใหม่นะ`); return; }
  const haveD = available(kid.id,'daily'), haveE = available(kid.id,'extra');
  if(haveD <= 0 && haveE <= 0){ toast('ยังไม่มีแต้มให้แบ่งเลย'); return; }
  openForm({title:`🤝 แบ่งแต้มให้${partner.name}`,
    fields:[
      {key:'extra', label:'แบ่งจากกระเป๋าไหน', type:'switch', value: haveD <= 0,
       onText:`💎 แต้มพิเศษ (มี ${haveE})`, offText:`🎈 แต้มประจำวัน (มี ${haveD})`},
      {key:'amt', label:'แบ่งกี่แต้ม' + (giveCap() ? ` (วันนี้เหลือได้อีก ${left})` : ''),
       type:'number', value:10}],
    async onSave(v){
      const pot = v.extra ? 'extra' : 'daily';
      const n = parseInt(v.amt,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      const have = available(kid.id, pot);
      if(have < n) return `${POT_NAME[pot]}มีให้แบ่งแค่ ${have} แต้ม`;
      if(giveCap() && n > left) return `วันนี้แบ่งได้อีกไม่เกิน ${left} แต้ม`;
      setTimeout(() => doGive(kid, partner, pot, n), 0);   // รอให้ฟอร์มปิดก่อนค่อยเด้ง PIN
    }});
}
function doGive(kid, partner, pot, n){
  askKidPin(kid, () => openConfirm(`แบ่งแต้มให้${partner.name}`,
    `${POT_NAME[pot]} ${n} แต้ม จะย้ายไปให้${partner.name} — ต้องรอคุณพ่อคุณแม่อนุมัติก่อนนะ`, async () => {
      try{
        const p = {id:uid(), ts:now(), kidId:kid.id, type:'transfer',
                   name:`แบ่งแต้มให้${partner.name}`, emo:'🤝',
                   pts:Number(n), total:Number(n), pot, rid:'',
                   partnerId:partner.id, partnerName:partner.name};
        await setDoc(dref('pending', p.id), p);
        showFlash({emo:'🤝', title:'ส่งคำขอแบ่งแต้มแล้ว', big:`−${n} แต้ม`, color:'var(--gold)',
          sub:`ให้${partner.name} · รอคุณพ่อคุณแม่อนุมัติ`, toast:'ส่งคำขอแล้ว รออนุมัติ'});
      }catch(e){ fail(e); }
    }),
    `${kid.name} ใส่ PIN เพื่อยืนยันว่าจะแบ่ง ${n} แต้มให้${partner.name}`);
}

/* ============================================================
   👾 มอนสเตอร์ 2D — โครงยืนสองขาแบบ "digital monster"
   หัวใหญ่มีปากยื่น + เขี้ยว · แขน/ขามีเล็บ 3 นิ้ว · พุงเป็นแผ่นเกล็ด · หางหนา
   เส้นขอบดำหนา สีสด — ออกแบบใหม่ทั้งหมด ไม่ได้ลอกตัวละครของใคร
   ชิ้นส่วนสลับกันได้ เพิ่มมอนสเตอร์ตัวใหม่ = เติม RECIPE บรรทัดเดียว
   ============================================================ */
const OUT = '#241f2b', SW = 3;
const P = (d, f, w) => `<path d="${d}" fill="${f||'none'}" stroke="${OUT}" stroke-width="${w||SW}"
  stroke-linejoin="round" stroke-linecap="round"/>`;
const EL = (cx, cy, rx, ry, f) => P(`M${cx-rx} ${cy}a${rx} ${ry} 0 1 0 ${rx*2} 0a${rx} ${ry} 0 1 0 ${-rx*2} 0`, f);

/* ---- เล็บ 3 นิ้ว ---- */
const claw3 = (x, y, dir, len) => `<g stroke="${OUT}" stroke-width="2.4" stroke-linecap="round" fill="none">
  <path d="M${x-4} ${y}l${-2*dir} ${len}"/><path d="M${x} ${y}l0 ${len+1}"/><path d="M${x+4} ${y}l${2*dir} ${len}"/></g>`;

/* ---- ขาสองข้าง + เท้ามีเล็บ ---- */
function legsRig(c1, c2, st){
  const w = st===2 ? 15 : 13, y = st===2 ? 74 : 76;
  const leg = x => P(`M${x} ${y}h${w}v${100-y-6}a${w/2} 7 0 0 1 ${-w} 0z`, c1)
    + EL(x+w/2, 99, w/2+2, 6, c2) + claw3(x+w/2, 101, 1, 4);
  return leg(24) + leg(61);
}
/* ---- แขนสองข้าง กางออก มีเล็บ ---- */
function armsRig(c1, st){
  const drop = st===2 ? 20 : 17;
  const arm = (x, dir) => P(`M${x} 56c${dir*7} 2 ${dir*11} 8 ${dir*11} ${drop}
    a7 8 0 0 ${dir>0?1:0} ${-dir*13} 0c0-8 ${dir*2}-${drop-6} ${-dir*2}-${drop-6}z`.replace(/\s+/g,' '), c1)
    + claw3(x + dir*12, 56+drop+4, dir, st===2?7:5);
  return arm(24, -1) + arm(76, 1);
}
/* ---- ลำตัว + พุงเป็นแผ่น ---- */
function torso(shape, c1, c2, bel){
  const SH = {
    pear:  'M50 40c-17 0-25 12-25 26s9 22 25 22 25-8 25-22-8-26-25-26z',
    stout: 'M50 40c-20 0-28 13-28 25s10 23 28 23 28-11 28-23-8-25-28-25z',
    slim:  'M50 41c-14 0-21 11-21 24s8 21 21 21 21-8 21-21-7-24-21-24z',
    drop:  'M50 38c-18 0-27 15-27 28s10 22 27 22 27-9 27-22-9-28-27-28z'
  };
  const B = SH[shape] || SH.pear;
  const belly = EL(50, 72, 15, 15, bel);
  const plates = `<g stroke="${OUT}" stroke-width="2" fill="none" opacity=".8">
    <path d="M37 66h26M36 74h28M39 82h22"/></g>`;
  return P(B, c1) + belly + plates;
}
/* ---- หัว 5 แบบ — จุดที่ทำให้แต่ละตัวต่างกันมากที่สุด ---- */
function headRig(kind, c1, c2, bel, st, mood){
  const cy = 33, fierce = st===2;
  let out = EL(50, cy, 25, 22, c1);
  if(kind === 'dino'){                                   // ปากยื่น + เขี้ยวบน
    out += EL(50, cy+13, 15, 10, bel)
      + P(`M40 ${cy+13}h20`) + P(`M43 ${cy+13}l2 5 3-5`, '#fff') + P(`M57 ${cy+13}l-2 5-3-5`, '#fff')
      + `<circle cx="45" cy="${cy+7}" r="1.6" fill="${OUT}"/><circle cx="55" cy="${cy+7}" r="1.6" fill="${OUT}"/>`;
  } else if(kind === 'beast'){                            // จมูกสั้น + หูตั้ง
    out = P(`M28 ${cy-12}l-5-17 17 8z`, c1) + P(`M72 ${cy-12}l5-17-17 8z`, c1) + out
      + EL(50, cy+13, 12, 8, bel) + `<circle cx="50" cy="${cy+9}" r="3" fill="${OUT}"/>`
      + P(`M50 ${cy+12}v3M50 ${cy+15}q-4 3-7 0M50 ${cy+15}q4 3 7 0`);
  } else if(kind === 'bird'){                             // จะงอยปาก
    out += P(`M50 ${cy+6}l11 9-11 8-11-8z`, '#f5c451');
  } else if(kind === 'aqua'){                             // ครีบหัว + ปากกว้าง
    out = P(`M50 ${cy-30}c6 6 8 13 8 20h-16c0-7 2-14 8-20z`, c2) + out

    out += P(`M38 ${cy+12}q-6 6-3 12 5-3 8-8z`, c2) + P(`M62 ${cy+12}q6 6 3 12-5-3-8-8z`, c2)
      + P(`M42 ${cy+13}h16`);

}
/* ---- เขา ---- */
function hornRig(kind, st){
  const g = st===2 ? 1.4 : 1, IV = '#f6ecd2';

    case 'crown':return P(`M32 16l4-11 6 8 8-12 8 12 6-8 4 11z`, IV);

/* ---- ของหลัง: ปีก / หนาม / กระดอง ---- */
function backRig(kind, c2, st){

/* ---- ตา — จุดที่บอกอารมณ์ ---- */
function eyesRig(mood, st){

/* หาง */
function tailRig(kind, c1, c2, st){

/* สูตรมอนสเตอร์ — hd หัว · hn เขา · bk ของหลัง · tl หาง · mk ลาย · bd ลำตัว */

const STAGE = [{k:'baby', s:.62, th:'ตัวอ่อน'}, {k:'rookie', s:.86, th:'ร่างปกติ'}, {k:'champ', s:1, th:'ร่างสมบูรณ์'}];

function petSVG(emo, mood, stage, cls){

/* ---------- 🏞️ ฉาก 2D ตามถิ่นที่อยู่ + เวลาจริง ---------- */
const SKY = {

function scene(hab, mood){
