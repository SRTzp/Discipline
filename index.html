<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>แต้มวินัย</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
  :root{
    --bg:#f6f2ec; --card:#fffdf9; --ink:#1f2c47;
    --navy:#2c3f66; --navy-2:#4a6491; --navy-soft:#e7ecf5;
    --muted:#8d8577; --line:#eae3d8;
    --gold:#c9973f; --gold-soft:#fbf1de;
    --good:#4f8172; --good-soft:#e6f0eb;
    --warn:#bd6b57; --warn-soft:#fbeae5;
    --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:40px}
  .wrap{max-width:520px;margin:0 auto;padding:14px}
  h1,h2,h3{margin:0 0 8px;color:var(--ink)}
  h1{font-size:23px;letter-spacing:-.3px} h2{font-size:18px} h3{font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06)}
  button{font-family:inherit;font-size:15px;border:none;border-radius:14px;padding:11px 16px;
    cursor:pointer;background:var(--navy-soft);color:var(--navy);font-weight:600}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.38;cursor:default}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-good{background:var(--good);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-warn{background:var(--warn-soft);color:var(--warn)}
  .btn-ghost{background:transparent;color:var(--muted);padding:8px 10px;font-weight:500}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:11px}
  .btn-full{width:100%}
  .row{display:flex;gap:8px;align-items:center}
  .row-between{display:flex;gap:8px;align-items:center;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  input,select{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:12px;width:100%;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--navy-2)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}

  .kid-tile{background:var(--card);border-radius:var(--radius);padding:16px 10px;text-align:center;
    box-shadow:0 2px 12px rgba(31,44,71,.06);cursor:pointer}
  .kid-tile .nm{font-weight:700;margin-top:8px}
  .kid-tile .pt{font-size:13px;color:var(--muted)}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    overflow:hidden;background:var(--navy-soft)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .points-big{font-size:42px;font-weight:800;line-height:1.1;color:var(--navy)}

  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
    background:var(--card);margin-bottom:8px;box-shadow:0 1px 7px rgba(31,44,71,.05)}
  .item.due-now{box-shadow:0 0 0 2px var(--gold),0 1px 7px rgba(31,44,71,.05)}
  .item.due-late{box-shadow:0 0 0 2px var(--warn),0 1px 7px rgba(31,44,71,.05)}
  .item .emo{font-size:26px;flex:0 0 auto;width:32px;text-align:center}
  .item .txt{flex:1;min-width:0}
  .item .txt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
  .tag-plus{background:var(--good-soft);color:var(--good)}
  .tag-minus{background:var(--warn-soft);color:var(--warn)}
  .tag-cost{background:var(--gold-soft);color:var(--gold)}
  .tag-wait{background:var(--navy-soft);color:var(--navy-2)}

  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(31,44,71,.06);overflow-x:auto}
  .tabs button{flex:1;background:transparent;color:var(--muted);padding:9px 6px;font-size:14px;white-space:nowrap}
  .tabs button.on{background:var(--navy);color:#fff}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
  .pinpad button{font-size:22px;padding:16px 0;background:var(--card);color:var(--ink);
    box-shadow:0 2px 8px rgba(31,44,71,.06)}
  .dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--navy)}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{display:inline-block;font-size:12px;background:var(--navy-soft);color:var(--navy);
    padding:4px 10px;border-radius:999px;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .log-line{display:flex;gap:9px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .log-line:last-child{border-bottom:none}
  .sec-title{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 8px;letter-spacing:.3px}
  .clock{font-variant-numeric:tabular-nums;font-weight:800}

  .prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .4s}
  .dayrow{display:flex;gap:4px;margin-top:6px}
  .daybox{flex:1;text-align:center;font-size:10px;color:var(--muted)}
  .daybox b{display:block;height:22px;border-radius:7px;line-height:22px;font-size:11px;color:#fff;margin-bottom:2px}
  .daypick{display:flex;gap:5px;margin-top:6px}
  .daypick button{flex:1;padding:9px 0;font-size:13px;background:var(--bg);color:var(--muted)}
  .daypick button.on{background:var(--navy);color:#fff}

  .overlay{position:fixed;inset:0;background:rgba(31,44,71,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:50}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px 24px;width:100%;
    max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 -8px 40px rgba(31,44,71,.25)}
  @media(min-width:560px){ .overlay{align-items:center} .sheet{border-radius:22px} }
  .sheet h3{font-size:18px;margin-bottom:2px}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .sheet-actions button{flex:1}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .emoji-pick button{padding:6px 8px;font-size:21px;background:var(--bg);border-radius:10px}
  .emoji-pick button.on{background:var(--navy-soft);outline:2px solid var(--navy-2)}
  .switch{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:13px}
  .switch button{flex:1;background:transparent;color:var(--muted);font-size:14px;padding:9px 4px}
  .switch button.on{background:var(--navy);color:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:14px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;
    max-width:88%;text-align:center}
  .toast.show{opacity:1;bottom:56px}
  .offline{position:fixed;top:0;left:0;right:0;background:var(--gold);color:#fff;text-align:center;
    font-size:12px;padding:5px;z-index:80;font-weight:600}
  .boot{text-align:center;padding:60px 20px;color:var(--muted)}
  .boot .big{font-size:38px;margin-bottom:10px}
  .login{max-width:360px;margin:50px auto;text-align:center}

  /* แถบบอกว่านี่คือบัญชีของใคร — ติดบนสุดตลอด ไม่เลื่อนหาย */
  .kidbar{position:sticky;top:0;z-index:40;margin:-14px -14px 14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;color:#fff;
    box-shadow:0 4px 18px rgba(31,44,71,.22)}
  .kidbar .av{border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
  .kidbar .nm{font-size:20px;font-weight:800;line-height:1.15}
  .kidbar .pt{font-size:13px;opacity:.92;font-weight:600}
  .kidbar button{background:rgba(255,255,255,.22);color:#fff;padding:9px 13px;font-size:14px}
  .kid-tile{border:3px solid transparent}
  .kid-tile .av{margin:0 auto}
</style>
</head>

<div class="wrap" id="app"><div class="boot"><div class="big">⭐</div>กำลังเชื่อมต่อ…</div></div>

<div class="toast" id="toast"></div>

<script>
/* ตัวจับข้อผิดพลาดตอนเริ่มระบบ — ถ้าค้างหรือพัง จะบอกบนหน้าจอเลย ไม่ต้องเปิด F12 */
(function(){
  var shown = false;
  function hint(m){
    m = String(m||'');
    if(/firebase\/app|Failed to resolve|bare specifier/i.test(m))
      return 'วาง config ผิด — มีบรรทัด import ของ Firebase Console ติดมาด้วย ให้เอาแค่ก้อน firebaseConfig = {...}';
    if(/already been declared/i.test(m))
      return 'มีโค้ดซ้ำกัน 2 ชุด (initializeApp หรือ app) — ให้ใช้ไฟล์ต้นฉบับแล้วแก้แค่ 6 บรรทัดใน firebaseConfig';
    if(/Failed to fetch|dynamically imported|NetworkError|Load failed/i.test(m))
      return 'โหลดไฟล์ Firebase จาก gstatic.com ไม่ได้ — ลองปิดตัวบล็อกโฆษณา / ปิด VPN / สลับไปใช้เน็ตมือถือ';
    if(/api-key|invalid|400/i.test(m))
      return 'ค่า apiKey หรือ authDomain ไม่ถูกต้อง ลองคัดลอกจาก Firebase Console ใหม่';
    if(/permission|insufficient/i.test(m))
      return 'ยังไม่ได้วาง Rules ใน Firestore (ขั้นที่ 4 ในคู่มือ)';
    return 'ลองรีเฟรชแบบล้างแคช (Ctrl+Shift+R) ถ้ายังไม่หาย ส่งข้อความนี้มาให้ดูได้เลย';
  }
  window.__showDiag = function(msg){
    if(shown) return; shown = true;
    document.getElementById('app').innerHTML =
      '<div class="boot" style="text-align:left">' +
      '<div class="big" style="text-align:center">⚠️</div>' +
      '<b style="display:block;text-align:center;color:var(--ink);margin-bottom:14px">เปิดแอปไม่สำเร็จ</b>' +
      '<div class="card" style="font-size:13px;word-break:break-word"><b>สาเหตุที่น่าจะเป็น</b><br>' +
      hint(msg) + '</div>' +
      '<div class="card" style="font-size:12px;color:var(--muted);word-break:break-word"><b>ข้อความจากระบบ</b><br>' +
      String(msg).replace(/[<>]/g,'') + '</div>' +
      '<div style="text-align:center"><button class="btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>';
  };
  window.addEventListener('error', function(e){
    if(e && e.target && e.target.tagName === 'SCRIPT')
      window.__showDiag('โหลดสคริปต์ไม่ได้: ' + (e.target.src || 'module'));
    else window.__showDiag((e.message||'error') + (e.filename ? ' @ บรรทัด ' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    window.__showDiag((r && (r.code || r.message)) || String(r));
  });
  setTimeout(function(){
    if(!window.__booted) window.__showDiag('รอเกิน 12 วินาทีแล้วยังเชื่อมต่อไม่ได้');
  }, 12000);
})();
</script>

/* ⬇⬇⬇ ค่าจาก Firebase Console ของโปรเจกต์ discipline-629c3 (ใส่ให้แล้ว) ⬇⬇⬇ */

/* ⬆⬆⬆ ถ้าจะเปลี่ยนโปรเจกต์ ให้แก้แค่ 6 บรรทัดข้างบนนี้ ห้ามเติม import หรือ initializeApp ⬆⬆⬆ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch,
         increment, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ============================================================
   ค่าคงที่ + ข้อมูลตั้งต้น
   ============================================================ */
const ALLDAYS = [0,1,2,3,4,5,6], WEEKDAYS = [1,2,3,4,5], SCHOOLNIGHT = [0,1,2,3,4];
const DAY_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const KID_COLORS = ['#4a6491','#7d9bc1','#bd6b57','#c9973f','#4f8172','#8b7fa8'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const DEF_SETTINGS = {approveChores:true, requireKidPin:false, stepOrder:true, perfectBonus:20,
                      autoHome:true, autoHomeSec:5, idleHome:true, idleSec:60, parentPin:'1234'};
const mkChore = c => Object.assign(
  {id:uid(), once:true, from:'', due:'', grace:10, latePct:50, routine:true, by:'kid', days:ALLDAYS.slice()}, c);
const DEF_CHORES = [
  mkChore({name:'ตื่นนอน ลุกจากเตียง',  emo:'⏰', pts:10, from:'05:00', due:'06:40', days:WEEKDAYS}),
  mkChore({name:'อาบน้ำเสร็จ',          emo:'🚿', pts:10, from:'06:00', due:'07:00', days:WEEKDAYS}),
  mkChore({name:'กินข้าวเช้าเสร็จ',      emo:'🍳', pts:10, from:'06:30', due:'07:25', days:WEEKDAYS}),
  mkChore({name:'ถึงโรงเรียนตรงเวลา',    emo:'🏫', pts:20, due:'08:00', days:WEEKDAYS, by:'parent'}),
  mkChore({name:'ทำการบ้านเสร็จ',        emo:'✏️', pts:15, from:'16:00', due:'19:00', days:WEEKDAYS}),
  mkChore({name:'เรียนหมากรุก 30 นาที',  emo:'♟️', pts:15, from:'16:00', due:'20:00', days:[1,3,5]}),
  mkChore({name:'อ่านหนังสือ 20 นาที',   emo:'📚', pts:10, from:'18:00', due:'20:30', days:WEEKDAYS}),
  mkChore({name:'เก็บกระเป๋าพร้อมพรุ่งนี้', emo:'🎒', pts:10, from:'18:00', due:'20:45', days:WEEKDAYS}),
  mkChore({name:'เตรียมชุดวันพรุ่งนี้',    emo:'👕', pts:10, from:'18:00', due:'20:50', days:WEEKDAYS}),
  mkChore({name:'เก็บของเล่นเข้าที่',     emo:'🧸', pts:5, once:false, routine:false})
];
const DEF_PENALTIES = [
  {id:uid(), name:'ไม่เก็บของ ทิ้งเกลื่อน', emo:'🧺', pts:5},
  {id:uid(), name:'ต้องเรียกเกิน 3 ครั้ง',  emo:'📢', pts:10},
  {id:uid(), name:'ทะเลาะกับพี่น้อง',       emo:'⚡', pts:10},
  {id:uid(), name:'เถียง/พูดไม่เพราะ',      emo:'😤', pts:15},
  {id:uid(), name:'เล่นเกินเวลาที่ตกลง',     emo:'⏰', pts:15}
];
const DEF_REWARDS = [
  {id:uid(), name:'เล่นเกม 30 นาที',  emo:'🎮', cost:0, daily:true},
  {id:uid(), name:'ดูการ์ตูน 1 ตอน',  emo:'📺', cost:0, daily:true},
  {id:uid(), name:'ไอศกรีม 1 ถ้วย',   emo:'🍦', cost:0, daily:true},
  {id:uid(), name:'เลือกเมนูข้าวเย็น', emo:'🍜', cost:0, daily:true},
  {id:uid(), name:'เล่นเกมเพิ่ม 1 ชม. (วันหยุด)', emo:'🕹️', cost:150,  daily:false},
  {id:uid(), name:'ค่าขนมพิเศษ 50 บาท',         emo:'💰', cost:300,  daily:false},
  {id:uid(), name:'นอนดึกได้ 1 ชม. (ศุกร์/เสาร์)', emo:'🌙', cost:350,  daily:false},
  {id:uid(), name:'ดูหนัง + ป็อปคอร์นที่บ้าน',     emo:'🍿', cost:400,  daily:false},
  {id:uid(), name:'ไปเที่ยวสวนสนุก',             emo:'🎡', cost:2000, daily:false},
  {id:uid(), name:'ของเล่น/หนังสือที่อยากได้',     emo:'🎁', cost:2500, daily:false}
];
const DEF_KIDS = [
  {id:uid(), name:'ลูกคนโต', emo:'🦊', photo:'', pin:'1111', color:KID_COLORS[0], points:0},
  {id:uid(), name:'น้อง',    emo:'🐻', photo:'', pin:'2222', color:KID_COLORS[1], points:0}
];

/* ============================================================
   สถานะ
   ============================================================ */
let S = null;                 // {settings, kids, chores, penalties, rewards, pending, log}
let ready = {};               // คอลเลกชันไหนโหลดแล้วบ้าง
let base = null;              // families/{uid}
let modal = null;
let view = {screen:'pick', kidId:null, tab:'chores', pinFor:null, pinBuf:''};
let unsubs = [];
let flash = null, flashTimer = null;   // หน้าสรุปหลังกดเสร็จ ก่อนเด้งกลับหน้าแรก

const col = n => collection(db, 'families', base, n);
const dref = (n,id) => doc(db, 'families', base, n, id);
const settingsRef = () => doc(db, 'families', base, 'config', 'settings');

/* ---------- เวลา ---------- */
const pad2 = n => String(n).padStart(2,'0');
const now = () => Date.now();
function dstr(ts){
  const x = new Date(ts === undefined ? now() : ts);
  return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
}
const todayStr = () => dstr();
const fmtClock = ts => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
function dueDateOf(hhmm, ref){
  const p = String(hhmm).split(':');
  const d = new Date(ref === undefined ? now() : ref);
  d.setHours(Number(p[0]), Number(p[1]), 0, 0);
  return d;
}
const minsUntil = hhmm => Math.ceil((dueDateOf(hhmm) - now())/60000);

/* ---------- helper ---------- */
const esc = s => String(s === undefined || s === null ? '' : s)
  .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function timeAgo(ts){
  const d = Math.floor((now()-ts)/1000);
  if(d < 60) return 'เมื่อครู่';
  if(d < 3600) return Math.floor(d/60)+' นาทีที่แล้ว';
  if(dstr(ts) === todayStr()) return 'วันนี้ ' + fmtClock(ts);
  return new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short'}) + ' ' + fmtClock(ts);
}
/* ผสมสีประจำตัวกับสีพื้นหลัง เพื่อย้อมทั้งหน้าจอแบบอ่อน ๆ */
function tint(hex, amt){
  const h = String(hex || '#4a6491').replace('#','');
  const bg = [246,242,236];
  const c = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
  const m = c.map((v,i) => Math.round(bg[i] + (v - bg[i]) * amt));
  return `rgb(${m[0]},${m[1]},${m[2]})`;
}
function avatar(k, size){
  const s = size || 52;
  const inner = k.photo ? `<img src="${k.photo}" alt="">`
    : `<span style="font-size:${Math.round(s*0.56)}px">${k.emo||'🙂'}</span>`;
  return `<div class="av" style="width:${s}px;height:${s}px;background:${(k.color||'#4a6491')}22">${inner}</div>`;
}
function daysLabel(c){
  const d = Array.isArray(c.days) ? c.days : ALLDAYS;
  if(d.length === 7) return 'ทุกวัน';
  if(d.join() === WEEKDAYS.join()) return 'จ–ศ';
  if(d.join() === '0,6') return 'เสาร์–อาทิตย์';
  if(d.join() === SCHOOLNIGHT.join()) return 'คืนก่อนวันเรียน';
  return d.map(x => DAY_TH[x]).join(' ');
}

/* ---------- ตรรกะแต้ม ---------- */
const cfg = () => S.settings;
const kidById = id => S.kids.find(k => k.id === id);
const balance = kidId => Number((kidById(kidId)||{}).points || 0);
const reserved = kidId => S.pending.filter(p => p.kidId===kidId && p.type==='reward')
                                   .reduce((s,p)=>s+Number(p.pts),0);
const available = kidId => balance(kidId) - reserved(kidId);
function doneToday(kidId, name){
  const t = todayStr();
  return S.log.some(l => l.kidId===kidId && l.kind==='chore' && l.name===name && dstr(l.ts)===t)
      || S.pending.some(p => p.kidId===kidId && p.type==='chore' && p.name===name && dstr(p.ts)===t);
}
function appliesOn(c, d){
  const days = Array.isArray(c.days) ? c.days : ALLDAYS;
  return !days.length || days.indexOf((d ? new Date(d) : new Date(now())).getDay()) >= 0;
}
function evalTiming(c, t){
  t = t === undefined ? now() : t;
  if(!c.due) return {status:'', lateMin:0, pts:Number(c.pts)};
  const late = Math.round((t - dueDateOf(c.due, t))/60000);
  if(late <= 0) return {status:'ontime', lateMin:0, pts:Number(c.pts)};
  if(late <= Number(c.grace||10))
    return {status:'late', lateMin:late, pts:Math.max(1, Math.round(Number(c.pts)*Number(c.latePct||50)/100))};
  return {status:'toolate', lateMin:late, pts:0};
}
const STATUS_TXT = {ontime:'ทันเวลา', late:'สายนิดหน่อย', toolate:'สายเกินไป'};
const STATUS_COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)'};
const windowOpen = c => !c.from || now() >= dueDateOf(c.from).getTime();
const dueKey = c => c.due || '99:99';
const chainToday = () => S.chores.filter(c => c.routine && c.by==='kid' && appliesOn(c))
  .sort((a,b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : 0);
function blockedBy(c, kidId){
  if(!cfg().stepOrder || !c.routine || c.by !== 'kid') return null;
  const list = chainToday();
  const idx = list.findIndex(x => x.id === c.id);
  if(idx <= 0) return null;
  for(let i=0;i<idx;i++) if(!doneToday(kidId, list[i].name)) return list[i];
  return null;
}
const routineToday = () => S.chores.filter(c => c.routine && appliesOn(c));
function routineProgress(kidId){
  const list = routineToday();
  const left = list.filter(c => !doneToday(kidId, c.name));
  return {total:list.length, done:list.length-left.length, left, complete:list.length>0 && left.length===0};
}
function dailyClaimToday(kidId){
  const t = todayStr();
  return S.log.find(l => l.kidId===kidId && l.kind==='daily' && dstr(l.ts)===t)
      || S.pending.find(p => p.kidId===kidId && p.type==='daily' && dstr(p.ts)===t);
}
function onTimeStreak(kidId){
  let streak = 0;
  for(let i=0;i<120;i++){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    const ds = dstr(d.getTime());
    const timed = S.chores.filter(c => c.routine && c.due && appliesOn(c, d.getTime()));
    if(!timed.length){ if(i===0) continue; else break; }
    const all = timed.every(c => {
      const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===ds);
      return e && e.status==='ontime';
    });
    if(all) streak++; else if(i===0) continue; else break;
  }
  return streak;
}

/* ============================================================
   เขียนข้อมูล (Firestore เขียนลงเครื่องก่อนแล้วค่อยซิงก์ — กดปุ๊บเห็นผลปั๊บ)
   ============================================================ */
function logEntry(kidId, kind, name, emo, delta, extra){
  return Object.assign({id:uid(), ts:now(), kidId, kind, name, emo, delta:Number(delta),
                        due:'', status:'', lateMin:0}, extra||{});
}
async function addLog(entry){
  const b = writeBatch(db);
  b.set(dref('log', entry.id), entry);
  if(entry.delta) b.update(dref('kids', entry.kidId), {points: increment(Number(entry.delta))});
  await b.commit();
}
async function removeLog(entry){
  const b = writeBatch(db);
  b.delete(dref('log', entry.id));
  if(entry.delta) b.update(dref('kids', entry.kidId), {points: increment(-Number(entry.delta))});
  await b.commit();
}
async function checkPerfectDay(kidId){
  const bonus = Number(cfg().perfectBonus);
  if(!bonus) return false;
  const t = todayStr();
  const timed = routineToday().filter(c => c.due);
  if(!timed.length) return false;
  const allOnTime = timed.every(c => S.log.some(l =>
    l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===t && l.status==='ontime'));
  if(!allOnTime) return false;
  if(S.log.some(l => l.kidId===kidId && l.kind==='bonus' && dstr(l.ts)===t)) return false;
  await addLog(logEntry(kidId, 'bonus', 'ตรงเวลาครบทั้งวัน 🎉', '🏅', bonus));
  toast(`สุดยอด! ตรงเวลาครบทุกอย่าง +${bonus} แต้ม 🏅`);
  return true;
}
function fail(e){ console.error(e); toast('บันทึกไม่สำเร็จ — ' + (e && e.code ? e.code : 'ลองใหม่อีกครั้ง')); }

    else { render(); tickFlash(); }

}

/* ---------- หน้าเด็ก ---------- */
function choreRow(c, kidId){
  const used = c.once && doneToday(kidId, c.name);
  const t = evalTiming(c);
  const early = !used && c.by !== 'parent' && !windowOpen(c);
  const prev  = !used && !early ? blockedBy(c, kidId) : null;
  let sub, cls = '', btn;
  if(used){
    const done = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===c.name && dstr(l.ts)===todayStr());
    sub = done ? `เสร็จ ${fmtClock(done.ts)} · ${done.status ? STATUS_TXT[done.status] : 'เรียบร้อย'}` : 'ส่งแล้ว รอตรวจ';
    btn = `<button class="btn-sm" disabled>✓</button>`;
  }else if(c.by === 'parent'){
    sub = `คุณพ่อคุณแม่เป็นคนกดให้ · ก่อน ${c.due||'—'}`;
    btn = `<button class="btn-sm" disabled>🔒</button>`;
  }else if(early){
    const left = minsUntil(c.from);
    sub = `⏳ ยังไม่ถึงเวลา — เริ่มได้ ${c.from}${left<60?` (อีก ${left} นาที)`:''}`;
    btn = `<button class="btn-sm" disabled>⏳</button>`;
  }else if(prev){
    sub = `🔒 ต้องทำ "${esc(prev.name)}" ให้เสร็จก่อน`;
    btn = `<button class="btn-sm" disabled>🔒</button>`;
  }else if(c.due){
    const mins = Math.round((dueDateOf(c.due) - now())/60000);
    if(mins > 0){ sub = `ทำได้เลย! ก่อน ${c.due} · เหลือ ${mins} นาที`; cls='due-now'; }
    else if(t.status === 'late'){ sub = `สาย ${t.lateMin} นาที · ได้ ${t.pts} แต้ม`; cls='due-late'; }
    else { sub = `สาย ${t.lateMin} นาที · ไม่ได้แต้มแล้ว`; cls='due-late'; }
    btn = `<button class="btn-good btn-sm" onclick="doChore('${c.id}')">${cfg().approveChores?'ส่ง':'เสร็จ'}</button>`;
  }else{
    sub = c.once ? 'วันละครั้ง' : 'ทำได้หลายครั้ง';
    btn = `<button class="btn-good btn-sm" onclick="doChore('${c.id}')">${cfg().approveChores?'ส่ง':'เสร็จ'}</button>`;
  }
  const shownPts = (!used && c.due) ? t.pts : Number(c.pts);
  const dim = used || early || prev || c.by==='parent';
  return `<div class="item ${dim?'':cls}" style="${dim?'opacity:.5':''}">
    <div class="emo">${c.emo}</div>
    <div class="txt"><b>${esc(c.name)}</b><span class="muted">${sub}</span></div>
    <span class="tag ${shownPts>0?'tag-plus':'tag-minus'}">+${shownPts}</span>
    ${btn}</div>`;
}
function dailyRewardCard(k){
  const pr = routineProgress(k.id);
  const claimed = dailyClaimToday(k.id);
  const dailies = S.rewards.filter(r => r.daily);
  if(!dailies.length) return '';
  if(pr.total === 0) return `<div class="card" style="background:var(--gold-soft)">
    <div class="row"><span style="font-size:30px">🌴</span>
      <div style="flex:1"><b>วันหยุด — ไม่มีกิจวัตรวันนี้</b>
        <div class="muted">พักผ่อนได้เต็มที่ ทำงานทั่วไปเก็บแต้มก็ได้นะ</div></div></div></div>`;
  if(claimed){
    const isPending = !claimed.kind;
    return `<div class="card" style="background:var(--good-soft)">
      <div class="sec-title" style="margin:0 0 4px">🎁 รางวัลวันนี้</div>
      <div class="row"><span style="font-size:26px">${claimed.emo}</span>
        <div style="flex:1"><b>${esc(claimed.name)}</b>
          <div class="muted">${isPending ? 'รอคุณพ่อคุณแม่อนุมัติ' : 'อนุมัติแล้ว 🎉'}</div></div></div></div>`;
  }
  if(!pr.complete){
    const pct = pr.total ? Math.round(pr.done/pr.total*100) : 0;
    return `<div class="card">
      <div class="sec-title" style="margin:0">🎁 รางวัลวันนี้ — ทำกิจวัตรให้ครบก่อน</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="row-between"><span class="muted">ทำแล้ว ${pr.done} จาก ${pr.total} อย่าง</span>
        <b style="color:var(--navy)">${pct}%</b></div>
      ${pr.left.length ? `<div class="muted" style="margin-top:6px">เหลืออีก: ${pr.left.map(c=>c.emo+' '+esc(c.name)).join(' · ')}</div>` : ''}
    </div>`;
  }
  return `<div class="card" style="background:linear-gradient(135deg,var(--gold-soft),var(--card))">
    <div class="sec-title" style="margin:0 0 2px">🎉 ทำครบแล้ว! เลือกรางวัลวันนี้ 1 อย่าง</div>
    <div class="muted" style="margin-bottom:10px">ไม่ใช้แต้มสะสมนะ — แต้มเก็บไว้แลกของใหญ่ได้</div>
    <div class="row" style="flex-wrap:wrap;gap:6px">
      ${dailies.map(r => `<button class="btn-gold btn-sm" onclick="claimDaily('${r.id}')">${r.emo} ${esc(r.name)}</button>`).join('')}
    </div></div>`;

      <div class="sec-title" style="margin:0 0 6px">⏳ รออนุมัติ</div>

        <span style="font-size:19px">${p.emo}</span>

    const big = S.rewards.filter(r => !r.daily);
    body = dailyRewardCard(k) + waitBox + `<div class="sec-title">💎 รางวัลใหญ่ (ใช้แต้มสะสม)</div>`
      + (big.map(r => {
          const can = avail >= Number(r.cost);

      <div class="row">${avatar(k, 58)}

function logLine(l, withUndo){
  const kid = kidById(l.kidId);
  const d = Number(l.delta);
  const cls = d > 0 ? 'tag-plus' : d < 0 ? (l.kind==='reward'?'tag-cost':'tag-minus') : 'tag-wait';
  const note = l.due ? ' · ' + (l.status==='ontime'
      ? '<span style="color:var(--good)">ทันเวลา</span>'
      : `<span style="color:${STATUS_COL[l.status]}">สาย ${l.lateMin} นาที</span>`) : '';
  const amt = l.kind==='daily' ? 'รางวัลวันนี้' : (d>=0?'+':'')+d;
  return `<div class="log-line">
    <span style="font-size:19px">${l.emo || '•'}</span>
    <span style="flex:1;min-width:0">
      <span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</span>
      <span class="muted">${kid ? esc(kid.name)+' · ' : ''}${timeAgo(l.ts)}${note}</span></span>
    <span class="tag ${cls}">${amt}</span>
    ${withUndo ? `<button class="btn-ghost btn-sm" onclick="undoLog('${l.id}')">↩︎</button>` : ''}</div>`;
}

/* ---------- การกระทำของเด็ก ---------- */
async function doChore(id){
  const c = S.chores.find(x => x.id===id); if(!c) return;
  if(c.once && doneToday(view.kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  if(!windowOpen(c)){ toast(`ยังไม่ถึงเวลา — เริ่มได้ตอน ${c.from} นะ`); render(); return; }
  const prev = blockedBy(c, view.kidId);
  if(prev){ toast(`ต้องทำ "${prev.name}" ให้เสร็จก่อนนะ`); render(); return; }
  const t = evalTiming(c);
  const commit = async () => {
    try{
      const statusTxt = t.status==='ontime' ? 'ทันเวลา! 🎉'
                      : t.status==='late'   ? `สาย ${t.lateMin} นาที`
                      : t.status==='toolate'? `สาย ${t.lateMin} นาที — รอบหน้าเอาใหม่นะ` : 'เรียบร้อย';
      if(cfg().approveChores){
        const p = {id:uid(), ts:now(), kidId:view.kidId, type:'chore', name:c.name, emo:c.emo,
                   pts:t.pts, full:Number(c.pts), due:c.due||'', status:t.status, lateMin:t.lateMin};
        await setDoc(dref('pending', p.id), p);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name, big:'ส่งแล้ว ✓', color:'var(--navy)',
          sub:`${statusTxt} · รอคุณพ่อคุณแม่ตรวจ`,
          extra: pr.complete ? '🎉 วันนี้ทำครบแล้ว! เลือกรางวัลได้เลย' : `วันนี้ทำแล้ว ${pr.done}/${pr.total}`,
          toast:`ส่งแล้ว รอตรวจ ${c.emo}`});
      }else{
        await addLog(logEntry(view.kidId, 'chore', c.name, c.emo, t.pts,
                              {due:c.due||'', status:t.status, lateMin:t.lateMin}));
        const gotBonus = await checkPerfectDay(view.kidId);
        const pr = routineProgress(view.kidId);
        showFlash({emo:c.emo, title:c.name,
          big: t.pts>0 ? `+${t.pts} แต้ม` : 'ไม่ได้แต้ม',
          color: t.pts>0 ? 'var(--good)' : 'var(--warn)',
          sub: statusTxt,
          extra: gotBonus ? `🏅 ตรงเวลาครบทั้งวัน! โบนัสอีก +${cfg().perfectBonus} แต้ม`
               : pr.complete ? '🎉 วันนี้ทำครบแล้ว! เลือกรางวัลได้เลย'
               : `วันนี้ทำแล้ว ${pr.done}/${pr.total}`,
          toast: t.pts>0 ? `ได้ ${t.pts} แต้ม ${c.emo}` : 'บันทึกเวลาแล้ว แต่สายเกินไปเลยไม่ได้แต้ม'});
      }
    }catch(e){ fail(e); }
  };
  if(t.status === 'toolate')
    openConfirm('สายเกินไปแล้ว', `ตอนนี้ ${fmtClock(now())} — สายกว่ากำหนด (${c.due}) ${t.lateMin} นาที รอบนี้ไม่ได้แต้ม แต่ยังนับว่าทำครบสำหรับรางวัลวันนี้นะ`, commit);
  else if(t.status === 'late')
    openConfirm('สายนิดหน่อย', `ตอนนี้ ${fmtClock(now())} — สาย ${t.lateMin} นาที จะได้ ${t.pts} แต้ม (เต็ม ${c.pts})`, commit);
  else commit();
}
function claimDaily(id){

  if(!routineProgress(k.id).complete){ toast('ทำกิจวัตรให้ครบก่อนนะ'); return; }

  openConfirm(`เลือก "${r.name}"`, 'เลือกได้วันละ 1 อย่าง เปลี่ยนใจทีหลังไม่ได้นะ', async () => {

        sub:'รอคุณพ่อคุณแม่อนุมัติ 🎉', toast:'เลือกแล้ว! รอคุณพ่อคุณแม่อนุมัติ 🎉'});

function redeem(id){

    try{

      await setDoc(dref('pending', p.id), p);

/* ---------- สถิติ ---------- */
function choreStats(kidId, chore, days){
  const res = {ontime:0, late:0, toolate:0, miss:0, na:0, sumLate:0, sumMin:0, n:0, applicable:0, boxes:[]};
  for(let i=days-1;i>=0;i--){
    const d = new Date(now()); d.setDate(d.getDate()-i);
    if(!appliesOn(chore, d.getTime())){ res.na++; res.boxes.push({d, st:'na', e:null}); continue; }
    res.applicable++;
    const ds = dstr(d.getTime());
    const e = S.log.find(l => l.kidId===kidId && l.kind==='chore' && l.name===chore.name && dstr(l.ts)===ds);
    let st = 'miss';
    if(e){
      st = e.status || 'ontime';
      res.n++; res.sumLate += Number(e.lateMin||0);
      const t = new Date(e.ts); res.sumMin += t.getHours()*60 + t.getMinutes();
    }
    res[st]++; res.boxes.push({d, st, e});
  }
  return res;
}
function parentSummary(){
  const timed = S.chores.filter(c => c.due).sort((a,b)=> a.due<b.due?-1:1);
  if(!timed.length) return '<div class="empty">ยังไม่มีงานที่กำหนดเวลา</div>';
  const COL = {ontime:'var(--good)', late:'var(--gold)', toolate:'var(--warn)', miss:'var(--warn-soft)', na:'var(--line)'};
  return S.kids.map(k => {
    const rows = timed.map(c => {
      const s = choreStats(k.id, c, 7);
      const avg = s.n ? pad2(Math.floor((s.sumMin/s.n)/60))+':'+pad2(Math.round((s.sumMin/s.n)%60)) : '—';
      const avgLate = s.n ? Math.round(s.sumLate/s.n) : 0;
      const boxes = s.boxes.map(b => `<div class="daybox">
        <b style="background:${COL[b.st]};color:${b.st==='miss'||b.st==='na'?'var(--muted)':'#fff'}">${b.e?fmtClock(b.e.ts):(b.st==='na'?'':'–')}</b>
        ${DAY_TH[b.d.getDay()]}</div>`).join('');
      return `<div style="margin-bottom:14px">
        <div class="row-between"><b style="font-size:14px">${c.emo} ${esc(c.name)}</b>
          <span class="muted">ก่อน ${c.due}</span></div>
        <div class="muted">ตรงเวลา ${s.ontime}/${s.applicable} วัน · ทำจริงเฉลี่ย ${avg}${avgLate>0?` (สายเฉลี่ย ${avgLate} นาที)`:''}</div>
        <div class="dayrow">${boxes}</div></div>`;
    }).join('');
    const st = onTimeStreak(k.id), pr = routineProgress(k.id);
    return `<div class="card">
      <div class="row" style="margin-bottom:14px">${avatar(k,46)}
        <div style="flex:1"><b>${esc(k.name)}</b>
          <div class="muted">วันนี้ ${pr.done}/${pr.total} · ${st>0?`🔥 ตรงเวลาครบ ${st} วันติด`:'ยังไม่มีวันที่ตรงเวลาครบ'}</div></div></div>
      ${rows}
      <div class="muted" style="border-top:1px solid var(--line);padding-top:10px">
        เขียว = ตรงเวลา · เหลือง = สายนิดหน่อย · แดง = สายเกินไป · ชมพู = ไม่ได้ทำ · เทา = ไม่มีในวันนั้น</div></div>`;
  }).join('') || '<div class="empty">ยังไม่มีเด็ก</div>';
}

async function approve(pid, override){
  const p = S.pending.find(x => x.id===pid); if(!p) return;
  try{
    await deleteDoc(dref('pending', pid));
    if(p.type === 'chore'){
      const pts = override !== undefined && override !== null ? Number(override) : Number(p.pts);
      await addLog(Object.assign(logEntry(p.kidId,'chore',p.name,p.emo,pts,
        {due:p.due||'', status:p.status||'', lateMin:p.lateMin||0}), {ts:p.ts}));
      toast('ให้ ' + pts + ' แต้มแล้ว');
      await checkPerfectDay(p.kidId);
    }else if(p.type === 'daily'){
      await addLog(logEntry(p.kidId,'daily',p.name,p.emo,0));
      toast('อนุมัติรางวัลวันนี้แล้ว 🎉');
    }else{
      await addLog(logEntry(p.kidId,'reward',p.name,p.emo,-Number(p.pts)));
      toast('อนุมัติแล้ว หัก ' + p.pts + ' แต้ม');
    }
  }catch(e){ fail(e); }
}
function reject(pid){
  const p = S.pending.find(x => x.id===pid); if(!p) return;

async function markParent(kidId, cid, onTime){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(doneToday(kidId, c.name)){ toast('บันทึกไปแล้ววันนี้'); return; }
  const pts = onTime ? Number(c.pts) : Math.max(0, Math.round(Number(c.pts)*Number(c.latePct||50)/100));
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo,pts,
      {due:c.due||'', status:onTime?'ontime':'late', lateMin:onTime?0:Number(c.grace||10)}));
    toast(onTime ? `ทันเวลา +${pts} แต้ม` : `สาย ได้ ${pts} แต้ม`);
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}
async function giveChore(kidId, cid){
  const c = S.chores.find(x => x.id===cid); if(!c) return;
  if(c.once && doneToday(kidId, c.name)){ toast('งานนี้ทำไปแล้ววันนี้'); return; }
  const t = evalTiming(c);
  try{
    await addLog(logEntry(kidId,'chore',c.name,c.emo, c.due ? t.pts : Number(c.pts),
      {due:c.due||'', status:t.status, lateMin:t.lateMin}));
    toast('บันทึกแล้ว');
    await checkPerfectDay(kidId);
  }catch(e){ fail(e); }
}

    try{ await addLog(logEntry(kidId,'penalty',p.name,p.emo,-Number(p.pts))); toast('หัก '+p.pts+' แต้มแล้ว'); }
    catch(e){ fail(e); }

function openAdjust(kidId, dir){
  openForm({title: dir>0?'ให้แต้มพิเศษ':'หักแต้ม',
    fields:[{key:'pts', label:'กี่แต้ม', type:'number', value:10},
            {key:'why', label:'เหตุผล', type:'text', value: dir>0?'ทำดีพิเศษ':'ปรับพฤติกรรม'}],
    async onSave(v){
      const n = parseInt(v.pts,10);
      if(!n || n<=0) return 'ใส่จำนวนแต้มมากกว่า 0';
      try{ await addLog(logEntry(kidId,'adjust', v.why || (dir>0?'ให้แต้มพิเศษ':'หักแต้ม'), dir>0?'🌟':'⚠️', dir*n));
           toast('บันทึกแล้ว'); }catch(e){ fail(e); }
    }});

function renderModal(){
  const m = document.getElementById('modal');
  if(!modal){ m.innerHTML = ''; return; }
  if(modal.kind === 'pinask'){
    const dots = [0,1,2,3].map(i => `<div class="dot ${i<modal.buf.length?'on':''}"></div>`).join('');
    const keys = [1,2,3,4,5,6,7,8,9].map(n => `<button onclick="pinAskTap('${n}')">${n}</button>`).join('');
    m.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="sheet" style="text-align:center"><h3>${esc(modal.title)}</h3>
        <div class="muted">ใส่ PIN ของ ${esc(modal.kidName)}</div>
        <div class="dots">${dots}</div>
        <div class="pinpad">${keys}
          <button class="btn-ghost" onclick="closeModal()">ยกเลิก</button>
          <button onclick="pinAskTap('0')">0</button>
          <button class="btn-ghost" onclick="pinAskDel()">⌫</button></div></div></div>`;
    return;
  }
  if(modal.kind === 'confirm'){
    m.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="sheet"><h3>${esc(modal.title)}</h3>
        <div class="muted" style="margin-bottom:4px">${esc(modal.msg)}</div>
        <div class="sheet-actions">
          <button onclick="closeModal()">ยกเลิก</button>
          <button class="btn-primary" onclick="confirmYes()">ตกลง</button></div></div></div>`;
    return;
  }
  const f = modal.fields.map(fd => {
    const v = modal.values[fd.key];
    if(fd.type === 'avatar'){
      const fake = {photo:modal.values.photo, emo:modal.values.emo||'🙂', color:'#4a6491'};
      const emos = ['🐰','🐻','🐱','🐶','🦊','🐼','🦁','🐸','🐵','🦄','⭐','🚀'];
      return `<label>${fd.label}</label>
        <div class="row" style="gap:12px;margin-bottom:6px">${avatar(fake,64)}
          <div style="flex:1">
            <button class="btn-sm btn-primary btn-full" onclick="pickPhoto()">📷 เลือกรูปจากเครื่อง</button>
            ${modal.values.photo ? `<button class="btn-sm btn-warn btn-full" style="margin-top:6px" onclick="clearPhoto()">ลบรูป ใช้อีโมจิแทน</button>` : ''}
          </div></div>
        ${modal.values.photo ? '' : `<div class="emoji-pick">${emos.map(e =>
          `<button class="${modal.values.emo===e?'on':''}" onclick="setVal('emo','${e}')">${e}</button>`).join('')}</div>`}`;
    }
    if(fd.type === 'emoji'){
      const emos = ['✨','⏰','🚿','👕','🍳','🎒','🚗','🏫','🛏️','✏️','♟️','📚','🧹','🍽️','🧸','🪴','🛁','🎮','🕹️','📺','🍦','🍜','🍿','💰','🌙','🎡','🎁','⚠️','😤','⚡','📕','🧺','📢'];
      return `<label>${fd.label}</label><div class="emoji-pick">${emos.map(e =>
        `<button class="${v===e?'on':''}" onclick="setVal('${fd.key}','${e}')">${e}</button>`).join('')}</div>`;
    }
    if(fd.type === 'switch'){
      return `<label>${fd.label}</label><div class="switch">
        <button class="${v?'on':''}" onclick="setVal('${fd.key}',true)">${esc(fd.onText)}</button>
        <button class="${v?'':'on'}" onclick="setVal('${fd.key}',false)">${esc(fd.offText)}</button></div>`;
    }
    if(fd.type === 'days'){
      const sel = Array.isArray(v) ? v : ALLDAYS;
      return `<label>${fd.label}</label>
        <div class="daypick">${DAY_TH.map((d,i) =>
          `<button class="${sel.indexOf(i)>=0?'on':''}" onclick="toggleDay('${fd.key}',${i})">${d}</button>`).join('')}</div>
        <div class="row" style="margin-top:6px">
          <button class="btn-sm" onclick="setDays('${fd.key}','all')">ทุกวัน</button>
          <button class="btn-sm" onclick="setDays('${fd.key}','week')">จ–ศ</button>
          <button class="btn-sm" onclick="setDays('${fd.key}','night')">คืนก่อนวันเรียน</button></div>`;
    }
    if(fd.type === 'time'){
      return `<label>${fd.label}</label>
        <div class="row"><input type="time" data-key="${fd.key}" value="${esc(v||'')}">
        <button class="btn-sm" onclick="setVal('${fd.key}','')">ไม่กำหนด</button></div>`;
    }
    const t = fd.type === 'number' ? 'number' : 'text';
    const extra = fd.type === 'pin' ? 'inputmode="numeric" maxlength="4"' : '';
    return `<label>${fd.label}</label><input type="${t}" ${extra} data-key="${fd.key}" value="${esc(v === undefined || v === null ? '' : v)}">`;
  }).join('');
  m.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="sheet"><h3>${esc(modal.title)}</h3>${f}
      ${modal.err ? `<div style="color:var(--warn);font-size:13px;margin-top:10px">${esc(modal.err)}</div>` : ''}
      <div class="sheet-actions">
        <button onclick="closeModal()">ยกเลิก</button>
        <button class="btn-primary" onclick="submitForm()">บันทึก</button></div></div></div>`;
}
function openForm(opts){
  modal = {kind:'form', title:opts.title, fields:opts.fields, onSave:opts.onSave, err:null, values:{}};
  opts.fields.forEach(f => { modal.values[f.key] = f.value; });
  if(opts.extraValues) Object.assign(modal.values, opts.extraValues);
  renderModal();
}
function openConfirm(title, msg, onYes){ modal = {kind:'confirm', title, msg, onYes}; renderModal(); }
function askKidPin(kid, onOk){ modal = {kind:'pinask', title:'ยืนยันตัวตน', kidName:kid.name, pin:String(kid.pin), buf:'', onOk}; renderModal(); }
function pinAskTap(n){
  if(modal.buf.length >= 4) return;
  modal.buf += n; renderModal();
  if(modal.buf.length === 4){
    if(modal.buf === modal.pin){ const f = modal.onOk; modal = null; renderModal(); if(f) f(); }
    else { toast('PIN ไม่ถูกต้อง'); modal.buf=''; renderModal(); }
  }
}
function pinAskDel(){ modal.buf = modal.buf.slice(0,-1); renderModal(); }
function confirmYes(){ const f = modal.onYes; modal = null; renderModal(); if(f) f(); }
function closeModal(){ modal = null; renderModal(); }
function setVal(k,v){ syncInputs(); modal.values[k] = v; renderModal(); }
function toggleDay(key, i){
  syncInputs();
  const cur = Array.isArray(modal.values[key]) ? modal.values[key].slice() : ALLDAYS.slice();
  const at = cur.indexOf(i);
  if(at >= 0){ if(cur.length > 1) cur.splice(at,1); } else cur.push(i);
  modal.values[key] = cur.sort((a,b)=>a-b);
  renderModal();
}
function setDays(key, preset){
  syncInputs();
  modal.values[key] = preset==='all' ? ALLDAYS.slice() : preset==='week' ? WEEKDAYS.slice() : SCHOOLNIGHT.slice();
  renderModal();
}
function syncInputs(){
  document.querySelectorAll('#modal input[data-key]').forEach(i => { modal.values[i.getAttribute('data-key')] = i.value; });
}
async function submitForm(){
  syncInputs();
  const err = await modal.onSave(modal.values);
  if(err){ modal.err = err; renderModal(); return; }
  modal = null; renderModal();
}

/* ---------- รูปโปรไฟล์ ---------- */
function pickPhoto(){
  syncInputs();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const file = inp.files && inp.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const N = 200, cv = document.createElement('canvas');
        cv.width = N; cv.height = N;
        const ctx = cv.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, N, N);
        modal.values.photo = cv.toDataURL('image/jpeg', 0.75);
        renderModal();
      };
      img.onerror = () => toast('เปิดรูปไม่ได้');
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  };
  inp.click();
}
function clearPhoto(){ syncInputs(); modal.values.photo = ''; renderModal(); }

function editKid(id){

    fields:[{key:'name', label:'ชื่อ', type:'text', value:k?k.name:''},

    async onSave(v){

        {key:'due', label:'ต้องเสร็จก่อนเวลา (เว้นว่าง = ไม่กำหนด)', type:'time', value:x?(x.due||''):''},
        {key:'days', label:'ทำวันไหนบ้าง', type:'days', value:x?(x.days||ALLDAYS).slice():WEEKDAYS.slice()},
        {key:'routine', label:'นับรวมในรางวัลประจำวันไหม', type:'switch', value:x?!!x.routine:true,
         onText:'นับรวม (บังคับ)', offText:'ไม่นับ (ทำก็ได้)'},
        {key:'by', label:'ใครเป็นคนกด', type:'switch', value:x?(x.by!=='parent'):true,
         onText:'ลูกกดเอง', offText:'พ่อแม่กดให้'},
        {key:'grace', label:'สายได้ไม่เกินกี่นาที (ยังได้แต้มบางส่วน)', type:'number', value:x?(x.grace||10):10},
        {key:'latePct', label:'สายแล้วได้กี่ % ของแต้มเต็ม', type:'number', value:x?(x.latePct||50):50},
        {key:'once', label:'ทำได้บ่อยแค่ไหน', type:'switch', value:x?!!x.once:true,
         onText:'วันละ 1 ครั้ง', offText:'หลายครั้งได้'}],
      async onSave(v){
        if(!v.name || !v.name.trim()) return 'ใส่ชื่อด้วยนะ';
        const n = parseInt(v.pts,10);
        if(!n || n<=0) return 'แต้มต้องมากกว่า 0';
        const due = String(v.due||'').trim(), from = String(v.from||'').trim();
        const okTime = s => !s || /^\d{1,2}:\d{2}$/.test(s);
        if(!okTime(due) || !okTime(from)) return 'เวลาต้องเป็นรูปแบบ ชม:นาที เช่น 07:00';
        if(from && due && from.padStart(5,'0') >= due.padStart(5,'0')) return 'เวลาเริ่มต้องมาก่อนเวลากำหนดส่ง';
        const g = parseInt(v.grace,10), lp = parseInt(v.latePct,10);
        const base = {name:v.name.trim(), emo:v.emo||'✨', pts:n,
          from: from ? from.padStart(5,'0') : '', due: due ? due.padStart(5,'0') : '',
          days: Array.isArray(v.days)&&v.days.length ? v.days : ALLDAYS.slice(),
          routine: !!v.routine, by: v.by ? 'kid' : 'parent',
          grace: isNaN(g)||g<0 ? 10 : g, latePct: isNaN(lp)||lp<0||lp>100 ? 50 : lp};
        base.once = base.due ? true : !!v.once;
        try{
          const idd = x ? x.id : uid();
          await setDoc(dref('chores', idd), Object.assign({id:idd}, base));
        }catch(e){ fail(e); }
      }});
    return;
  }
  if(list === 'rewards'){
    openForm({title:(x?'แก้ไข':'เพิ่ม')+'ของรางวัล',
      fields:[
        {key:'name', label:'ชื่อ', type:'text', value:x?x.name:''},
        {key:'emo', label:'ไอคอน', type:'emoji', value:x?x.emo:'🎁'},
        {key:'daily', label:'ประเภทรางวัล', type:'switch', value:x?!!x.daily:false,
         onText:'รางวัลประจำวัน (ฟรี)', offText:'รางวัลใหญ่ (ใช้แต้ม)'},
        {key:'cost', label:'ใช้กี่แต้ม (เฉพาะรางวัลใหญ่)', type:'number', value:x?(x.cost||0):100}],
      async onSave(v){
        if(!v.name || !v.name.trim()) return 'ใส่ชื่อด้วยนะ';
        const daily = !!v.daily, n = parseInt(v.cost,10);
        if(!daily && (!n || n<=0)) return 'รางวัลใหญ่ต้องใส่แต้มมากกว่า 0';
        try{
          const idd = x ? x.id : uid();
          await setDoc(dref('rewards', idd), {id:idd, name:v.name.trim(), emo:v.emo||'🎁', daily, cost: daily?0:n});
        }catch(e){ fail(e); }
      }});
    return;
  }
  openForm({title:(x?'แก้ไข':'เพิ่ม')+'รายการหักแต้ม',
    fields:[{key:'name', label:'พฤติกรรม', type:'text', value:x?x.name:''},
            {key:'emo', label:'ไอคอน', type:'emoji', value:x?x.emo:'⚠️'},
            {key:'pts', label:'หักกี่แต้ม', type:'number', value:x?x.pts:10}],
    async onSave(v){
      if(!v.name || !v.name.trim()) return 'ใส่ชื่อด้วยนะ';
      const n = parseInt(v.pts,10);
      if(!n || n<=0) return 'แต้มต้องมากกว่า 0';
      try{
        const idd = x ? x.id : uid();
        await setDoc(dref('penalties', idd), {id:idd, name:v.name.trim(), emo:v.emo||'⚠️', pts:n});
      }catch(e){ fail(e); }
    }});
}
function delItem(list, id){
  const label = {kids:'เด็กคนนี้', chores:'งานนี้', penalties:'รายการนี้', rewards:'ของรางวัลนี้'}[list];
  openConfirm('ลบ'+label+'?', 'ประวัติแต้มเดิมยังอยู่เหมือนเดิม', async () => {
    try{ await deleteDoc(dref(list, id)); }catch(e){ fail(e); }
  });
}

/* ============================================================
   เชื่อมต่อ Firestore
   ============================================================ */
function watch(){
  const empty = {settings:Object.assign({}, DEF_SETTINGS), kids:[], chores:[], penalties:[], rewards:[], pending:[], log:[]};
  S = S || empty;
  const mark = n => { ready[n] = true; if(Object.keys(ready).length >= 7) render(); };

  unsubs.push(onSnapshot(settingsRef(), d => {
    S.settings = Object.assign({}, DEF_SETTINGS, d.exists() ? d.data() : {});
    mark('settings'); render();
  }, e => console.error(e)));

  [['kids','kids'],['chores','chores'],['penalties','penalties'],['rewards','rewards']].forEach(([c,key]) => {
    unsubs.push(onSnapshot(col(c), snap => {
      S[key] = snap.docs.map(d => d.data());
      mark(key); render();
    }, e => console.error(e)));
  });
  // เรียงใหม่ฝั่งเครื่องด้วย เผื่อเวลาชนกันเป๊ะ ๆ จะได้ลำดับคงที่ทุกเครื่อง
  const newestFirst = (a,b) => (b.ts - a.ts) || (a.id < b.id ? 1 : a.id > b.id ? -1 : 0);
  unsubs.push(onSnapshot(query(col('pending'), orderBy('ts','desc')), snap => {
    S.pending = snap.docs.map(d => d.data()).sort(newestFirst); mark('pending'); render();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(query(col('log'), orderBy('ts','desc'), limit(600)), snap => {
    S.log = snap.docs.map(d => d.data()).sort(newestFirst); mark('log'); render();
  }, e => console.error(e)));
}
async function seedIfEmpty(){
  const snap = await getDocs(col('chores'));
  if(!snap.empty) return;
  const b = writeBatch(db);
  b.set(settingsRef(), DEF_SETTINGS);
  DEF_KIDS.forEach(k => b.set(dref('kids', k.id), k));
  DEF_CHORES.forEach(c => b.set(dref('chores', c.id), c));
  DEF_PENALTIES.forEach(p => b.set(dref('penalties', p.id), p));
  DEF_REWARDS.forEach(r => b.set(dref('rewards', r.id), r));
  await b.commit();
}

/* ---------- หน้าเข้าสู่ระบบ ---------- */
function viewLogin(msg){
  document.getElementById('app').innerHTML = `
    <div class="login">
      <div style="font-size:40px">⭐</div>
      <h1>แต้มวินัย</h1>
      <div class="muted" style="margin-bottom:20px">เข้าสู่ระบบด้วยบัญชีครอบครัว<br>ทำครั้งเดียวต่อเครื่อง</div>
      <div class="card" style="text-align:left">
        <label>อีเมล</label><input type="email" id="em" autocomplete="username">
        <label>รหัสผ่าน</label><input type="password" id="pw" autocomplete="current-password">
        ${msg ? `<div style="color:var(--warn);font-size:13px;margin-top:10px">${esc(msg)}</div>` : ''}
        <button class="btn-primary btn-full" style="margin-top:16px" onclick="doSignIn()">เข้าสู่ระบบ</button>
      </div></div>`;
}
async function doSignIn(){
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  if(!em || !pw){ viewLogin('ใส่อีเมลและรหัสผ่านด้วยนะ'); return; }
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, em, pw);
  }catch(e){
    const m = e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
      ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ — ' + e.code;
    viewLogin(m);
  }
}

/* ---------- นาฬิกาเดิน ---------- */
setInterval(() => { if(S && !modal && !flash) render(); }, 20000);

/* ---------- ไม่มีใครแตะนาน ๆ → กลับหน้าแรกเอง ----------
   กันเครื่องค้างอยู่ในบัญชีของคนก่อนหน้า คนถัดไปเดินมาจะเจอหน้าแรกเสมอ */
let lastTouch = Date.now();
['pointerdown','touchstart','keydown','wheel'].forEach(ev =>
  document.addEventListener(ev, () => { lastTouch = Date.now(); }, {capture:true, passive:true}));
setInterval(() => {
  if(!S || modal || flash) return;
  if(view.screen === 'pick') return;
  if(!cfg().idleHome) return;
  const sec = Number(cfg().idleSec || 60);
  const limit = view.screen === 'parent' ? sec * 3 : sec;   // โหมดผู้ปกครองให้เวลานานกว่า จะได้อ่านสรุปทัน
  if(Date.now() - lastTouch > limit * 1000) go('pick');
}, 5000);

/* ---------- เริ่ม ---------- */
onAuthStateChanged(auth, async user => {
  window.__booted = true;               // บอกตัวจับข้อผิดพลาดว่าเริ่มระบบสำเร็จแล้ว
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = []; ready = {}; S = null;
  if(!user){ viewLogin(); return; }
  base = user.uid;
  document.getElementById('app').innerHTML = '<div class="boot"><div class="big">⭐</div>กำลังโหลดข้อมูล…</div>';
  try{ await seedIfEmpty(); }catch(e){ console.error(e); }
  watch();
});
