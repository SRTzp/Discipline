function openForm(opts){
  modal = {kind:'form', title:opts.title, fields:opts.fields, onSave:opts.onSave, err:null, values:{}};
  opts.fields.forEach(f => { modal.values[f.key] = f.value; });
  if(opts.extraValues) Object.assign(modal.values, opts.extraValues);
  renderModal();
}
function openConfirm(title, msg, onYes){ modal = {kind:'confirm', title, msg, onYes}; renderModal(); }
function askKidPin(kid, onOk, note){
  modal = {kind:'pinask', title:'ยืนยันตัวตน', kidName:kid.name, pin:String(kid.pin), buf:'', onOk, note};
  renderModal();
}
function pinAskTap(n){
  if(modal.buf.length >= 4) return;
  modal.buf += n; renderModal();
  if(modal.buf.length === 4){
    if(modal.buf === modal.pin){ const f = modal.onOk; modal = null; renderModal(); if(f) f(); }
    else { toast('PIN ไม่ถูกต้อง'); modal.buf=''; renderModal(); }
  }
}
function pinAskDel(){ modal.buf = modal.buf.slice(0,-1); renderModal(); }
function confirmYes(){ const f = modal.onYes; modal = null; renderModal(); if(f) f(); }
function closeModal(){ modal = null; renderModal(); }
function setVal(k,v){ syncInputs(); modal.values[k] = v; renderModal(); }
function toggleDay(key, i){
  syncInputs();
  const cur = Array.isArray(modal.values[key]) ? modal.values[key].slice() : ALLDAYS.slice();
  const at = cur.indexOf(i);
  if(at >= 0){ if(cur.length > 1) cur.splice(at,1); } else cur.push(i);
  modal.values[key] = cur.sort((a,b)=>a-b);
  renderModal();
}
function setDays(key, preset){
  syncInputs();
  modal.values[key] = preset==='all' ? ALLDAYS.slice() : preset==='week' ? WEEKDAYS.slice() : SCHOOLNIGHT.slice();
  renderModal();
}
function syncInputs(){
  document.querySelectorAll('#modal input[data-key]').forEach(i => { modal.values[i.getAttribute('data-key')] = i.value; });
}
async function submitForm(){
  syncInputs();
  const err = await modal.onSave(modal.values);
  if(err){ modal.err = err; renderModal(); return; }
  modal = null; renderModal();
}

/* ---------- รูปโปรไฟล์ ---------- */
function pickPhoto(){
  syncInputs();
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const file = inp.files && inp.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const N = 200, cv = document.createElement('canvas');
        cv.width = N; cv.height = N;
        const ctx = cv.getContext('2d');
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, N, N);
        modal.values.photo = cv.toDataURL('image/jpeg', 0.75);
        renderModal();
      };
      img.onerror = () => toast('เปิดรูปไม่ได้');
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  };
  inp.click();
}
function clearPhoto(){ syncInputs(); modal.values.photo = ''; renderModal(); }

      async onSave(v){

        const n = parseInt(v.pts,10);
        if(!n || n<=0) return 'แต้มต้องมากกว่า 0';
        const due = String(v.due||'').trim(), from = String(v.from||'').trim();

          carryDay: (v.carryDay===''||v.carryDay===undefined||v.carryDay===null) ? '' : parseInt(v.carryDay,10),
          carryPct: Math.min(100, Math.max(1, parseInt(v.carryPct,10)||100))};
        // วันที่ยกไปทำ ต้องไม่ใช่วันที่ทำงานนี้อยู่แล้ว ไม่งั้นจะได้แต้ม 2 เด้ง
        if(base.carryDay !== '' && base.days.indexOf(base.carryDay) >= 0)
          return `วัน${DAY_TH[base.carryDay]} เป็นวันทำงานนี้อยู่แล้ว เลือกวันอื่นที่ยังไม่ได้ติ๊ก`;
        base.once = base.due ? true : !!v.once;
        try{
          const idd = x ? x.id : uid();
          await setDoc(dref('chores', idd), Object.assign({id:idd}, base));
        }catch(e){ fail(e); }
      }});
    return;
  }
  if(list === 'rewards'){
    openForm({title:(x?'แก้ไข':'เพิ่ม')+'ของรางวัล',
      fields:[
        {key:'name', label:'ชื่อ', type:'text', value:x?x.name:''},

        {key:'limitDay',  label:'แลกได้วันละกี่ครั้ง (0 = ไม่จำกัด)', type:'number', value:x?(x.limitDay||0):0},
        {key:'limitWeek', label:'แลกได้สัปดาห์ละกี่ครั้ง (0 = ไม่จำกัด)', type:'number', value:x?(x.limitWeek||0):0}],
      async onSave(v){

            big: !!v.big, share: !!v.share, cost:n,

      }});

  openForm({title:(x?'แก้ไข':'เพิ่ม')+'รายการหักแต้ม',
    fields:[{key:'name', label:'พฤติกรรม', type:'text', value:x?x.name:''},
            {key:'emo', label:'ไอคอน', type:'emoji', value:x?x.emo:'⚠️'},

            {key:'all', label:'หักทั้งบ้านพร้อมกันได้ไหม', type:'switch', value:x?!!x.all:false,
             onText:'ผิดทั้งคู่ (หักทุกคน)', offText:'หักทีละคน'}],

/* ============================================================
   เชื่อมต่อ Firestore
   ============================================================ */
function watch(){
  const empty = {settings:Object.assign({}, DEF_SETTINGS), kids:[], chores:[], penalties:[], rewards:[], pending:[], log:[]};
  S = S || empty;
  const mark = n => { ready[n] = true; if(Object.keys(ready).length >= 7) render(); };

  unsubs.push(onSnapshot(settingsRef(), d => {
    S.settings = Object.assign({}, DEF_SETTINGS, d.exists() ? d.data() : {});
    mark('settings'); render();
  }, e => console.error(e)));

  [['kids','kids'],['chores','chores'],['penalties','penalties'],['rewards','rewards']].forEach(([c,key]) => {
    unsubs.push(onSnapshot(col(c), snap => {
      S[key] = snap.docs.map(d => d.data());
      mark(key); render();
    }, e => console.error(e)));
  });
  // เรียงใหม่ฝั่งเครื่องด้วย เผื่อเวลาชนกันเป๊ะ ๆ จะได้ลำดับคงที่ทุกเครื่อง
  const newestFirst = (a,b) => (b.ts - a.ts) || (a.id < b.id ? 1 : a.id > b.id ? -1 : 0);
  unsubs.push(onSnapshot(query(col('pending'), orderBy('ts','desc')), snap => {
    S.pending = snap.docs.map(d => d.data()).sort(newestFirst); mark('pending'); render();
  }, e => console.error(e)));
  unsubs.push(onSnapshot(query(col('log'), orderBy('ts','desc'), limit(600)), snap => {
    S.log = snap.docs.map(d => d.data()).sort(newestFirst); mark('log'); render();
  }, e => console.error(e)));
}
async function seedOrMigrate(){
  const chores = await getDocs(col('chores'));
  if(chores.empty){                       // ครั้งแรกสุด — สร้างข้อมูลตั้งต้นทั้งชุด
    const b = writeBatch(db);
    b.set(settingsRef(), DEF_SETTINGS);
    DEF_KIDS.forEach(k => b.set(dref('kids', k.id), k));
    DEF_CHORES.forEach(c => b.set(dref('chores', c.id), c));
    DEF_PENALTIES.forEach(p => b.set(dref('penalties', p.id), p));
    DEF_REWARDS.forEach(r => b.set(dref('rewards', r.id), r));
    await b.commit();
    return;
  }
  /* ---- อัปเกรดข้อมูลเดิม (ทำครั้งเดียว) แต้มและประวัติไม่หาย ---- */
  const setSnap = await getDocs(query(col('config')));
  const cur = {};
  setSnap.docs.forEach(d => { if(d.id === 'settings') Object.assign(cur, d.data()); });

  if(!cur.potFixV1){        // ซ่อมงานเสริมที่เคยถูกบันทึกเข้ากระเป๋าแต้มประจำวันผิด ๆ
    const isExtra = {};
    chores.docs.forEach(d => { const o = d.data(); if(o.routine === false) isExtra[o.name] = true; });
    const logs = await getDocs(col('log'));
    const move = {};
    const bad = logs.docs.filter(d => {
      const l = d.data();
      return l.kind === 'chore' && (l.pot || 'daily') === 'daily' && isExtra[l.name] && Number(l.delta);
    }).slice(0, 300);
    if(bad.length){
      const b = writeBatch(db);
      bad.forEach(d => {
        const l = d.data();
        b.update(dref('log', d.id), {pot:'extra'});
        move[l.kidId] = (move[l.kidId] || 0) + Number(l.delta);
      });
      Object.keys(move).forEach(kidId => {
        b.update(dref('kids', kidId), {points: increment(-move[kidId]), extra: increment(move[kidId])});
      });
      b.update(settingsRef(), {potFixV1:true});
      await b.commit();
      console.log('ย้ายแต้มงานเสริมกลับเข้ากระเป๋าแต้มพิเศษ', bad.length, 'รายการ');
    } else await updateDoc(settingsRef(), {potFixV1:true});
  }
  if(cur.rewardsV4 && !cur.eveningV1){   // งานช่วงเย็น 3 อย่าง → 17:00–20:00 ทำอันไหนก่อนก็ได้
    const b = writeBatch(db);
    const free = {'ทำการบ้านเสร็จ':1, 'ทำการบ้านเสร็จภายใน 1 ชม.':1,
                  'เก็บกระเป๋าพร้อมพรุ่งนี้':1, 'เตรียมชุดวันพรุ่งนี้':1};
    chores.docs.forEach(d => {
      const o = d.data(), u = {};
      if(o.chain === undefined) u.chain = true;
      if(free[o.name]){
        u.chain = false; u.from = '17:00'; u.due = '20:00';
        if(o.name.indexOf('ภายใน 1 ชม.') >= 0) u.name = 'ทำการบ้านเสร็จ';
      }
      if(Object.keys(u).length) b.update(dref('chores', d.id), u);
    });
    b.update(settingsRef(), {eveningV1:true});
    await b.commit();
  }
  if(!cur.rewardsV4){        // แยก 2 กระเป๋าแต้ม + จัดลำดับความสำคัญของแต้มใหม่
    const b = writeBatch(db);
    (await getDocs(col('rewards'))).docs.forEach(d => b.delete(dref('rewards', d.id)));
    DEF_REWARDS.forEach(r => b.set(dref('rewards', r.id), r));
    // แทนกิจวัตรด้วยชุดใหม่ (แต้มต้องรวมได้ 100) แต่ยกเวลา/วันที่เคยตั้งเองไว้มาด้วย
    const oldByName = {};
    chores.docs.forEach(d => { const o = d.data(); oldByName[o.name] = o; b.delete(dref('chores', d.id)); });
    DEF_CHORES.forEach(c => {
      const o = oldByName[c.name];
      const keep = o ? {from:o.from||c.from, due:o.due||c.due,
                        days:(Array.isArray(o.days)&&o.days.length)?o.days:c.days,
                        grace:o.grace??c.grace, latePct:o.latePct??c.latePct} : {};
      b.set(dref('chores', c.id), Object.assign({}, c, keep));
    });
    (await getDocs(col('kids'))).docs.forEach(d => {          // เปิดกระเป๋าแต้มพิเศษให้ทุกคน
      if(d.data().extra === undefined) b.update(dref('kids', d.id), {extra:0});
    });
    // รายการหักแต้ม: เติมธง "หักทั้งคู่" โดยไม่ทับของที่ตั้งเอง
    const pens = await getDocs(col('penalties'));
    let hasFight = false;
    pens.docs.forEach(d => {
      const o = d.data();
      if(o.name && o.name.indexOf('ทะเลาะ') >= 0){ hasFight = true; b.update(dref('penalties', d.id), {all:true}); }
      else if(o.all === undefined) b.update(dref('penalties', d.id), {all:false});
    });
    if(!hasFight){
      const f = DEF_PENALTIES.find(x => x.name.indexOf('ทะเลาะ') >= 0);
      if(f) b.set(dref('penalties', f.id), f);
    }
    b.set(settingsRef(), Object.assign({}, DEF_SETTINGS, cur,
      {rewardsV4:true, rewardsV3:true, rewardsV2:true, extrasV1:true, eveningV1:true, potFixV1:true,
       shareSmallV1:true, perfectBonus:20}));
    await b.commit();
  }
  if(!cur.shareSmallV1){     // เปิดให้ "เลือกเมนูข้าวเย็น" กับ "Swensen" หารกันจ่ายได้ (ราคาเดิม)
    const SHARE_SMALL = {'เลือกเมนูข้าวเย็น':1, 'Swensen':1};
    const b = writeBatch(db);
    (await getDocs(col('rewards'))).docs.forEach(d => {
      const o = d.data();
      if(SHARE_SMALL[String(o.name||'').trim()] && !o.share) b.update(dref('rewards', d.id), {share:true});
    });
    b.update(settingsRef(), {shareSmallV1:true});
    await b.commit();
  }
  if(cur.maxGiveDay === undefined){          // เพดานแบ่งแต้มให้พี่น้องต่อคนต่อวัน
    await updateDoc(settingsRef(), {maxGiveDay:50});
  }
  if(!cur.bankV1){                           // 🏦 ธนาคารแต้ม — ค่าตั้งต้นที่คำนวณมาแล้วว่าไม่ทำให้แต้มเฟ้อ
    await updateDoc(settingsRef(), {
      bankOn:true, bankV1:true,
      loanCap:340, loanPct:10, loanDays:14, loanLatePct:2, loanMaxPct:30, loanRepayPct:50,
      depDaily:'3:2,7:5,14:12', depCapDaily:200,
      depExtra:'7:2,14:6,30:15', depCapExtra:400});
  }
  if(!cur.morningV1){         // ชุดเช้า: อาบน้ำ 10 → แยกเป็น อาบน้ำ 4 + แปรงฟัน 3 + แต่งตัว 3 (รวมเท่าเดิม)
    const cs = await getDocs(col('chores'));
    const byName = {}; cs.docs.forEach(d => { byName[String(d.data().name||'').trim()] = d; });
    const b = writeBatch(db);
    const bath = byName['อาบน้ำเสร็จ'];
    if(bath) b.update(dref('chores', bath.id),
      {pts:4, from:'06:00', due:'07:15', chain:false, days:WEEKDAYS.slice()});
    [['แปรงฟัน','🪥'], ['แต่งตัวเรียบร้อย','👔']].forEach(([nm, em]) => {
      if(byName[nm]) return;                       // มีอยู่แล้ว (หรือพ่อแม่เพิ่มเอง) ไม่ทับ
      const src = bath ? bath.data() : {};
      const c = mkChore({name:nm, emo:em, pts:3, from:'06:00', due:'07:15',
                         days:WEEKDAYS.slice(), chain:false,
                         grace: src.grace===undefined?10:src.grace,
                         latePct: src.latePct===undefined?50:src.latePct});
      b.set(dref('chores', c.id), Object.assign({carryDay:'', carryPct:100}, c));
    });
    b.update(settingsRef(), {morningV1:true});
    await b.commit();
  }
  if(!cur.fridayV1){          // ศุกร์เย็นไม่ต้องเตรียมของ → ยกไปทำวันอาทิตย์แทน
    const b = writeBatch(db);
    (await getDocs(col('chores'))).docs.forEach(d => {
      const o = d.data(), n = String(o.name||'').trim();
      if(n === 'เก็บกระเป๋าพร้อมพรุ่งนี้' || n === 'เตรียมชุดวันพรุ่งนี้')
        b.update(dref('chores', d.id), {days: SCHOOLNIGHT.slice(), carryDay:'', carryPct:100});
      else if(n === 'ทำการบ้านเสร็จ')
        b.update(dref('chores', d.id), {days: WEEKDAYS.slice(), carryDay:0, carryPct:50});
      else if(o.carryDay === undefined)
        b.update(dref('chores', d.id), {carryDay:'', carryPct:100});
    });
    b.update(settingsRef(), {fridayV1:true});
    await b.commit();
  }
  if(!cur.arbV1){                            // ช่องทำกำไรที่ตั้งใจเปิดไว้ให้เด็กหาเจอเอง
    await updateDoc(settingsRef(), {
      arbV1:true, loanGraceDays:3, loanPerWeek:1,
      coDepBonusPct:2, coDepBonusMax:5, coDepMinDays:14,
      cosignOn:true, cosignPct:50, cosignDiscount:50});
  }
}

/* ============================================================
   Face ID / Touch ID แทนรหัสผู้ปกครอง (WebAuthn)
   ผูกกับ "เครื่องนี้" เท่านั้น — แต่ละเครื่องต้องตั้งเอง และรหัส 4 หลักยังใช้ได้เสมอ
   ============================================================ */
const SEEN_KEY = 'discipline.seen';
const lastSeen = () => Number(localStorage.getItem(SEEN_KEY) || 0);
function markSeen(){ try{ localStorage.setItem(SEEN_KEY, String(now())); }catch(e){} }

const FID_KEY = 'discipline.faceid';
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = str => {
  const t = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(t + '='.repeat((4 - t.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
};
const faceIdSupported = () => !!(window.PublicKeyCredential && navigator.credentials);
const faceIdReady = () => faceIdSupported() && !!localStorage.getItem(FID_KEY);

async function faceIdSetup(){
  if(!faceIdSupported()){ toast('เครื่องนี้ไม่รองรับ Face ID / Touch ID'); return; }
  try{
    const cred = await navigator.credentials.create({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: {name:'Discipline'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name:'parent', displayName:'ผู้ปกครอง'},
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: {authenticatorAttachment:'platform', userVerification:'required'},
      timeout: 60000, attestation:'none'
    }});
    localStorage.setItem(FID_KEY, b64(cred.rawId));
    toast('เปิด Face ID สำหรับเครื่องนี้แล้ว 🙂');
    render();
  }catch(e){
    console.error(e);
    toast(e && e.name === 'NotAllowedError' ? 'ยกเลิกแล้ว' : 'ตั้งค่าไม่สำเร็จ — ลองใหม่อีกครั้ง');
  }
}
function faceIdRemove(){
  openConfirm('ปิด Face ID เครื่องนี้', 'ต่อไปต้องใช้รหัส 4 หลักเข้าโหมดผู้ปกครอง', () => {
    localStorage.removeItem(FID_KEY); toast('ปิดแล้ว'); render();
  });
}
async function faceIdUnlock(){
  if(!faceIdReady()) return;
  try{
    await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{type:'public-key', id: unb64(localStorage.getItem(FID_KEY))}],
      userVerification:'required', timeout: 60000
    }});
    markSeen();
    view.screen='parent'; view.tab='review'; view.pinBuf=''; render();   // ผ่านการยืนยันตัวตนของเครื่องแล้ว
  }catch(e){
    if(e && e.name === 'NotAllowedError') toast('ยกเลิก หรือไม่ผ่าน — ใช้รหัส 4 หลักแทนได้');
    else { console.error(e); toast('ปลดล็อกไม่สำเร็จ ใช้รหัส 4 หลักแทน'); }
  }
}

  if(!cfg().idleHome) return;
  const sec = Number(cfg().idleSec || 60);
  const limit = view.screen === 'parent' ? sec * 3 : sec;   // โหมดผู้ปกครองให้เวลานานกว่า จะได้อ่านสรุปทัน
  if(Date.now() - lastTouch > limit * 1000) go('pick');
}, 5000);

/* ---------- เริ่ม ---------- */
onAuthStateChanged(auth, async user => {
  window.__booted = true;               // บอกตัวจับข้อผิดพลาดว่าเริ่มระบบสำเร็จแล้ว
  unsubs.forEach(u => { try{ u(); }catch(e){} });
  unsubs = []; ready = {}; S = null;
  if(!user){ viewLogin(); return; }
  base = user.uid;
  document.getElementById('app').innerHTML = '<div class="boot"><div class="big">⭐</div>กำลังโหลดข้อมูล…</div>';
  try{ await seedOrMigrate(); }catch(e){ console.error(e); }
  watch();
});
